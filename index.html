{id:91,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Na avaliação de um trauma torácico, identifica-se um segmento da parede torácica que se move para dentro durante a inspiração e para fora durante a expiração. Qual o diagnóstico e a principal causa da hipóxia associada?",alternativas:["A) Tórax instável; contusão pulmonar subjacente", "B) Pneumotórax aberto; colapso pulmonar total", "C) Hemotórax; compressão do parênquima", "D) Fratura simples de costela; dor e hipoventilação"],correta:0,justificativas:["✔ O tórax instável ocorre com fraturas de 2 ou mais costelas em 2 ou mais pontos. A respiração paradoxal é o sinal diagnóstico, e a hipóxia devese mais à contusão pulmonar do que ao movimento mecânico da parede.", "No pneumotórax aberto, há uma ferida aspirante na parede torácica.", "O hemotórax não causa movimento paradoxal da parede.", "Fraturas simples não geram o segmento móvel característico da respiração paradoxal."]},
{id:92,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Na avaliação de um trauma torácico, identifica-se um segmento da parede torácica que se move para dentro durante a inspiração e para fora durante a expiração. Qual o diagnóstico e a principal causa da hipóxia associada?",alternativas:["A) Tórax instável; contusão pulmonar subjacente", "B) Pneumotórax aberto; colapso pulmonar total", "C) Hemotórax; compressão do parênquima", "D) Fratura simples de costela; dor e hipoventilação"],correta:0,justificativas:["✔ O tórax instável ocorre com fraturas de 2 ou mais costelas em 2 ou mais pontos. A respiração paradoxal é o sinal diagnóstico, e a hipóxia devese mais à contusão pulmonar do que ao movimento mecânico da parede.", "No pneumotórax aberto, há uma ferida aspirante na parede torácica.", "O hemotórax não causa movimento paradoxal da parede.", "Fraturas simples não geram o segmento móvel característico da respiração paradoxal."]},
{id:93,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Durante a reanimação volêmica no \"C\", o paciente apresenta bradicardia, hipotensão e pele quente e seca nas extremidades, apesar da suspeita de lesão medular. Qual o tipo de choque provável?",alternativas:["A) Choque Hipovolêmico", "B) Choque Neurogênico", "C) Choque Cardiogênico", "D) Choque Obstrutivo"],correta:1,justificativas:["No choque hipovolêmico, o paciente estaria taquicárdico e com as extremidades frias e pegajosas (vasoconstrição).", "✔ O choque neurogênico (lesão acima de T6) causa perda do tônus simpático, resultando em vasodilatação (pele quente) e perda da resposta taquicárdica compensatória (bradicardia).", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:94,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Durante a reanimação volêmica no \"C\", o paciente apresenta bradicardia, hipotensão e pele quente e seca nas extremidades, apesar da suspeita de lesão medular. Qual o tipo de choque provável?",alternativas:["A) Choque Hipovolêmico", "B) Choque Neurogênico", "C) Choque Cardiogênico", "D) Choque Obstrutivo"],correta:1,justificativas:["No choque hipovolêmico, o paciente estaria taquicárdico e com as extremidades frias e pegajosas (vasoconstrição).", "✔ O choque neurogênico (lesão acima de T6) causa perda do tônus simpático, resultando em vasodilatação (pele quente) e perda da resposta taquicárdica compensatória (bradicardia).", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:95,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Qual o sinal radiográfico esperado em um paciente com Ruptura Traumática de Aorta na incidência de Tórax em AP?",alternativas:["A) Hipertransparência pulmonar bilateral", "B) Alargamento do mediastino (> 8 cm)", "C) Elevação da cúpula diafragmática", "D) Presença de ar abaixo do diafragma"],correta:1,justificativas:["Sugere pneumotórax ou enfisema.", "✔ O alargamento do mediastino é o sinal clássico de suspeita de lesão de aorta. Outros sinais incluem o desvio da traqueia para a direita e apagamento do botão aórtico.", "Pode sugerir lesão do nervo frênico ou hérnia diafragmática.", "Indica pneumoperitônio (perfuração de víscera oca)."]},
{id:96,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Qual o sinal radiográfico esperado em um paciente com Ruptura Traumática de Aorta na incidência de Tórax em AP?",alternativas:["A) Hipertransparência pulmonar bilateral", "B) Alargamento do mediastino (> 8 cm)", "C) Elevação da cúpula diafragmática", "D) Presença de ar abaixo do diafragma"],correta:1,justificativas:["Sugere pneumotórax ou enfisema.", "✔ O alargamento do mediastino é o sinal clássico de suspeita de lesão de aorta. Outros sinais incluem o desvio da traqueia para a direita e apagamento do botão aórtico.", "Pode sugerir lesão do nervo frênico ou hérnia diafragmática.", "Indica pneumoperitônio (perfuração de víscera oca)."]},
{id:97,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Um paciente de 25 anos chega ao trauma com ferimento por arma branca no 4º espaço intercostal esquerdo. Está consciente, mas com turgência jugular. O eFAST mostra líquido no espaço pericárdico. Qual a conduta diagnóstica imediata mais adequada para este caso estável?",alternativas:["A) Pericardiocentese imediata", "B) Toracotomia de reanimação na sala de emergência", "C) Encaminhamento para Janela Pericárdica ou Toracoscopia em centro cirúrgico", "D) Observação clínica por 24 horas"],correta:2,justificativas:["A pericardiocentese é uma medida de exceção temporária para o paciente instável que não pode ir ao CC imediatamente.", "A toracotomia de reanimação é para pacientes que param ou estão em préparada na sua frente.", "✔ Se o paciente está hemodinamicamente estável, mas com eFAST positivo para líquido pericárdico em zona de risco, o diagnóstico deve ser confirmado/tratado em ambiente controlado (centro cirúrgico).", "Ferimento em zona de Ziedler com eFAST positivo nunca deve ser apenas observado."]},
{id:98,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Um paciente de 25 anos chega ao trauma com ferimento por arma branca no 4º espaço intercostal esquerdo. Está consciente, mas com turgência jugular. O eFAST mostra líquido no espaço pericárdico. Qual a conduta diagnóstica imediata mais adequada para este caso estável?",alternativas:["A) Pericardiocentese imediata", "B) Toracotomia de reanimação na sala de emergência", "C) Encaminhamento para Janela Pericárdica ou Toracoscopia em centro cirúrgico", "D) Observação clínica por 24 horas"],correta:2,justificativas:["A pericardiocentese é uma medida de exceção temporária para o paciente instável que não pode ir ao CC imediatamente.", "A toracotomia de reanimação é para pacientes que param ou estão em préparada na sua frente.", "✔ Se o paciente está hemodinamicamente estável, mas com eFAST positivo para líquido pericárdico em zona de risco, o diagnóstico deve ser confirmado/tratado em ambiente controlado (centro cirúrgico).", "Ferimento em zona de Ziedler com eFAST positivo nunca deve ser apenas observado."]},
{id:99,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"No trauma abdominal, qual é a principal limitação do Lavagem Peritoneal Diagnóstica (LPD) em comparação com a Tomografia Computadorizada (TC)?",alternativas:["A) O LPD é muito demorado para ser feito na urgência", "B) O LPD não avalia adequadamente lesões no retroperitônio", "C) O LPD exige que o paciente esteja estável para ser realizado", "D) O LPD tem baixa sensibilidade para detectar hemoperitônio"],correta:1,justificativas:["O LPD é um procedimento rápido de beira de leito.", "✔ O LPD avalia apenas o espaço intraperitoneal. Lesões de pâncreas, rins ou grandes vasos retroperitoneais podem passar despercebidas, ao contrário da TC.", "Pelo contrário, o LPD é indicado justamente para o paciente instável que não pode ir à TC.", "O LPD tem uma sensibilidade altíssima (até demais), podendo gerar laparotomias não terapêuticas por pequenas quantidades de sangue."]},
{id:100,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"No trauma abdominal, qual é a principal limitação do Lavagem Peritoneal Diagnóstica (LPD) em comparação com a Tomografia Computadorizada (TC)?",alternativas:["A) O LPD é muito demorado para ser feito na urgência", "B) O LPD não avalia adequadamente lesões no retroperitônio", "C) O LPD exige que o paciente esteja estável para ser realizado", "D) O LPD tem baixa sensibilidade para detectar hemoperitônio"],correta:1,justificativas:["O LPD é um procedimento rápido de beira de leito.", "✔ O LPD avalia apenas o espaço intraperitoneal. Lesões de pâncreas, rins ou grandes vasos retroperitoneais podem passar despercebidas, ao contrário da TC.", "Pelo contrário, o LPD é indicado justamente para o paciente instável que não pode ir à TC.", "O LPD tem uma sensibilidade altíssima (até demais), podendo gerar laparotomias não terapêuticas por pequenas quantidades de sangue."]},
{id:101,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"Na classificação de Gustilo e Anderson, uma fratura exposta com ferida limpa, menor que 1 cm de extensão e provocada por trauma de baixa energia é classificada como:",alternativas:["A) Grau I", "B) Grau II", "C) Grau IIIA", "D) Grau IIIB"],correta:0,justificativas:["✔ O Grau I é definido por feridas puntiformes (< 1 cm), com mínima lesão de partes moles e baixa contaminação, geralmente causadas por fragmentos ósseos que perfuram a pele de dentro para fora.", "Grau II exige ferida maior que 1 cm.", "e D: Estes graus envolvem alta energia e grande destruição de tecidos.", "Alternativa D incorreta."]},
{id:102,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Na classificação de Gustilo e Anderson, uma fratura exposta com ferida limpa, menor que 1 cm de extensão e provocada por trauma de baixa energia é classificada como:",alternativas:["A) Grau I", "B) Grau II", "C) Grau IIIA", "D) Grau IIIB"],correta:0,justificativas:["✔ O Grau I é definido por feridas puntiformes (< 1 cm), com mínima lesão de partes moles e baixa contaminação, geralmente causadas por fragmentos ósseos que perfuram a pele de dentro para fora.", "Grau II exige ferida maior que 1 cm.", "e D: Estes graus envolvem alta energia e grande destruição de tecidos.", "Alternativa D incorreta."]},
{id:103,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"Qual é o limite de tamanho da ferida cutânea que separa, nos critérios clássicos, o Grau I do Grau II de Gustilo?",alternativas:["A) 0,5 cm", "B) 1,0 cm", "C) 5,0 cm", "D) 10,0 cm"],correta:1,justificativas:["Alternativa A incorreta.", "✔ O ponto de corte clássico estabelecido por Gustilo e Anderson para diferenciar o Grau I (mínima) do Grau II (moderada) é de 1 centímetro.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:104,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Qual é o limite de tamanho da ferida cutânea que separa, nos critérios clássicos, o Grau I do Grau II de Gustilo?",alternativas:["A) 0,5 cm", "B) 1,0 cm", "C) 5,0 cm", "D) 10,0 cm"],correta:1,justificativas:["Alternativa A incorreta.", "✔ O ponto de corte clássico estabelecido por Gustilo e Anderson para diferenciar o Grau I (mínima) do Grau II (moderada) é de 1 centímetro.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:105,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"Uma fratura exposta que apresenta ferida maior que 1 cm, mas sem sofrimento extenso de partes moles, sem retalhos ou avulsões, é classificada como:",alternativas:["A) Grau I", "B) Grau II", "C) Grau IIIA", "D) Grau IIIC"],correta:1,justificativas:["Grau I exige ferida < 1 cm.", "✔ O Grau II caracterizase por ferida > 1 cm, mas com dano de tecidos moles moderado e sem a alta energia típica do Grau III.", "e D: Exigem alta energia ou lesões extensas/vasculares.", "Alternativa D incorreta."]},
{id:106,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Uma fratura exposta que apresenta ferida maior que 1 cm, mas sem sofrimento extenso de partes moles, sem retalhos ou avulsões, é classificada como:",alternativas:["A) Grau I", "B) Grau II", "C) Grau IIIA", "D) Grau IIIC"],correta:1,justificativas:["Grau I exige ferida < 1 cm.", "✔ O Grau II caracterizase por ferida > 1 cm, mas com dano de tecidos moles moderado e sem a alta energia típica do Grau III.", "e D: Exigem alta energia ou lesões extensas/vasculares.", "Alternativa D incorreta."]},
{id:107,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"As fraturas expostas causadas por projétil de arma de fogo (PAF) de alta velocidade são automaticamente classificadas em qual grupo, independentemente do tamanho da ferida?",alternativas:["A) Grau I", "B) Grau II", "C) Grau III", "D) Grau IV"],correta:2,justificativas:["e B: A alta energia cinética do projétil impede a classificação em graus menores.", "Alternativa B incorreta.", "✔ Ferimentos por PAF, traumas rurais (fazenda) e desastres naturais são considerados de alta energia e alta contaminação, entrando automaticamente na categoria Grau III.", "Não existe Grau IV na classificação de Gustilo e Anderson."]},
{id:108,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"As fraturas expostas causadas por projétil de arma de fogo (PAF) de alta velocidade são automaticamente classificadas em qual grupo, independentemente do tamanho da ferida?",alternativas:["A) Grau I", "B) Grau II", "C) Grau III", "D) Grau IV"],correta:2,justificativas:["e B: A alta energia cinética do projétil impede a classificação em graus menores.", "Alternativa B incorreta.", "✔ Ferimentos por PAF, traumas rurais (fazenda) e desastres naturais são considerados de alta energia e alta contaminação, entrando automaticamente na categoria Grau III.", "Não existe Grau IV na classificação de Gustilo e Anderson."]},
{id:109,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"O que define tecnicamente uma fratura exposta como Grau IIIB?",alternativas:["A) Presença de lesão arterial que exige reparo cirúrgico", "B) Cobertura óssea adequada apesar da grande laceração", "C) Exposição óssea com necessidade de retalho muscular ou cutâneo para cobertura", "D) Ferida menor que 1 cm com solo contaminado"],correta:2,justificativas:["Isso define o Grau IIIC.", "Isso define o Grau IIIA (cobertura óssea é possível com as partes moles locais).", "✔ O \"B\" de IIIB vem de Bone coverage (ou a falta dela). Indica que o periósteo foi stripping (descolado) e há necessidade de procedimentos de reconstrução plástica para cobrir o osso.", "Solo contaminado geralmente eleva para III, mas o critério de cobertura é soberano para o IIIB."]},
{id:110,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"O que define tecnicamente uma fratura exposta como Grau IIIB?",alternativas:["A) Presença de lesão arterial que exige reparo cirúrgico", "B) Cobertura óssea adequada apesar da grande laceração", "C) Exposição óssea com necessidade de retalho muscular ou cutâneo para cobertura", "D) Ferida menor que 1 cm com solo contaminado"],correta:2,justificativas:["Isso define o Grau IIIC.", "Isso define o Grau IIIA (cobertura óssea é possível com as partes moles locais).", "✔ O \"B\" de IIIB vem de Bone coverage (ou a falta dela). Indica que o periósteo foi stripping (descolado) e há necessidade de procedimentos de reconstrução plástica para cobrir o osso.", "Solo contaminado geralmente eleva para III, mas o critério de cobertura é soberano para o IIIB."]},
{id:111,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"A presença de uma lesão vascular que requer reparo cirúrgico para a viabilidade do membro classifica a fratura exposta como:",alternativas:["A) Grau IIIA", "B) Grau IIIB", "C) Grau IIIC", "D) Grau III-Vascular"],correta:2,justificativas:["e B: Podem ter graves danos teciduais, mas sem lesão arterial principal que exija reparo.", "Alternativa B incorreta.", "✔ O subgrupo IIIC é exclusivo para lesões arteriais que necessitam de intervenção (sutura/shunt/enxerto) para salvar o membro, independente do dano às partes moles.", "A terminologia correta na classificação é IIIC."]},
{id:112,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"A presença de uma lesão vascular que requer reparo cirúrgico para a viabilidade do membro classifica a fratura exposta como:",alternativas:["A) Grau IIIA", "B) Grau IIIB", "C) Grau IIIC", "D) Grau III-Vascular"],correta:2,justificativas:["e B: Podem ter graves danos teciduais, mas sem lesão arterial principal que exija reparo.", "Alternativa B incorreta.", "✔ O subgrupo IIIC é exclusivo para lesões arteriais que necessitam de intervenção (sutura/shunt/enxerto) para salvar o membro, independente do dano às partes moles.", "A terminologia correta na classificação é IIIC."]},
{id:113,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"Fraturas expostas ocorridas em ambiente rural (ex: contato com esterco ou terra de fazenda) são classificadas como:",alternativas:["A) Grau I, se a ferida for pequena", "B) Grau II, pelo risco moderado", "C) Grau III, devido ao alto potencial de contaminação", "D) Grau IIIB, obrigatoriamente"],correta:2,justificativas:["e B: O critério de contaminação severa sobrepõese ao critério de tamanho da ferida.", "Alternativa B incorreta.", "✔ O potencial de infecção por germes anaeróbios e gramnegativos em ambientes rurais obriga a classificação como Grau III, independente do tamanho da pele rompida.", "Para ser IIIB, precisaria preencher o critério de falta de cobertura óssea."]},
{id:114,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Fraturas expostas ocorridas em ambiente rural (ex: contato com esterco ou terra de fazenda) são classificadas como:",alternativas:["A) Grau I, se a ferida for pequena", "B) Grau II, pelo risco moderado", "C) Grau III, devido ao alto potencial de contaminação", "D) Grau IIIB, obrigatoriamente"],correta:2,justificativas:["e B: O critério de contaminação severa sobrepõese ao critério de tamanho da ferida.", "Alternativa B incorreta.", "✔ O potencial de infecção por germes anaeróbios e gramnegativos em ambientes rurais obriga a classificação como Grau III, independente do tamanho da pele rompida.", "Para ser IIIB, precisaria preencher o critério de falta de cobertura óssea."]},
{id:115,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"Qual destas características é típica de uma fratura Grau IIIA?",alternativas:["A) Cobertura óssea adequada pelos tecidos moles, apesar da alta energia do trauma", "B) Necessidade de retalho microcirúrgico imediato", "C) Ferida limpa de 0,5 cm", "D) Lesão da artéria poplítea"],correta:0,justificativas:["✔ No Grau IIIA, há alta energia e laceração extensa, mas após a limpeza, o osso ainda pode ser coberto pelos tecidos remanescentes do próprio membro.", "Isso caracteriza o Grau IIIB.", "Caracteriza o Grau I.", "Caracteriza o Grau IIIC."]},
{id:116,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Qual destas características é típica de uma fratura Grau IIIA?",alternativas:["A) Cobertura óssea adequada pelos tecidos moles, apesar da alta energia do trauma", "B) Necessidade de retalho microcirúrgico imediato", "C) Ferida limpa de 0,5 cm", "D) Lesão da artéria poplítea"],correta:0,justificativas:["✔ No Grau IIIA, há alta energia e laceração extensa, mas após a limpeza, o osso ainda pode ser coberto pelos tecidos remanescentes do próprio membro.", "Isso caracteriza o Grau IIIB.", "Caracteriza o Grau I.", "Caracteriza o Grau IIIC."]},
{id:117,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"Em relação à classificação de Gustilo, fraturas com esmagamento severo (crush injury) são classificadas em qual grupo?",alternativas:["A) Grau II", "B) Grau III", "C) Grau I", "D) Grau IIA"],correta:1,justificativas:["e C: Subestimariam a gravidade biológica do dano por esmagamento.", "✔ Esmagamentos envolvem grande sofrimento tecidual por pressão e isquemia, sendo enquadrados na categoria de alta energia (Grau III).", "Alternativa C incorreta.", "Essa nomenclatura (IIA) não existe nesta classificação."]},
{id:118,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Em relação à classificação de Gustilo, fraturas com esmagamento severo (crush injury) são classificadas em qual grupo?",alternativas:["A) Grau II", "B) Grau III", "C) Grau I", "D) Grau IIA"],correta:1,justificativas:["e C: Subestimariam a gravidade biológica do dano por esmagamento.", "✔ Esmagamentos envolvem grande sofrimento tecidual por pressão e isquemia, sendo enquadrados na categoria de alta energia (Grau III).", "Alternativa C incorreta.", "Essa nomenclatura (IIA) não existe nesta classificação."]},
{id:119,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"O principal objetivo da Classificação de Gustilo e Anderson na prática ortopédica é:",alternativas:["A) Apenas descrever a cor da pele ao redor da ferida", "B) Determinar o preço dos materiais cirúrgicos", "C) Auxiliar na previsão do risco de infecção e guiar a antibioticoterapia", "D) Escolher o tipo de gesso que o paciente vai usar"],correta:2,justificativas:["A classificação é muito mais ampla que a cor da pele.", "e D: Não são finalidades clínicas ou científicas da classificação. ## Salter Harris Com base na sua confirmação, aqui está o primeiro bloco de 10 questões focado em Classificações (SalterHarris), nível Fácil (Conceitos, Anatomia e Definições). Bloco 1: Classificações SalterHarris (Nível: Fácil)", "✔ A classificação correlaciona a gravidade da exposição com a taxa de infecção, ajudando a decidir o tempo de antibiótico e a urgência da limpeza cirúrgica.", "Alternativa D incorreta."]},
{id:120,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"O principal objetivo da Classificação de Gustilo e Anderson na prática ortopédica é:",alternativas:["A) Apenas descrever a cor da pele ao redor da ferida", "B) Determinar o preço dos materiais cirúrgicos", "C) Auxiliar na previsão do risco de infecção e guiar a antibioticoterapia", "D) Escolher o tipo de gesso que o paciente vai usar"],correta:2,justificativas:["A classificação é muito mais ampla que a cor da pele.", "e D: Não são finalidades clínicas ou científicas da classificação. ## Salter Harris Com base na sua confirmação, aqui está o primeiro bloco de 10 questões focado em Classificações (SalterHarris), nível Fácil (Conceitos, Anatomia e Definições). Bloco 1: Classificações SalterHarris (Nível: Fácil)", "✔ A classificação correlaciona a gravidade da exposição com a taxa de infecção, ajudando a decidir o tempo de antibiótico e a urgência da limpeza cirúrgica.", "Alternativa D incorreta."]},
{id:121,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"iniciante",enunciado:"A classificação de Salter-Harris é utilizada para descrever fraturas que envolvem qual estrutura anatômica específica no esqueleto imaturo?",alternativas:["A) Diáfise óssea", "B) Placa epifisária (fise)", "C) Periósteo espessado", "D) Cartilagem articular hialina"],correta:1,justificativas:["Fraturas diafisárias não envolvem a placa de crescimento e usam outras classificações.", "✔ A classificação de SalterHarris é o sistema padrão para descrever fraturas que acometem a placa de crescimento (fise ou placa epifisária) em crianças.", "O periósteo é uma membrana que recobre o osso, não sendo o foco desta classificação.", "Embora a fise seja cartilaginosa, a classificação foca na placa de crescimento, não na cartilagem puramente articular."]},
{id:122,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"A classificação de Salter-Harris é utilizada para descrever fraturas que envolvem qual estrutura anatômica específica no esqueleto imaturo?",alternativas:["A) Diáfise óssea", "B) Placa epifisária (fise)", "C) Periósteo espessado", "D) Cartilagem articular hialina"],correta:1,justificativas:["Fraturas diafisárias não envolvem a placa de crescimento e usam outras classificações.", "✔ A classificação de SalterHarris é o sistema padrão para descrever fraturas que acometem a placa de crescimento (fise ou placa epifisária) em crianças.", "O periósteo é uma membrana que recobre o osso, não sendo o foco desta classificação.", "Embora a fise seja cartilaginosa, a classificação foca na placa de crescimento, não na cartilagem puramente articular."]},
{id:123,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"iniciante",enunciado:"Na classificação de Salter-Harris, o Tipo I caracteriza-se por:",alternativas:["A) Uma fratura que atravessa a metáfise e a fise", "B) Uma fratura que atravessa a epífise e a fise", "C) Um descolamento completo da epífise em relação à metáfise através da camada hipertrófica da fise", "D) Uma compressão axial da placa de crescimento"],correta:2,justificativas:["Isso descreve o Tipo II.", "Isso descreve o Tipo III.", "✔ O Tipo I é uma separação pura da fise. O traço de fratura corre inteiramente através da placa de crescimento, sem envolver osso metafisário ou epifisário.", "Isso descreve o Tipo V."]},
{id:124,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"Na classificação de Salter-Harris, o Tipo I caracteriza-se por:",alternativas:["A) Uma fratura que atravessa a metáfise e a fise", "B) Uma fratura que atravessa a epífise e a fise", "C) Um descolamento completo da epífise em relação à metáfise através da camada hipertrófica da fise", "D) Uma compressão axial da placa de crescimento"],correta:2,justificativas:["Isso descreve o Tipo II.", "Isso descreve o Tipo III.", "✔ O Tipo I é uma separação pura da fise. O traço de fratura corre inteiramente através da placa de crescimento, sem envolver osso metafisário ou epifisário.", "Isso descreve o Tipo V."]},
{id:125,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"iniciante",enunciado:"Qual é o tipo mais comum de fratura de Salter-Harris encontrado na prática clínica pediátrica?",alternativas:["A) Tipo I", "B) Tipo II", "C) Tipo III", "D) Tipo IV"],correta:1,justificativas:["O Tipo I é comum em bebês e em ossos específicos, mas não é o mais frequente no geral.", "✔ O Tipo II (fise + metáfise) é estatisticamente o mais frequente, representando cerca de 75% das lesões fisárias.", "O Tipo III é menos comum e geralmente intraarticular.", "O Tipo IV é mais raro e envolve alta energia ou mecanismos específicos."]},
{id:126,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"Qual é o tipo mais comum de fratura de Salter-Harris encontrado na prática clínica pediátrica?",alternativas:["A) Tipo I", "B) Tipo II", "C) Tipo III", "D) Tipo IV"],correta:1,justificativas:["O Tipo I é comum em bebês e em ossos específicos, mas não é o mais frequente no geral.", "✔ O Tipo II (fise + metáfise) é estatisticamente o mais frequente, representando cerca de 75% das lesões fisárias.", "O Tipo III é menos comum e geralmente intraarticular.", "O Tipo IV é mais raro e envolve alta energia ou mecanismos específicos."]},
{id:127,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"iniciante",enunciado:"A fratura de Salter-Harris Tipo II envolve quais componentes ósseos?",alternativas:["A) Apenas a fise", "B) Fise e um fragmento da epífise", "C) Fise e um fragmento da metáfise (Sinal de Thurston-Holland)", "D) Fise, metáfise e epífise simultaneamente"],correta:2,justificativas:["Esta é a Tipo I.", "Esta é a Tipo III.", "✔ No Tipo II, o traço de fratura percorre a fise e desviase para \"cima\", arrancando um fragmento triangular da metáfise.", "Esta é a Tipo IV."]},
{id:128,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"A fratura de Salter-Harris Tipo II envolve quais componentes ósseos?",alternativas:["A) Apenas a fise", "B) Fise e um fragmento da epífise", "C) Fise e um fragmento da metáfise (Sinal de Thurston-Holland)", "D) Fise, metáfise e epífise simultaneamente"],correta:2,justificativas:["Esta é a Tipo I.", "Esta é a Tipo III.", "✔ No Tipo II, o traço de fratura percorre a fise e desviase para \"cima\", arrancando um fragmento triangular da metáfise.", "Esta é a Tipo IV."]},
{id:129,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"iniciante",enunciado:"O sinal radiográfico conhecido como \"Sinal de Thurston-Holland\" (fragmento metafisário triangular) é patognomônico de qual tipo de Salter-Harris?",alternativas:["A) Tipo I", "B) Tipo II", "C) Tipo III", "D) Tipo IV"],correta:1,justificativas:["Alternativa A incorreta.", "✔ O fragmento de metáfise que permanece unido à epífise deslocada é a marca registrada da lesão Tipo II.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:130,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"O sinal radiográfico conhecido como \"Sinal de Thurston-Holland\" (fragmento metafisário triangular) é patognomônico de qual tipo de Salter-Harris?",alternativas:["A) Tipo I", "B) Tipo II", "C) Tipo III", "D) Tipo IV"],correta:1,justificativas:["Alternativa A incorreta.", "✔ O fragmento de metáfise que permanece unido à epífise deslocada é a marca registrada da lesão Tipo II.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:131,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"iniciante",enunciado:"Uma fratura que se estende da superfície articular, atravessa a epífise e corta a fise, mas não atinge a metáfise, é classificada como:",alternativas:["A) Salter-Harris Tipo II", "B) Salter-Harris Tipo III", "C) Salter-Harris Tipo IV", "D) Salter-Harris Tipo V"],correta:1,justificativas:["A Tipo II vai para a metáfise.", "✔ O Tipo III é uma fratura epifisária (intraarticular) que se estende através da fise.", "A Tipo IV atravessa metáfise e epífise.", "A Tipo V é esmagamento."]},
{id:132,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"Uma fratura que se estende da superfície articular, atravessa a epífise e corta a fise, mas não atinge a metáfise, é classificada como:",alternativas:["A) Salter-Harris Tipo II", "B) Salter-Harris Tipo III", "C) Salter-Harris Tipo IV", "D) Salter-Harris Tipo V"],correta:1,justificativas:["A Tipo II vai para a metáfise.", "✔ O Tipo III é uma fratura epifisária (intraarticular) que se estende através da fise.", "A Tipo IV atravessa metáfise e epífise.", "A Tipo V é esmagamento."]},
{id:133,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"iniciante",enunciado:"Qual tipo de Salter-Harris é caracterizado por um traço de fratura vertical que atravessa a metáfise, a fise e a epífise, sendo obrigatoriamente intra-articular?",alternativas:["A) Tipo II", "B) Tipo III", "C) Tipo IV", "D) Tipo V"],correta:2,justificativas:["Não atinge a epífise.", "Não atinge a metáfise.", "✔ O Tipo IV é uma lesão completa que cruza as três zonas: metáfise, fise e epífise.", "Envolve compressão e não um traço de fratura visível típico."]},
{id:134,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"Qual tipo de Salter-Harris é caracterizado por um traço de fratura vertical que atravessa a metáfise, a fise e a epífise, sendo obrigatoriamente intra-articular?",alternativas:["A) Tipo II", "B) Tipo III", "C) Tipo IV", "D) Tipo V"],correta:2,justificativas:["Não atinge a epífise.", "Não atinge a metáfise.", "✔ O Tipo IV é uma lesão completa que cruza as três zonas: metáfise, fise e epífise.", "Envolve compressão e não um traço de fratura visível típico."]},
{id:135,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"iniciante",enunciado:"O tipo de Salter-Harris que apresenta o maior risco de fechamento prematuro da fise (ponte óssea) devido a um mecanismo de esmagamento celular é o:",alternativas:["A) Tipo I", "B) Tipo II", "C) Tipo III", "D) Tipo V"],correta:3,justificativas:["e B: Geralmente preservam o suprimento vascular e as camadas germinativas.", "Alternativa B incorreta.", "Pode causar paragem de crescimento se não reduzida, mas o mecanismo é diferente do Tipo V.", "✔ O Tipo V é causado por uma força de compressão axial severa que destrói as células germinativas da fise, tendo o pior prognóstico para crescimento."]},
{id:136,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"O tipo de Salter-Harris que apresenta o maior risco de fechamento prematuro da fise (ponte óssea) devido a um mecanismo de esmagamento celular é o:",alternativas:["A) Tipo I", "B) Tipo II", "C) Tipo III", "D) Tipo V"],correta:3,justificativas:["e B: Geralmente preservam o suprimento vascular e as camadas germinativas.", "Alternativa B incorreta.", "Pode causar paragem de crescimento se não reduzida, mas o mecanismo é diferente do Tipo V.", "✔ O Tipo V é causado por uma força de compressão axial severa que destrói as células germinativas da fise, tendo o pior prognóstico para crescimento."]},
{id:137,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"iniciante",enunciado:"Para memorização acadêmica, utiliza-se frequentemente o mnemônico SALTR. O que representa a letra \"A\" no mnemônico associado ao Tipo II?",alternativas:["A) Articular (Atinge a articulação)", "B) Above (Acima, em direção à metáfise)", "C) Axial (Compressão axial)", "D) Atrofia (Risco de atrofia)"],correta:1,justificativas:["Articular seria mais associado ao Tipo III ou IV.", "✔ No mnemônico SALTR: S (Same/Straight Tipo I), A (Above/Acima Tipo II para metáfise), L (Lower/Abaixo Tipo III para epífise), T (Through/Através Tipo IV), R (Ram/Crush Tipo V).", "Axial referese ao mecanismo do Tipo V.", "Não faz parte do mnemônico padrão."]},
{id:138,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"Para memorização acadêmica, utiliza-se frequentemente o mnemônico SALTR. O que representa a letra \"A\" no mnemônico associado ao Tipo II?",alternativas:["A) Articular (Atinge a articulação)", "B) Above (Acima, em direção à metáfise)", "C) Axial (Compressão axial)", "D) Atrofia (Risco de atrofia)"],correta:1,justificativas:["Articular seria mais associado ao Tipo III ou IV.", "✔ No mnemônico SALTR: S (Same/Straight Tipo I), A (Above/Acima Tipo II para metáfise), L (Lower/Abaixo Tipo III para epífise), T (Through/Através Tipo IV), R (Ram/Crush Tipo V).", "Axial referese ao mecanismo do Tipo V.", "Não faz parte do mnemônico padrão."]},
{id:139,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"iniciante",enunciado:"Anatomocitologicamente, a maioria das fraturas de Salter-Harris ocorre através de qual camada da placa de crescimento?",alternativas:["A) Camada de reserva", "B) Camada proliferativa", "C) Camada hipertrófica (zona de calcificação provisória)", "D) Zona de ossificação metafisária"],correta:2,justificativas:["e B: São zonas mais resistentes e vitais para o crescimento; lesões aqui são mais graves.", "Alternativa B incorreta.", "✔ A camada hipertrófica é a zona mecanicamente mais frágil da fise, onde a matriz extracelular é escassa, facilitando o traço de fratura.", "Esta já é a transição para o osso formado, não faz parte da fise propriamente dita. ## ASA"]},
{id:140,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"Anatomocitologicamente, a maioria das fraturas de Salter-Harris ocorre através de qual camada da placa de crescimento?",alternativas:["A) Camada de reserva", "B) Camada proliferativa", "C) Camada hipertrófica (zona de calcificação provisória)", "D) Zona de ossificação metafisária"],correta:2,justificativas:["e B: São zonas mais resistentes e vitais para o crescimento; lesões aqui são mais graves.", "Alternativa B incorreta.", "✔ A camada hipertrófica é a zona mecanicamente mais frágil da fise, onde a matriz extracelular é escassa, facilitando o traço de fratura.", "Esta já é a transição para o osso formado, não faz parte da fise propriamente dita. ## ASA"]},
{id:141,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"iniciante",enunciado:"A classificação ASA é uma ferramenta utilizada mundialmente na avaliação pré-anestésica. O seu principal objetivo é avaliar:",alternativas:["A) O risco cirúrgico cardiovascular isolado", "B) O estado físico e a presença de comorbidades do paciente", "C) A dificuldade técnica para a intubação orotraqueal", "D) O tempo estimado de recuperação pós-operatória"],correta:1,justificativas:["Embora inclua doenças cardíacas, a escala é sistémica e não apenas cardiovascular.", "✔ A escala ASA avalia o estado físico global do paciente antes da cirurgia, baseandose na presença e gravidade de doenças sistémicas.", "A dificuldade de intubação é avaliada por outras escalas, como Mallampati.", "A escala foca no estado préoperatório, não na previsão direta do tempo de internamento."]},
{id:142,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"A classificação ASA é uma ferramenta utilizada mundialmente na avaliação pré-anestésica. O seu principal objetivo é avaliar:",alternativas:["A) O risco cirúrgico cardiovascular isolado", "B) O estado físico e a presença de comorbidades do paciente", "C) A dificuldade técnica para a intubação orotraqueal", "D) O tempo estimado de recuperação pós-operatória"],correta:1,justificativas:["Embora inclua doenças cardíacas, a escala é sistémica e não apenas cardiovascular.", "✔ A escala ASA avalia o estado físico global do paciente antes da cirurgia, baseandose na presença e gravidade de doenças sistémicas.", "A dificuldade de intubação é avaliada por outras escalas, como Mallampati.", "A escala foca no estado préoperatório, não na previsão direta do tempo de internamento."]},
{id:143,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"Um paciente considerado ASA I é definido como:",alternativas:["A) Paciente com doença sistémica leve, sem limitações funcionais", "B) Paciente saudável, não fumador e com consumo de álcool nulo ou mínimo", "C) Paciente com doença sistémica grave que limita a atividade", "D) Paciente submetido a cirurgia de urgência"],correta:1,justificativas:["Esta definição corresponde ao ASA II.", "✔ O ASA I representa o paciente perfeitamente saudável, sem doenças orgânicas, fisiológicas ou psiquiátricas, e com hábitos de vida saudáveis.", "Esta definição corresponde ao ASA III.", "A urgência é indicada pelo sufixo \"E\", não pelo numeral."]},
{id:144,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Um paciente considerado ASA I é definido como:",alternativas:["A) Paciente com doença sistémica leve, sem limitações funcionais", "B) Paciente saudável, não fumador e com consumo de álcool nulo ou mínimo", "C) Paciente com doença sistémica grave que limita a atividade", "D) Paciente submetido a cirurgia de urgência"],correta:1,justificativas:["Esta definição corresponde ao ASA II.", "✔ O ASA I representa o paciente perfeitamente saudável, sem doenças orgânicas, fisiológicas ou psiquiátricas, e com hábitos de vida saudáveis.", "Esta definição corresponde ao ASA III.", "A urgência é indicada pelo sufixo \"E\", não pelo numeral."]},
{id:145,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"De acordo com as diretrizes atuais da ASA, um paciente fumador sem outras doenças conhecidas deve ser classificado como:",alternativas:["A) ASA I", "B) ASA II", "C) ASA III", "D) ASA IV"],correta:1,justificativas:["Fumadores não podem ser ASA I por definição.", "✔ O tabagismo é considerado um fator que retira o paciente da categoria \"saudável\", enquadrandoo como doença sistémica leve (ASA II).", "Seria necessário uma doença que causasse limitação funcional (ex: DPOC grave).", "Reservado para doenças que ameaçam a vida constantemente."]},
{id:146,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"De acordo com as diretrizes atuais da ASA, um paciente fumador sem outras doenças conhecidas deve ser classificado como:",alternativas:["A) ASA I", "B) ASA II", "C) ASA III", "D) ASA IV"],correta:1,justificativas:["Fumadores não podem ser ASA I por definição.", "✔ O tabagismo é considerado um fator que retira o paciente da categoria \"saudável\", enquadrandoo como doença sistémica leve (ASA II).", "Seria necessário uma doença que causasse limitação funcional (ex: DPOC grave).", "Reservado para doenças que ameaçam a vida constantemente."]},
{id:147,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"O paciente classificado como ASA III apresenta:",alternativas:["A) Doença sistémica leve, controlada com medicação", "B) Doença sistémica grave, que não constitui ameaça constante à vida, mas limita a funcionalidade", "C) Estado de morte cerebral, cujos órgãos serão removidos para doação", "D) Paciente moribundo, sem expectativa de sobrevivência sem a cirurgia"],correta:1,justificativas:["Corresponde ao ASA II.", "✔ O ASA III define doenças graves (ex: Diabetes Mellitus mal controlada ou Enfarte do Miocárdio há mais de 3 meses) que geram limitações funcionais.", "Corresponde ao ASA VI.", "Corresponde ao ASA V."]},
{id:148,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"O paciente classificado como ASA III apresenta:",alternativas:["A) Doença sistémica leve, controlada com medicação", "B) Doença sistémica grave, que não constitui ameaça constante à vida, mas limita a funcionalidade", "C) Estado de morte cerebral, cujos órgãos serão removidos para doação", "D) Paciente moribundo, sem expectativa de sobrevivência sem a cirurgia"],correta:1,justificativas:["Corresponde ao ASA II.", "✔ O ASA III define doenças graves (ex: Diabetes Mellitus mal controlada ou Enfarte do Miocárdio há mais de 3 meses) que geram limitações funcionais.", "Corresponde ao ASA VI.", "Corresponde ao ASA V."]},
{id:149,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"Qual das situações abaixo enquadra um paciente na categoria ASA IV?",alternativas:["A) Hipertensão arterial sistémica bem controlada", "B) Gestação em curso (sem intercorrências)", "C) Insuficiência renal crónica em diálise regular", "D) Enfarte do miocárdio recente (menos de 3 meses)"],correta:3,justificativas:["e B: Ambas são situações típicas de ASA II.", "Alternativa B incorreta.", "Pacientes em diálise regular, embora graves, são geralmente classificados como ASA III (doença grave, mas estável).", "✔ Eventos isquémicos cardíacos ou cerebrais recentes (< 3 meses) são considerados ameaças constantes à vida, classificando o paciente como ASA IV."]},
{id:150,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Qual das situações abaixo enquadra um paciente na categoria ASA IV?",alternativas:["A) Hipertensão arterial sistémica bem controlada", "B) Gestação em curso (sem intercorrências)", "C) Insuficiência renal crónica em diálise regular", "D) Enfarte do miocárdio recente (menos de 3 meses)"],correta:3,justificativas:["e B: Ambas são situações típicas de ASA II.", "Alternativa B incorreta.", "Pacientes em diálise regular, embora graves, são geralmente classificados como ASA III (doença grave, mas estável).", "✔ Eventos isquémicos cardíacos ou cerebrais recentes (< 3 meses) são considerados ameaças constantes à vida, classificando o paciente como ASA IV."]},
{id:151,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"Um paciente classificado como ASA V é aquele que:",alternativas:["A) Tem uma expectativa de vida superior a 24 horas independentemente da cirurgia", "B) É um doente moribundo que não sobreviverá sem a operação", "C) Apresenta obesidade mórbida (IMC > 40)", "D) Está em coma profundo por trauma craniano estável"],correta:1,justificativas:["O ASA V tem prognóstico de morte iminente.", "✔ O ASA V é o paciente crítico, com baixíssima probabilidade de sobrevivência, operado como última tentativa de salvamento (ex: rutura de aneurisma abdominal).", "Obesidade mórbida isolada costuma ser classificada como ASA III.", "Se estiver estável, pode ser ASA III ou IV; se for morte cerebral confirmada, seria ASA VI."]},
{id:152,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Um paciente classificado como ASA V é aquele que:",alternativas:["A) Tem uma expectativa de vida superior a 24 horas independentemente da cirurgia", "B) É um doente moribundo que não sobreviverá sem a operação", "C) Apresenta obesidade mórbida (IMC > 40)", "D) Está em coma profundo por trauma craniano estável"],correta:1,justificativas:["O ASA V tem prognóstico de morte iminente.", "✔ O ASA V é o paciente crítico, com baixíssima probabilidade de sobrevivência, operado como última tentativa de salvamento (ex: rutura de aneurisma abdominal).", "Obesidade mórbida isolada costuma ser classificada como ASA III.", "Se estiver estável, pode ser ASA III ou IV; se for morte cerebral confirmada, seria ASA VI."]},
{id:153,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"Na classificação ASA, o que indica a letra \"E\" adicionada ao numeral (ex: ASA II-E)?",alternativas:["A) Que o paciente está sob efeito de anestesia", "B) Que a cirurgia é eletiva", "C) Que a cirurgia é uma emergência", "D) Que o paciente é idoso (Eldery)"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ O sufixo \"E\" (Emergency) é adicionado quando o procedimento não pode ser adiado sem aumentar significativamente o risco para o paciente.", "Alternativa D incorreta."]},
{id:154,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Na classificação ASA, o que indica a letra \"E\" adicionada ao numeral (ex: ASA II-E)?",alternativas:["A) Que o paciente está sob efeito de anestesia", "B) Que a cirurgia é eletiva", "C) Que a cirurgia é uma emergência", "D) Que o paciente é idoso (Eldery)"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ O sufixo \"E\" (Emergency) é adicionado quando o procedimento não pode ser adiado sem aumentar significativamente o risco para o paciente.", "Alternativa D incorreta."]},
{id:155,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"Um doente com Morte Cerebral declarada, que será submetido a cirurgia para colheita de órgãos para transplante, é classificado como:",alternativas:["A) ASA IV", "B) ASA V", "C) ASA VI", "D) ASA E"],correta:2,justificativas:["e B: Referemse a pacientes vivos, ainda que em estado crítico.", "Alternativa B incorreta.", "✔ A categoria ASA VI foi criada especificamente para dadores de órgãos em morte encefálica.", "\"E\" é um sufixo de urgência, não uma categoria numérica isolada."]},
{id:156,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Um doente com Morte Cerebral declarada, que será submetido a cirurgia para colheita de órgãos para transplante, é classificado como:",alternativas:["A) ASA IV", "B) ASA V", "C) ASA VI", "D) ASA E"],correta:2,justificativas:["e B: Referemse a pacientes vivos, ainda que em estado crítico.", "Alternativa B incorreta.", "✔ A categoria ASA VI foi criada especificamente para dadores de órgãos em morte encefálica.", "\"E\" é um sufixo de urgência, não uma categoria numérica isolada."]},
{id:157,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"A obesidade é um critério importante na ASA. Um paciente com IMC entre 30 e 40 (obesidade classe I e II) é geralmente classificado como:",alternativas:["A) ASA I", "B) ASA II", "C) ASA III", "D) ASA IV"],correta:1,justificativas:["Obesidade é uma patologia, impedindo a classificação ASA I.", "✔ Obesidade moderada (IMC < 40) sem outras comorbidades graves é considerada uma doença sistémica leve (ASA II).", "Reservado para Obesidade Mórbida (IMC > 40).", "Reservado para ameaça imediata à vida."]},
{id:158,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"A obesidade é um critério importante na ASA. Um paciente com IMC entre 30 e 40 (obesidade classe I e II) é geralmente classificado como:",alternativas:["A) ASA I", "B) ASA II", "C) ASA III", "D) ASA IV"],correta:1,justificativas:["Obesidade é uma patologia, impedindo a classificação ASA I.", "✔ Obesidade moderada (IMC < 40) sem outras comorbidades graves é considerada uma doença sistémica leve (ASA II).", "Reservado para Obesidade Mórbida (IMC > 40).", "Reservado para ameaça imediata à vida."]},
{id:159,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"iniciante",enunciado:"Qual a conduta em relação ao consumo de álcool para que um paciente possa ser classificado como ASA I?",alternativas:["A) Pode beber socialmente todos os fins de semana", "B) Deve ser abstémio ou ter um consumo mínimo/ocasional", "C) Pode ser etilista crónico, desde que a função hepática esteja normal", "D) O álcool não interfere na classificação ASA"],correta:1,justificativas:["Consumo regular de fim de semana já é considerado fator de risco moderado (ASA II).", "✔ Para ser ASA I, o paciente não deve ter hábitos que impactem a fisiologia normal; o consumo social regular ou excessivo de álcool move o paciente para ASA II.", "Etilismo crónico é ASA II ou III (dependendo do dano orgânico).", "Hábitos sociais (tabaco, álcool, drogas) são critérios fundamentais na escala. ## Mallampati"]},
{id:160,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Qual a conduta em relação ao consumo de álcool para que um paciente possa ser classificado como ASA I?",alternativas:["A) Pode beber socialmente todos os fins de semana", "B) Deve ser abstémio ou ter um consumo mínimo/ocasional", "C) Pode ser etilista crónico, desde que a função hepática esteja normal", "D) O álcool não interfere na classificação ASA"],correta:1,justificativas:["Consumo regular de fim de semana já é considerado fator de risco moderado (ASA II).", "✔ Para ser ASA I, o paciente não deve ter hábitos que impactem a fisiologia normal; o consumo social regular ou excessivo de álcool move o paciente para ASA II.", "Etilismo crónico é ASA II ou III (dependendo do dano orgânico).", "Hábitos sociais (tabaco, álcool, drogas) são critérios fundamentais na escala. ## Mallampati"]},
{id:161,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"A classificação de Mallampati é realizada com o objetivo de prever a facilidade de intubação orotraqueal. Para uma avaliação correta, como o paciente deve estar posicionado?",alternativas:["A) Deitado em decúbito dorsal com a cabeça em hiperextensão", "B) Sentado, com a boca aberta ao máximo e a língua protruída, sem fonar (dizer \"ah\")", "C) Sentado, com a boca aberta e a língua relaxada dentro da boca", "D) Deitado de lado, com a boca fechada"],correta:1,justificativas:["Esta é a posição para intubação (posição de \"sniffing\"), não para o teste de Mallampati.", "✔ A técnica padrão exige o paciente sentado, boca aberta, língua para fora e, crucialmente, sem fonar, pois a fonação pode elevar o palato mole e mascarar a realidade anatômica.", "A língua deve ser protruída para permitir a visualização das estruturas posteriores.", "Inviabiliza a visualização da orofaringe."]},
{id:162,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"A classificação de Mallampati é realizada com o objetivo de prever a facilidade de intubação orotraqueal. Para uma avaliação correta, como o paciente deve estar posicionado?",alternativas:["A) Deitado em decúbito dorsal com a cabeça em hiperextensão", "B) Sentado, com a boca aberta ao máximo e a língua protruída, sem fonar (dizer \"ah\")", "C) Sentado, com a boca aberta e a língua relaxada dentro da boca", "D) Deitado de lado, com a boca fechada"],correta:1,justificativas:["Esta é a posição para intubação (posição de \"sniffing\"), não para o teste de Mallampati.", "✔ A técnica padrão exige o paciente sentado, boca aberta, língua para fora e, crucialmente, sem fonar, pois a fonação pode elevar o palato mole e mascarar a realidade anatômica.", "A língua deve ser protruída para permitir a visualização das estruturas posteriores.", "Inviabiliza a visualização da orofaringe."]},
{id:163,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"Na classificação de Mallampati Classe I, quais estruturas são completamente visíveis ao exame?",alternativas:["A) Apenas a base da úvula e o palato duro", "B) Palato mole, fauce (pilares amigdalianos), úvula e palato duro", "C) Apenas o palato duro", "D) Palato mole e palato duro, mas a úvula está escondida pela língua"],correta:1,justificativas:["Esta descrição referese a uma classe mais avançada (III).", "✔ A Classe I é a de visualização total. Enxergamos o palato mole, os pilares (fauce) e a úvula inteira.", "Esta é a Classe IV.", "Corresponde à Classe II ou III."]},
{id:164,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Na classificação de Mallampati Classe I, quais estruturas são completamente visíveis ao exame?",alternativas:["A) Apenas a base da úvula e o palato duro", "B) Palato mole, fauce (pilares amigdalianos), úvula e palato duro", "C) Apenas o palato duro", "D) Palato mole e palato duro, mas a úvula está escondida pela língua"],correta:1,justificativas:["Esta descrição referese a uma classe mais avançada (III).", "✔ A Classe I é a de visualização total. Enxergamos o palato mole, os pilares (fauce) e a úvula inteira.", "Esta é a Classe IV.", "Corresponde à Classe II ou III."]},
{id:165,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"Um paciente que apresenta visualização do palato mole, da fauce e da úvula parcialmente visível (ponta escondida pela base da língua) é classificado como:",alternativas:["A) Mallampati Classe I", "B) Mallampati Classe II", "C) Mallampati Classe III", "D) Mallampati Classe IV"],correta:1,justificativas:["Veria a úvula toda.", "✔ Na Classe II, ainda vemos o palato mole e os pilares, mas a úvula começa a ser \"coberta\", vendose apenas parte dela.", "Veria apenas a base da úvula ou só o palato mole.", "Não veria o palato mole."]},
{id:166,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Um paciente que apresenta visualização do palato mole, da fauce e da úvula parcialmente visível (ponta escondida pela base da língua) é classificado como:",alternativas:["A) Mallampati Classe I", "B) Mallampati Classe II", "C) Mallampati Classe III", "D) Mallampati Classe IV"],correta:1,justificativas:["Veria a úvula toda.", "✔ Na Classe II, ainda vemos o palato mole e os pilares, mas a úvula começa a ser \"coberta\", vendose apenas parte dela.", "Veria apenas a base da úvula ou só o palato mole.", "Não veria o palato mole."]},
{id:167,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"A classificação de Mallampati Classe III é definida pela visualização de:",alternativas:["A) Palato mole, úvula e pilares amigdalianos", "B) Palato mole e base da úvula apenas", "C) Apenas o palato duro", "D) Apenas as amígdalas"],correta:1,justificativas:["Corresponde à Classe I.", "✔ Na Classe III, a visualização é muito restrita; conseguese ver o palato mole e, no máximo, a base (raiz) da úvula.", "Corresponde à Classe IV.", "As amígdalas/pilares não são mais visíveis na Classe III."]},
{id:168,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"A classificação de Mallampati Classe III é definida pela visualização de:",alternativas:["A) Palato mole, úvula e pilares amigdalianos", "B) Palato mole e base da úvula apenas", "C) Apenas o palato duro", "D) Apenas as amígdalas"],correta:1,justificativas:["Corresponde à Classe I.", "✔ Na Classe III, a visualização é muito restrita; conseguese ver o palato mole e, no máximo, a base (raiz) da úvula.", "Corresponde à Classe IV.", "As amígdalas/pilares não são mais visíveis na Classe III."]},
{id:169,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"Qual classe de Mallampati indica a maior probabilidade de uma via aérea difícil, onde apenas o palato duro é visível?",alternativas:["A) Classe I", "B) Classe II", "C) Classe III", "D) Classe IV"],correta:3,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "Alternativa C incorreta.", "✔ Na Classe IV, o palato mole não é mais visível, restando apenas o palato duro à vista. É um forte preditor de intubação difícil."]},
{id:170,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Qual classe de Mallampati indica a maior probabilidade de uma via aérea difícil, onde apenas o palato duro é visível?",alternativas:["A) Classe I", "B) Classe II", "C) Classe III", "D) Classe IV"],correta:3,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "Alternativa C incorreta.", "✔ Na Classe IV, o palato mole não é mais visível, restando apenas o palato duro à vista. É um forte preditor de intubação difícil."]},
{id:171,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"Do ponto de vista anatômico, o que separa o palato duro do palato mole na avaliação de Mallampati?",alternativas:["A) A presença de dentes", "B) A úvula", "C) A transição entre a parte óssea anterior e a parte muscular posterior do teto da boca", "D) Os pilares amigdalianos"],correta:2,justificativas:["e D: São estruturas anexas, não definem a divisão dos palatos.", "A úvula é uma projeção do palato mole.", "✔ O palato duro é a porção óssea (frente), enquanto o palato mole é a continuação muscular e móvel (fundo). Identificar essa transição é chave para diferenciar Mallampati III de IV.", "Alternativa D incorreta."]},
{id:172,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Do ponto de vista anatômico, o que separa o palato duro do palato mole na avaliação de Mallampati?",alternativas:["A) A presença de dentes", "B) A úvula", "C) A transição entre a parte óssea anterior e a parte muscular posterior do teto da boca", "D) Os pilares amigdalianos"],correta:2,justificativas:["e D: São estruturas anexas, não definem a divisão dos palatos.", "A úvula é uma projeção do palato mole.", "✔ O palato duro é a porção óssea (frente), enquanto o palato mole é a continuação muscular e móvel (fundo). Identificar essa transição é chave para diferenciar Mallampati III de IV.", "Alternativa D incorreta."]},
{id:173,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"Na prática clínica, quais classes de Mallampati são geralmente associadas a uma maior facilidade de intubação?",alternativas:["A) Classes I e II", "B) Classes III e IV", "C) Apenas a Classe IV", "D) Todas as classes apresentam a mesma facilidade"],correta:0,justificativas:["✔ Classes I e II oferecem boa visualização das estruturas, facilitando a laringoscopia.", "III e IV são preditores de via aérea difícil.", "IV é a mais difícil de todas.", "A escala existe justamente para diferenciar os níveis de dificuldade."]},
{id:174,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Na prática clínica, quais classes de Mallampati são geralmente associadas a uma maior facilidade de intubação?",alternativas:["A) Classes I e II", "B) Classes III e IV", "C) Apenas a Classe IV", "D) Todas as classes apresentam a mesma facilidade"],correta:0,justificativas:["✔ Classes I e II oferecem boa visualização das estruturas, facilitando a laringoscopia.", "III e IV são preditores de via aérea difícil.", "IV é a mais difícil de todas.", "A escala existe justamente para diferenciar os níveis de dificuldade."]},
{id:175,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"Durante o exame físico, se o médico visualizar o palato mole, mas não conseguir visualizar os pilares amigdalianos nem a ponta da úvula, ele deve classificar como:",alternativas:["A) Classe I", "B) Classe II", "C) Classe III", "D) Classe IV"],correta:2,justificativas:["e B: Exigem a visualização dos pilares.", "Alternativa B incorreta.", "✔ A ausência de pilares e da maior parte da úvula, mantendo apenas o palato mole visível, caracteriza a Classe III.", "Não veria nem o palato mole."]},
{id:176,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Durante o exame físico, se o médico visualizar o palato mole, mas não conseguir visualizar os pilares amigdalianos nem a ponta da úvula, ele deve classificar como:",alternativas:["A) Classe I", "B) Classe II", "C) Classe III", "D) Classe IV"],correta:2,justificativas:["e B: Exigem a visualização dos pilares.", "Alternativa B incorreta.", "✔ A ausência de pilares e da maior parte da úvula, mantendo apenas o palato mole visível, caracteriza a Classe III.", "Não veria nem o palato mole."]},
{id:177,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"Sobre a escala de Mallampati, é correto afirmar que:",alternativas:["A) É uma avaliação dinâmica feita durante a cirurgia", "B) Substitui a necessidade de outros testes de via aérea", "C) É um teste clínico simples realizado no pré-operatório", "D) Avalia a complacência pulmonar do paciente"],correta:2,justificativas:["É feita antes da cirurgia (préoperatório).", "Deve ser combinada com outros testes (distância tireomentoniana, abertura de boca).", "✔ É um exame de beira de leito, rápido e visual, essencial na avaliação préanestésica.", "Avalia anatomia de via aérea superior, não função pulmonar."]},
{id:178,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Sobre a escala de Mallampati, é correto afirmar que:",alternativas:["A) É uma avaliação dinâmica feita durante a cirurgia", "B) Substitui a necessidade de outros testes de via aérea", "C) É um teste clínico simples realizado no pré-operatório", "D) Avalia a complacência pulmonar do paciente"],correta:2,justificativas:["É feita antes da cirurgia (préoperatório).", "Deve ser combinada com outros testes (distância tireomentoniana, abertura de boca).", "✔ É um exame de beira de leito, rápido e visual, essencial na avaliação préanestésica.", "Avalia anatomia de via aérea superior, não função pulmonar."]},
{id:179,tema:"Classificações",subtema:"Mallampati",dificuldade:"iniciante",enunciado:"Se um paciente tem a língua muito grande em relação à cavidade oral (macroglossia), qual a tendência do seu índice de Mallampati?",alternativas:["A) Ser um Mallampati Classe I", "B) Ser um Mallampati de classe mais alta (III ou IV)", "C) A língua não influencia a classificação", "D) Tornar o palato mole mais visível"],correta:1,justificativas:["Classe I exige pouco volume lingual relativo.", "✔ A escala de Mallampati correlaciona o tamanho da língua com o espaço da orofaringe. Se a língua ocupa muito espaço, ela \"esconde\" as estruturas do fundo, resultando em classes III ou IV.", "e D: A língua é o principal fator que obstrui a visão no teste, dificultando a visão do palato mole. ## Questoes difíceis", "Alternativa D incorreta."]},
{id:180,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Se um paciente tem a língua muito grande em relação à cavidade oral (macroglossia), qual a tendência do seu índice de Mallampati?",alternativas:["A) Ser um Mallampati Classe I", "B) Ser um Mallampati de classe mais alta (III ou IV)", "C) A língua não influencia a classificação", "D) Tornar o palato mole mais visível"],correta:1,justificativas:["Classe I exige pouco volume lingual relativo.", "✔ A escala de Mallampati correlaciona o tamanho da língua com o espaço da orofaringe. Se a língua ocupa muito espaço, ela \"esconde\" as estruturas do fundo, resultando em classes III ou IV.", "e D: A língua é o principal fator que obstrui a visão no teste, dificultando a visão do palato mole. ## Questoes difíceis", "Alternativa D incorreta."]},
{id:181,tema:"Classificações",subtema:"ASA",dificuldade:"avançado",enunciado:"Paciente de 55 anos, hipertenso e diabético, ambos controlados com medicação oral, sem outras queixas. Relata que caminha 30 minutos por dia sem cansaço ou limitações. Qual a classificação ASA para este paciente?",alternativas:["A) ASA I", "B) ASA II", "C) ASA III", "D) ASA IV"],correta:1,justificativas:["ASA I é exclusivo para pacientes sem nenhuma patologia.", "✔ Doenças sistêmicas controladas (HAS e DM) que não limitam a capacidade funcional do paciente o enquadram como ASA II.", "ASA III exigiria uma limitação funcional (ex: cansaço aos esforços ou doença mal controlada).", "ASA IV é uma ameaça constante à vida."]},
{id:182,tema:"Classificações",subtema:"ASA",dificuldade:"intermediário",enunciado:"Paciente de 55 anos, hipertenso e diabético, ambos controlados com medicação oral, sem outras queixas. Relata que caminha 30 minutos por dia sem cansaço ou limitações. Qual a classificação ASA para este paciente?",alternativas:["A) ASA I", "B) ASA II", "C) ASA III", "D) ASA IV"],correta:1,justificativas:["ASA I é exclusivo para pacientes sem nenhuma patologia.", "✔ Doenças sistêmicas controladas (HAS e DM) que não limitam a capacidade funcional do paciente o enquadram como ASA II.", "ASA III exigiria uma limitação funcional (ex: cansaço aos esforços ou doença mal controlada).", "ASA IV é uma ameaça constante à vida."]},
{id:183,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"avançado",enunciado:"Criança de 8 anos sofre queda de altura. O RX mostra um traço de fratura que se inicia na superfície articular, cruza a epífise e termina na placa de crescimento, desviando-se por ela. A metáfise está íntegra. Qual o diagnóstico?",alternativas:["A) Salter-Harris I", "B) Salter-Harris II", "C) Salter-Harris III", "D) Salter-Harris IV"],correta:2,justificativas:["Tipo I é apenas o descolamento da fise.", "Tipo II envolveria a metáfise.", "✔ A fratura que acomete a epífise e a fise, sendo obrigatoriamente intraarticular, define o Tipo III.", "Tipo IV envolveria obrigatoriamente a metáfise e a epífise simultaneamente."]},
{id:184,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"Criança de 8 anos sofre queda de altura. O RX mostra um traço de fratura que se inicia na superfície articular, cruza a epífise e termina na placa de crescimento, desviando-se por ela. A metáfise está íntegra. Qual o diagnóstico?",alternativas:["A) Salter-Harris I", "B) Salter-Harris II", "C) Salter-Harris III", "D) Salter-Harris IV"],correta:2,justificativas:["Tipo I é apenas o descolamento da fise.", "Tipo II envolveria a metáfise.", "✔ A fratura que acomete a epífise e a fise, sendo obrigatoriamente intraarticular, define o Tipo III.", "Tipo IV envolveria obrigatoriamente a metáfise e a epífise simultaneamente."]},
{id:185,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"avançado",enunciado:"Paciente vítima de atropelamento apresenta fratura exposta de tíbia com ferida de 12 cm, grande contaminação por terra e necessidade de retalho muscular para cobertura do osso, porém com pulsos periféricos normais. Como classificar?",alternativas:["A) Grau II", "B) Grau IIIA", "C) Grau IIIB", "D) Grau IIIC"],correta:2,justificativas:["Ferida > 10cm ou alta energia já exclui Grau II.", "No IIIA, a cobertura cutânea é adequada sem necessidade de procedimentos complexos de retalho.", "✔ O fator determinante aqui é a necessidade de retalho para cobertura óssea (exposição óssea persistente após limpeza), o que define o Grau IIIB.", "Exigiria lesão arterial com necessidade de reparo."]},
{id:186,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Paciente vítima de atropelamento apresenta fratura exposta de tíbia com ferida de 12 cm, grande contaminação por terra e necessidade de retalho muscular para cobertura do osso, porém com pulsos periféricos normais. Como classificar?",alternativas:["A) Grau II", "B) Grau IIIA", "C) Grau IIIB", "D) Grau IIIC"],correta:2,justificativas:["Ferida > 10cm ou alta energia já exclui Grau II.", "No IIIA, a cobertura cutânea é adequada sem necessidade de procedimentos complexos de retalho.", "✔ O fator determinante aqui é a necessidade de retalho para cobertura óssea (exposição óssea persistente após limpeza), o que define o Grau IIIB.", "Exigiria lesão arterial com necessidade de reparo."]},
{id:187,tema:"Classificações",subtema:"Mallampati",dificuldade:"avançado",enunciado:"Durante a avaliação pré-anestésica de um paciente obeso, o médico solicita a abertura da boca e protrusão da língua. Ele observa apenas o palato mole e a base da úvula. Os pilares amigdalianos não são visíveis. Qual o índice?",alternativas:["A) Mallampati I", "B) Mallampati II", "C) Mallampati III", "D) Mallampati IV"],correta:2,justificativas:["e B: Ambos permitem ver os pilares e maior parte da úvula.", "Alternativa B incorreta.", "✔ Na Classe III, a visibilidade é restrita ao palato mole e à base da úvula; os pilares já estão ocultos pela língua.", "Veria apenas o palato duro."]},
{id:188,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Durante a avaliação pré-anestésica de um paciente obeso, o médico solicita a abertura da boca e protrusão da língua. Ele observa apenas o palato mole e a base da úvula. Os pilares amigdalianos não são visíveis. Qual o índice?",alternativas:["A) Mallampati I", "B) Mallampati II", "C) Mallampati III", "D) Mallampati IV"],correta:2,justificativas:["e B: Ambos permitem ver os pilares e maior parte da úvula.", "Alternativa B incorreta.", "✔ Na Classe III, a visibilidade é restrita ao palato mole e à base da úvula; os pilares já estão ocultos pela língua.", "Veria apenas o palato duro."]},
{id:189,tema:"Classificações",subtema:"ASA",dificuldade:"avançado",enunciado:"Homem de 68 anos será submetido a uma osteossíntese de fêmur. Apresenta história de Infarto Agudo do Miocárdio há 2 meses e faz uso de oxigenoterapia domiciliar por DPOC grave. Qual a classificação ASA?",alternativas:["A) ASA II", "B) ASA III", "C) ASA IV", "D) ASA V"],correta:2,justificativas:["Alternativa A incorreta.", "Se o IAM tivesse mais de 3 meses e a DPOC fosse moderada, seria ASA III.", "✔ Tanto o IAM recente (menos de 3 meses) quanto a DPOC com dependência de oxigênio classificam o paciente como ASA IV (doença que ameaça a vida).", "O paciente não está em estado moribundo (morte esperada em 24h)."]},
{id:190,tema:"Classificações",subtema:"ASA",dificuldade:"intermediário",enunciado:"Homem de 68 anos será submetido a uma osteossíntese de fêmur. Apresenta história de Infarto Agudo do Miocárdio há 2 meses e faz uso de oxigenoterapia domiciliar por DPOC grave. Qual a classificação ASA?",alternativas:["A) ASA II", "B) ASA III", "C) ASA IV", "D) ASA V"],correta:2,justificativas:["Alternativa A incorreta.", "Se o IAM tivesse mais de 3 meses e a DPOC fosse moderada, seria ASA III.", "✔ Tanto o IAM recente (menos de 3 meses) quanto a DPOC com dependência de oxigênio classificam o paciente como ASA IV (doença que ameaça a vida).", "O paciente não está em estado moribundo (morte esperada em 24h)."]},
{id:191,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"avançado",enunciado:"Motociclista apresenta fratura exposta com ferida de 2 cm, mas com traço de fratura altamente cominutivo (segmentar). Qual a classificação correta?",alternativas:["A) Grau I", "B) Grau II", "C) Grau III (independente do tamanho da ferida)", "D) Grau IIIA"],correta:2,justificativas:["e B: Não se aplicam em casos de alta energia ou cominuição severa.", "Alternativa B incorreta.", "✔ Fraturas com alta energia (cominuição severa, fraturas segmentares ou armas de fogo) são classificadas automaticamente como Grau III, mesmo que a ferida de pele seja pequena.", "Sem mais dados sobre partes moles, o termo genérico Grau III é a base, mas a alta energia é o critério de corte."]},
{id:192,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Motociclista apresenta fratura exposta com ferida de 2 cm, mas com traço de fratura altamente cominutivo (segmentar). Qual a classificação correta?",alternativas:["A) Grau I", "B) Grau II", "C) Grau III (independente do tamanho da ferida)", "D) Grau IIIA"],correta:2,justificativas:["e B: Não se aplicam em casos de alta energia ou cominuição severa.", "Alternativa B incorreta.", "✔ Fraturas com alta energia (cominuição severa, fraturas segmentares ou armas de fogo) são classificadas automaticamente como Grau III, mesmo que a ferida de pele seja pequena.", "Sem mais dados sobre partes moles, o termo genérico Grau III é a base, mas a alta energia é o critério de corte."]},
{id:193,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"avançado",enunciado:"Um \"Sinal de Thurston-Holland\" positivo em uma radiografia de punho de uma criança indica que o traço de fratura:",alternativas:["A) Passa apenas pela fise", "B) Envolve um fragmento triangular da metáfise", "C) Envolve um fragmento triangular da epífise", "D) É uma fratura por compressão axial"],correta:1,justificativas:["Seria Tipo I.", "✔ Este sinal é característico da SalterHarris Tipo II, onde o traço percorre a fise e \"arranca\" um pedaço da metáfise.", "Seria Tipo III.", "Seria Tipo V."]},
{id:194,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"Um \"Sinal de Thurston-Holland\" positivo em uma radiografia de punho de uma criança indica que o traço de fratura:",alternativas:["A) Passa apenas pela fise", "B) Envolve um fragmento triangular da metáfise", "C) Envolve um fragmento triangular da epífise", "D) É uma fratura por compressão axial"],correta:1,justificativas:["Seria Tipo I.", "✔ Este sinal é característico da SalterHarris Tipo II, onde o traço percorre a fise e \"arranca\" um pedaço da metáfise.", "Seria Tipo III.", "Seria Tipo V."]},
{id:195,tema:"Classificações",subtema:"Mallampati",dificuldade:"avançado",enunciado:"Ao avaliar uma gestante em trabalho de parto que necessita de intervenção, o anestesista nota que, ao abrir a boca, o palato mole não é visível de forma alguma. Qual o Mallampati e o que isso sugere?",alternativas:["A) Mallampati III; Intubação fácil", "B) Mallampati IV; Provável via aérea difícil", "C) Mallampati II; Necessidade de laringoscopia direta", "D) Mallampati IV; Intubação impossível"],correta:1,justificativas:["Classe III ainda vê o palato mole.", "✔ Se o palato mole não é visível (apenas palato duro), é Classe IV, o que correlacionase fortemente com dificuldade de intubação.", "Classe II vê quase tudo.", "Sugere dificuldade, mas não torna a intubação necessariamente impossível (podese usar guias ou videolaringo)."]},
{id:196,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Ao avaliar uma gestante em trabalho de parto que necessita de intervenção, o anestesista nota que, ao abrir a boca, o palato mole não é visível de forma alguma. Qual o Mallampati e o que isso sugere?",alternativas:["A) Mallampati III; Intubação fácil", "B) Mallampati IV; Provável via aérea difícil", "C) Mallampati II; Necessidade de laringoscopia direta", "D) Mallampati IV; Intubação impossível"],correta:1,justificativas:["Classe III ainda vê o palato mole.", "✔ Se o palato mole não é visível (apenas palato duro), é Classe IV, o que correlacionase fortemente com dificuldade de intubação.", "Classe II vê quase tudo.", "Sugere dificuldade, mas não torna a intubação necessariamente impossível (podese usar guias ou videolaringo)."]},
{id:197,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"avançado",enunciado:"Em uma fratura exposta de tíbia com lesão da artéria poplítea que necessita de shunt vascular imediato, a classificação é Grau IIIC. Qual o principal fator prognóstico para o membro neste caso?",alternativas:["A) O tamanho da ferida na pele", "B) O tempo de isquemia morna do membro", "C) O tipo de antibiótico utilizado", "D) A idade do paciente"],correta:1,justificativas:["A lesão vascular sobrepõese ao tamanho da ferida.", "✔ No Grau IIIC, o salvamento do membro depende diretamente de restaurar a perfusão antes que ocorra necrose muscular irreversível por isquemia.", "e D: São importantes, mas secundários à viabilidade tecidual por fluxo sanguíneo.", "Alternativa D incorreta."]},
{id:198,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Em uma fratura exposta de tíbia com lesão da artéria poplítea que necessita de shunt vascular imediato, a classificação é Grau IIIC. Qual o principal fator prognóstico para o membro neste caso?",alternativas:["A) O tamanho da ferida na pele", "B) O tempo de isquemia morna do membro", "C) O tipo de antibiótico utilizado", "D) A idade do paciente"],correta:1,justificativas:["A lesão vascular sobrepõese ao tamanho da ferida.", "✔ No Grau IIIC, o salvamento do membro depende diretamente de restaurar a perfusão antes que ocorra necrose muscular irreversível por isquemia.", "e D: São importantes, mas secundários à viabilidade tecidual por fluxo sanguíneo.", "Alternativa D incorreta."]},
{id:199,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"avançado",enunciado:"Uma criança apresenta dor após trauma no tornozelo. O RX inicial é normal, mas há dor intensa à palpação sobre a placa de crescimento. Após 2 anos, ela apresenta encurtamento do membro. Qual o provável diagnóstico retrospectivo?",alternativas:["A) Salter-Harris II", "B) Salter-Harris III", "C) Salter-Harris V", "D) Salter-Harris I"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ A Tipo V (compressão) frequentemente tem RX inicial normal (sem traço visível), mas destrói as células da fise, causando parada de crescimento futura.", "Alternativa D incorreta."]},
{id:200,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"Uma criança apresenta dor após trauma no tornozelo. O RX inicial é normal, mas há dor intensa à palpação sobre a placa de crescimento. Após 2 anos, ela apresenta encurtamento do membro. Qual o provável diagnóstico retrospectivo?",alternativas:["A) Salter-Harris II", "B) Salter-Harris III", "C) Salter-Harris V", "D) Salter-Harris I"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ A Tipo V (compressão) frequentemente tem RX inicial normal (sem traço visível), mas destrói as células da fise, causando parada de crescimento futura.", "Alternativa D incorreta."]},
{id:201,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"avançado",enunciado:"Paciente vítima de queda de altura apresenta fratura exposta de fêmur. Ao exame, nota-se ferida de 4 cm com moderada contaminação e esmagamento muscular localizado, mas a pele permite cobertura completa do osso sem tensão. Qual a classificação?",alternativas:["A) Grau I", "B) Grau II", "C) Grau IIIA", "D) Grau IIIB"],correta:1,justificativas:["Feridas > 1 cm saem do Grau I.", "✔ O Grau II é definido por feridas entre 1 e 10 cm, com dano de partes moles moderado e, fundamentalmente, onde a cobertura cutânea do osso ainda é possível.", "O Grau III envolve alta energia, cominuição severa ou feridas > 10 cm.", "Exigiria a necessidade de retalho (falha de cobertura cutânea)."]},
