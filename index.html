{id:498,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Qual nutriente, essencial para a absorção intestinal de cálcio, costuma estar em níveis baixos na população idosa, agravando a fragilidade óssea?",alternativas:["A) Vitamina C", "B) Vitamina K", "C) Vitamina D", "D) Vitamina B12"],correta:2,justificativas:["Vitamina C é importante para o colágeno, mas não controla o cálcio diretamente.", "A Vitamina K ajuda na fixação, mas a D é a \"chave\" da absorção primária.", "✔ A Vitamina D é fundamental para que o cálcio da dieta entre no sangue e chegue ao osso. Sua deficiência é onipresente em idosos com pouca exposição solar.", "A B12 é vital para o sistema nervoso e sangue, não para o metabolismo do cálcio."]},
{id:499,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"O principal objetivo do tratamento cirúrgico imediato em uma fratura de quadril no idoso é:",alternativas:["A) Garantir que o paciente nunca mais precise de bengala", "B) Permitir a mobilização precoce e evitar complicações do repouso prolongado (como pneumonia e trombose)", "C) Deixar o osso mais forte do que era antes da quebra", "D) Evitar que o paciente sinta qualquer dor no pós-operatório"],correta:1,justificativas:["Nem sempre é possível recuperar a marcha sem auxílio, dependendo da condição prévia.", "✔ Idosos não toleram bem o repouso no leito. A cirurgia visa estabilizar o osso para que ele possa sentar e andar o quanto antes, evitando complicações fatais.", "A cirurgia repara o dano, mas não cura a osteoporose sistêmica de base.", "O pósoperatório ortopédico sempre envolve algum manejo de dor; o foco principal é a função e sobrevivência. ## Questões gerais"]},
{id:500,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"O principal objetivo do tratamento cirúrgico imediato em uma fratura de quadril no idoso é:",alternativas:["A) Garantir que o paciente nunca mais precise de bengala", "B) Permitir a mobilização precoce e evitar complicações do repouso prolongado (como pneumonia e trombose)", "C) Deixar o osso mais forte do que era antes da quebra", "D) Evitar que o paciente sinta qualquer dor no pós-operatório"],correta:1,justificativas:["Nem sempre é possível recuperar a marcha sem auxílio, dependendo da condição prévia.", "✔ Idosos não toleram bem o repouso no leito. A cirurgia visa estabilizar o osso para que ele possa sentar e andar o quanto antes, evitando complicações fatais.", "A cirurgia repara o dano, mas não cura a osteoporose sistêmica de base.", "O pósoperatório ortopédico sempre envolve algum manejo de dor; o foco principal é a função e sobrevivência. ## Questões gerais"]},
{id:501,tema:"Fraturas",subtema:"Questões Gerais",dificuldade:"iniciante",enunciado:"Um paciente de 72 anos, após queda da própria altura, apresenta dor intensa no quadril direito, encurtamento do membro inferior e atitude em rotação externa. Ao exame radiográfico, observa-se traço de fratura que une o grande ao pequeno trocanter. Qual o diagnóstico radiológico e o sinal clínico clássico esperado?",alternativas:["A) Fratura do colo do femoral; sinal de Trendelenburg", "B) Fratura transtrocanteriana; hematoma na região lateral do quadril", "C) Luxação posterior do quadril; posição de \"banhista pudico\"", "D) Fratura da cabeça femoral; sinal de Drehmann"],correta:1,justificativas:["Na fratura do colo (intracapsular), o hematoma é raro por estar contido pela cápsula.", "✔ A descrição clínica (encurtamento e rotação externa) é clássica de fraturas extracapsulares (transtrocanterianas). O hematoma tardio na face lateral é comum por ser uma zona muito vascularizada e extracapsular.", "Na luxação posterior, o membro fica em rotação interna e adução (banhista pudico).", "Fraturas da cabeça femoral são raras e associadas a luxações de alta energia, não queda da própria altura."]},
{id:502,tema:"Fraturas",subtema:"Questões Gerais",dificuldade:"intermediário",enunciado:"Um paciente de 72 anos, após queda da própria altura, apresenta dor intensa no quadril direito, encurtamento do membro inferior e atitude em rotação externa. Ao exame radiográfico, observa-se traço de fratura que une o grande ao pequeno trocanter. Qual o diagnóstico radiológico e o sinal clínico clássico esperado?",alternativas:["A) Fratura do colo do femoral; sinal de Trendelenburg", "B) Fratura transtrocanteriana; hematoma na região lateral do quadril", "C) Luxação posterior do quadril; posição de \"banhista pudico\"", "D) Fratura da cabeça femoral; sinal de Drehmann"],correta:1,justificativas:["Na fratura do colo (intracapsular), o hematoma é raro por estar contido pela cápsula.", "✔ A descrição clínica (encurtamento e rotação externa) é clássica de fraturas extracapsulares (transtrocanterianas). O hematoma tardio na face lateral é comum por ser uma zona muito vascularizada e extracapsular.", "Na luxação posterior, o membro fica em rotação interna e adução (banhista pudico).", "Fraturas da cabeça femoral são raras e associadas a luxações de alta energia, não queda da própria altura."]},
{id:503,tema:"Fraturas",subtema:"Questões Gerais",dificuldade:"iniciante",enunciado:"No atendimento a uma criança de 6 anos com suspeita de fratura de antebraço, o médico observa uma angulação da cortical em apenas um dos lados do rádio, enquanto o lado oposto permanece íntegro e apenas \"curvado\". Como se classifica essa fratura pediátrica?",alternativas:["A) Fratura em Galho Verde", "B) Fratura em Toro (Torus)", "C) Fratura de Salter-Harris tipo I", "D) Deformidade Plástica"],correta:0,justificativas:["✔ A fratura em galho verde ocorre quando há ruptura de uma cortical (tensão) e encurvamento da outra (compressão), típica do osso poroso da criança.", "Na fratura em toro, há um abaulamento circunferencial da cortical por compressão axial, sem ruptura franca.", "SalterHarris envolve a placa epifisária (fise), o que não foi descrito.", "Na deformidade plástica, não há linha de fratura visível, apenas o encurvamento microscópico do osso."]},
{id:504,tema:"Fraturas",subtema:"Questões Gerais",dificuldade:"intermediário",enunciado:"No atendimento a uma criança de 6 anos com suspeita de fratura de antebraço, o médico observa uma angulação da cortical em apenas um dos lados do rádio, enquanto o lado oposto permanece íntegro e apenas \"curvado\". Como se classifica essa fratura pediátrica?",alternativas:["A) Fratura em Galho Verde", "B) Fratura em Toro (Torus)", "C) Fratura de Salter-Harris tipo I", "D) Deformidade Plástica"],correta:0,justificativas:["✔ A fratura em galho verde ocorre quando há ruptura de uma cortical (tensão) e encurvamento da outra (compressão), típica do osso poroso da criança.", "Na fratura em toro, há um abaulamento circunferencial da cortical por compressão axial, sem ruptura franca.", "SalterHarris envolve a placa epifisária (fise), o que não foi descrito.", "Na deformidade plástica, não há linha de fratura visível, apenas o encurvamento microscópico do osso."]},
{id:505,tema:"Fraturas",subtema:"Questões Gerais",dificuldade:"iniciante",enunciado:"Um paciente adulto sofre queda sobre a mão espalmada em extensão. Apresenta dor na \"tabaqueira anatômica\" ao exame físico. As radiografias iniciais de punho são negativas para fratura. Qual a conduta diagnóstica recomendada?",alternativas:["A) Dar alta com analgésicos e orientar retorno se a dor persistir por 30 dias", "B) Solicitar Ressonância Magnética imediata, pois o Raio-X não vê fratura de rádio distal", "C) Imobilização com gesso escafoide e repetir o Raio-X em 10 a 14 dias", "D) Solicitar Tomografia Computadorizada de punho em incidência para túnel do carpo"],correta:2,justificativas:["O risco de pseudoartrose e necrose avascular do escafoide é alto se não tratado.", "Embora a RM seja padrãoouro, a conduta clássica em provas de acesso direto é a imobilização e repetição do RX.", "✔ A suspeita de fratura de escafoide com RX inicial normal exige imobilização preventiva, pois o traço de fratura costuma aparecer após a reabsorção óssea inicial (1014 dias).", "A incidência de túnel do carpo não é a ideal para avaliar o corpo do escafoide."]},
{id:506,tema:"Fraturas",subtema:"Questões Gerais",dificuldade:"intermediário",enunciado:"Um paciente adulto sofre queda sobre a mão espalmada em extensão. Apresenta dor na \"tabaqueira anatômica\" ao exame físico. As radiografias iniciais de punho são negativas para fratura. Qual a conduta diagnóstica recomendada?",alternativas:["A) Dar alta com analgésicos e orientar retorno se a dor persistir por 30 dias", "B) Solicitar Ressonância Magnética imediata, pois o Raio-X não vê fratura de rádio distal", "C) Imobilização com gesso escafoide e repetir o Raio-X em 10 a 14 dias", "D) Solicitar Tomografia Computadorizada de punho em incidência para túnel do carpo"],correta:2,justificativas:["O risco de pseudoartrose e necrose avascular do escafoide é alto se não tratado.", "Embora a RM seja padrãoouro, a conduta clássica em provas de acesso direto é a imobilização e repetição do RX.", "✔ A suspeita de fratura de escafoide com RX inicial normal exige imobilização preventiva, pois o traço de fratura costuma aparecer após a reabsorção óssea inicial (1014 dias).", "A incidência de túnel do carpo não é a ideal para avaliar o corpo do escafoide."]},
{id:507,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"No trauma de punho, a fratura de Colles é caracterizada por um desvio específico do fragmento distal do rádio. Qual é esse desvio e o nome da deformidade clínica resultante?",alternativas:["A) Desvio volar; deformidade em \"ventre de garfo\"", "B) Desvio dorsal; deformidade em \"dorso de garfo\"", "C) Desvio lateral; deformidade em \"baioneta\"", "D) Desvio volar; deformidade de Smith"],correta:1,justificativas:["\"Ventre de garfo\" referese à fratura de Smith (Colles invertida).", "✔ A fratura de Colles ocorre por queda em extensão, gerando desvio dorsal e radial do fragmento distal, criando o aspecto de \"dorso de garfo\".", "Deformidade em baioneta é mais comum em desvios radias acentuados, mas não define a Colles isoladamente.", "A deformidade de Smith é o oposto da Colles (desvio volar)."]},
{id:508,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"No trauma de punho, a fratura de Colles é caracterizada por um desvio específico do fragmento distal do rádio. Qual é esse desvio e o nome da deformidade clínica resultante?",alternativas:["A) Desvio volar; deformidade em \"ventre de garfo\"", "B) Desvio dorsal; deformidade em \"dorso de garfo\"", "C) Desvio lateral; deformidade em \"baioneta\"", "D) Desvio volar; deformidade de Smith"],correta:1,justificativas:["\"Ventre de garfo\" referese à fratura de Smith (Colles invertida).", "✔ A fratura de Colles ocorre por queda em extensão, gerando desvio dorsal e radial do fragmento distal, criando o aspecto de \"dorso de garfo\".", "Deformidade em baioneta é mais comum em desvios radias acentuados, mas não define a Colles isoladamente.", "A deformidade de Smith é o oposto da Colles (desvio volar)."]},
{id:509,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Paciente jovem apresenta-se após acidente de motocicleta com dor e deformidade na perna. Ao exame, observa-se uma ferida de 0,5 cm na face medial da tíbia, com exposição óssea puntiforme que regrediu para dentro da pele. De acordo com a classificação de Gustilo-Anderson, qual o grau correto?",alternativas:["A) Grau I", "B) Grau II", "C) Grau IIIA", "D) Grau IIIB"],correta:0,justificativas:["✔ Lesões menores que 1 cm, com mínima contaminação e sem dano extensos às partes moles, são classificadas como Grau I.", "Grau II exige ferida entre 1 e 10 cm.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:510,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Paciente jovem apresenta-se após acidente de motocicleta com dor e deformidade na perna. Ao exame, observa-se uma ferida de 0,5 cm na face medial da tíbia, com exposição óssea puntiforme que regrediu para dentro da pele. De acordo com a classificação de Gustilo-Anderson, qual o grau correto?",alternativas:["A) Grau I", "B) Grau II", "C) Grau IIIA", "D) Grau IIIB"],correta:0,justificativas:["✔ Lesões menores que 1 cm, com mínima contaminação e sem dano extensos às partes moles, são classificadas como Grau I.", "Grau II exige ferida entre 1 e 10 cm.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:511,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Durante a avaliação de uma luxação de joelho reduzida, qual o sinal clínico ou exame físico é prioritário para descartar a complicação arterial mais comum?",alternativas:["A) Teste de Lachman", "B) Avaliação da sensibilidade no dermátomo de L5", "C) Palpação dos pulsos pedioso e tibial posterior e cálculo do Índice Tornozelo-Braquial (IT", "B) "],correta:2,justificativas:["Alternativa A incorreta.", "Avalia a parte neurológica (nervo fibular comum), importante, mas o risco vascular é mais crítico para a viabilidade do membro.", "✔ A luxação de joelho é uma emergência vascular potencial (lesão da artéria poplítea). O ITB < 0,9 é um forte preditor de lesão arterial.", "Alternativa D incorreta."]},
{id:512,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Durante a avaliação de uma luxação de joelho reduzida, qual o sinal clínico ou exame físico é prioritário para descartar a complicação arterial mais comum?",alternativas:["A) Teste de Lachman", "B) Avaliação da sensibilidade no dermátomo de L5", "C) Palpação dos pulsos pedioso e tibial posterior e cálculo do Índice Tornozelo-Braquial (IT", "B) "],correta:2,justificativas:["Alternativa A incorreta.", "Avalia a parte neurológica (nervo fibular comum), importante, mas o risco vascular é mais crítico para a viabilidade do membro.", "✔ A luxação de joelho é uma emergência vascular potencial (lesão da artéria poplítea). O ITB < 0,9 é um forte preditor de lesão arterial.", "Alternativa D incorreta."]},
{id:513,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"A fratura de Monteggia é uma lesão que combina um componente de fratura óssea e uma luxação. Identifique a combinação correta:",alternativas:["A) Fratura do rádio distal e luxação da articulação radioulnar distal", "B) Fratura da ulna proximal e luxação da cabeça do rádio", "C) Fratura do rádio proximal e luxação da articulação ulnoumeral", "D) Fratura de ambos os ossos do antebraço e luxação do cotovelo"],correta:1,justificativas:["Esta é a definição da fraturaluxação de Galeazzi.", "✔ Por definição, Monteggia é a fratura do terço proximal da ulna associada à luxação da cabeça do rádio.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:514,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"A fratura de Monteggia é uma lesão que combina um componente de fratura óssea e uma luxação. Identifique a combinação correta:",alternativas:["A) Fratura do rádio distal e luxação da articulação radioulnar distal", "B) Fratura da ulna proximal e luxação da cabeça do rádio", "C) Fratura do rádio proximal e luxação da articulação ulnoumeral", "D) Fratura de ambos os ossos do antebraço e luxação do cotovelo"],correta:1,justificativas:["Esta é a definição da fraturaluxação de Galeazzi.", "✔ Por definição, Monteggia é a fratura do terço proximal da ulna associada à luxação da cabeça do rádio.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:515,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Idoso de 80 anos, hipertenso e diabético, apresenta fratura do colo do fêmur Garden IV (totalmente desviada). Qual a principal complicação vascular tardia esperada se esta fratura não for tratada adequadamente ou fixada com falha?",alternativas:["A) Osteomielite hematogênica", "B) Síndrome de embolia gordurosa", "C) Necrose avascular da cabeça femoral", "D) Trombose venosa profunda"],correta:2,justificativas:["Osteomielite é complicação infecciosa, geralmente póscirúrgica ou em expostas.", "A embolia gordurosa ocorre agudamente no trauma de ossos longos, não é uma complicação tardia vascular do local da fratura.", "✔ O colo do fêmur tem suprimento sanguíneo retrógrado (artérias circunflexas). Fraturas desviadas (Garden III e IV) rompem esses vasos, levando à isquemia e necrose da cabeça.", "É uma complicação sistêmica da imobilidade, não intrínseca à vascularização do osso fraturado."]},
{id:516,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Idoso de 80 anos, hipertenso e diabético, apresenta fratura do colo do fêmur Garden IV (totalmente desviada). Qual a principal complicação vascular tardia esperada se esta fratura não for tratada adequadamente ou fixada com falha?",alternativas:["A) Osteomielite hematogênica", "B) Síndrome de embolia gordurosa", "C) Necrose avascular da cabeça femoral", "D) Trombose venosa profunda"],correta:2,justificativas:["Osteomielite é complicação infecciosa, geralmente póscirúrgica ou em expostas.", "A embolia gordurosa ocorre agudamente no trauma de ossos longos, não é uma complicação tardia vascular do local da fratura.", "✔ O colo do fêmur tem suprimento sanguíneo retrógrado (artérias circunflexas). Fraturas desviadas (Garden III e IV) rompem esses vasos, levando à isquemia e necrose da cabeça.", "É uma complicação sistêmica da imobilidade, não intrínseca à vascularização do osso fraturado."]},
{id:517,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Uma criança de 9 anos sofre queda de um brinquedo e apresenta dor e edema no cotovelo. O RX mostra uma linha de fratura que atravessa a fise e termina saindo pela metáfise. Segundo Salter-Harris, qual o tipo desta fratura?",alternativas:["A) Tipo I", "B) Tipo II", "C) Tipo III", "D) Tipo IV"],correta:1,justificativas:["Tipo I é apenas através da fise.", "✔ SalterHarris II envolve a fise e a metáfise (é a mais comum). Dica: Metáfise = Tipo 2 (SALTER A de \"Above\"/Acima).", "Tipo III envolve fise e epífise (SALTER L de \"Lower\"/Abaixo).", "Tipo IV atravessa metáfise, fise e epífise."]},
{id:518,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Uma criança de 9 anos sofre queda de um brinquedo e apresenta dor e edema no cotovelo. O RX mostra uma linha de fratura que atravessa a fise e termina saindo pela metáfise. Segundo Salter-Harris, qual o tipo desta fratura?",alternativas:["A) Tipo I", "B) Tipo II", "C) Tipo III", "D) Tipo IV"],correta:1,justificativas:["Tipo I é apenas através da fise.", "✔ SalterHarris II envolve a fise e a metáfise (é a mais comum). Dica: Metáfise = Tipo 2 (SALTER A de \"Above\"/Acima).", "Tipo III envolve fise e epífise (SALTER L de \"Lower\"/Abaixo).", "Tipo IV atravessa metáfise, fise e epífise."]},
{id:519,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Qual incidência radiográfica é fundamental para o diagnóstico de uma luxação posterior do ombro, que muitas vezes passa despercebida no Raio-X em AP (Anteroposterior)?",alternativas:["A) AP com rotação interna", "B) Perfil de Escápula (Y)", "C) Incidência Axilar ou Perfil de Velpeau", "D) Incidência de Outlet"],correta:2,justificativas:["Pode mascarar ainda mais a sobreposição óssea.", "O perfil de escápula ajuda, mas o axilar é superior para visualizar a congruência glenoumeral no plano horizontal.", "✔ Na luxação posterior, o AP pode parecer normal (sinal da lâmpada). A incidência axilar mostra claramente o desvio da cabeça umeral em relação à glenoide.", "É usada para avaliar o espaço subacromial (impacto). ## Questões difíceis"]},
{id:520,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Qual incidência radiográfica é fundamental para o diagnóstico de uma luxação posterior do ombro, que muitas vezes passa despercebida no Raio-X em AP (Anteroposterior)?",alternativas:["A) AP com rotação interna", "B) Perfil de Escápula (Y)", "C) Incidência Axilar ou Perfil de Velpeau", "D) Incidência de Outlet"],correta:2,justificativas:["Pode mascarar ainda mais a sobreposição óssea.", "O perfil de escápula ajuda, mas o axilar é superior para visualizar a congruência glenoumeral no plano horizontal.", "✔ Na luxação posterior, o AP pode parecer normal (sinal da lâmpada). A incidência axilar mostra claramente o desvio da cabeça umeral em relação à glenoide.", "É usada para avaliar o espaço subacromial (impacto). ## Questões difíceis"]},
{id:521,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"avançado",enunciado:"Paciente de 35 anos, vítima de queda de altura, apresenta fratura cominutiva da diáfise da tíbia (Gustilo I). Após fixação com haste intramedular bloqueada, evolui no pós-operatório imediato com dor desproporcional, que piora severamente à dorsiflexão passiva do hálux. O membro apresenta pulsos presentes, mas há parestesia no primeiro espaço interdigital. Qual a conduta imediata?",alternativas:["A) Elevação do membro e aplicação de gelo para redução do edema", "B) Realizar arteriografia de urgência para descartar lesão da artéria tibial anterior", "C) Fasciotomia descompressiva de todos os compartimentos da perna", "D) Abertura de todos os curativos e observação por 6 horas antes de reintervir"],correta:2,justificativas:["Elevar o membro diminui o gradiente de pressão arteriolar, piorando a isquemia compartimental.", "O quadro é clínico; a arteriografia retardaria o tratamento definitivo.", "✔ O quadro é clássico de Síndrome Compartimental (dor desproporcional e dor ao alongamento passivo). O tratamento é cirúrgico imediato (fasciotomia), e a presença de pulso não exclui o diagnóstico.", "A janela de isquemia nervosa é curta; 6 horas de espera podem levar a sequelas irreversíveis."]},
{id:522,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Paciente de 35 anos, vítima de queda de altura, apresenta fratura cominutiva da diáfise da tíbia (Gustilo I). Após fixação com haste intramedular bloqueada, evolui no pós-operatório imediato com dor desproporcional, que piora severamente à dorsiflexão passiva do hálux. O membro apresenta pulsos presentes, mas há parestesia no primeiro espaço interdigital. Qual a conduta imediata?",alternativas:["A) Elevação do membro e aplicação de gelo para redução do edema", "B) Realizar arteriografia de urgência para descartar lesão da artéria tibial anterior", "C) Fasciotomia descompressiva de todos os compartimentos da perna", "D) Abertura de todos os curativos e observação por 6 horas antes de reintervir"],correta:2,justificativas:["Elevar o membro diminui o gradiente de pressão arteriolar, piorando a isquemia compartimental.", "O quadro é clínico; a arteriografia retardaria o tratamento definitivo.", "✔ O quadro é clássico de Síndrome Compartimental (dor desproporcional e dor ao alongamento passivo). O tratamento é cirúrgico imediato (fasciotomia), e a presença de pulso não exclui o diagnóstico.", "A janela de isquemia nervosa é curta; 6 horas de espera podem levar a sequelas irreversíveis."]},
{id:523,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"avançado",enunciado:"No planejamento cirúrgico de uma fratura de colo de fêmur Garden III em um paciente de 32 anos, vítima de acidente automobilístico, qual é o objetivo terapêutico prioritário e a técnica de escolha?",alternativas:["A) Artroplastia total de quadril para evitar a necrose avascular", "B) Redução anatômica (preferencialmente fechada) e fixação interna urgente com parafusos canulados ou DHS", "C) Hemiartroplastia tipo Thompson devido ao alto risco de pseudoartrose", "D) Tração esquelética por 6 semanas seguida de gesso pélvico-podálico"],correta:1,justificativas:["Alternativa A incorreta.", "✔ Em pacientes jovens, o objetivo é a preservação da cabeça femoral (\"Time is bone\"). A fixação interna deve ser feita o mais rápido possível para tentar salvar a vascularização remanescente.", "Alternativa C incorreta.", "O tratamento conservador no colo do fêmur desviado em jovens é proscrito pelo altíssimo índice de falha."]},
{id:524,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"No planejamento cirúrgico de uma fratura de colo de fêmur Garden III em um paciente de 32 anos, vítima de acidente automobilístico, qual é o objetivo terapêutico prioritário e a técnica de escolha?",alternativas:["A) Artroplastia total de quadril para evitar a necrose avascular", "B) Redução anatômica (preferencialmente fechada) e fixação interna urgente com parafusos canulados ou DHS", "C) Hemiartroplastia tipo Thompson devido ao alto risco de pseudoartrose", "D) Tração esquelética por 6 semanas seguida de gesso pélvico-podálico"],correta:1,justificativas:["Alternativa A incorreta.", "✔ Em pacientes jovens, o objetivo é a preservação da cabeça femoral (\"Time is bone\"). A fixação interna deve ser feita o mais rápido possível para tentar salvar a vascularização remanescente.", "Alternativa C incorreta.", "O tratamento conservador no colo do fêmur desviado em jovens é proscrito pelo altíssimo índice de falha."]},
{id:525,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"avançado",enunciado:"Paciente de 45 anos com fratura diafisária de fêmur unilateral fechada. Durante a fixação com haste intramedular fresada (reamed), apresenta queda súbita da saturação de O2 e da pressão arterial, associada a petéquias em conjuntiva. Qual a principal causa fisiopatológica e a conduta?",alternativas:["A) Choque hipovolêmico por perda sanguínea oculta; reposição volêmica agressiva", "B) Embolia gordurosa; suporte ventilatório e estabilização hemodinâmica", "C) Tromboembolismo pulmonar (TEP) agudo; início imediato de heparinização plena", "D) Reação anafilática ao metal da haste; administração de adrenalina"],correta:1,justificativas:["Embora perca sangue, as petéquias e a hipóxia súbita direcionam para embolia.", "✔ A fresagem do canal medular aumenta a pressão intramedular, facilitando a entrada de gordura na circulação (Síndrome da Embolia Gordurosa). O tratamento é de suporte (oxigênio e estabilização).", "O TEP costuma ser mais tardio (dias após). A petéquia é patognomônica da gordurosa.", "Reações alérgicas ao titânio/aço em cirurgia ortopédica aguda são extremamente raras e não cursam com petéquias conjuntivais."]},
{id:526,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Paciente de 45 anos com fratura diafisária de fêmur unilateral fechada. Durante a fixação com haste intramedular fresada (reamed), apresenta queda súbita da saturação de O2 e da pressão arterial, associada a petéquias em conjuntiva. Qual a principal causa fisiopatológica e a conduta?",alternativas:["A) Choque hipovolêmico por perda sanguínea oculta; reposição volêmica agressiva", "B) Embolia gordurosa; suporte ventilatório e estabilização hemodinâmica", "C) Tromboembolismo pulmonar (TEP) agudo; início imediato de heparinização plena", "D) Reação anafilática ao metal da haste; administração de adrenalina"],correta:1,justificativas:["Embora perca sangue, as petéquias e a hipóxia súbita direcionam para embolia.", "✔ A fresagem do canal medular aumenta a pressão intramedular, facilitando a entrada de gordura na circulação (Síndrome da Embolia Gordurosa). O tratamento é de suporte (oxigênio e estabilização).", "O TEP costuma ser mais tardio (dias após). A petéquia é patognomônica da gordurosa.", "Reações alérgicas ao titânio/aço em cirurgia ortopédica aguda são extremamente raras e não cursam com petéquias conjuntivais."]},
{id:527,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"avançado",enunciado:"Sobre a classificação de Gustilo-Anderson para fraturas expostas, em qual cenário uma lesão é obrigatoriamente classificada como Grau III, independentemente do tamanho da ferida cutânea?",alternativas:["A) Quando há presença de fratura segmentar (bifocal) ou solo altamente contaminado (fazenda/esgoto)", "B) Quando a ferida tem entre 1 e 10 cm de extensão", "C) Quando o paciente é diabético ou tabagista inveterado", "D) Quando ocorre lesão nervosa periférica associada"],correta:0,justificativas:["✔ Alta energia (segmentares), contaminação maciça (fazenda) ou lesão vascular que exija reparo são critérios automáticos para Grau III.", "Isso define Grau II se as partes moles estiverem boas.", "Comorbidades não mudam a classificação de Gustilo (que é morfológica da lesão).", "Lesão nervosa isolada não define Grau III; a lesão vascular sim."]},
{id:528,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Sobre a classificação de Gustilo-Anderson para fraturas expostas, em qual cenário uma lesão é obrigatoriamente classificada como Grau III, independentemente do tamanho da ferida cutânea?",alternativas:["A) Quando há presença de fratura segmentar (bifocal) ou solo altamente contaminado (fazenda/esgoto)", "B) Quando a ferida tem entre 1 e 10 cm de extensão", "C) Quando o paciente é diabético ou tabagista inveterado", "D) Quando ocorre lesão nervosa periférica associada"],correta:0,justificativas:["✔ Alta energia (segmentares), contaminação maciça (fazenda) ou lesão vascular que exija reparo são critérios automáticos para Grau III.", "Isso define Grau II se as partes moles estiverem boas.", "Comorbidades não mudam a classificação de Gustilo (que é morfológica da lesão).", "Lesão nervosa isolada não define Grau III; a lesão vascular sim."]},
{id:529,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"avançado",enunciado:"Uma fratura de rádio distal com desvio volar (Smith) apresenta-se instável e com necessidade de cirurgia. Qual o acesso cirúrgico mais utilizado e qual o dispositivo de fixação padrão-ouro atual?",alternativas:["A) Acesso dorsal de Thompson; placa de compressão dinâmica (DCP)", "B) Acesso volar de Henry; placa bloqueada volar (LCP)", "C) Acesso lateral; fios de Kirschner percutâneos", "D) Acesso dorsal; fixador externo biplanar"],correta:1,justificativas:["O acesso dorsal é mais usado para Colles (se necessário), mas aumenta o risco de ruptura de tendões extensores.", "✔ O acesso de Henry (volar) permite a aplicação da placa bloqueada, que é o padrão atual para garantir estabilidade e permitir mobilização precoce.", "Fios de Kirschner são insuficientes para a maioria das fraturas instáveis de Smith.", "Fixador externo é usado em fraturas com grave dano de partes moles ou extrema cominuição, não como padrão para Smith."]},
{id:530,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Uma fratura de rádio distal com desvio volar (Smith) apresenta-se instável e com necessidade de cirurgia. Qual o acesso cirúrgico mais utilizado e qual o dispositivo de fixação padrão-ouro atual?",alternativas:["A) Acesso dorsal de Thompson; placa de compressão dinâmica (DCP)", "B) Acesso volar de Henry; placa bloqueada volar (LCP)", "C) Acesso lateral; fios de Kirschner percutâneos", "D) Acesso dorsal; fixador externo biplanar"],correta:1,justificativas:["O acesso dorsal é mais usado para Colles (se necessário), mas aumenta o risco de ruptura de tendões extensores.", "✔ O acesso de Henry (volar) permite a aplicação da placa bloqueada, que é o padrão atual para garantir estabilidade e permitir mobilização precoce.", "Fios de Kirschner são insuficientes para a maioria das fraturas instáveis de Smith.", "Fixador externo é usado em fraturas com grave dano de partes moles ou extrema cominuição, não como padrão para Smith."]},
{id:531,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"avançado",enunciado:"Em uma fratura supracondiliana de úmero em criança (Gartland tipo III), o paciente apresenta incapacidade de realizar o sinal de \"OK\" (flexão da falange distal do indicador e polegar). Qual nervo foi acometido?",alternativas:["A) Nervo Radial", "B) Nervo Ulnar", "C) Nervo Interósseo Anterior (ramo do Mediano)", "D) Nervo Axilar"],correta:2,justificativas:["Lesão do radial causaria queda do punho/extensão dos dedos.", "Ulnar causaria garra ulnar e perda de adução do polegar.", "✔ A incapacidade de fletir as falanges distais do 1º e 2º quirodáctilos indica lesão do nervo interósseo anterior, a neuropatia mais comum nas fraturas supracondilianas em extensão.", "O axilar inerva o deltoide e não chega ao antebraço."]},
{id:532,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Em uma fratura supracondiliana de úmero em criança (Gartland tipo III), o paciente apresenta incapacidade de realizar o sinal de \"OK\" (flexão da falange distal do indicador e polegar). Qual nervo foi acometido?",alternativas:["A) Nervo Radial", "B) Nervo Ulnar", "C) Nervo Interósseo Anterior (ramo do Mediano)", "D) Nervo Axilar"],correta:2,justificativas:["Lesão do radial causaria queda do punho/extensão dos dedos.", "Ulnar causaria garra ulnar e perda de adução do polegar.", "✔ A incapacidade de fletir as falanges distais do 1º e 2º quirodáctilos indica lesão do nervo interósseo anterior, a neuropatia mais comum nas fraturas supracondilianas em extensão.", "O axilar inerva o deltoide e não chega ao antebraço."]},
{id:533,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"avançado",enunciado:"Qual o critério absoluto para indicação de tratamento cirúrgico (estabilização) em uma fratura de clavícula no adulto?",alternativas:["A) Encurtamento maior que 2 cm ou desvio total entre os fragmentos", "B) Fratura do terço médio sem desvio", "C) Paciente destro com fratura à esquerda", "D) Idade superior a 60 anos"],correta:0,justificativas:["✔ Encurtamento > 2 cm está associado a alto índice de insatisfação, perda de força e pseudoartrose.", "Sem desvio o tratamento é conservador (tipoia).", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:534,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Qual o critério absoluto para indicação de tratamento cirúrgico (estabilização) em uma fratura de clavícula no adulto?",alternativas:["A) Encurtamento maior que 2 cm ou desvio total entre os fragmentos", "B) Fratura do terço médio sem desvio", "C) Paciente destro com fratura à esquerda", "D) Idade superior a 60 anos"],correta:0,justificativas:["✔ Encurtamento > 2 cm está associado a alto índice de insatisfação, perda de força e pseudoartrose.", "Sem desvio o tratamento é conservador (tipoia).", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:535,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"avançado",enunciado:"Paciente com fratura de bacia tipo \"Livro Aberto\" (disjunção da sínfise púbica > 2,5 cm) apresenta instabilidade hemodinâmica na sala de trauma. Qual a primeira medida ortopédica para controle de danos?",alternativas:["A) Redução aberta e fixação com placa definitiva", "B) Colocação de lençol ou cinta pélvica na altura dos trocanteres maiores", "C) Tração transesquelética femoral bilateral", "D) Arteriografia com embolização imediata"],correta:1,justificativas:["O paciente instável não tolera cirurgia definitiva (Controle de Danos).", "✔ A cinta pélvica reduz o volume interno da bacia, promovendo o tamponamento do sangramento venoso plexiforme. Deve ser no trocanter, não na crista ilíaca.", "Tração não estabiliza o volume pélvico agudamente.", "A estabilização mecânica (cinta) precede a embolização no protocolo ATLS."]},
{id:536,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Paciente com fratura de bacia tipo \"Livro Aberto\" (disjunção da sínfise púbica > 2,5 cm) apresenta instabilidade hemodinâmica na sala de trauma. Qual a primeira medida ortopédica para controle de danos?",alternativas:["A) Redução aberta e fixação com placa definitiva", "B) Colocação de lençol ou cinta pélvica na altura dos trocanteres maiores", "C) Tração transesquelética femoral bilateral", "D) Arteriografia com embolização imediata"],correta:1,justificativas:["O paciente instável não tolera cirurgia definitiva (Controle de Danos).", "✔ A cinta pélvica reduz o volume interno da bacia, promovendo o tamponamento do sangramento venoso plexiforme. Deve ser no trocanter, não na crista ilíaca.", "Tração não estabiliza o volume pélvico agudamente.", "A estabilização mecânica (cinta) precede a embolização no protocolo ATLS."]},

function SpiderChart({data,size=190}){
  const cx=size/2,cy=size/2,r=size*0.36,n=TEMAS.length;
  const ang=i=>(Math.PI*2*i)/n-Math.PI/2;
  const pt=(i,ratio)=>({x:cx+Math.cos(ang(i))*r*ratio,y:cy+Math.sin(ang(i))*r*ratio});
  const filled=TEMAS.map((t,i)=>pt(i,Math.max(0.04,data[t]??0)));
  const fp=filled.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ")+" Z";
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {[0.25,0.5,0.75,1].map(ring=>{const pts=TEMAS.map((_,i)=>pt(i,ring));const path=pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ")+" Z";return <path key={ring} d={path} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth={1}/>;}) }
      {TEMAS.map((_,i)=>{const e=pt(i,1);return <line key={i} x1={cx} y1={cy} x2={e.x.toFixed(1)} y2={e.y.toFixed(1)} stroke="rgba(255,255,255,0.07)" strokeWidth={1}/>;}) }
      <path d={fp} fill="rgba(99,102,241,0.2)" stroke="#6366f1" strokeWidth={1.5}/>
      {filled.map((p,i)=><circle key={i} cx={p.x.toFixed(1)} cy={p.y.toFixed(1)} r={3.5} fill={TEMA_CFG[TEMAS[i]].cor}/>)}
      {TEMAS.map((t,i)=>{const lp=pt(i,1.3);return <text key={t} x={lp.x.toFixed(1)} y={lp.y.toFixed(1)} textAnchor="middle" dominantBaseline="middle" fontSize={8.5} fill="rgba(255,255,255,0.5)" fontFamily="system-ui,sans-serif">{t.slice(0,7)}</text>;})}
    </svg>
  );
}

// Componente botão admin discreto com senha
function AdminDirectButton({ onLogin }) {
  const [show, setShow] = React.useState(false);
  const [pwd,  setPwd]  = React.useState("");
  const [err,  setErr]  = React.useState("");
  const ADMIN_PWD = "123Saude@";

  const handleTry = () => {
    if (pwd === ADMIN_PWD) {
      onLogin(ADMIN_PROFILE);
    } else {
      setErr("Senha incorreta.");
      setPwd("");
    }
  };

  if (!show) return (
    <div style={{textAlign:"right",marginTop:10}}>
      <button onClick={()=>setShow(true)}
        style={{background:"none",border:"none",color:"rgba(139,92,246,0.5)",

function AdminPanel({ onBack }) {
  const [tab,      setTab]      = useState("alunos");
  const [data,     setData]     = useState(null);
  const [loading,  setLoading]  = useState(true);
  const [detail,   setDetail]   = useState(null);
  const [detData,  setDetData]  = useState(null);

  const BG="#09111f",CARD="#0f1c2e",CARD2="#121f32",BD="rgba(255,255,255,0.07)",MT="#4a6070",TX="#dde6f0";

  useEffect(()=>{
    fetchAdminStats().then(d=>{ setData(d); setLoading(false); });
  },[]);

  const openDetail = async (user) => {
    setDetail(user); setDetData(null);
    const d = await fetchUserDetail(user.id);
    setDetData(d);
  };

  const handleApprove = async (id) => {
    await approveUser(id);
    const updated = await fetchAdminStats();
    setData(updated);
  };

  const handleDelete = async (id) => {
    if (!confirm("Excluir este perfil? Esta ação é irreversível.")) return;
    await deleteUser(id);
    const updated = await fetchAdminStats();
    setData(updated);
    if (detail?.id === id) setDetail(null);
  };

  const handleResetUserPwd = async (email) => {
    if (!confirm(`Enviar email de redefinição de senha para ${email}?`)) return;
    const r = await resetPassword(email);
    if (r.ok) alert(`✅ Email de redefinição enviado para ${email}`);
    else alert(`Erro: ${r.error}`);
  };

  if (loading) return (
    <div style={{minHeight:"100vh",background:BG,display:"flex",alignItems:"center",justifyContent:"center",color:TX,fontFamily:"system-ui"}}>
      <p>Carregando painel...</p>
    </div>
  );

  const users    = Array.isArray(data?.users)    ? data.users    : [];
  const sessions = Array.isArray(data?.sessions) ? data.sessions : [];
  const answers  = Array.isArray(data?.answers)  ? data.answers  : [];

  // ── Stats computadas ──────────────────────────────────────
  const approved = users.filter(u=>u.aprovado);
  const pending  = users.filter(u=>!u.aprovado);
  const totalQ   = sessions.reduce((a,s)=>a+s.total,0);
  const totalAc  = sessions.reduce((a,s)=>a+s.acertos,0);
  const taxaGeral = totalQ > 0 ? Math.round(totalAc/totalQ*100) : 0;

  // Taxa de acerto por tema
  const taxaPorTema = {};
  const errosPorTema = {};
  for (const a of answers) {
    if (!taxaPorTema[a.tema]) taxaPorTema[a.tema] = { c:0, t:0 };
    taxaPorTema[a.tema].t++;
    if (a.correta) taxaPorTema[a.tema].c++;
    if (!a.correta) errosPorTema[a.tema] = (errosPorTema[a.tema]||0)+1;
  }

  // Alunos mais ativos
  const atividadePorUser = {};
  for (const s of sessions) {
    if (!atividadePorUser[s.user_id]) atividadePorUser[s.user_id] = 0;
    atividadePorUser[s.user_id] += s.total;
  }

  // Questões com maior taxa de erro (por question_id não disponível aqui - por tema)
  const temaErroRanking = Object.entries(errosPorTema)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5);

  // Detail screen
  if (detail) {
    const TEMAS = ["Urgências","Classificações","Coluna","Complicações","Fraturas"];
    const CORES = {Urgências:"#ef4444",Classificações:"#8b5cf6",Coluna:"#10b981",Complicações:"#f59e0b",Fraturas:"#3b82f6"};

    const streak= detData?.xp?.streak || 0;
    const prog  = detData?.prog || [];
    const sess  = detData?.sess || [];
    const ans   = detData?.answers || [];
    const totalQd = sess.reduce((a,s)=>a+s.total,0);
    const totalAd = sess.reduce((a,s)=>a+s.acertos,0);
    const taxaD   = totalQd > 0 ? Math.round(totalAd/totalQd*100) : 0;

    // Taxa por tema
    const temaTaxa = {};
    for (const a of ans) {
      if (!temaTaxa[a.tema]) temaTaxa[a.tema] = {c:0,t:0};

      if (a.correta) temaTaxa[a.tema].c++;

    // Progresso por tema

              {[{l:"XP Total",v:xp},{l:"Streak",v:`${streak}🔥`},{l:"Questões",v:totalQd},{l:"Aproveitamento",v:`${taxaD}%`}].map(it=>(

              {TEMAS.map(t=>{
                const cor = CORES[t];
                const níveis = ["iniciante","intermediário","avançado"];
                const labels = ["Iniciante","Intermediário","Avançado"];
                const ta = temaTaxa[t];
                const pct = ta && ta.t > 0 ? Math.round(ta.c/ta.t*100) : 0;
                return(
                  <div key={t} style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span style={{fontSize:13,fontWeight:700}}>{t}</span>

                    </div>
                    <div style={{display:"flex",gap:6}}>
                      {níveis.map((n,i)=>{
                        const st = progMap[`${t}|${n}`] || "bloqueado";

                          </div>

                      })}

                  </div>

            </div>

            {/* Histórico de sessões */}
            <div style={{background:CARD,border:`1px solid ${BD}`,borderRadius:16,padding:16}}>
              <p style={{margin:"0 0 12px",fontSize:11,fontWeight:700,color:MT,textTransform:"uppercase",letterSpacing:".08em"}}>Últimas sessões</p>
              {sess.length === 0 ? <p style={{color:MT,fontSize:13}}>Sem sessões ainda.</p> :
                sess.slice(0,15).map((s,i)=>{
                  const p = s.total > 0 ? Math.round(s.acertos/s.total*100) : 0;
                  const cor = CORES[s.tema] || "#64748b";
                  const ml = s.mode==="simulado"?"📝":s.mode==="aleatorio"?"🎲":"📚";

                        <p style={{margin:0,fontSize:11,color:MT}}>{p}%</p>
                      </div>

                  );
                })
              }
            </div>
          </>}
        </div>
      </div>
    );
  }

  // ── MAIN ADMIN PANEL ──────────────────────────────────────────────────────
  const CORES = {Urgências:"#ef4444",Classificações:"#8b5cf6",Coluna:"#10b981",Complicações:"#f59e0b",Fraturas:"#3b82f6"};

  return (
    <div style={{minHeight:"100vh",background:BG,color:TX,fontFamily:"system-ui",padding:"0 0 40px"}}>

        <div style={{display:"flex",gap:6,marginBottom:16,overflowX:"auto"}}>

        {/* ── TAB: ALUNOS ── */}
        {tab==="alunos" && (
          <div>
            {approved.length === 0 ? <p style={{color:MT}}>Nenhum aluno aprovado ainda.</p> :
              approved.map(u=>{
                const ativ = atividadePorUser[u.id] || 0;
                return(
                  <div key={u.id} style={{background:CARD,border:`1px solid ${BD}`,borderRadius:14,padding:"14px 16px",marginBottom:8}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div style={{flex:1,cursor:"pointer"}} onClick={()=>openDetail(u)}>
                        <p style={{margin:0,fontSize:14,fontWeight:700,color:"#f0f6ff"}}>{u.nome}</p>

                      <div style={{display:"flex",gap:8,flexShrink:0}}>

            ) : pending.map(u=>(
              <div key={u.id} style={{background:CARD,border:"1px solid rgba(245,158,11,.3)",borderRadius:14,padding:"14px 16px",marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <p style={{margin:0,fontSize:14,fontWeight:700,color:"#f0f6ff"}}>{u.nome}</p>
                    <p style={{margin:"3px 0 0",fontSize:12,color:MT}}>RA: {u.ra} · {u.email}</p>
                    <p style={{margin:"3px 0 0",fontSize:11,color:"#fcd34d"}}>Cadastrado em {new Date(u.created_at).toLocaleDateString("pt-BR")}</p>
                  </div>
                  <div style={{display:"flex",gap:8,flexShrink:0}}>
                    <button onClick={()=>handleApprove(u.id)}
                      style={{background:"rgba(16,185,129,.2)",border:"1px solid rgba(16,185,129,.3)",color:"#6ee7b7",
                        borderRadius:8,padding:"8px 14px",cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>
                      ✓ Aprovar
                    </button>
                    <button onClick={()=>handleDelete(u.id)}
                      style={{background:"rgba(239,68,68,.15)",border:"1px solid rgba(239,68,68,.3)",color:"#fca5a5",

                      ✕
                    </button>
                  </div>
                </div>

        {/* ── TAB: DASHBOARD ── */}
        {tab==="dashboard" && (
          <div>
            {/* Taxa de acerto por tema */}
            <div style={{background:CARD,border:`1px solid ${BD}`,borderRadius:16,padding:16,marginBottom:14}}>
              <p style={{margin:"0 0 14px",fontSize:11,fontWeight:700,color:MT,textTransform:"uppercase",letterSpacing:".08em"}}>Taxa de acerto por tema (todos os alunos)</p>
              {Object.entries(taxaPorTema).length === 0 ? <p style={{color:MT,fontSize:13}}>Sem dados ainda.</p> :
                Object.entries(taxaPorTema).map(([tema,{c,t}])=>{
                  const pct = Math.round(c/t*100);
                  const cor = CORES[tema] || "#64748b";
                  return(
                    <div key={tema} style={{marginBottom:10}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                        <span style={{fontSize:13,fontWeight:600}}>{tema}</span>
                        <span style={{fontSize:12,fontWeight:700,color:pct>=70?"#10b981":pct>=50?cor:"#ef4444"}}>{pct}% ({t} respostas)</span>
                      </div>
                      <div style={{background:"rgba(255,255,255,0.07)",borderRadius:999,height:8,overflow:"hidden"}}>
                        <div style={{width:`${pct}%`,height:"100%",background:pct>=70?"#10b981":pct>=50?cor:"#ef4444",borderRadius:999,transition:"width .5s"}}/>

            </div>

            {/* Temas com maior taxa de erro */}
            <div style={{background:CARD,border:`1px solid ${BD}`,borderRadius:16,padding:16,marginBottom:14}}>

              {temaErroRanking.length === 0 ? <p style={{color:MT,fontSize:13}}>Sem dados ainda.</p> :
                temaErroRanking.map(([tema,n],i)=>(
                  <div key={tema} style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
                    <span style={{fontSize:16,fontWeight:800,color:"#ef4444",width:20}}>#{i+1}</span>

                    <span style={{fontSize:13,fontWeight:700,color:"#fca5a5"}}>{n} erros</span>

              }
            </div>

            {/* Alunos mais ativos */}
            <div style={{background:CARD,border:`1px solid ${BD}`,borderRadius:16,padding:16}}>
              <p style={{margin:"0 0 12px",fontSize:11,fontWeight:700,color:MT,textTransform:"uppercase",letterSpacing:".08em"}}>🏆 Alunos mais ativos</p>
              {Object.entries(atividadePorUser).length === 0 ? <p style={{color:MT,fontSize:13}}>Sem dados ainda.</p> :
                Object.entries(atividadePorUser)
                  .sort((a,b)=>b[1]-a[1])
                  .slice(0,10)
                  .map(([uid,n],i)=>{
                    const u = users.find(x=>x.id===uid);
                    if (!u) return null;
                    return(
                      <div key={uid} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,cursor:"pointer"}}

                          <p style={{margin:0,fontSize:11,color:MT}}>RA: {u.ra}</p>

        )}
      </div>
    </div>
  );
}


function OrthoQuizGame({ profile, onLogout }){
  const uid = profile?.id;
  const [sc,setSc]         = useState("home");
  const [xp,setXP]         = useState(0);
  const [prog,setProg]     = useState(initP());
  const [hits,setHits]     = useState({});
  const [hist,setHist]     = useState([]);
  const [streak,setStreak] = useState(0);
  const [lastD,setLastD]   = useState("");
  const [allQ,setAllQ]     = useState(FALLBACK);
  const [daily,setDaily]   = useState(false);
  const [sbLoaded,setSbLoaded] = useState(false);
  const [novaSenha, setNovaSenha] = useState("");
  const [confSenha, setConfSenha] = useState("");
  const [msgPerfil, setMsgPerfil] = useState("");
  const [errPerfil, setErrPerfil] = useState("");
  const [loadPerfil,setLoadPerfil]= useState(false);
  const [qMode,setQMode]   = useState(null);
  const [qTema,setQTema]   = useState(null);
  const [qDif,setQDif]     = useState(null);
  const [fila,setFila]     = useState([]);
  const [qIdx,setQIdx]     = useState(0);
  const [qTotal,setQTotal] = useState(0);
  const [sel,setSel]       = useState(null);
  const [conf,setConf]     = useState(false);
  const [elim,setElim]     = useState([]);
  const [sHits,setSHits]   = useState(0);
  const [sDone,setSDone]   = useState(0);
  const [xpAnim,setXpAnim] = useState(null);
  const [unlock,setUnlock] = useState(null);
  const [simCfg,setSimCfg] = useState({qtd:10,temas:TEMAS,difs:DIFS});
  const [simAns,setSimAns] = useState([]);
  const [simRev,setSimRev] = useState(null);
  const [selTema,setSelTema]= useState(null);
  const [aleAns,setAleAns] = useState([]);

  // Carregar dados do usuário do Supabase ao montar
  useEffect(()=>{
    if(!uid) return;
    loadUserData(uid).then(d=>{
      const hoje=new Date().toDateString();
      const xpVal  = d.xp?.xp    || 0;
      const strVal = d.xp?.streak|| 0;
      const ldVal  = d.xp?.last_date || "";
      setXP(xpVal); setStreak(strVal); setLastD(ldVal);
      // Streak diário
      if(ldVal !== hoje){
        const ontem=new Date();ontem.setDate(ontem.getDate()-1);
        const ns=ldVal===ontem.toDateString()?strVal+1:1;
        setStreak(ns);
        saveXP(uid, xpVal, ns, hoje);
        setLastD(hoje);
      }
      // Progresso por tema/nível
      const np=initP();
      d.prog.forEach(p=>{ if(np[p.tema]) np[p.tema][p.dificuldade]=p.status; });
      setProg(np);
      // Hits por tema/dificuldade (contagem de acertos)
      const nh={};
      d.prog.forEach(p=>{ if(!nh[p.tema])nh[p.tema]={}; nh[p.tema][p.dificuldade]=p.acertos_acumulados||0; });
      setHits(nh);
      // Histórico de sessões
      const hh=d.hist.map(s=>({data:new Date(s.created_at).toLocaleDateString("pt-BR"),tema:s.tema,dif:s.dificuldade,mode:s.mode,acertos:s.acertos,total:s.total}));
      setHist(hh);
      // Desafio diário
      const dailyDone = d.hist.some(s=>new Date(s.created_at).toDateString()===hoje);
      setDaily(dailyDone);
      setSbLoaded(true);
    }).catch(()=>setSbLoaded(true));
  },[uid]);

  // Carregar questões do banco
  useEffect(()=>{fetchQuestions().then(d=>{if(d)setAllQ(d);});},[]);

  const sXP   = (v,st,ld)=>{setXP(v);if(uid)saveXP(uid,v,st??streak,ld??lastD);};
  const sProg = (p)=>{setProg(p);};
  const sHit  = (h)=>{setHits(h);};
  const sHist = (h)=>{setHist(h);};

  // Spider: % de acerto médio por tema (baseado no histórico de sessões)
  const spider={};
  TEMAS.forEach(t=>{
    const sessT=hist.filter(h=>h.tema===t&&h.total>0);
    if(sessT.length===0){spider[t]=0;return;}
    const avg=sessT.reduce((a,h)=>a+h.acertos/h.total,0)/sessT.length;
    spider[t]=Math.min(1,avg);
  });

  const getTitulo=tema=>{const tp=prog[tema]||initP()[tema];if(tp.avançado==="concluido")return TITULO.avançado;if(tp.intermediário==="concluido")return TITULO.intermediário;if(tp.iniciante==="concluido")return TITULO.iniciante;return{t:"Interno",i:"🥼"};};
  const isCirurgiao=TEMAS.every(t=>prog[t]?.avançado==="concluido");

  const startEstudo=useCallback((tema,dif)=>{
    // Excluir questões já respondidas em níveis anteriores
    const difIdx = DIFS.indexOf(dif);
    const prevDifs = DIFS.slice(0, difIdx);
    let jaRespondidos = new Set();
    try {
      const stored = JSON.parse(sessionStorage.getItem(`oq_resp_${tema}`) || '{}');
      prevDifs.forEach(d => { (stored[d] || []).forEach(id => jaRespondidos.add(id)); });
    } catch(e) {}

    let pool = allQ.filter(q => q.tema===tema && q.dificuldade===dif && !jaRespondidos.has(q.id));
    // Se sobrar menos de 15 após excluir, usar pool completo do nível
    if (pool.length < 15) pool = allQ.filter(q => q.tema===tema && q.dificuldade===dif);
    if (!pool.length) { alert("Sem questões disponíveis neste nível ainda."); return; }

    // Garantir exatamente 15 questões (repetir se necessário)
    pool = pool.sort(() => Math.random() - .5);
    const fila15 = [];
    for (let i = 0; fila15.length < 15; i++) fila15.push(pool[i % pool.length]);

    setQMode("estudo");setQTema(tema);setQDif(dif);setFila(fila15);setQTotal(15);
    setQIdx(0);setSel(null);setConf(false);setElim([]);setSHits(0);setSDone(0);setUnlock(null);setSc("quiz");
  },[allQ]);

  const startAleatorio=useCallback(()=>{
    const pool=[...allQ].sort(()=>Math.random()-.5);
    setQMode("aleatorio");setQTema(null);setQDif(null);setFila([...pool,...pool,...pool]);setQTotal(0);
    setQIdx(0);setSel(null);setConf(false);setElim([]);setSHits(0);setSDone(0);setAleAns([]);setSc("quiz");
  },[allQ]);

  const startSimulado=useCallback(()=>{
    const pool=allQ.filter(q=>simCfg.temas.includes(q.tema)&&simCfg.difs.includes(q.dificuldade)).sort(()=>Math.random()-.5).slice(0,simCfg.qtd);
    if(!pool.length){alert("Sem questões para os filtros selecionados.");return;}
    setQMode("simulado");setFila(pool);setQTotal(pool.length);setSimAns(pool.map(q=>({q,sel:null})));
    setQIdx(0);setSel(null);setConf(false);setElim([]);setSHits(0);setSDone(0);setSc("quiz");
  },[allQ,simCfg]);

  const confirm=()=>{
    if(sel===null)return;
    if(qMode==="simulado"){
      setSimAns(prev=>{const n=[...prev];n[qIdx]={...n[qIdx],sel};return n;});
      if(qIdx+1>=fila.length)finSim();else{setQIdx(i=>i+1);setSel(null);setElim([]);}
      return;
    }
    setConf(true);
    const q=fila[qIdx],ok=sel===q.correta,delta=ok?12:-2,nxp=Math.max(0,xp+delta);
    setXP(nxp);if(uid)saveXP(uid,nxp,streak,lastD);
    setXpAnim({val:delta,ok});setTimeout(()=>setXpAnim(null),1600);
    if(ok){
      setSHits(h=>h+1);
      if(qDif==="avançado")fireConfetti();
    } else if(window.navigator?.vibrate)window.navigator.vibrate([50]);
    setSDone(d=>d+1);
  };

  const next=()=>{
    if(qMode==="aleatorio"){
      const q=fila[qIdx],ok=sel===q.correta;
      const novaResp={tema:q.tema,dif:q.dificuldade,ok};
      const novasAleAns=[...aleAns,novaResp];
      setAleAns(novasAleAns);
      // A cada 10 respostas salvar sessão agrupada por tema
      if(novasAleAns.length%10===0){
        if(uid){
          const ultimas=novasAleAns.slice(-10);
          const porTema={};
          ultimas.forEach(r=>{if(!porTema[r.tema])porTema[r.tema]={acertos:0,total:0};porTema[r.tema].total++;if(r.ok)porTema[r.tema].acertos++;});
          Object.entries(porTema).forEach(([tema,dados])=>saveSession(uid,"aleatorio",tema,"misto",dados.acertos,dados.total,0));
        }
      }
      setQIdx(i=>i+1);setSel(null);setConf(false);setElim([]);return;
    }
    // Modo estudo: sempre 15 questões fixas — não re-adicionar erros
    if(qIdx+1>=15) finEst(sHits);
    else { setQIdx(i=>i+1); setSel(null); setConf(false); setElim([]); }
  };

  const finEst=fh=>{
    const passou=fh>=PASS&&qTotal===15;
    // Salvar IDs respondidos nesta sessão para não repetir no nível acima
    try {
      const stored=JSON.parse(sessionStorage.getItem(`oq_resp_${qTema}`)||'{}');
      if(!stored[qDif])stored[qDif]=[];
      stored[qDif]=[...new Set([...stored[qDif],...fila.map(q=>q.id)])];
      sessionStorage.setItem(`oq_resp_${qTema}`,JSON.stringify(stored));
    } catch(e) {}
    const np=JSON.parse(JSON.stringify(prog));let nu=null;
    let xpBonus=0;
    if(passou){
      np[qTema][qDif]="concluido";
      const nd=DIFS[DIFS.indexOf(qDif)+1];
      if(nd&&np[qTema][nd]==="bloqueado"){np[qTema][nd]="desbloqueado";nu=nd;}
      sProg(np);
      fireConfetti();
      if(TEMAS.every(t=>np[t]?.avançado==="concluido"))setTimeout(()=>fireConfetti({particleCount:200,spread:120}),600);
      // Salvar progresso no Supabase
      if(uid){
        upsertProgress(uid,qTema,qDif,"concluido",fh);
        if(nu) upsertProgress(uid,qTema,nu,"desbloqueado",0);
      }
    } else if(uid) {
      // Atualizar acertos acumulados mesmo sem concluir
      upsertProgress(uid,qTema,qDif,"desbloqueado",fh);
    }
    // Atualizar hits local
    const nh=JSON.parse(JSON.stringify(hits));
    if(!nh[qTema])nh[qTema]={};
    nh[qTema][qDif]=(nh[qTema][qDif]||0)+fh;
    sHit(nh);
    // Desafio diário
    const hoje=new Date().toDateString();
    if(!daily){xpBonus=50;setDaily(true);}
    const nxp=Math.max(0,xp+xpBonus);
    if(xpBonus>0) sXP(nxp,streak,hoje);
    // Salvar sessão
    if(uid) saveSession(uid,"estudo",qTema,qDif,fh,qTotal,xpBonus);
    sHist([{data:new Date().toLocaleDateString("pt-BR"),tema:qTema,dif:qDif,mode:"estudo",acertos:fh,total:qTotal},...hist].slice(0,50));
    setSHits(fh);setUnlock(nu);setSc("resultado");
  };

  const finSim=()=>{
    const ans=simAns.map((a,i)=>({...a,sel:i===qIdx?sel:a.sel,ok:(i===qIdx?sel:a.sel)===a.q.correta}));
    setSimAns(ans);
    const ac=ans.filter(a=>a.ok).length;
    if(uid) saveSession(uid,"simulado","Simulado","misto",ac,ans.length,0);
    sHist([{data:new Date().toLocaleDateString("pt-BR"),tema:"Simulado",dif:"misto",mode:"simulado",acertos:ac,total:ans.length},...hist].slice(0,50));
    setSHits(ac);setQTotal(ans.length);setSc("resultSim");
  };

  const nv=gLv(xp),nxnv=GLEVELS.find(l=>l.min>xp);
  const xpRange=nxnv?nxnv.min-nv.min:300,xpIn=xp-nv.min,pctNv=Math.min(100,Math.round((xpIn/xpRange)*100));

  const BG="#09111f",CARD="#0f1c2e",CARD2="#121f32",BD="rgba(255,255,255,0.07)",MT="#4a6070",TX="#dde6f0";
  const S={
    app:{minHeight:"100vh",background:BG,color:TX,fontFamily:"system-ui,sans-serif",maxWidth:440,margin:"0 auto",padding:"0 0 60px"},

  const p=s=>({...S.btn,...s});

  // ── HOME ──────────────────────────────────────────────────────────────────
  if(sc==="home"){
    const hot=streak>=5;
    return(
      <div style={S.app}>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>

            </div>

              <button onClick={()=>setSc("hist")} style={{...S.btn,background:"rgba(255,255,255,0.05)",color:MT,fontSize:11,padding:"6px 10px",border:`1px solid ${BD}`,borderRadius:8,width:"auto"}}>Histórico</button>

            <Bar pct={pctNv} cor="#3b82f6" h={5}/>

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>

              {!daily&&<button onClick={()=>startEstudo(TEMAS[Math.floor(Math.random()*TEMAS.length)],"iniciante")} style={{...S.btn,background:"rgba(245,158,11,.15)",color:"#fcd34d",fontSize:11,padding:"6px 12px",border:"1px solid rgba(245,158,11,.3)",borderRadius:8,width:"auto",flexShrink:0}}>Iniciar</button>}

              <div style={{display:"flex",alignItems:"center",gap:14}}>

                <svg width="16" height="16" viewBox="0 0 24 24" fill={MT} style={{flexShrink:0,marginLeft:"auto"}}><path d="M8 5v14l11-7z"/></svg>

          {hist.length>0&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:16}}>{[{l:"Sessões",v:hist.length},{l:"Aproveit.",v:(()=>{const valid=hist.filter(h=>h.total>0&&h.acertos<=h.total);return valid.length?Math.min(100,Math.round(valid.reduce((a,h)=>a+h.acertos/h.total,0)/valid.length*100))+"%":"0%";})() },{l:"Questões",v:hist.reduce((a,h)=>a+h.total,0)}].map(it=>(<div key={it.l} style={{...S.c2,padding:"11px 10px",textAlign:"center"}}><p style={{margin:0,fontSize:17,fontWeight:800,color:"#93c5fd"}}>{it.v}</p><p style={{margin:"3px 0 0",fontSize:10,color:MT}}>{it.l}</p></div>))}</div>}
        </div>
      </div>
    );
  }

  // ── MODO ESTUDO — TEMAS ───────────────────────────────────────────────────
  if(sc==="modoEstudo"){return(
    <div style={S.app}>
      <div style={{padding:"28px 20px 0"}}>

              <div style={{position:"absolute",left:0,top:0,bottom:0,width:3,background:cfg.cor,borderRadius:"18px 0 0 18px"}}/>

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>

                  <span style={{fontSize:12,fontWeight:700,color:pct>=70?"#10b981":cfg.cor}}>{pct}%</span>

                <p style={{margin:"6px 0 0",fontSize:11,color:MT}}>{sessT.reduce((a,hs)=>a+hs.acertos,0)}/{sessT.reduce((a,hs)=>a+hs.total,0)} questões corretas no total</p>

  // ── MODO ESTUDO — NÍVEL ───────────────────────────────────────────────────
  if(sc==="modoEstudoNv"&&selTema){
    const cfg=TEMA_CFG[selTema],tp=prog[selTema]||initP()[selTema];
    return(
      <div style={S.app}>
        <div style={{padding:"28px 20px 0"}}>

          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}><div style={{width:10,height:10,borderRadius:"50%",background:cfg.cor}}/><h2 style={{margin:0,fontSize:20,fontWeight:700,color:"#f0f6ff"}}>{selTema}</h2></div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>

              const sessD=hist.filter(h=>h.tema===selTema&&h.dif===dif&&h.total>0);
              const pct=sessD.length>0?Math.min(100,Math.round(sessD.reduce((a,h)=>a+h.acertos/h.total,0)/sessD.length*100)):0;
              const nt=TITULO[dif];
              return(<div key={dif} onClick={()=>!blk&&startEstudo(selTema,dif)} style={{...S.card,padding:"16px 20px",cursor:blk?"default":"pointer",opacity:blk?.45:1,borderColor:con?`${cfg.cor}55`:BD,position:"relative",overflow:"hidden"}}>
                {con&&<div style={{position:"absolute",left:0,top:0,bottom:0,width:3,background:cfg.cor,borderRadius:"18px 0 0 18px"}}/>}

                      {!blk&&!con&&nt&&<span style={{fontSize:10,color:MT}}>{nt.i} → {nt.t}</span>}
                    </div>
                    {!blk&&<span style={{fontSize:11,fontWeight:700,color:pct>=70?"#10b981":cfg.cor}}>{pct}%</span>}
                  </div>
                  {!blk&&<Bar pct={pct} cor={con?"#10b981":cfg.cor} h={3}/>}
                  <p style={{margin:"6px 0 0",fontSize:11,color:MT}}>{blk?`Conclua ${DLBL[DIFS[i-1]]} com ${PASS}/15 para desbloquear`:cnt>0?`${cnt} questões · Meta: ${PASS}/15 para avançar`:"Questões em breve"}</p>
                </div>
              </div>);
            })}
          </div>
        </div>
      </div>
    );
  }

  // ── SIMULADO CONFIG ───────────────────────────────────────────────────────
  if(sc==="modoSim"){return(
    <div style={S.app}>
      <div style={{padding:"28px 20px 0"}}>
        <button onClick={()=>setSc("home")} style={{...S.btn,background:"none",color:MT,fontSize:13,padding:"0 0 16px",width:"auto"}}>← Voltar</button>
        <h2 style={{margin:"0 0 6px",fontSize:20,fontWeight:700,color:"#f0f6ff"}}>Modo Simulado</h2>
        <p style={{margin:"0 0 22px",fontSize:13,color:MT}}>Configure seu simulado</p>
        <div style={{marginBottom:20}}>
          <p style={{...S.lbl,margin:"0 0 10px"}}>Número de questões</p>
          <div style={{display:"flex",gap:8}}>{[10,20,50].map(n=>(<button key={n} onClick={()=>setSimCfg(c=>({...c,qtd:n}))} style={{...S.btn,flex:1,padding:"11px",fontSize:14,background:simCfg.qtd===n?"rgba(99,102,241,.25)":"rgba(255,255,255,.04)",border:`1.5px solid ${simCfg.qtd===n?"#6366f1":BD}`,color:simCfg.qtd===n?"#a5b4fc":TX}}>{n}</button>))}</div>

            {TEMAS.map(t=>{const on=simCfg.temas.includes(t);return(<div key={t} onClick={()=>setSimCfg(c=>({...c,temas:on?c.temas.filter(x=>x!==t):[...c.temas,t]}))} style={{...S.c2,padding:"11px 14px",cursor:"pointer",borderColor:on?`${TEMA_CFG[t].cor}60`:BD,background:on?`${TEMA_CFG[t].cor}08`:"transparent",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:13,fontWeight:on?700:400,color:on?"#f0f6ff":MT}}>{t}</span><div style={{width:18,height:18,borderRadius:5,border:`2px solid ${on?TEMA_CFG[t].cor:MT}`,background:on?TEMA_CFG[t].cor:"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>{on&&<svg width="10" height="10" viewBox="0 0 24 24" fill="#fff"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>}</div></div>);})}

      </div>
    </div>
  );}

  // ── QUIZ ──────────────────────────────────────────────────────────────────
  if(sc==="quiz"&&fila.length>0){
    const q=fila[qIdx],cfg=q?TEMA_CFG[q.tema]||TEMA_CFG["Urgências"]:TEMA_CFG["Urgências"];
    const L=["A","B","C","D"],isSim=qMode==="simulado",isAle=qMode==="aleatorio";
    const progPct=qTotal>0?Math.round((qIdx/qTotal)*100):0;

  // ── RESULTADO ESTUDO ──────────────────────────────────────────────────────
  if(sc==="resultado"){

          <div style={{...S.card,padding:"20px",marginBottom:16}}>
            <p style={{margin:"0 0 16px",fontSize:14,fontWeight:700,color:"#f0f6ff"}}>Trocar senha</p>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div>
                <p style={{margin:"0 0 6px",fontSize:11,color:MT,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em"}}>Nova senha</p>
                <input style={inp} type="password" placeholder="Mínimo 6 caracteres"
                  value={novaSenha} onChange={e=>setNovaSenha(e.target.value)}/>
              </div>
              <div>
                <p style={{margin:"0 0 6px",fontSize:11,color:MT,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em"}}>Confirmar nova senha</p>
                <input style={inp} type="password" placeholder="Repita a nova senha"
                  value={confSenha} onChange={e=>setConfSenha(e.target.value)}/>
              </div>
              {errPerfil&&<p style={{margin:0,fontSize:13,color:"#fca5a5"}}>{errPerfil}</p>}
              {msgPerfil&&<p style={{margin:0,fontSize:13,color:"#6ee7b7"}}>{msgPerfil}</p>}
              <button onClick={trocarSenha} disabled={loadPerfil}
                style={{...S.btn,...S.pri,opacity:loadPerfil?.6:1,cursor:loadPerfil?"not-allowed":"pointer"}}>
                {loadPerfil?"Salvando...":"Salvar nova senha"}
              </button>
            </div>
          </div>

          <button onClick={onLogout}
            style={{...S.btn,background:"rgba(239,68,68,.12)",color:"#fca5a5",border:"1px solid rgba(239,68,68,.25)",
              borderRadius:12,padding:"13px",width:"100%",fontSize:14,fontWeight:600}}>
            Sair da conta
          </button>
        </div>
      </div>
    );
  }

if(sc==="hist")return(
    <div style={S.app}>
      <div style={{padding:"28px 20px 0"}}>
        <button onClick={()=>setSc("home")} style={{...S.btn,background:"none",color:MT,fontSize:13,padding:"0 0 16px",width:"auto"}}>← Voltar</button>
        <h2 style={{margin:"0 0 20px",fontSize:20,fontWeight:700,color:"#f0f6ff"}}>Histórico</h2>
        {hist.length===0?<div style={{...S.card,padding:"28px",textAlign:"center"}}><p style={{margin:0,color:MT}}>Nenhuma sessão ainda.</p></div>:hist.map((h,i)=>{
          const cfg=TEMA_CFG[h.tema]||{cor:"#64748b"},p=Math.round((h.acertos/h.total)*100);
          const ml=h.mode==="simulado"?"📝":h.mode==="aleatorio"?"🎲":"📚";
          return(<div key={i} style={{...S.c2,padding:"11px 15px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}><p style={{margin:0,fontSize:13,fontWeight:700}}>{h.tema}</p><span style={{fontSize:12}}>{ml}</span></div><p style={{margin:0,fontSize:11,color:MT}}>{DLBL[h.dif]||h.dif} · {h.data}</p></div>
            <div style={{textAlign:"right"}}><p style={{margin:"0 0 1px",fontSize:16,fontWeight:800,color:p>=80?"#10b981":p>=60?cfg.cor:"#ef4444"}}>{h.acertos}/{h.total}</p><p style={{margin:0,fontSize:11,color:MT}}>{p}%</p></div>
          </div>);
        })}
      </div>
    </div>
  );

  return null;
}

// ══════════════════════════════════════════════════════════════
// APP WRAPPER — handles login / admin / game routing
// ══════════════════════════════════════════════════════════════
function App() {
  const [profile,   setProfile]   = useState(null);
  const [showAdmin, setShowAdmin] = useState(false);
  const [loading,   setLoading]   = useState(false);

  // Restore session from localStorage
  useEffect(()=>{
    const saved = localStorage.getItem("oq_profile");
    if (saved) {
      try { setProfile(JSON.parse(saved)); } catch {}
    }
  },[]);

  const handleLogin = (prof) => {
    setProfile(prof);
    localStorage.setItem("oq_profile", JSON.stringify(prof));
  };

  const handleLogout = () => {
    setProfile(null);
    localStorage.removeItem("oq_profile");
    setShowAdmin(false);
  };

  if (!profile) return <LoginScreen onLogin={handleLogin}/>;

  if (profile.is_admin && showAdmin) {
    return <AdminPanel onBack={()=>setShowAdmin(false)}/>;
  }

  return (
    <div style={{position:"relative"}}>
      {profile.is_admin && (
        <div style={{position:"fixed",top:0,left:0,right:0,zIndex:999,
          background:"rgba(139,92,246,0.95)",backdropFilter:"blur(8px)",
          borderBottom:"1px solid rgba(139,92,246,0.5)",
          display:"flex",alignItems:"center",justifyContent:"space-between",
          padding:"8px 16px",maxWidth:440,margin:"0 auto",boxSizing:"border-box"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:12}}>🛡️</span>
            <span style={{fontSize:12,fontWeight:700,color:"#fff"}}>Modo Admin</span>
          </div>
          <button onClick={()=>setShowAdmin(true)}
            style={{background:"rgba(255,255,255,0.2)",border:"1px solid rgba(255,255,255,0.3)",
              color:"#fff",borderRadius:8,padding:"5px 12px",cursor:"pointer",
              fontSize:12,fontWeight:600,fontFamily:"system-ui"}}>
            Abrir Painel →
          </button>
        </div>
      )}
      <div style={{paddingTop: profile.is_admin ? 42 : 0}}>
        <OrthoQuizGame profile={profile} onLogout={handleLogout}/>
      </div>
    </div>
  );
}



    // Montar o app no #root
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
