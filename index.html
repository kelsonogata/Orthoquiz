{id:300,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"Paciente vítima de mergulho em águas rasas apresenta tetraplegia imediata. A TC mostra fratura explosão de C5 com retropulsão de fragmento ósseo para o canal. Ele apresenta PA 80/50 mmHg e frequência cardíaca de 50 bpm. Este estado hemodinâmico define:",alternativas:["A) Choque Hipovolêmico", "B) Choque Neurogênico", "C) Choque Medular", "D) Choque Séptico"],correta:1,justificativas:["No choque hipovolêmico, o paciente estaria taquicárdico (>100 bpm).", "✔ A combinação de hipotensão com bradicardia (ou falta de taquicardia compensatória) em um paciente com trauma cervical/torácico alto caracteriza o choque neurogênico pela perda do tônus simpático.", "Choque medular é uma definição neurológica (reflexos), não hemodinâmica (pressão/pulso).", "Não há sinais de infecção descritos no caso agudo."]},
{id:301,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"avançado",enunciado:"(Baseada em USP): Homem, 30 anos, vítima de queda de 4 metros de altura, apresenta-se estável hemodinamicamente, mas com ausência de movimentos e sensibilidade em membros inferiores. O reflexo bulbocavernoso está ausente. Qual a interpretação correta deste achado inicial?",alternativas:["A) O paciente apresenta uma lesão medular completa definitiva", "B) O paciente está em choque medular, o que impede a definição do prognóstico neurológico agora", "C) O diagnóstico é de choque neurogênico devido à bradicardia esperada", "D) Trata-se de uma síndrome da cauda equina, dado o nível da paralisia"],correta:1,justificativas:["A \"completude\" da lesão só é avaliada após o retorno dos reflexos sacrais.", "✔ A ausência do reflexo bulbocavernoso no trauma agudo define o choque medular. Enquanto este estado persistir, não podemos afirmar se a lesão é completa ou incompleta.", "Choque neurogênico é uma definição hemodinâmica (PA/FC), não de reflexos.", "A cauda equina ocorre em lesões abaixo de L2; o quadro descrito é de uma provável lesão medular alta (paraplegia)."]},
{id:302,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"(Baseada em USP): Homem, 30 anos, vítima de queda de 4 metros de altura, apresenta-se estável hemodinamicamente, mas com ausência de movimentos e sensibilidade em membros inferiores. O reflexo bulbocavernoso está ausente. Qual a interpretação correta deste achado inicial?",alternativas:["A) O paciente apresenta uma lesão medular completa definitiva", "B) O paciente está em choque medular, o que impede a definição do prognóstico neurológico agora", "C) O diagnóstico é de choque neurogênico devido à bradicardia esperada", "D) Trata-se de uma síndrome da cauda equina, dado o nível da paralisia"],correta:1,justificativas:["A \"completude\" da lesão só é avaliada após o retorno dos reflexos sacrais.", "✔ A ausência do reflexo bulbocavernoso no trauma agudo define o choque medular. Enquanto este estado persistir, não podemos afirmar se a lesão é completa ou incompleta.", "Choque neurogênico é uma definição hemodinâmica (PA/FC), não de reflexos.", "A cauda equina ocorre em lesões abaixo de L2; o quadro descrito é de uma provável lesão medular alta (paraplegia)."]},
{id:303,tema:"Coluna",subtema:"Choque Medular",dificuldade:"avançado",enunciado:"(Baseada em UNICAMP): Paciente de 45 anos com dor lombar irradiada para face lateral da coxa e perna esquerda, com parestesia no primeiro espaço interdigital dorsal. Ao exame, apresenta fraqueza na extensão do hálux. O nível provável da hérnia de disco é:",alternativas:["A) L2-L3", "B) L3-L4", "C) L4-L5", "D) L5-S1"],correta:2,justificativas:["e B: Envolveriam raízes mais altas (L2, L3 ou L4), afetando extensão do joelho ou reflexo patelar.", "Alternativa B incorreta.", "✔ A extensão do hálux e a sensibilidade do primeiro espaço interdigital são funções da raiz de L5. Em uma hérnia paracentral (mais comum), a raiz de L5 é comprimida no nível L4L5.", "L5S1 comprimiria a raiz de S1 (reflexo aquileu e flexão plantar)."]},
{id:304,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"(Baseada em UNICAMP): Paciente de 45 anos com dor lombar irradiada para face lateral da coxa e perna esquerda, com parestesia no primeiro espaço interdigital dorsal. Ao exame, apresenta fraqueza na extensão do hálux. O nível provável da hérnia de disco é:",alternativas:["A) L2-L3", "B) L3-L4", "C) L4-L5", "D) L5-S1"],correta:2,justificativas:["e B: Envolveriam raízes mais altas (L2, L3 ou L4), afetando extensão do joelho ou reflexo patelar.", "Alternativa B incorreta.", "✔ A extensão do hálux e a sensibilidade do primeiro espaço interdigital são funções da raiz de L5. Em uma hérnia paracentral (mais comum), a raiz de L5 é comprimida no nível L4L5.", "L5S1 comprimiria a raiz de S1 (reflexo aquileu e flexão plantar)."]},
{id:305,tema:"Coluna",subtema:"Choque Medular",dificuldade:"avançado",enunciado:"(Baseada em ENARE): Um sinal de alerta (\"Red Flag\") que indica a necessidade de investigação imediata com exames de imagem em um paciente com lombalgia é:",alternativas:["A) Dor que piora ao dirigir por longos períodos", "B) Melhora da dor com o uso de anti-inflamatórios comuns", "C) Idade superior a 50 anos associada a histórico de neoplasia prévia", "D) Dor localizada apenas na musculatura paravertebral sem irradiação"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ Idade avançada e histórico de câncer são \"red flags\" clássicos para metástases vertebrais.", "Alternativa D incorreta."]},
{id:306,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"(Baseada em ENARE): Um sinal de alerta (\"Red Flag\") que indica a necessidade de investigação imediata com exames de imagem em um paciente com lombalgia é:",alternativas:["A) Dor que piora ao dirigir por longos períodos", "B) Melhora da dor com o uso de anti-inflamatórios comuns", "C) Idade superior a 50 anos associada a histórico de neoplasia prévia", "D) Dor localizada apenas na musculatura paravertebral sem irradiação"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ Idade avançada e histórico de câncer são \"red flags\" clássicos para metástases vertebrais.", "Alternativa D incorreta."]},
{id:307,tema:"Coluna",subtema:"Choque Medular",dificuldade:"avançado",enunciado:"(Baseada em SUS-SP): No trauma de coluna cervical, a \"Fratura de Jefferson\" é caracterizada por:",alternativas:["A) Fratura dos elementos posteriores de C2 (Enforcado)", "B) Fratura por explosão do anel do Atlas (C1)", "C) Fratura do dente do Áxis tipo II", "D) Luxação bilateral das facetas de C5-C6"],correta:1,justificativas:["Esta é a espondilolistese traumática de C2.", "✔ A fratura de Jefferson ocorre por carga axial no topo da cabeça, causando a ruptura do anel de C1 em múltiplos pontos.", "Classificada por Anderson e D'Alonzo.", "É uma lesão subaxial grave, não relacionada a Jefferson."]},
{id:308,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"(Baseada em SUS-SP): No trauma de coluna cervical, a \"Fratura de Jefferson\" é caracterizada por:",alternativas:["A) Fratura dos elementos posteriores de C2 (Enforcado)", "B) Fratura por explosão do anel do Atlas (C1)", "C) Fratura do dente do Áxis tipo II", "D) Luxação bilateral das facetas de C5-C6"],correta:1,justificativas:["Esta é a espondilolistese traumática de C2.", "✔ A fratura de Jefferson ocorre por carga axial no topo da cabeça, causando a ruptura do anel de C1 em múltiplos pontos.", "Classificada por Anderson e D'Alonzo.", "É uma lesão subaxial grave, não relacionada a Jefferson."]},
{id:309,tema:"Coluna",subtema:"Choque Medular",dificuldade:"avançado",enunciado:"(Baseada em AMRIGS): Paciente idosa, com dor lombar crônica, apresenta quadro de \"claudicação neurogênica\": dor em membros inferiores ao caminhar que melhora ao fletir o tronco para frente. Qual o diagnóstico e o exame padrão-ouro?",alternativas:["A) Hérnia de disco extrusa; Tomografia Computadorizada", "B) Estenose de canal vertebral; Ressonância Magnética", "C) Insuficiência arterial crônica; Doppler de MMII", "D) Espondilodiscite; Cintilografia Óssea"],correta:1,justificativas:["Hérnias costumam piorar com a flexão do tronco.", "✔ A melhora da dor com a flexão da coluna (que abre o canal) é típica da estenose, e a RM é o melhor exame para visualizar o estreitamento do canal e do saco dural.", "A claudicação vascular não melhora com a posição da coluna, mas sim com a parada da marcha.", "Espondilodiscite é uma infecção; causa febre e dor constante, não claudicação."]},
{id:310,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"(Baseada em AMRIGS): Paciente idosa, com dor lombar crônica, apresenta quadro de \"claudicação neurogênica\": dor em membros inferiores ao caminhar que melhora ao fletir o tronco para frente. Qual o diagnóstico e o exame padrão-ouro?",alternativas:["A) Hérnia de disco extrusa; Tomografia Computadorizada", "B) Estenose de canal vertebral; Ressonância Magnética", "C) Insuficiência arterial crônica; Doppler de MMII", "D) Espondilodiscite; Cintilografia Óssea"],correta:1,justificativas:["Hérnias costumam piorar com a flexão do tronco.", "✔ A melhora da dor com a flexão da coluna (que abre o canal) é típica da estenose, e a RM é o melhor exame para visualizar o estreitamento do canal e do saco dural.", "A claudicação vascular não melhora com a posição da coluna, mas sim com a parada da marcha.", "Espondilodiscite é uma infecção; causa febre e dor constante, não claudicação."]},
{id:311,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"avançado",enunciado:"(Baseada em USP-RP): Qual o nível neurológico motor (ASIA) avaliado através do músculo Tríceps Braquial (extensão do cotovelo)?",alternativas:["A) C5", "B) C6", "C) C7", "D) C8"],correta:2,justificativas:["C5 avalia flexão do cotovelo (bíceps).", "C6 avalia extensão do punho.", "✔ C7 é o nível chave para a extensão do cotovelo.", "C8 avalia flexão dos dedos (flexor profundo do 3º dedo)."]},
{id:312,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"(Baseada em USP-RP): Qual o nível neurológico motor (ASIA) avaliado através do músculo Tríceps Braquial (extensão do cotovelo)?",alternativas:["A) C5", "B) C6", "C) C7", "D) C8"],correta:2,justificativas:["C5 avalia flexão do cotovelo (bíceps).", "C6 avalia extensão do punho.", "✔ C7 é o nível chave para a extensão do cotovelo.", "C8 avalia flexão dos dedos (flexor profundo do 3º dedo)."]},
{id:313,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"avançado",enunciado:"(Baseada em UNIFESP): No atendimento de um TRM cervical, o paciente apresenta tetraplegia e o médico nota que o paciente consegue respirar, mas apenas com esforço diafragmático, sem ajuda da musculatura intercostal. A lesão provável está:",alternativas:["A) Acima de C3", "B) Entre C3 e C5", "C) Abaixo de C5", "D) No nível de T12"],correta:2,justificativas:["Lesões acima de C3 causam parada respiratória imediata por denervação do diafragma.", "Lesões neste nível causariam paralisia parcial ou total do diafragma.", "✔ Se o diafragma (C3C5) está funcionando, a lesão deve estar abaixo de C5. A paralisia intercostal ocorre porque os nervos que as inervam saem da medula torácica.", "T12 causaria paraplegia, não tetraplegia."]},
{id:314,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"(Baseada em UNIFESP): No atendimento de um TRM cervical, o paciente apresenta tetraplegia e o médico nota que o paciente consegue respirar, mas apenas com esforço diafragmático, sem ajuda da musculatura intercostal. A lesão provável está:",alternativas:["A) Acima de C3", "B) Entre C3 e C5", "C) Abaixo de C5", "D) No nível de T12"],correta:2,justificativas:["Lesões acima de C3 causam parada respiratória imediata por denervação do diafragma.", "Lesões neste nível causariam paralisia parcial ou total do diafragma.", "✔ Se o diafragma (C3C5) está funcionando, a lesão deve estar abaixo de C5. A paralisia intercostal ocorre porque os nervos que as inervam saem da medula torácica.", "T12 causaria paraplegia, não tetraplegia."]},
{id:315,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"avançado",enunciado:"(Baseada em SMS-RJ): Qual a conduta imediata para um paciente com suspeita clínica de Síndrome da Cauda Equina (retenção urinária e anestesia em sela)?",alternativas:["A) Prescrever corticoide em altas doses e reavaliar em 1 semana", "B) Realizar Ressonância Magnética de urgência e encaminhar para descompressão cirúrgica", "C) Solicitar Radiografia simples e orientar uso de colar cervical", "D) Iniciar fisioterapia para fortalecimento de assoalho pélvico"],correta:1,justificativas:["Corticoides não resolvem a compressão mecânica aguda da cauda equina.", "✔ A cauda equina é uma urgência neurológica; o atraso na cirurgia pode levar a incontinência urinária e fecal permanente.", "Rx não vê compressão nervosa; colar cervical é para trauma de pescoço, não lombar.", "A fisioterapia é reabilitadora, nunca o tratamento primário para compressão aguda grave."]},
{id:316,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"(Baseada em SMS-RJ): Qual a conduta imediata para um paciente com suspeita clínica de Síndrome da Cauda Equina (retenção urinária e anestesia em sela)?",alternativas:["A) Prescrever corticoide em altas doses e reavaliar em 1 semana", "B) Realizar Ressonância Magnética de urgência e encaminhar para descompressão cirúrgica", "C) Solicitar Radiografia simples e orientar uso de colar cervical", "D) Iniciar fisioterapia para fortalecimento de assoalho pélvico"],correta:1,justificativas:["Corticoides não resolvem a compressão mecânica aguda da cauda equina.", "✔ A cauda equina é uma urgência neurológica; o atraso na cirurgia pode levar a incontinência urinária e fecal permanente.", "Rx não vê compressão nervosa; colar cervical é para trauma de pescoço, não lombar.", "A fisioterapia é reabilitadora, nunca o tratamento primário para compressão aguda grave."]},
{id:317,tema:"Coluna",subtema:"TRM",dificuldade:"avançado",enunciado:"(Baseada em MedVideo/Provas Gerais): O reflexo patelar avalia predominantemente quais raízes nervosas?",alternativas:["A) L2 - L4", "B) L5 - S1", "C) S1 - S2", "D) L1 - L2"],correta:0,justificativas:["✔ O arco reflexo do tendão patelar é mediado pelas raízes de L2, L3 e L4 (principalmente L4).", "e C: Estas raízes estão relacionadas ao reflexo aquileu (S1).", "Alternativa C incorreta.", "L1 e L2 participam mais da flexão do quadril e sensibilidade inguinal."]},
{id:318,tema:"Coluna",subtema:"TRM",dificuldade:"intermediário",enunciado:"(Baseada em MedVideo/Provas Gerais): O reflexo patelar avalia predominantemente quais raízes nervosas?",alternativas:["A) L2 - L4", "B) L5 - S1", "C) S1 - S2", "D) L1 - L2"],correta:0,justificativas:["✔ O arco reflexo do tendão patelar é mediado pelas raízes de L2, L3 e L4 (principalmente L4).", "e C: Estas raízes estão relacionadas ao reflexo aquileu (S1).", "Alternativa C incorreta.", "L1 e L2 participam mais da flexão do quadril e sensibilidade inguinal."]},
{id:319,tema:"Coluna",subtema:"TRM",dificuldade:"avançado",enunciado:"(Baseada em AMRIGS): Homem, 20 anos, sofreu queda de mergulho. Apresenta perda de força e sensibilidade nos membros inferiores e tronco, mas mantém sensibilidade anal profunda e contração voluntária do esfíncter anal. De acordo com a escala ASIA, esta lesão é:",alternativas:["A) Completa (ASIA", "A) ", "B) Incompleta (ASIA B ou", "C) "],correta:1,justificativas:["A lesão completa (ASIA A) exige ausência total de função nos últimos segmentos sacrais.", "✔ A presença de \"preservação sacral\" (sensibilidade ou motor em S4S5) define uma lesão incompleta.", "A Síndrome Central costuma afetar mais membros superiores que inferiores.", "Choque neurogênico é um estado circulatório, não uma classificação de lesão medular."]},
{id:320,tema:"Coluna",subtema:"TRM",dificuldade:"intermediário",enunciado:"(Baseada em AMRIGS): Homem, 20 anos, sofreu queda de mergulho. Apresenta perda de força e sensibilidade nos membros inferiores e tronco, mas mantém sensibilidade anal profunda e contração voluntária do esfíncter anal. De acordo com a escala ASIA, esta lesão é:",alternativas:["A) Completa (ASIA", "A) ", "B) Incompleta (ASIA B ou", "C) "],correta:1,justificativas:["A lesão completa (ASIA A) exige ausência total de função nos últimos segmentos sacrais.", "✔ A presença de \"preservação sacral\" (sensibilidade ou motor em S4S5) define uma lesão incompleta.", "A Síndrome Central costuma afetar mais membros superiores que inferiores.", "Choque neurogênico é um estado circulatório, não uma classificação de lesão medular."]},
{id:321,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"iniciante",enunciado:"A Síndrome Compartimental Aguda (SCA) é definida fisiopatologicamente como:",alternativas:["A) O aumento da pressão intersticial dentro de um espaço osteofascial fechado, comprometendo a perfusão tecidual", "B) A interrupção do fluxo arterial principal de um membro devido a um trauma direto no vaso", "C) O acúmulo de líquido sinovial nas articulações adjacentes a uma fratura de alta energia", "D) A necrose óssea avascular decorrente da interrupção do suprimento sanguíneo epifisário"],correta:0,justificativas:["✔ A SCA ocorre quando a pressão dentro de um compartimento muscular (delimitado por fáscias e ossos que não se expandem) sobe a ponto de superar a pressão de perfusão capilar, levando à isquemia de músculos e nervos.", "A interrupção de um vaso principal é uma lesão arterial direta, não uma síndrome compartimental, embora possa ser uma causa secundária.", "O líquido sinovial referese a derrames articulares; a SCA é um fenômeno muscular/compartimental.", "Esta descrição referese à osteonecrose (necrose avascular), um processo diferente da pressão compartimental elevada."]},
{id:322,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"intermediário",enunciado:"A Síndrome Compartimental Aguda (SCA) é definida fisiopatologicamente como:",alternativas:["A) O aumento da pressão intersticial dentro de um espaço osteofascial fechado, comprometendo a perfusão tecidual", "B) A interrupção do fluxo arterial principal de um membro devido a um trauma direto no vaso", "C) O acúmulo de líquido sinovial nas articulações adjacentes a uma fratura de alta energia", "D) A necrose óssea avascular decorrente da interrupção do suprimento sanguíneo epifisário"],correta:0,justificativas:["✔ A SCA ocorre quando a pressão dentro de um compartimento muscular (delimitado por fáscias e ossos que não se expandem) sobe a ponto de superar a pressão de perfusão capilar, levando à isquemia de músculos e nervos.", "A interrupção de um vaso principal é uma lesão arterial direta, não uma síndrome compartimental, embora possa ser uma causa secundária.", "O líquido sinovial referese a derrames articulares; a SCA é um fenômeno muscular/compartimental.", "Esta descrição referese à osteonecrose (necrose avascular), um processo diferente da pressão compartimental elevada."]},
{id:323,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"iniciante",enunciado:"Qual é o local anatômico mais frequentemente afetado pela Síndrome Compartimental no corpo humano?",alternativas:["A) Coxa (compartimento medial)", "B) Antebraço (compartimento dorsal)", "C) Perna (compartimento anterior)", "D) Pé (compartimento lateral)"],correta:2,justificativas:["A coxa possui compartimentos amplos e é menos frequentemente afetada que a perna.", "O antebraço é o segundo local mais comum, mas perde para a perna em incidência.", "✔ O compartimento anterior da perna é estatisticamente o local mais comum de SCA, frequentemente associado a fraturas da diáfise da tíbia.", "Embora existam compartimentos no pé, a frequência de SCA nesta região é menor que na perna."]},
{id:324,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"intermediário",enunciado:"Qual é o local anatômico mais frequentemente afetado pela Síndrome Compartimental no corpo humano?",alternativas:["A) Coxa (compartimento medial)", "B) Antebraço (compartimento dorsal)", "C) Perna (compartimento anterior)", "D) Pé (compartimento lateral)"],correta:2,justificativas:["A coxa possui compartimentos amplos e é menos frequentemente afetada que a perna.", "O antebraço é o segundo local mais comum, mas perde para a perna em incidência.", "✔ O compartimento anterior da perna é estatisticamente o local mais comum de SCA, frequentemente associado a fraturas da diáfise da tíbia.", "Embora existam compartimentos no pé, a frequência de SCA nesta região é menor que na perna."]},
{id:325,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"iniciante",enunciado:"Na anatomia da perna, quantos compartimentos musculares principais são descritos para fins de avaliação de síndrome compartimental?",alternativas:["A) Dois", "B) Três", "C) Quatro", "D) Seis"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ A perna é dividida anatomicamente em 4 compartimentos: Anterior, Lateral, Posterior Superficial e Posterior Profundo.", "Alternativa D incorreta."]},
{id:326,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"intermediário",enunciado:"Na anatomia da perna, quantos compartimentos musculares principais são descritos para fins de avaliação de síndrome compartimental?",alternativas:["A) Dois", "B) Três", "C) Quatro", "D) Seis"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ A perna é dividida anatomicamente em 4 compartimentos: Anterior, Lateral, Posterior Superficial e Posterior Profundo.", "Alternativa D incorreta."]},
{id:327,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"iniciante",enunciado:"O termo \"Contratura Isquêmica de Volkmann\" refere-se a:",alternativas:["A) Uma fase inicial de dor intensa na síndrome compartimental", "B) A sequela tardia e irreversível de uma síndrome compartimental não tratada no antebraço", "C) Uma malformação congênita das fáscias musculares", "D) O relaxamento muscular após a realização de uma fasciotomia de urgência"],correta:1,justificativas:["A fase inicial é caracterizada por dor e pressão, não pela contratura fibrótica.", "✔ A Contratura de Volkmann é o estágio final da isquemia muscular não tratada, resultando em fibrose e encurtamento permanente dos músculos (especialmente flexores do antebraço).", "É uma condição adquirida pósisquêmica, não congênita.", "A fasciotomia visa evitar a contratura, e não é o nome do relaxamento."]},
{id:328,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"intermediário",enunciado:"O termo \"Contratura Isquêmica de Volkmann\" refere-se a:",alternativas:["A) Uma fase inicial de dor intensa na síndrome compartimental", "B) A sequela tardia e irreversível de uma síndrome compartimental não tratada no antebraço", "C) Uma malformação congênita das fáscias musculares", "D) O relaxamento muscular após a realização de uma fasciotomia de urgência"],correta:1,justificativas:["A fase inicial é caracterizada por dor e pressão, não pela contratura fibrótica.", "✔ A Contratura de Volkmann é o estágio final da isquemia muscular não tratada, resultando em fibrose e encurtamento permanente dos músculos (especialmente flexores do antebraço).", "É uma condição adquirida pósisquêmica, não congênita.", "A fasciotomia visa evitar a contratura, e não é o nome do relaxamento."]},
{id:329,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"iniciante",enunciado:"Qual é o sintoma clínico mais precoce e sensível para o diagnóstico da Síndrome Compartimental Aguda em pacientes conscientes?",alternativas:["A) Ausência de pulsos distais (ausência de pulso)", "B) Palidez cutânea", "C) Paralisia muscular", "D) Dor desproporcional à lesão e que piora com o estiramento passivo"],correta:3,justificativas:["A ausência de pulso é um sinal muito tardio (o compartimento precisa de uma pressão maior que a sistólica para ocluir a artéria).", "Palidez é um sinal de insuficiência arterial, nem sempre presente na SCA inicial.", "Paralisia indica dano nervoso ou muscular já estabelecido (tardio).", "✔ A dor intensa, que não melhora com analgésicos e piora drasticamente ao alongar passivamente a musculatura do compartimento, é o sinal \"clássico\" mais precoce."]},
{id:330,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"intermediário",enunciado:"Qual é o sintoma clínico mais precoce e sensível para o diagnóstico da Síndrome Compartimental Aguda em pacientes conscientes?",alternativas:["A) Ausência de pulsos distais (ausência de pulso)", "B) Palidez cutânea", "C) Paralisia muscular", "D) Dor desproporcional à lesão e que piora com o estiramento passivo"],correta:3,justificativas:["A ausência de pulso é um sinal muito tardio (o compartimento precisa de uma pressão maior que a sistólica para ocluir a artéria).", "Palidez é um sinal de insuficiência arterial, nem sempre presente na SCA inicial.", "Paralisia indica dano nervoso ou muscular já estabelecido (tardio).", "✔ A dor intensa, que não melhora com analgésicos e piora drasticamente ao alongar passivamente a musculatura do compartimento, é o sinal \"clássico\" mais precoce."]},
{id:331,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"iniciante",enunciado:"Em relação aos \"6 Ps\" da síndrome compartimental, qual deles é considerado um sinal tardio, indicando mau prognóstico e provável necrose?",alternativas:["A) Parestesia", "B) Pain (Dor)", "C) Paralysis (Paralisia)", "D) Pressure (Pressão/Tensão)"],correta:2,justificativas:["Parestesia é um sinal precoce de sofrimento nervoso, mas ocorre antes da paralisia.", "A dor é o sinal mais precoce de todos.", "✔ A paralisia muscular indica que houve isquemia prolongada resultando em morte tecidual ou dano nervoso grave, sendo um sinal de irreversibilidade.", "A pressão aumentada é a causa fisiopatológica detectada precocemente."]},
{id:332,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"intermediário",enunciado:"Em relação aos \"6 Ps\" da síndrome compartimental, qual deles é considerado um sinal tardio, indicando mau prognóstico e provável necrose?",alternativas:["A) Parestesia", "B) Pain (Dor)", "C) Paralysis (Paralisia)", "D) Pressure (Pressão/Tensão)"],correta:2,justificativas:["Parestesia é um sinal precoce de sofrimento nervoso, mas ocorre antes da paralisia.", "A dor é o sinal mais precoce de todos.", "✔ A paralisia muscular indica que houve isquemia prolongada resultando em morte tecidual ou dano nervoso grave, sendo um sinal de irreversibilidade.", "A pressão aumentada é a causa fisiopatológica detectada precocemente."]},
{id:333,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"iniciante",enunciado:"Qual estrutura anatômica atua como o principal limitador da expansão muscular, contribuindo para o aumento da pressão na Síndrome Compartimental?",alternativas:["A) O periósteo", "B) A fáscia muscular", "C) O tecido subcutâneo", "D) A derme"],correta:1,justificativas:["O periósteo reveste o osso, não o compartimento muscular.", "✔ As fáscias são membranas de tecido conjuntivo denso e pouco elástico que envolvem os grupos musculares. Quando há edema ou sangramento interno, a fáscia não se expande, elevando a pressão interna.", "e D: A pele e o subcutâneo têm grande elasticidade e não são os responsáveis pelo confinamento pressórico inicial da SCA.", "Alternativa D incorreta."]},
{id:334,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"intermediário",enunciado:"Qual estrutura anatômica atua como o principal limitador da expansão muscular, contribuindo para o aumento da pressão na Síndrome Compartimental?",alternativas:["A) O periósteo", "B) A fáscia muscular", "C) O tecido subcutâneo", "D) A derme"],correta:1,justificativas:["O periósteo reveste o osso, não o compartimento muscular.", "✔ As fáscias são membranas de tecido conjuntivo denso e pouco elástico que envolvem os grupos musculares. Quando há edema ou sangramento interno, a fáscia não se expande, elevando a pressão interna.", "e D: A pele e o subcutâneo têm grande elasticidade e não são os responsáveis pelo confinamento pressórico inicial da SCA.", "Alternativa D incorreta."]},
{id:335,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"iniciante",enunciado:"O que significa o termo \"Pressão Delta\" ($Delta P$) no contexto da Síndrome Compartimental?",alternativas:["A) A soma da pressão arterial sistólica com a pressão do compartimento", "B) A diferença entre a pressão arterial diastólica e a pressão medida dentro do compartimento", "C) A diferença entre a pressão arterial média e a pressão sistólica", "D) O tempo decorrido entre o trauma e o início da dor"],correta:1,justificativas:["Não se utiliza a soma das pressões para diagnóstico.", "✔ A pressão delta ($Delta P = PAD P_{comp}$) é usada para guiar a conduta. Valores abaixo de 30 mmHg são indicativos de necessidade de intervenção (fasciotomia).", "A pressão arterial média não é o parâmetro padrão na fórmula da pressão delta.", "O delta referese a valores de pressão, não a intervalos de tempo."]},
{id:336,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"intermediário",enunciado:"O que significa o termo \"Pressão Delta\" ($Delta P$) no contexto da Síndrome Compartimental?",alternativas:["A) A soma da pressão arterial sistólica com a pressão do compartimento", "B) A diferença entre a pressão arterial diastólica e a pressão medida dentro do compartimento", "C) A diferença entre a pressão arterial média e a pressão sistólica", "D) O tempo decorrido entre o trauma e o início da dor"],correta:1,justificativas:["Não se utiliza a soma das pressões para diagnóstico.", "✔ A pressão delta ($Delta P = PAD P_{comp}$) é usada para guiar a conduta. Valores abaixo de 30 mmHg são indicativos de necessidade de intervenção (fasciotomia).", "A pressão arterial média não é o parâmetro padrão na fórmula da pressão delta.", "O delta referese a valores de pressão, não a intervalos de tempo."]},
{id:337,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"iniciante",enunciado:"Qual destas condições clínicas é uma causa comum de síndrome compartimental por \"redução do volume do compartimento\" (externa)?",alternativas:["A) Fratura de tíbia", "B) Esmagamento (Crush injury)", "C) Queimaduras circunferenciais com escaras inelásticas", "D) Uso excessivo de anticoagulantes"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ Queimaduras graves criam escaras que agem como uma \"faixa\" apertada, impedindo a expansão dos tecidos e reduzindo o espaço externo disponível para o músculo.", "Alternativa D incorreta."]},
{id:338,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"intermediário",enunciado:"Qual destas condições clínicas é uma causa comum de síndrome compartimental por \"redução do volume do compartimento\" (externa)?",alternativas:["A) Fratura de tíbia", "B) Esmagamento (Crush injury)", "C) Queimaduras circunferenciais com escaras inelásticas", "D) Uso excessivo de anticoagulantes"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ Queimaduras graves criam escaras que agem como uma \"faixa\" apertada, impedindo a expansão dos tecidos e reduzindo o espaço externo disponível para o músculo.", "Alternativa D incorreta."]},
{id:339,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"iniciante",enunciado:"Como é denominada a técnica cirúrgica de urgência indicada para o tratamento da Síndrome Compartimental Aguda?",alternativas:["A) Fasciotomia", "B) Fasciodese", "C) Aponeurectomia", "D) Tenotomia"],correta:0,justificativas:["✔ A fasciotomia consiste na abertura cirúrgica da pele e da fáscia muscular para aliviar a pressão interna e restaurar a perfusão.", "Fasciodese não é um termo cirúrgico padrão para este contexto (dese referese a fusão/fixação).", "Aponeurectomia é a retirada de uma aponeurose (usado em Dupuytren, por exemplo), não apenas a abertura para alívio de pressão.", "Tenotomia é o corte de um tendão. ## Pseudoartrose Excelente. Vamos dar continuidade à construção da sua base de dados para o aplicativo. Bloco 2 Tema: Complicações Subtema: Pseudoartrose (Não união) Nível: Fácil (Conceitos, Classificações Básicas e Terminologia)"]},
{id:340,tema:"Complicações",subtema:"Síndrome Compartimental",dificuldade:"intermediário",enunciado:"Como é denominada a técnica cirúrgica de urgência indicada para o tratamento da Síndrome Compartimental Aguda?",alternativas:["A) Fasciotomia", "B) Fasciodese", "C) Aponeurectomia", "D) Tenotomia"],correta:0,justificativas:["✔ A fasciotomia consiste na abertura cirúrgica da pele e da fáscia muscular para aliviar a pressão interna e restaurar a perfusão.", "Fasciodese não é um termo cirúrgico padrão para este contexto (dese referese a fusão/fixação).", "Aponeurectomia é a retirada de uma aponeurose (usado em Dupuytren, por exemplo), não apenas a abertura para alívio de pressão.", "Tenotomia é o corte de um tendão. ## Pseudoartrose Excelente. Vamos dar continuidade à construção da sua base de dados para o aplicativo. Bloco 2 Tema: Complicações Subtema: Pseudoartrose (Não união) Nível: Fácil (Conceitos, Classificações Básicas e Terminologia)"]},
{id:341,tema:"Complicações",subtema:"Pseudoartrose",dificuldade:"iniciante",enunciado:"O conceito de \"Pseudoartrose\" (ou não união) refere-se a:",alternativas:["A) Uma fratura que cicatrizou em uma posição anatômica incorreta (vicioso)", "B) A falha completa da consolidação óssea, onde o processo de reparo cessou e não ocorrerá sem intervenção", "C) Um atraso no tempo esperado para a consolidação, mas que ainda mantém potencial de cura", "D) Uma infecção óssea crônica que impede a visualização do calo ósseo"],correta:1,justificativas:["Isso é definido como \"Consolidação Viciosa\".", "✔ A pseudoartrose é a \"falsa articulação\". Diferente da consolidação retardada, na pseudoartrose o organismo desistiu de tentar unir os fragmentos, formando frequentemente uma cavidade com fluido sinovial e tecido fibroso entre as pontas ósseas.", "Isso é definido como \"Consolidação Retardada\" (Delayed union).", "A infecção (osteomielite) pode causar pseudoartrose, mas a definição técnica de pseudoartrose foca na falha da união mecânica/biológica, não na infecção em si."]},
{id:342,tema:"Complicações",subtema:"Pseudoartrose",dificuldade:"intermediário",enunciado:"O conceito de \"Pseudoartrose\" (ou não união) refere-se a:",alternativas:["A) Uma fratura que cicatrizou em uma posição anatômica incorreta (vicioso)", "B) A falha completa da consolidação óssea, onde o processo de reparo cessou e não ocorrerá sem intervenção", "C) Um atraso no tempo esperado para a consolidação, mas que ainda mantém potencial de cura", "D) Uma infecção óssea crônica que impede a visualização do calo ósseo"],correta:1,justificativas:["Isso é definido como \"Consolidação Viciosa\".", "✔ A pseudoartrose é a \"falsa articulação\". Diferente da consolidação retardada, na pseudoartrose o organismo desistiu de tentar unir os fragmentos, formando frequentemente uma cavidade com fluido sinovial e tecido fibroso entre as pontas ósseas.", "Isso é definido como \"Consolidação Retardada\" (Delayed union).", "A infecção (osteomielite) pode causar pseudoartrose, mas a definição técnica de pseudoartrose foca na falha da união mecânica/biológica, não na infecção em si."]},
{id:343,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"Na classificação de Weber e Cech para pseudoartroses, o tipo \"Hipertrófica\" é caracterizado principalmente por:",alternativas:["A) Ausência total de calo ósseo e suprimento sanguíneo pobre", "B) Presença de grande produção de calo ósseo (\"pata de elefante\"), indicando boa biologia mas instabilidade mecânica", "C) Perda de substância óssea (falha óssea) superior a 2 cm", "D) Presença de sequestro ósseo e sinais óbvios de infecção ativa"],correta:1,justificativas:["Esta descrição referese às pseudoartroses atróficas.", "✔ As pseudoartroses hipertróficas são vascularizadas. O osso tenta consolidar, mas como há muita mobilidade no foco da fratura, o calo cresce sem conseguir unir as pontas.", "Perda de substância define as pseudoartroses por defeito ósseo.", "Referese à pseudoartrose infectada."]},
{id:344,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Na classificação de Weber e Cech para pseudoartroses, o tipo \"Hipertrófica\" é caracterizado principalmente por:",alternativas:["A) Ausência total de calo ósseo e suprimento sanguíneo pobre", "B) Presença de grande produção de calo ósseo (\"pata de elefante\"), indicando boa biologia mas instabilidade mecânica", "C) Perda de substância óssea (falha óssea) superior a 2 cm", "D) Presença de sequestro ósseo e sinais óbvios de infecção ativa"],correta:1,justificativas:["Esta descrição referese às pseudoartroses atróficas.", "✔ As pseudoartroses hipertróficas são vascularizadas. O osso tenta consolidar, mas como há muita mobilidade no foco da fratura, o calo cresce sem conseguir unir as pontas.", "Perda de substância define as pseudoartroses por defeito ósseo.", "Referese à pseudoartrose infectada."]},
{id:345,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"Qual é a principal característica fisiopatológica de uma pseudoartrose classificada como \"Atrófica\"?",alternativas:["A) Instabilidade mecânica extrema com calo exuberante", "B) Falha biológica por vascularização inadequada e ausência de formação de calo ósseo", "C) Excesso de compressão no foco da fratura", "D) Consolidação rápida, porém em eixo desviado"],correta:1,justificativas:["Característica da hipertrófica.", "✔ Na pseudoartrose atrófica, o problema é a \"biologia\". Não há suprimento sanguíneo ou células progenitoras suficientes para iniciar o calo, deixando as extremidades ósseas afinadas ou arredondadas.", "A compressão controlada geralmente auxilia na consolidação, não causa atrofia.", "Referese a consolidação viciosa."]},
{id:346,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Qual é a principal característica fisiopatológica de uma pseudoartrose classificada como \"Atrófica\"?",alternativas:["A) Instabilidade mecânica extrema com calo exuberante", "B) Falha biológica por vascularização inadequada e ausência de formação de calo ósseo", "C) Excesso de compressão no foco da fratura", "D) Consolidação rápida, porém em eixo desviado"],correta:1,justificativas:["Característica da hipertrófica.", "✔ Na pseudoartrose atrófica, o problema é a \"biologia\". Não há suprimento sanguíneo ou células progenitoras suficientes para iniciar o calo, deixando as extremidades ósseas afinadas ou arredondadas.", "A compressão controlada geralmente auxilia na consolidação, não causa atrofia.", "Referese a consolidação viciosa."]},
{id:347,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"O termo \"Pata de Elefante\" e \"Pata de Cavalo\" são descrições radiográficas comuns para qual tipo de complicação?",alternativas:["A) Osteomielite Aguda", "B) Pseudoartrose Hipertrófica", "C) Pseudoartrose Atrófica", "D) Osteossarcoma"],correta:1,justificativas:["A osteomielite apresenta sinais como reação periosteal e sequestro.", "✔ São termos clássicos para descrever o formato do calo ósseo alargado nas pseudoartroses que possuem boa vascularização mas falha de estabilidade.", "Na atrófica, quase não há calo visível.", "É um tumor maligno com outros padrões radiográficos (ex: triângulo de Codman)."]},
{id:348,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"O termo \"Pata de Elefante\" e \"Pata de Cavalo\" são descrições radiográficas comuns para qual tipo de complicação?",alternativas:["A) Osteomielite Aguda", "B) Pseudoartrose Hipertrófica", "C) Pseudoartrose Atrófica", "D) Osteossarcoma"],correta:1,justificativas:["A osteomielite apresenta sinais como reação periosteal e sequestro.", "✔ São termos clássicos para descrever o formato do calo ósseo alargado nas pseudoartroses que possuem boa vascularização mas falha de estabilidade.", "Na atrófica, quase não há calo visível.", "É um tumor maligno com outros padrões radiográficos (ex: triângulo de Codman)."]},
{id:349,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"Qual fator de risco sistêmico é amplamente conhecido por prejudicar a microcirculação e aumentar significativamente a taxa de pseudoartrose?",alternativas:["A) Prática de exercícios físicos leves", "B) Dieta rica em vitamina D", "C) Tabagismo", "D) Uso de suplementos de cálcio"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ A nicotina causa vasoconstrição e inibe a osteogênese, sendo um dos principais fatores modificáveis que levam à falha de consolidação.", "Alternativa D incorreta."]},
{id:350,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Qual fator de risco sistêmico é amplamente conhecido por prejudicar a microcirculação e aumentar significativamente a taxa de pseudoartrose?",alternativas:["A) Prática de exercícios físicos leves", "B) Dieta rica em vitamina D", "C) Tabagismo", "D) Uso de suplementos de cálcio"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ A nicotina causa vasoconstrição e inibe a osteogênese, sendo um dos principais fatores modificáveis que levam à falha de consolidação.", "Alternativa D incorreta."]},
{id:351,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"Em relação à estabilidade mecânica, o excesso de movimento no foco de uma fratura tratada tende a gerar:",alternativas:["A) Consolidação primária (direta)", "B) Pseudoartrose atrófica", "C) Pseudoartrose hipertrófica", "D) Reabsorção óssea completa do membro"],correta:2,justificativas:["A consolidação primária exige estabilidade absoluta (sem movimento).", "A atrófica depende da biologia ruim, não apenas do movimento.", "✔ Se a biologia é boa (há sangue), mas o foco se mexe muito, o osso tenta criar calo (estabilidade secundária), mas não consegue \"fechar a ponte\", resultando em hipertrofia do foco.", "É uma resposta extrema e não típica apenas do movimento excessivo."]},
{id:352,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Em relação à estabilidade mecânica, o excesso de movimento no foco de uma fratura tratada tende a gerar:",alternativas:["A) Consolidação primária (direta)", "B) Pseudoartrose atrófica", "C) Pseudoartrose hipertrófica", "D) Reabsorção óssea completa do membro"],correta:2,justificativas:["A consolidação primária exige estabilidade absoluta (sem movimento).", "A atrófica depende da biologia ruim, não apenas do movimento.", "✔ Se a biologia é boa (há sangue), mas o foco se mexe muito, o osso tenta criar calo (estabilidade secundária), mas não consegue \"fechar a ponte\", resultando em hipertrofia do foco.", "É uma resposta extrema e não típica apenas do movimento excessivo."]},
{id:353,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"Como se define uma pseudoartrose \"Oligotrófica\"?",alternativas:["A) Aquela com grande desvio angular e infecção", "B) Uma forma intermediária onde há pouca ou nenhuma formação de calo, mas as extremidades ainda são viáveis/vascularizadas", "C) Quando o osso consolida antes do tempo previsto", "D) Quando ocorre apenas em crianças pequenas"],correta:1,justificativas:["Desvios e infecção são complicações adicionais, não definem a oligotrofia.", "✔ Na oligotrófica (oligo = pouco), há vascularização, mas o calo é mínimo. Frequentemente ocorre por redução inadequada ou fixação que não estimulou o calo.", "Isso seria consolidação precoce.", "Pode ocorrer em qualquer idade."]},
{id:354,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Como se define uma pseudoartrose \"Oligotrófica\"?",alternativas:["A) Aquela com grande desvio angular e infecção", "B) Uma forma intermediária onde há pouca ou nenhuma formação de calo, mas as extremidades ainda são viáveis/vascularizadas", "C) Quando o osso consolida antes do tempo previsto", "D) Quando ocorre apenas em crianças pequenas"],correta:1,justificativas:["Desvios e infecção são complicações adicionais, não definem a oligotrofia.", "✔ Na oligotrófica (oligo = pouco), há vascularização, mas o calo é mínimo. Frequentemente ocorre por redução inadequada ou fixação que não estimulou o calo.", "Isso seria consolidação precoce.", "Pode ocorrer em qualquer idade."]},
{id:355,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"Qual a principal diferença teórica entre \"Consolidação Retardada\" e \"Pseudoartrose\"?",alternativas:["A) A consolidação retardada dói, a pseudoartrose não", "B) A pseudoartrose é uma infecção, a retardada é apenas demora", "C) Na consolidação retardada, o osso ainda está em processo de união; na pseudoartrose, o processo parou", "D) Nenhuma, são termos sinônimos"],correta:2,justificativas:["Ambas podem causar dor à carga.", "Pseudoartrose não implica necessariamente infecção.", "✔ É uma diferenciação de potencial. A retardada precisa de mais tempo; a pseudoartrose precisa de uma nova cirurgia ou intervenção biológica/mecânica para curar.", "São conceitos distintos com condutas diferentes."]},
{id:356,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Qual a principal diferença teórica entre \"Consolidação Retardada\" e \"Pseudoartrose\"?",alternativas:["A) A consolidação retardada dói, a pseudoartrose não", "B) A pseudoartrose é uma infecção, a retardada é apenas demora", "C) Na consolidação retardada, o osso ainda está em processo de união; na pseudoartrose, o processo parou", "D) Nenhuma, são termos sinônimos"],correta:2,justificativas:["Ambas podem causar dor à carga.", "Pseudoartrose não implica necessariamente infecção.", "✔ É uma diferenciação de potencial. A retardada precisa de mais tempo; a pseudoartrose precisa de uma nova cirurgia ou intervenção biológica/mecânica para curar.", "São conceitos distintos com condutas diferentes."]},
{id:357,tema:"Complicações",subtema:"Pseudoartrose",dificuldade:"iniciante",enunciado:"O uso de quais medicamentos é frequentemente associado a um maior risco de atraso na consolidação ou pseudoartrose?",alternativas:["A) Anti-inflamatórios não esteroidais (AINES)", "B) Antibióticos cefalosporinas", "C) Complexos vitamínicos B", "D) Analgésicos simples (Paracetamol)"],correta:0,justificativas:["✔ Os AINES inibem as prostaglandinas (via COX2), que são essenciais para recrutar células formadoras de osso na fase inflamatória inicial da fratura.", "Antibióticos tratam infecções que poderiam causar pseudoartrose.", "e D: Não possuem evidência de prejudicar a consolidação óssea.", "Alternativa D incorreta."]},
{id:358,tema:"Complicações",subtema:"Pseudoartrose",dificuldade:"intermediário",enunciado:"O uso de quais medicamentos é frequentemente associado a um maior risco de atraso na consolidação ou pseudoartrose?",alternativas:["A) Anti-inflamatórios não esteroidais (AINES)", "B) Antibióticos cefalosporinas", "C) Complexos vitamínicos B", "D) Analgésicos simples (Paracetamol)"],correta:0,justificativas:["✔ Os AINES inibem as prostaglandinas (via COX2), que são essenciais para recrutar células formadoras de osso na fase inflamatória inicial da fratura.", "Antibióticos tratam infecções que poderiam causar pseudoartrose.", "e D: Não possuem evidência de prejudicar a consolidação óssea.", "Alternativa D incorreta."]},
{id:359,tema:"Complicações",subtema:"Pseudoartrose",dificuldade:"iniciante",enunciado:"Anatomicamente, as pseudoartroses \"Sinoviais\" são caracterizadas por:",alternativas:["A) Extrema rigidez do foco", "B) Formação de uma cavidade preenchida por fluido e revestida por uma membrana semelhante à sinovial entre os fragmentos", "C) Uma ponte óssea sólida que impede o movimento", "D) Ocorre exclusivamente em fraturas expostas Gustilo III"],correta:1,justificativas:["Elas são geralmente muito móveis.", "✔ É a forma mais clássica de \"falsa articulação\", onde o corpo cria uma bolsa de fluido entre os ossos que não colaram, permitindo movimento anômalo.", "Se houvesse ponte óssea, estaria consolidado.", "Pode ocorrer em qualquer tipo de fratura, fechada ou exposta. ## ## Osteomielite Perfeito. Vamos focar agora no subtema Osteomielite, mantendo o Nível Fácil (Conceitos, Anatomia e Terminologia), conforme as regras de ouro da nossa progressão pedagógica. Bloco 3 Tema: Complicações / Infecções Subtema: Osteomielite Nível: Fácil (Conceitos, Vias de Disseminação e Anatomia)"]},
{id:360,tema:"Complicações",subtema:"Pseudoartrose",dificuldade:"intermediário",enunciado:"Anatomicamente, as pseudoartroses \"Sinoviais\" são caracterizadas por:",alternativas:["A) Extrema rigidez do foco", "B) Formação de uma cavidade preenchida por fluido e revestida por uma membrana semelhante à sinovial entre os fragmentos", "C) Uma ponte óssea sólida que impede o movimento", "D) Ocorre exclusivamente em fraturas expostas Gustilo III"],correta:1,justificativas:["Elas são geralmente muito móveis.", "✔ É a forma mais clássica de \"falsa articulação\", onde o corpo cria uma bolsa de fluido entre os ossos que não colaram, permitindo movimento anômalo.", "Se houvesse ponte óssea, estaria consolidado.", "Pode ocorrer em qualquer tipo de fratura, fechada ou exposta. ## ## Osteomielite Perfeito. Vamos focar agora no subtema Osteomielite, mantendo o Nível Fácil (Conceitos, Anatomia e Terminologia), conforme as regras de ouro da nossa progressão pedagógica. Bloco 3 Tema: Complicações / Infecções Subtema: Osteomielite Nível: Fácil (Conceitos, Vias de Disseminação e Anatomia)"]},
{id:361,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"A Osteomielite é definida como um processo inflamatório do osso causado por um agente infeccioso. Qual a via de disseminação mais comum desta patologia na população pediátrica?",alternativas:["A) Via hematogênica (através do sangue)", "B) Inoculação direta por trauma penetrante", "C) Contiguidade por infecção de tecidos moles adjacentes", "D) Via linfática a partir de linfonodos regionais"],correta:0,justificativas:["✔ Em crianças, a osteomielite aguda é predominantemente hematogênica, originandose de uma bacteremia (frequentemente assintomática) que se aloja no osso.", "A inoculação direta é mais comum em adultos (fraturas expostas ou cirurgias).", "A contiguidade é comum em pacientes com pé diabético ou úlceras vasculares.", "A via linfática não é uma via reconhecida de disseminação para infecções ósseas."]},
{id:362,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"A Osteomielite é definida como um processo inflamatório do osso causado por um agente infeccioso. Qual a via de disseminação mais comum desta patologia na população pediátrica?",alternativas:["A) Via hematogênica (através do sangue)", "B) Inoculação direta por trauma penetrante", "C) Contiguidade por infecção de tecidos moles adjacentes", "D) Via linfática a partir de linfonodos regionais"],correta:0,justificativas:["✔ Em crianças, a osteomielite aguda é predominantemente hematogênica, originandose de uma bacteremia (frequentemente assintomática) que se aloja no osso.", "A inoculação direta é mais comum em adultos (fraturas expostas ou cirurgias).", "A contiguidade é comum em pacientes com pé diabético ou úlceras vasculares.", "A via linfática não é uma via reconhecida de disseminação para infecções ósseas."]},
{id:363,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"Na osteomielite hematogênica aguda em crianças, qual região anatômica dos ossos longos é o sítio inicial mais frequente da infecção e por quê?",alternativas:["A) Epífise, devido à rica vascularização articular", "B) Diáfise, por ser a região com maior córtex ósseo", "C) Metáfise, devido ao fluxo sanguíneo lento em alças capilares terminais", "D) Fise (Placa epifisária), por ser um tecido cartilaginoso mole"],correta:2,justificativas:["A epífise é protegida pela fise na maioria das crianças, sendo menos comum como foco primário.", "A diáfise tem fluxo sanguíneo mais rápido e menor área de estase capilar que a metáfise.", "✔ A metáfise possui capilares que fazem curvas agudas (alças) antes de entrar no sistema venoso, causando um fluxo lento e turbulento que favorece a adesão e proliferação bacteriana.", "A fise atua, na verdade, como uma barreira mecânica à disseminação da infecção em crianças maiores."]},
{id:364,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Na osteomielite hematogênica aguda em crianças, qual região anatômica dos ossos longos é o sítio inicial mais frequente da infecção e por quê?",alternativas:["A) Epífise, devido à rica vascularização articular", "B) Diáfise, por ser a região com maior córtex ósseo", "C) Metáfise, devido ao fluxo sanguíneo lento em alças capilares terminais", "D) Fise (Placa epifisária), por ser um tecido cartilaginoso mole"],correta:2,justificativas:["A epífise é protegida pela fise na maioria das crianças, sendo menos comum como foco primário.", "A diáfise tem fluxo sanguíneo mais rápido e menor área de estase capilar que a metáfise.", "✔ A metáfise possui capilares que fazem curvas agudas (alças) antes de entrar no sistema venoso, causando um fluxo lento e turbulento que favorece a adesão e proliferação bacteriana.", "A fise atua, na verdade, como uma barreira mecânica à disseminação da infecção em crianças maiores."]},
{id:365,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"O agente etiológico mais comumente isolado em todos os tipos de osteomielite, independentemente da idade (exceto em condições específicas como anemia falciforme), é o:",alternativas:["A) Streptococcus pyogenes", "B) Staphylococcus aureus", "C) Escherichia coli", "D) Pseudomonas aeruginosa"],correta:1,justificativas:["Embora cause infecções, é menos frequente que o estafilococo.", "✔ O S. aureus possui proteínas de adesão (adesinas) que se ligam fortemente aos componentes da matriz óssea, sendo o patógeno número um em infecções ortopédicas.", "Comum em infecções neonatais ou urinárias, mas não é o principal no osso.", "Associado a feridas perfurantes no pé (tênis) ou uso de drogas IV, mas não é o mais comum geral."]},
{id:366,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"O agente etiológico mais comumente isolado em todos os tipos de osteomielite, independentemente da idade (exceto em condições específicas como anemia falciforme), é o:",alternativas:["A) Streptococcus pyogenes", "B) Staphylococcus aureus", "C) Escherichia coli", "D) Pseudomonas aeruginosa"],correta:1,justificativas:["Embora cause infecções, é menos frequente que o estafilococo.", "✔ O S. aureus possui proteínas de adesão (adesinas) que se ligam fortemente aos componentes da matriz óssea, sendo o patógeno número um em infecções ortopédicas.", "Comum em infecções neonatais ou urinárias, mas não é o principal no osso.", "Associado a feridas perfurantes no pé (tênis) ou uso de drogas IV, mas não é o mais comum geral."]},
{id:367,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"Na osteomielite crônica, como é denominado o fragmento de osso necrótico e desvascularizado que serve como foco para a persistência da infecção?",alternativas:["A) Involucro", "B) Cloaca", "C) Sequestro", "D) Abscesso de Brodie"],correta:2,justificativas:["O involucro é a camada de osso novo formado ao redor do osso infectado.", "Cloaca é o orifício no involucro por onde o pus drena.", "✔ O \"sequestro\" é um pedaço de osso morto que se separou do osso vivo. Como não tem sangue, os antibióticos e as células de defesa não conseguem chegar até ele.", "É uma forma de osteomielite subaguda, um abscesso localizado e bem delimitado."]},
{id:368,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Na osteomielite crônica, como é denominado o fragmento de osso necrótico e desvascularizado que serve como foco para a persistência da infecção?",alternativas:["A) Involucro", "B) Cloaca", "C) Sequestro", "D) Abscesso de Brodie"],correta:2,justificativas:["O involucro é a camada de osso novo formado ao redor do osso infectado.", "Cloaca é o orifício no involucro por onde o pus drena.", "✔ O \"sequestro\" é um pedaço de osso morto que se separou do osso vivo. Como não tem sangue, os antibióticos e as células de defesa não conseguem chegar até ele.", "É uma forma de osteomielite subaguda, um abscesso localizado e bem delimitado."]},
{id:369,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"Qual o nome da nova camada de osso vivo que se forma ao redor do osso necrótico na tentativa do corpo de isolar a infecção na osteomielite crônica?",alternativas:["A) Sequestro", "B) Involucro", "C) Calo primário", "D) Fístula"],correta:1,justificativas:["Sequestro é o osso morto (centro).", "✔ O involucro é a reação periosteal que forma osso novo para dar estabilidade e tentar \"sepultar\" o foco infeccioso.", "Calo primário referese à cicatrização de fraturas.", "Fístula é o trajeto que comunica a infecção com a pele."]},
{id:370,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Qual o nome da nova camada de osso vivo que se forma ao redor do osso necrótico na tentativa do corpo de isolar a infecção na osteomielite crônica?",alternativas:["A) Sequestro", "B) Involucro", "C) Calo primário", "D) Fístula"],correta:1,justificativas:["Sequestro é o osso morto (centro).", "✔ O involucro é a reação periosteal que forma osso novo para dar estabilidade e tentar \"sepultar\" o foco infeccioso.", "Calo primário referese à cicatrização de fraturas.", "Fístula é o trajeto que comunica a infecção com a pele."]},
{id:371,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"Pacientes portadores de Anemia Falciforme apresentam uma predisposição aumentada para osteomielite por qual agente específico, além do Staphylococcus aureus?",alternativas:["A) Salmonella spp", "B) Haemophilus influenzae", "C) Klebsiella pneumoniae", "D) Neisseria gonorrhoeae"],correta:0,justificativas:["✔ Devido a microinfartos intestinais e disfunção esplênica na anemia falciforme, a Salmonella consegue translocar para a corrente sanguínea e colonizar áreas de infarto ósseo.", "Alternativa B incorreta.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:372,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Pacientes portadores de Anemia Falciforme apresentam uma predisposição aumentada para osteomielite por qual agente específico, além do Staphylococcus aureus?",alternativas:["A) Salmonella spp", "B) Haemophilus influenzae", "C) Klebsiella pneumoniae", "D) Neisseria gonorrhoeae"],correta:0,justificativas:["✔ Devido a microinfartos intestinais e disfunção esplênica na anemia falciforme, a Salmonella consegue translocar para a corrente sanguínea e colonizar áreas de infarto ósseo.", "Alternativa B incorreta.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:373,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"Como é classificada a osteomielite que ocorre após uma cirurgia de fixação de fratura com uso de placas e parafusos (implantes)?",alternativas:["A) Osteomielite Hematogênica", "B) Osteomielite Pós-traumática / Associada a Implante", "C) Osteomielite Primária de Garré", "D) Abscesso de Brodie"],correta:1,justificativas:["Hematogênica vem pelo sangue, sem trauma cirúrgico prévio no local.", "✔ Esta categoria engloba infecções por inoculação direta no ato cirúrgico ou por contaminação do material de síntese (biofilme).", "A osteomielite de Garré é uma forma crônica esclerosante rara.", "O abscesso de Brodie é uma forma subaguda idiopática, sem relação com implantes."]},
{id:374,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Como é classificada a osteomielite que ocorre após uma cirurgia de fixação de fratura com uso de placas e parafusos (implantes)?",alternativas:["A) Osteomielite Hematogênica", "B) Osteomielite Pós-traumática / Associada a Implante", "C) Osteomielite Primária de Garré", "D) Abscesso de Brodie"],correta:1,justificativas:["Hematogênica vem pelo sangue, sem trauma cirúrgico prévio no local.", "✔ Esta categoria engloba infecções por inoculação direta no ato cirúrgico ou por contaminação do material de síntese (biofilme).", "A osteomielite de Garré é uma forma crônica esclerosante rara.", "O abscesso de Brodie é uma forma subaguda idiopática, sem relação com implantes."]},
{id:375,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"O que caracteriza a \"Osteomielite Esclerosante de Garré\"?",alternativas:["A) Formação de grandes abscessos purulentos", "B) Intensa proliferação óssea e espessamento do córtex, sem formação de pus ou sequestros óbvios", "C) Destruição completa da articulação adjacente", "D) Ocorre exclusivamente em pacientes idosos com diabetes"],correta:1,justificativas:["É tipicamente \"não supurativa\".", "✔ É uma variante crônica onde a resposta do hospedeiro é gerar osso denso (esclerose), causando dor crônica, mas com baixa atividade purulenta.", "Geralmente poupa a articulação, focando na diáfise/metáfise.", "É mais comum em crianças e adultos jovens."]},
{id:376,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"O que caracteriza a \"Osteomielite Esclerosante de Garré\"?",alternativas:["A) Formação de grandes abscessos purulentos", "B) Intensa proliferação óssea e espessamento do córtex, sem formação de pus ou sequestros óbvios", "C) Destruição completa da articulação adjacente", "D) Ocorre exclusivamente em pacientes idosos com diabetes"],correta:1,justificativas:["É tipicamente \"não supurativa\".", "✔ É uma variante crônica onde a resposta do hospedeiro é gerar osso denso (esclerose), causando dor crônica, mas com baixa atividade purulenta.", "Geralmente poupa a articulação, focando na diáfise/metáfise.", "É mais comum em crianças e adultos jovens."]},
{id:377,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"Qual a definição de \"Cloaca\" no contexto radiográfico da osteomielite crônica?",alternativas:["A) Uma cavidade contendo ar dentro do osso", "B) Um canal ou orifício no involucro que permite a saída de pus e debris do sequestro", "C) O ponto onde o tendão se insere no osso infectado", "D) A placa de crescimento quando infectada por fungos"],correta:1,justificativas:["Cavidades com ar (gás) sugerem infecções por anaeróbios em tecidos moles, não é a definição de cloaca.", "✔ A cloaca é o \"cano de descarga\" da infecção óssea, permitindo que a pressão interna seja aliviada através da drenagem para as partes moles.", "e D: Definições sem relação técnica com o termo.", "Alternativa D incorreta."]},
{id:378,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Qual a definição de \"Cloaca\" no contexto radiográfico da osteomielite crônica?",alternativas:["A) Uma cavidade contendo ar dentro do osso", "B) Um canal ou orifício no involucro que permite a saída de pus e debris do sequestro", "C) O ponto onde o tendão se insere no osso infectado", "D) A placa de crescimento quando infectada por fungos"],correta:1,justificativas:["Cavidades com ar (gás) sugerem infecções por anaeróbios em tecidos moles, não é a definição de cloaca.", "✔ A cloaca é o \"cano de descarga\" da infecção óssea, permitindo que a pressão interna seja aliviada através da drenagem para as partes moles.", "e D: Definições sem relação técnica com o termo.", "Alternativa D incorreta."]},
{id:379,tema:"Complicações",subtema:"Osteomielite",dificuldade:"iniciante",enunciado:"Quando uma osteomielite é chamada de \"Hematogênica Aguda\", quanto tempo geralmente duram os sintomas antes do diagnóstico?",alternativas:["A) Menos de 2 semanas", "B) Mais de 3 meses", "C) Exatamente 1 ano", "D) Entre 6 e 12 meses"],correta:0,justificativas:["✔ O termo \"agudo\" na osteomielite referese a infecções diagnosticadas nos primeiros dias até cerca de 2 semanas do início dos sintomas.", "Alternativa B incorreta.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:380,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Quando uma osteomielite é chamada de \"Hematogênica Aguda\", quanto tempo geralmente duram os sintomas antes do diagnóstico?",alternativas:["A) Menos de 2 semanas", "B) Mais de 3 meses", "C) Exatamente 1 ano", "D) Entre 6 e 12 meses"],correta:0,justificativas:["✔ O termo \"agudo\" na osteomielite referese a infecções diagnosticadas nos primeiros dias até cerca de 2 semanas do início dos sintomas.", "Alternativa B incorreta.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:381,tema:"Complicações",subtema:"Pioartrite",dificuldade:"iniciante",enunciado:"A pioartrite (ou artrite séptica) é corretamente definida como:",alternativas:["A) Uma inflamação articular causada por deposição de cristais de ácido úrico", "B) A invasão do espaço articular por um microrganismo patogênico, geralmente resultando em resposta inflamatória purulenta", "C) O desgaste degenerativo da cartilagem hialina devido ao envelhecimento", "D) Uma reação inflamatória articular que ocorre semanas após uma infecção intestinal, sem presença de bactérias na junta"],correta:1,justificativas:["Esta é a definição de gota.", "✔ A pioartrite é uma infecção direta da articulação. O termo \"pio\" indica a formação de pus dentro da cavidade sinovial.", "Esta é a definição de osteoartrose.", "Esta é a definição de artrite reativa (estéril na articulação)."]},
{id:382,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"A pioartrite (ou artrite séptica) é corretamente definida como:",alternativas:["A) Uma inflamação articular causada por deposição de cristais de ácido úrico", "B) A invasão do espaço articular por um microrganismo patogênico, geralmente resultando em resposta inflamatória purulenta", "C) O desgaste degenerativo da cartilagem hialina devido ao envelhecimento", "D) Uma reação inflamatória articular que ocorre semanas após uma infecção intestinal, sem presença de bactérias na junta"],correta:1,justificativas:["Esta é a definição de gota.", "✔ A pioartrite é uma infecção direta da articulação. O termo \"pio\" indica a formação de pus dentro da cavidade sinovial.", "Esta é a definição de osteoartrose.", "Esta é a definição de artrite reativa (estéril na articulação)."]},
{id:383,tema:"Complicações",subtema:"Pioartrite",dificuldade:"iniciante",enunciado:"Qual é a via de disseminação mais comum da pioartrite na população pediátrica?",alternativas:["A) Inoculação direta por ferimentos penetrantes", "B) Extensão por contiguidade de uma infecção de partes moles", "C) Via hematogênica (disseminação pelo sangue)", "D) Disseminação retrógrada pelos vasos linfáticos"],correta:2,justificativas:["É comum em traumas abertos, mas não é a principal via em crianças.", "Pode ocorrer, mas é menos frequente que a via hematogênica.", "✔ Assim como na osteomielite, a maioria das pioartrites em crianças ocorre porque bactérias na corrente sanguínea se instalam na membrana sinovial, que é altamente vascularizada.", "A via linfática não é uma via reconhecida de infecção articular."]},
{id:384,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"Qual é a via de disseminação mais comum da pioartrite na população pediátrica?",alternativas:["A) Inoculação direta por ferimentos penetrantes", "B) Extensão por contiguidade de uma infecção de partes moles", "C) Via hematogênica (disseminação pelo sangue)", "D) Disseminação retrógrada pelos vasos linfáticos"],correta:2,justificativas:["É comum em traumas abertos, mas não é a principal via em crianças.", "Pode ocorrer, mas é menos frequente que a via hematogênica.", "✔ Assim como na osteomielite, a maioria das pioartrites em crianças ocorre porque bactérias na corrente sanguínea se instalam na membrana sinovial, que é altamente vascularizada.", "A via linfática não é uma via reconhecida de infecção articular."]},
{id:385,tema:"Complicações",subtema:"Pioartrite",dificuldade:"iniciante",enunciado:"Qual estrutura anatômica da articulação é a primeira a ser colonizada pelas bactérias na pioartrite hematogênica?",alternativas:["A) Cartilagem hialina", "B) Meniscos ou labrum", "C) Membrana sinovial", "D) Ligamentos cruzados"],correta:2,justificativas:["A cartilagem é avascular; ela é destruída secundariamente pelas enzimas, mas não é o sítio inicial de fixação bacteriana.", "e D: São estruturas internas que podem ser infectadas secundariamente, mas não são a porta de entrada.", "✔ A membrana sinovial não possui membrana basal e é ricamente vascularizada, facilitando a saída das bactérias do sangue para o líquido sinovial.", "Alternativa D incorreta."]},
{id:386,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"Qual estrutura anatômica da articulação é a primeira a ser colonizada pelas bactérias na pioartrite hematogênica?",alternativas:["A) Cartilagem hialina", "B) Meniscos ou labrum", "C) Membrana sinovial", "D) Ligamentos cruzados"],correta:2,justificativas:["A cartilagem é avascular; ela é destruída secundariamente pelas enzimas, mas não é o sítio inicial de fixação bacteriana.", "e D: São estruturas internas que podem ser infectadas secundariamente, mas não são a porta de entrada.", "✔ A membrana sinovial não possui membrana basal e é ricamente vascularizada, facilitando a saída das bactérias do sangue para o líquido sinovial.", "Alternativa D incorreta."]},
{id:387,tema:"Complicações",subtema:"Pioartrite",dificuldade:"iniciante",enunciado:"Por que a pioartrite do quadril em recém-nascidos é frequentemente associada à osteomielite do fêmur proximal?",alternativas:["A) Porque a metáfise do fêmur proximal é intracapsular", "B) Porque o quadril do recém-nascido não possui cápsula articular", "C) Porque o sangue do recém-nascido circula mais devagar que o do adulto", "D) Porque as bactérias do recém-nascido são mais agressivas que as do adulto"],correta:0,justificativas:["✔ No quadril (e no ombro), a cápsula articular se insere abaixo da metáfise. Assim, um abscesso ósseo metafisário rompe para dentro da articulação, causando as duas doenças simultaneamente.", "Todos os humanos nascem com cápsulas articulares formadas.", "e D: Não são explicações anatômicas para a coexistência das duas patologias no mesmo local.", "Alternativa D incorreta."]},
{id:388,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"Por que a pioartrite do quadril em recém-nascidos é frequentemente associada à osteomielite do fêmur proximal?",alternativas:["A) Porque a metáfise do fêmur proximal é intracapsular", "B) Porque o quadril do recém-nascido não possui cápsula articular", "C) Porque o sangue do recém-nascido circula mais devagar que o do adulto", "D) Porque as bactérias do recém-nascido são mais agressivas que as do adulto"],correta:0,justificativas:["✔ No quadril (e no ombro), a cápsula articular se insere abaixo da metáfise. Assim, um abscesso ósseo metafisário rompe para dentro da articulação, causando as duas doenças simultaneamente.", "Todos os humanos nascem com cápsulas articulares formadas.", "e D: Não são explicações anatômicas para a coexistência das duas patologias no mesmo local.", "Alternativa D incorreta."]},
{id:389,tema:"Complicações",subtema:"Pioartrite",dificuldade:"iniciante",enunciado:"O termo \"Atitude Antálgica\" no contexto da pioartrite refere-se a:",alternativas:["A) Uma deformidade óssea permanente causada pela infecção", "B) A posição em que o paciente mantém o membro para minimizar a pressão intra-articular e a dor", "C) Um tique nervoso causado pela febre alta", "D) O relaxamento muscular após a drenagem do pus"],correta:1,justificativas:["É uma posição funcional e temporária devido à dor, não uma deformidade óssea fixa inicial.", "✔ Na pioartrite, o derrame aumenta a pressão. O paciente mantém a junta em uma posição (geralmente flexão) que comporta o maior volume de líquido com a menor dor possível.", "e D: Definições sem fundamento técnico no contexto da patologia.", "Alternativa D incorreta."]},
{id:390,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"O termo \"Atitude Antálgica\" no contexto da pioartrite refere-se a:",alternativas:["A) Uma deformidade óssea permanente causada pela infecção", "B) A posição em que o paciente mantém o membro para minimizar a pressão intra-articular e a dor", "C) Um tique nervoso causado pela febre alta", "D) O relaxamento muscular após a drenagem do pus"],correta:1,justificativas:["É uma posição funcional e temporária devido à dor, não uma deformidade óssea fixa inicial.", "✔ Na pioartrite, o derrame aumenta a pressão. O paciente mantém a junta em uma posição (geralmente flexão) que comporta o maior volume de líquido com a menor dor possível.", "e D: Definições sem fundamento técnico no contexto da patologia.", "Alternativa D incorreta."]},
{id:391,tema:"Complicações",subtema:"Pioartrite",dificuldade:"iniciante",enunciado:"Qual articulação é estatisticamente a mais afetada pela pioartrite em todas as faixas etárias?",alternativas:["A) Quadril", "B) Ombro", "C) Joelho", "D) Tornozelo"],correta:2,justificativas:["É a segunda mais comum, sendo muito importante na pediatria (RNs).", "e D: São menos frequentes que o joelho e o quadril.", "✔ O joelho é a articulação sinovial mais comum para artrite séptica, respondendo por aproximadamente 50% dos casos.", "Alternativa D incorreta."]},
{id:392,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"Qual articulação é estatisticamente a mais afetada pela pioartrite em todas as faixas etárias?",alternativas:["A) Quadril", "B) Ombro", "C) Joelho", "D) Tornozelo"],correta:2,justificativas:["É a segunda mais comum, sendo muito importante na pediatria (RNs).", "e D: São menos frequentes que o joelho e o quadril.", "✔ O joelho é a articulação sinovial mais comum para artrite séptica, respondendo por aproximadamente 50% dos casos.", "Alternativa D incorreta."]},
{id:393,tema:"Complicações",subtema:"Pioartrite",dificuldade:"iniciante",enunciado:"A destruição da cartilagem na pioartrite ocorre principalmente devido a:",alternativas:["A) Ação direta de vírus que corroem o colágeno", "B) Liberação de enzimas proteolíticas (como metaloproteinases) pelas bactérias e pelos leucócitos do hospedeiro", "C) Falta de cálcio no líquido sinovial durante a infecção", "D) Pressão mecânica do gesso se este for utilizado no tratamento"],correta:1,justificativas:["Pioartrite é predominantemente bacteriana.", "✔ A destruição é química e enzimática. Tanto as bactérias quanto as células de defesa (neutrófilos) liberam enzimas que \"digerem\" a matriz da cartilagem.", "A alteração de minerais não é o mecanismo primário de destruição da cartilagem.", "O gesso não causa a destruição da cartilagem característica da pioartrite."]},
{id:394,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"A destruição da cartilagem na pioartrite ocorre principalmente devido a:",alternativas:["A) Ação direta de vírus que corroem o colágeno", "B) Liberação de enzimas proteolíticas (como metaloproteinases) pelas bactérias e pelos leucócitos do hospedeiro", "C) Falta de cálcio no líquido sinovial durante a infecção", "D) Pressão mecânica do gesso se este for utilizado no tratamento"],correta:1,justificativas:["Pioartrite é predominantemente bacteriana.", "✔ A destruição é química e enzimática. Tanto as bactérias quanto as células de defesa (neutrófilos) liberam enzimas que \"digerem\" a matriz da cartilagem.", "A alteração de minerais não é o mecanismo primário de destruição da cartilagem.", "O gesso não causa a destruição da cartilagem característica da pioartrite."]},
{id:395,tema:"Complicações",subtema:"Pioartrite",dificuldade:"iniciante",enunciado:"O que caracteriza o termo clínico \"Pseudoparalisia\" em uma criança com suspeita de pioartrite?",alternativas:["A) Lesão traumática do nervo ciático", "B) Perda real da força muscular por atrofia", "C) A recusa em movimentar o membro devido à dor extrema à mobilização articular", "D) Um estado de coma induzido pela sepse"],correta:2,justificativas:["Não há lesão nervosa primária na pioartrite.", "Atrofia é um processo crônico; a pioartrite é aguda.", "✔ A criança tem força e nervos íntegros, mas a dor é tão forte que ela não move o membro, simulando uma paralisia (por isso o termo \"pseudo\").", "Pseudoparalisia é um sinal local, não um estado de consciência."]},
{id:396,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"O que caracteriza o termo clínico \"Pseudoparalisia\" em uma criança com suspeita de pioartrite?",alternativas:["A) Lesão traumática do nervo ciático", "B) Perda real da força muscular por atrofia", "C) A recusa em movimentar o membro devido à dor extrema à mobilização articular", "D) Um estado de coma induzido pela sepse"],correta:2,justificativas:["Não há lesão nervosa primária na pioartrite.", "Atrofia é um processo crônico; a pioartrite é aguda.", "✔ A criança tem força e nervos íntegros, mas a dor é tão forte que ela não move o membro, simulando uma paralisia (por isso o termo \"pseudo\").", "Pseudoparalisia é um sinal local, não um estado de consciência."]},
{id:397,tema:"Complicações",subtema:"Pioartrite",dificuldade:"iniciante",enunciado:"Qual o microrganismo mais comum em casos de pioartrite na população em geral?",alternativas:["A) Escherichia coli", "B) Staphylococcus aureus", "C) Neisseria meningitidis", "D) Streptococcus pneumoniae"],correta:1,justificativas:["Mais comum em neonatos ou idosos com infecção urinária.", "✔ Assim como na osteomielite, o S. aureus é o principal patógeno devido à sua capacidade de adesão aos tecidos articulares.", "e D: Podem causar, mas são muito menos frequentes que o estafilococo.", "Alternativa D incorreta."]},
{id:398,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"Qual o microrganismo mais comum em casos de pioartrite na população em geral?",alternativas:["A) Escherichia coli", "B) Staphylococcus aureus", "C) Neisseria meningitidis", "D) Streptococcus pneumoniae"],correta:1,justificativas:["Mais comum em neonatos ou idosos com infecção urinária.", "✔ Assim como na osteomielite, o S. aureus é o principal patógeno devido à sua capacidade de adesão aos tecidos articulares.", "e D: Podem causar, mas são muito menos frequentes que o estafilococo.", "Alternativa D incorreta."]},
{id:399,tema:"Complicações",subtema:"Pioartrite",dificuldade:"iniciante",enunciado:"Qual o procedimento padrão para obter o diagnóstico definitivo de uma pioartrite?",alternativas:["A) Ressonância Magnética", "B) Artrocentese (aspiração do líquido sinovial) seguida de análise", "C) Biópsia de osso subcondral", "D) Cintilografia óssea com tecnécio"],correta:1,justificativas:["A RM vê o líquido (derrame), mas não diz se é pus ou apenas inflamação.", "✔ A análise do líquido (contagem de células, Gram e cultura) é o único método que confirma a infecção e identifica o agente.", "A infecção é no espaço articular (líquido), não há necessidade de biópsia óssea para o diagnóstico inicial da pioartrite.", "Exame de imagem funcional que não substitui a necessidade de coleta de material para cultura. ## Questões difíceis"]},
