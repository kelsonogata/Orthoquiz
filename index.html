{id:400,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"Qual o procedimento padrão para obter o diagnóstico definitivo de uma pioartrite?",alternativas:["A) Ressonância Magnética", "B) Artrocentese (aspiração do líquido sinovial) seguida de análise", "C) Biópsia de osso subcondral", "D) Cintilografia óssea com tecnécio"],correta:1,justificativas:["A RM vê o líquido (derrame), mas não diz se é pus ou apenas inflamação.", "✔ A análise do líquido (contagem de células, Gram e cultura) é o único método que confirma a infecção e identifica o agente.", "A infecção é no espaço articular (líquido), não há necessidade de biópsia óssea para o diagnóstico inicial da pioartrite.", "Exame de imagem funcional que não substitui a necessidade de coleta de material para cultura. ## Questões difíceis"]},
{id:401,tema:"Complicações",subtema:"Pioartrite",dificuldade:"avançado",enunciado:"Paciente de 30 anos, vítima de queda de altura com fratura de diáfise de tíbia há 6 meses, tratada com haste intramedular. Apresenta dor persistente à carga. Radiografias mostram alargamento do foco da fratura com esclerose das bordas e ausência de ponte óssea, mas com exuberante formação de calo periférico (\"pata de elefante\"). Qual o diagnóstico e a provável etiologia?",alternativas:["A) Pseudoartrose atrófica por falha biológica", "B) Pseudoartrose hipertrófica por instabilidade mecânica", "C) Osteomielite crônica por contaminação do implante", "D) Consolidação retardada por deficiência de Vitamina D"],correta:1,justificativas:["Na atrófica, não haveria formação de calo (extremidades afinadas).", "✔ O sinal de \"pata de elefante\" (calo exuberante) indica que há boa vascularização (biologia), mas o movimento excessivo no foco impede a união final, caracterizando a pseudoartrose hipertrófica.", "Embora a dor ocorra na osteomielite, o padrão \"pata de elefante\" é clássico da instabilidade mecânica.", "6 meses é o marco comum para diagnóstico de pseudoartrose na tíbia; o padrão radiográfico define a categoria."]},
{id:402,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"Paciente de 30 anos, vítima de queda de altura com fratura de diáfise de tíbia há 6 meses, tratada com haste intramedular. Apresenta dor persistente à carga. Radiografias mostram alargamento do foco da fratura com esclerose das bordas e ausência de ponte óssea, mas com exuberante formação de calo periférico (\"pata de elefante\"). Qual o diagnóstico e a provável etiologia?",alternativas:["A) Pseudoartrose atrófica por falha biológica", "B) Pseudoartrose hipertrófica por instabilidade mecânica", "C) Osteomielite crônica por contaminação do implante", "D) Consolidação retardada por deficiência de Vitamina D"],correta:1,justificativas:["Na atrófica, não haveria formação de calo (extremidades afinadas).", "✔ O sinal de \"pata de elefante\" (calo exuberante) indica que há boa vascularização (biologia), mas o movimento excessivo no foco impede a união final, caracterizando a pseudoartrose hipertrófica.", "Embora a dor ocorra na osteomielite, o padrão \"pata de elefante\" é clássico da instabilidade mecânica.", "6 meses é o marco comum para diagnóstico de pseudoartrose na tíbia; o padrão radiográfico define a categoria."]},
{id:403,tema:"Complicações",subtema:"Pioartrite",dificuldade:"avançado",enunciado:"No diagnóstico da Síndrome Compartimental Aguda, qual a utilidade da aferição da pressão intracompartimental?",alternativas:["A) É obrigatória em todos os casos, sobrepondo-se ao exame clínico", "B) Deve ser realizada apenas se os pulsos distais estiverem ausentes", "C) É fundamental em pacientes com rebaixamento do nível de consciência ou politraumatizados sedados onde o exame físico é pouco confiável", "D) Serve para diferenciar a síndrome compartimental de uma fratura exposta"],correta:2,justificativas:["O diagnóstico é predominantemente clínico; a monitorização é um auxílio.", "A ausência de pulsos é um sinal muito tardio; esperar por isso para medir a pressão é perigoso.", "✔ Em pacientes que não podem relatar dor (sedados, com TCE), a monitorização objetiva da pressão é a única forma de diagnóstico precoce.", "Não há relação diagnóstica direta entre as duas entidades dessa forma."]},
{id:404,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"No diagnóstico da Síndrome Compartimental Aguda, qual a utilidade da aferição da pressão intracompartimental?",alternativas:["A) É obrigatória em todos os casos, sobrepondo-se ao exame clínico", "B) Deve ser realizada apenas se os pulsos distais estiverem ausentes", "C) É fundamental em pacientes com rebaixamento do nível de consciência ou politraumatizados sedados onde o exame físico é pouco confiável", "D) Serve para diferenciar a síndrome compartimental de uma fratura exposta"],correta:2,justificativas:["O diagnóstico é predominantemente clínico; a monitorização é um auxílio.", "A ausência de pulsos é um sinal muito tardio; esperar por isso para medir a pressão é perigoso.", "✔ Em pacientes que não podem relatar dor (sedados, com TCE), a monitorização objetiva da pressão é a única forma de diagnóstico precoce.", "Não há relação diagnóstica direta entre as duas entidades dessa forma."]},
{id:405,tema:"Complicações",subtema:"Pioartrite",dificuldade:"avançado",enunciado:"Uma criança de 5 anos apresenta claudicação e dor no quadril direito. Ao exame, apresenta febre ($38,5^{circ}C$) e recusa da mobilização ativa e passiva. Segundo os Critérios de Kocher para diferenciar Artrite Séptica de Sinovite Transitória, qual dos parâmetros abaixo NÃO faz parte da pontuação original?",alternativas:["A) Febre $> 38,5^{circ}C$", "B) VHS $> 40$ mm/h", "C) Leucocitose $> 12.000$ células/$mu$l", "D) Proteína C Reativa (PCR) $> 100$ mg/L"],correta:3,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "Alternativa C incorreta.", "✔ Os quatro critérios originais de Kocher são: febre, incapacidade de apoiar o peso, leucocitose e VHS elevado. A PCR foi adicionada posteriormente em estudos modificados, mas não consta no escore original de 4 pontos."]},
{id:406,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"Uma criança de 5 anos apresenta claudicação e dor no quadril direito. Ao exame, apresenta febre ($38,5^{circ}C$) e recusa da mobilização ativa e passiva. Segundo os Critérios de Kocher para diferenciar Artrite Séptica de Sinovite Transitória, qual dos parâmetros abaixo NÃO faz parte da pontuação original?",alternativas:["A) Febre $> 38,5^{circ}C$", "B) VHS $> 40$ mm/h", "C) Leucocitose $> 12.000$ células/$mu$l", "D) Proteína C Reativa (PCR) $> 100$ mg/L"],correta:3,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "Alternativa C incorreta.", "✔ Os quatro critérios originais de Kocher são: febre, incapacidade de apoiar o peso, leucocitose e VHS elevado. A PCR foi adicionada posteriormente em estudos modificados, mas não consta no escore original de 4 pontos."]},
{id:407,tema:"Complicações",subtema:"Osteomielite",dificuldade:"avançado",enunciado:"Qual o achado radiográfico mais precoce na Osteomielite Hematogênica Aguda, observado geralmente nos primeiros 3 a 5 dias de sintomas?",alternativas:["A) Reação periosteal em \"casca de cebola\"", "B) Edema e distensão das linhas de gordura nos tecidos moles profundos", "C) Aparecimento do sequestro ósseo", "D) Presença de cloacas no córtex"],correta:1,justificativas:["Reação periosteal demora mais tempo para se tornar visível.", "✔ As alterações ósseas demoram de 10 a 14 dias para aparecer na radiografia. O sinal mais precoce é o edema de partes moles adjacente ao osso infectado.", "e D: São sinais de osteomielite crônica (semanas a meses).", "Alternativa D incorreta."]},
{id:408,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Qual o achado radiográfico mais precoce na Osteomielite Hematogênica Aguda, observado geralmente nos primeiros 3 a 5 dias de sintomas?",alternativas:["A) Reação periosteal em \"casca de cebola\"", "B) Edema e distensão das linhas de gordura nos tecidos moles profundos", "C) Aparecimento do sequestro ósseo", "D) Presença de cloacas no córtex"],correta:1,justificativas:["Reação periosteal demora mais tempo para se tornar visível.", "✔ As alterações ósseas demoram de 10 a 14 dias para aparecer na radiografia. O sinal mais precoce é o edema de partes moles adjacente ao osso infectado.", "e D: São sinais de osteomielite crônica (semanas a meses).", "Alternativa D incorreta."]},
{id:409,tema:"Complicações",subtema:"Osteomielite",dificuldade:"avançado",enunciado:"Durante o exame físico de um paciente com suspeita de Síndrome Compartimental do compartimento posterior profundo da perna, qual manobra de estiramento passivo deve desencadear dor intensa?",alternativas:["A) Extensão passiva do hálux e dos dedos", "B) Flexão plantar passiva do tornozelo", "C) Inversão passiva do pé", "D) Eversão passiva do pé"],correta:0,justificativas:["✔ Os músculos flexor longo do hálux e flexor longo dos dedos estão no compartimento posterior profundo; a extensão passiva estira esses músculos inflamados, causando dor.", "A flexão plantar relaxa esses músculos, aliviando a dor desse compartimento específico.", "e D: Testam predominantemente o compartimento lateral.", "Alternativa D incorreta."]},
{id:410,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Durante o exame físico de um paciente com suspeita de Síndrome Compartimental do compartimento posterior profundo da perna, qual manobra de estiramento passivo deve desencadear dor intensa?",alternativas:["A) Extensão passiva do hálux e dos dedos", "B) Flexão plantar passiva do tornozelo", "C) Inversão passiva do pé", "D) Eversão passiva do pé"],correta:0,justificativas:["✔ Os músculos flexor longo do hálux e flexor longo dos dedos estão no compartimento posterior profundo; a extensão passiva estira esses músculos inflamados, causando dor.", "A flexão plantar relaxa esses músculos, aliviando a dor desse compartimento específico.", "e D: Testam predominantemente o compartimento lateral.", "Alternativa D incorreta."]},
{id:411,tema:"Complicações",subtema:"Osteomielite",dificuldade:"avançado",enunciado:"No estudo laboratorial do líquido sinovial na Artrite Séptica (Pioartrite), qual a contagem de leucócitos por $mm^3$ que sugere fortemente o diagnóstico?",alternativas:["A) $> 500$ leucócitos com predomínio de linfócitos", "B) $> 2.000$ leucócitos com cristais de urato", "C) $> 50.000$ leucócitos com predomínio ($> 75%$) de polimorfonucleares", "D) $< 10.000$ leucócitos com glicose normal"],correta:2,justificativas:["Sugere processo inflamatório leve ou viral.", "Sugere gota.", "✔ Valores acima de 50.000 leucócitos/mm³ são o limiar clássico para artrite séptica, embora em quadros iniciais ou imunossuprimidos possa ser menor.", "Sugere artrite não infecciosa ou líquido normal."]},
{id:412,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"No estudo laboratorial do líquido sinovial na Artrite Séptica (Pioartrite), qual a contagem de leucócitos por $mm^3$ que sugere fortemente o diagnóstico?",alternativas:["A) $> 500$ leucócitos com predomínio de linfócitos", "B) $> 2.000$ leucócitos com cristais de urato", "C) $> 50.000$ leucócitos com predomínio ($> 75%$) de polimorfonucleares", "D) $< 10.000$ leucócitos com glicose normal"],correta:2,justificativas:["Sugere processo inflamatório leve ou viral.", "Sugere gota.", "✔ Valores acima de 50.000 leucócitos/mm³ são o limiar clássico para artrite séptica, embora em quadros iniciais ou imunossuprimidos possa ser menor.", "Sugere artrite não infecciosa ou líquido normal."]},
{id:413,tema:"Complicações",subtema:"Pioartrite",dificuldade:"avançado",enunciado:"Um paciente politraumatizado apresenta dor na perna que não cede com doses crescentes de morfina. Ao exame, o compartimento está tenso e há parestesia no primeiro espaço interdigital. Qual compartimento da perna está provavelmente acometido?",alternativas:["A) Lateral", "B) Posterior Superficial", "C) Anterior", "D) Posterior Profundo"],correta:2,justificativas:["Acometeria o nervo fibular superficial (dorso do pé).", "e D: Acometeriam a sensibilidade plantar (nervo tibial).", "✔ O nervo fibular profundo atravessa o compartimento anterior e sua compressão causa parestesia/dormência no primeiro espaço interdigital (entre o 1º e 2º dedos).", "Alternativa D incorreta."]},
{id:414,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"Um paciente politraumatizado apresenta dor na perna que não cede com doses crescentes de morfina. Ao exame, o compartimento está tenso e há parestesia no primeiro espaço interdigital. Qual compartimento da perna está provavelmente acometido?",alternativas:["A) Lateral", "B) Posterior Superficial", "C) Anterior", "D) Posterior Profundo"],correta:2,justificativas:["Acometeria o nervo fibular superficial (dorso do pé).", "e D: Acometeriam a sensibilidade plantar (nervo tibial).", "✔ O nervo fibular profundo atravessa o compartimento anterior e sua compressão causa parestesia/dormência no primeiro espaço interdigital (entre o 1º e 2º dedos).", "Alternativa D incorreta."]},
{id:415,tema:"Complicações",subtema:"Pioartrite",dificuldade:"avançado",enunciado:"Na investigação de uma possível Pseudoartrose Infectada, qual exame de imagem possui maior sensibilidade para detectar atividade inflamatória e persistência de infecção ao redor de implantes metálicos?",alternativas:["A) Radiografia simples em estresse", "B) Tomografia Computadorizada (T", "C) ", "C) Cintilografia com leucócitos marcados ou Cinditilografia com Gálio"],correta:2,justificativas:["Avalia apenas estabilidade mecânica.", "O metal dos implantes causa muitos artefatos na TC, dificultando a visão de pequenos abscessos.", "✔ A cintilografia com leucócitos marcados é excelente para diferenciar inflamação mecânica de infecção, pois as células de defesa se acumulam no foco infeccioso.", "Tem utilidade limitada para avaliação endosteal."]},
{id:416,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"Na investigação de uma possível Pseudoartrose Infectada, qual exame de imagem possui maior sensibilidade para detectar atividade inflamatória e persistência de infecção ao redor de implantes metálicos?",alternativas:["A) Radiografia simples em estresse", "B) Tomografia Computadorizada (T", "C) ", "C) Cintilografia com leucócitos marcados ou Cinditilografia com Gálio"],correta:2,justificativas:["Avalia apenas estabilidade mecânica.", "O metal dos implantes causa muitos artefatos na TC, dificultando a visão de pequenos abscessos.", "✔ A cintilografia com leucócitos marcados é excelente para diferenciar inflamação mecânica de infecção, pois as células de defesa se acumulam no foco infeccioso.", "Tem utilidade limitada para avaliação endosteal."]},
{id:417,tema:"Complicações",subtema:"Pioartrite",dificuldade:"avançado",enunciado:"Qual a principal limitação da Proteína C Reativa (PCR) no acompanhamento do tratamento de uma Osteomielite Aguda?",alternativas:["A) Ela demora semanas para baixar após o tratamento correto", "B) Ela é um marcador muito inespecífico, mas é excelente para monitorar a resposta terapêutica por sua queda rápida", "C) Ela não se altera em infecções ósseas", "D) Ela só aumenta se houver infecção urinária associada"],correta:1,justificativas:["O VHS é que demora semanas para baixar; a PCR baixa rápido.", "✔ A PCR sobe rápido e cai rápido (meiavida curta). Se o tratamento está funcionando, a PCR deve cair em poucos dias. Se permanecer alta, o tratamento falhou.", "e D: Afirmações incorretas sobre a fisiologia da PCR.", "Alternativa D incorreta."]},
{id:418,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"Qual a principal limitação da Proteína C Reativa (PCR) no acompanhamento do tratamento de uma Osteomielite Aguda?",alternativas:["A) Ela demora semanas para baixar após o tratamento correto", "B) Ela é um marcador muito inespecífico, mas é excelente para monitorar a resposta terapêutica por sua queda rápida", "C) Ela não se altera em infecções ósseas", "D) Ela só aumenta se houver infecção urinária associada"],correta:1,justificativas:["O VHS é que demora semanas para baixar; a PCR baixa rápido.", "✔ A PCR sobe rápido e cai rápido (meiavida curta). Se o tratamento está funcionando, a PCR deve cair em poucos dias. Se permanecer alta, o tratamento falhou.", "e D: Afirmações incorretas sobre a fisiologia da PCR.", "Alternativa D incorreta."]},
{id:419,tema:"Complicações",subtema:"Osteomielite",dificuldade:"avançado",enunciado:"Ao avaliar uma radiografia de uma pseudoartrose, o médico observa que as extremidades ósseas estão afinadas, em \"ponta de lápis\", sem nenhum sinal de formação de calo. Qual a conduta diagnóstica complementar mais importante?",alternativas:["A) Apenas observar por mais 3 meses", "B) Avaliar fatores biológicos do paciente (nutrição, tabagismo, vascularização)", "C) Realizar nova imobilização com gesso", "D) Solicitar uma biópsia nervosa"],correta:1,justificativas:["e C: A atrófica não curará sem intervenção (geralmente enxerto ósseo), pois a biologia cessou.", "✔ A pseudoartrose atrófica (\"ponta de lápis\") indica falha biológica. É essencial investigar por que o osso não está reagindo (isquemia, tabaco, desnutrição).", "Alternativa C incorreta.", "Não há indicação de biópsia nervosa para falha de união óssea."]},
{id:420,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Ao avaliar uma radiografia de uma pseudoartrose, o médico observa que as extremidades ósseas estão afinadas, em \"ponta de lápis\", sem nenhum sinal de formação de calo. Qual a conduta diagnóstica complementar mais importante?",alternativas:["A) Apenas observar por mais 3 meses", "B) Avaliar fatores biológicos do paciente (nutrição, tabagismo, vascularização)", "C) Realizar nova imobilização com gesso", "D) Solicitar uma biópsia nervosa"],correta:1,justificativas:["e C: A atrófica não curará sem intervenção (geralmente enxerto ósseo), pois a biologia cessou.", "✔ A pseudoartrose atrófica (\"ponta de lápis\") indica falha biológica. É essencial investigar por que o osso não está reagindo (isquemia, tabaco, desnutrição).", "Alternativa C incorreta.", "Não há indicação de biópsia nervosa para falha de união óssea."]},
{id:421,tema:"Complicações",subtema:"Osteomielite",dificuldade:"avançado",enunciado:"Na artrite séptica do quadril infantil, a ultrassonografia é um exame de triagem valioso porque:",alternativas:["A) Identifica exatamente qual bactéria está causando a infecção", "B) É capaz de detectar precocemente o derrame articular (distensão da cápsula), mesmo com radiografias normais", "C) Substitui a necessidade de punção articular", "D) Visualiza o sequestro ósseo dentro da articulação"],correta:1,justificativas:["Somente a cultura do líquido identifica a bactéria.", "✔ A USG é altamente sensível para detectar líquido (derrame) no quadril, o que ajuda a decidir pela punção diagnóstica.", "A USG indica o derrame, mas a punção ainda é necessária para análise.", "Sequestros são raros em fases agudas e melhor vistos por TC/RaioX."]},
{id:422,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Na artrite séptica do quadril infantil, a ultrassonografia é um exame de triagem valioso porque:",alternativas:["A) Identifica exatamente qual bactéria está causando a infecção", "B) É capaz de detectar precocemente o derrame articular (distensão da cápsula), mesmo com radiografias normais", "C) Substitui a necessidade de punção articular", "D) Visualiza o sequestro ósseo dentro da articulação"],correta:1,justificativas:["Somente a cultura do líquido identifica a bactéria.", "✔ A USG é altamente sensível para detectar líquido (derrame) no quadril, o que ajuda a decidir pela punção diagnóstica.", "A USG indica o derrame, mas a punção ainda é necessária para análise.", "Sequestros são raros em fases agudas e melhor vistos por TC/RaioX."]},
{id:423,tema:"Complicações",subtema:"Osteomielite",dificuldade:"avançado",enunciado:"Um paciente apresenta dor lombar crônica e febre baixa. A RM mostra destruição do disco intervertebral e dos platôs vertebrais adjacentes. Este padrão de imagem é típico de:",alternativas:["A) Tumor vertebral metastático", "B) Hérnia de disco aguda", "C) Espondilodiscite infecciosa (Osteomielite vertebral)", "D) Fratura por insuficiência (Osteoporose)"],correta:2,justificativas:["Tumores raramente atravessam o disco; eles preferem o corpo vertebral e pedículos.", "Hérnias não causam destruição óssea dos platôs ou febre.", "✔ Diferente dos tumores (que costumam poupar o disco), a infecção (osteomielite vertebral) frequentemente atravessa e destrói o disco intervertebral.", "Fraturas por osteoporose não apresentam destruição discal infecciosa."]},
{id:424,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Um paciente apresenta dor lombar crônica e febre baixa. A RM mostra destruição do disco intervertebral e dos platôs vertebrais adjacentes. Este padrão de imagem é típico de:",alternativas:["A) Tumor vertebral metastático", "B) Hérnia de disco aguda", "C) Espondilodiscite infecciosa (Osteomielite vertebral)", "D) Fratura por insuficiência (Osteoporose)"],correta:2,justificativas:["Tumores raramente atravessam o disco; eles preferem o corpo vertebral e pedículos.", "Hérnias não causam destruição óssea dos platôs ou febre.", "✔ Diferente dos tumores (que costumam poupar o disco), a infecção (osteomielite vertebral) frequentemente atravessa e destrói o disco intervertebral.", "Fraturas por osteoporose não apresentam destruição discal infecciosa."]},
{id:425,tema:"Complicações",subtema:"Osteomielite",dificuldade:"avançado",enunciado:"O \"Sinal de Volkmann\" (dedos em flexão que se estendem quando o pulso é fletido) é um achado de exame físico que indica:",alternativas:["A) Síndrome compartimental aguda em fase inicial", "B) Encurtamento isquêmico dos flexores do antebraço (sequela de síndrome compartimental)", "C) Ruptura aguda do tendão flexor", "D) Lesão do nervo radial"],correta:1,justificativas:["Na fase aguda, há dor ao estiramento, mas a contratura fixa ainda não ocorreu.", "✔ É um sinal de contratura fibrótica. Ao fletir o pulso, \"sobra\" comprimento para os tendões flexores encurtados, permitindo que os dedos estendam.", "Na ruptura, o dedo permaneceria em extensão e não fletiria.", "A lesão do radial causa \"mão caída\", afetando os extensores."]},
{id:426,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"O \"Sinal de Volkmann\" (dedos em flexão que se estendem quando o pulso é fletido) é um achado de exame físico que indica:",alternativas:["A) Síndrome compartimental aguda em fase inicial", "B) Encurtamento isquêmico dos flexores do antebraço (sequela de síndrome compartimental)", "C) Ruptura aguda do tendão flexor", "D) Lesão do nervo radial"],correta:1,justificativas:["Na fase aguda, há dor ao estiramento, mas a contratura fixa ainda não ocorreu.", "✔ É um sinal de contratura fibrótica. Ao fletir o pulso, \"sobra\" comprimento para os tendões flexores encurtados, permitindo que os dedos estendam.", "Na ruptura, o dedo permaneceria em extensão e não fletiria.", "A lesão do radial causa \"mão caída\", afetando os extensores."]},
{id:427,tema:"Complicações",subtema:"Osteomielite",dificuldade:"avançado",enunciado:"Qual a principal característica que diferencia uma pseudoartrose \"Oligotrófica\" na radiografia?",alternativas:["A) Grande calo ósseo deformado", "B) Ausência de calo, mas com as extremidades ósseas sem esclerose (vivas)", "C) Presença de pus saindo pela pele", "D) O osso está completamente reabsorvido (falha óssea)"],correta:1,justificativas:["Isso é hipertrófica.", "✔ A oligotrófica é o meiotermo. Há biologia (sangue), mas não houve estímulo para o calo. As pontas não estão mortas (como na atrófica), mas estão \"preguiçosas\".", "Isso é pseudoartrose infectada.", "Isso é pseudoartrose por defeito ósseo."]},
{id:428,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Qual a principal característica que diferencia uma pseudoartrose \"Oligotrófica\" na radiografia?",alternativas:["A) Grande calo ósseo deformado", "B) Ausência de calo, mas com as extremidades ósseas sem esclerose (vivas)", "C) Presença de pus saindo pela pele", "D) O osso está completamente reabsorvido (falha óssea)"],correta:1,justificativas:["Isso é hipertrófica.", "✔ A oligotrófica é o meiotermo. Há biologia (sangue), mas não houve estímulo para o calo. As pontas não estão mortas (como na atrófica), mas estão \"preguiçosas\".", "Isso é pseudoartrose infectada.", "Isso é pseudoartrose por defeito ósseo."]},
{id:429,tema:"Complicações",subtema:"Osteomielite",dificuldade:"avançado",enunciado:"Na avaliação de uma criança com suspeita de Osteomielite Aguda, o exame de Ressonância Magnética com contraste (gadolínio) é superior à Tomografia para:",alternativas:["A) Ver a anatomia do traço de fratura", "B) Identificar abscessos subperiosteais e edema medular precocemente", "C) Avaliar o tempo de consolidação óssea", "D) Medir a densidade mineral óssea"],correta:1,justificativas:["e C: A Tomografia ou RaioX são melhores para detalhe cortical e fraturas.", "✔ A RM é extremamente sensível para detectar o conteúdo de água (edema) e coleções de pus (abscessos) antes que qualquer destruição óssea ocorra.", "Alternativa C incorreta.", "Isso é feito pela Densitometria Óssea."]},
{id:430,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Na avaliação de uma criança com suspeita de Osteomielite Aguda, o exame de Ressonância Magnética com contraste (gadolínio) é superior à Tomografia para:",alternativas:["A) Ver a anatomia do traço de fratura", "B) Identificar abscessos subperiosteais e edema medular precocemente", "C) Avaliar o tempo de consolidação óssea", "D) Medir a densidade mineral óssea"],correta:1,justificativas:["e C: A Tomografia ou RaioX são melhores para detalhe cortical e fraturas.", "✔ A RM é extremamente sensível para detectar o conteúdo de água (edema) e coleções de pus (abscessos) antes que qualquer destruição óssea ocorra.", "Alternativa C incorreta.", "Isso é feito pela Densitometria Óssea."]},
{id:431,tema:"Complicações",subtema:"Osteomielite",dificuldade:"avançado",enunciado:"Um marcador bioquímico que pode estar elevado na Síndrome de Esmagamento (Crush Syndrome) associada à Síndrome Compartimental grave é:",alternativas:["A) Creatinofosfoquinase (CPK)", "B) Amilase", "C) Fosfatase alcalina", "D) Troponina I"],correta:0,justificativas:["✔ A lesão muscular maciça (rabdomiólise) libera CPK na corrente sanguínea, o que pode levar à insuficiência renal aguda.", "Relacionada ao pâncreas.", "Relacionada a turnover ósseo ou fígado.", "Marcador de lesão do miocárdio (coração)."]},
{id:432,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"Um marcador bioquímico que pode estar elevado na Síndrome de Esmagamento (Crush Syndrome) associada à Síndrome Compartimental grave é:",alternativas:["A) Creatinofosfoquinase (CPK)", "B) Amilase", "C) Fosfatase alcalina", "D) Troponina I"],correta:0,justificativas:["✔ A lesão muscular maciça (rabdomiólise) libera CPK na corrente sanguínea, o que pode levar à insuficiência renal aguda.", "Relacionada ao pâncreas.", "Relacionada a turnover ósseo ou fígado.", "Marcador de lesão do miocárdio (coração)."]},
{id:433,tema:"Complicações",subtema:"Osteomielite",dificuldade:"avançado",enunciado:"O que se espera encontrar na gasometria ou bioquímica sanguínea de um membro com Síndrome Compartimental avançada?",alternativas:["A) Alcalose metabólica", "B) Acidose metabólica e hipercalemia (aumento de potássio)", "C) Hipocalemia grave", "D) Diminuição da ureia e creatinina"],correta:1,justificativas:["Alternativa A incorreta.", "✔ A morte muscular libera ácido lático (acidose) e potássio intracelular (hipercalemia) na circulação sistêmica.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:434,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"O que se espera encontrar na gasometria ou bioquímica sanguínea de um membro com Síndrome Compartimental avançada?",alternativas:["A) Alcalose metabólica", "B) Acidose metabólica e hipercalemia (aumento de potássio)", "C) Hipocalemia grave", "D) Diminuição da ureia e creatinina"],correta:1,justificativas:["Alternativa A incorreta.", "✔ A morte muscular libera ácido lático (acidose) e potássio intracelular (hipercalemia) na circulação sistêmica.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:435,tema:"Complicações",subtema:"Osteomielite",dificuldade:"avançado",enunciado:"No diagnóstico diferencial da Artrite Séptica em crianças, a Sinovite Transitória do Quadril caracteriza-se por:",alternativas:["A) Febre alta e leucocitose importante", "B) Melhora rápida dos sintomas com repouso e AINES, com exames laboratoriais normais ou pouco alterados", "C) Necessidade de cirurgia imediata", "D) Presença de bactérias Gram positivas no líquido sinovial"],correta:1,justificativas:["e D: São características da artrite séptica.", "✔ A sinovite transitória é benigna, inflamatória (frequentemente pósviral) e não apresenta os critérios de gravidade (Kocher) da pioartrite.", "O tratamento da sinovite transitória é conservador.", "Alternativa D incorreta."]},
{id:436,tema:"Complicações",subtema:"Osteomielite",dificuldade:"intermediário",enunciado:"No diagnóstico diferencial da Artrite Séptica em crianças, a Sinovite Transitória do Quadril caracteriza-se por:",alternativas:["A) Febre alta e leucocitose importante", "B) Melhora rápida dos sintomas com repouso e AINES, com exames laboratoriais normais ou pouco alterados", "C) Necessidade de cirurgia imediata", "D) Presença de bactérias Gram positivas no líquido sinovial"],correta:1,justificativas:["e D: São características da artrite séptica.", "✔ A sinovite transitória é benigna, inflamatória (frequentemente pósviral) e não apresenta os critérios de gravidade (Kocher) da pioartrite.", "O tratamento da sinovite transitória é conservador.", "Alternativa D incorreta."]},
{id:437,tema:"Complicações",subtema:"Pioartrite",dificuldade:"avançado",enunciado:"Qual o papel da Cintilografia Óssea de 3 fases no diagnóstico da Osteomielite?",alternativas:["A) Ela é altamente específica, nunca dando falso-positivos", "B) Ela mostra aumento de captação nas três fases (fluxo, equilíbrio e tardia) no local da infecção, indicando hiperemia e turnover ósseo", "C) Serve apenas para medir o tamanho do osso", "D) Não deve ser usada em crianças"],correta:1,justificativas:["Ela tem baixa especificidade (muitos falsos positivos).", "✔ A \"hipercaptação\" nas três fases sugere um processo inflamatório/infeccioso ativo. É muito sensível, embora pouco específica (pode captar em fraturas ou tumores também).", "e D: Afirmações incorretas.", "Alternativa D incorreta."]},
{id:438,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"Qual o papel da Cintilografia Óssea de 3 fases no diagnóstico da Osteomielite?",alternativas:["A) Ela é altamente específica, nunca dando falso-positivos", "B) Ela mostra aumento de captação nas três fases (fluxo, equilíbrio e tardia) no local da infecção, indicando hiperemia e turnover ósseo", "C) Serve apenas para medir o tamanho do osso", "D) Não deve ser usada em crianças"],correta:1,justificativas:["Ela tem baixa especificidade (muitos falsos positivos).", "✔ A \"hipercaptação\" nas três fases sugere um processo inflamatório/infeccioso ativo. É muito sensível, embora pouco específica (pode captar em fraturas ou tumores também).", "e D: Afirmações incorretas.", "Alternativa D incorreta."]},
{id:439,tema:"Complicações",subtema:"Pioartrite",dificuldade:"avançado",enunciado:"Ao suspeitar de uma pseudoartrose infectada em um paciente com placa e parafusos, qual o sinal clínico mais indicativo de infecção crônica persistente?",alternativas:["A) Dor apenas durante o exercício", "B) Presença de fístula com drenagem persistente de secreção", "C) Febre de $40^{circ}C$ todos os dias", "D) Perda de apetite"],correta:1,justificativas:["Dor à carga é comum em qualquer pseudoartrose (mesmo as não infectadas).", "✔ A fístula (um trajeto que comunica o osso infectado com o meio externo) é o sinal patognomônico de osteomielite crônica ou pseudoartrose infectada.", "Na fase crônica, a febre costuma ser baixa ou ausente; febre alta é típica da fase aguda.", "Sinal sistêmico muito inespecífico."]},
{id:440,tema:"Complicações",subtema:"Pioartrite",dificuldade:"intermediário",enunciado:"Ao suspeitar de uma pseudoartrose infectada em um paciente com placa e parafusos, qual o sinal clínico mais indicativo de infecção crônica persistente?",alternativas:["A) Dor apenas durante o exercício", "B) Presença de fístula com drenagem persistente de secreção", "C) Febre de $40^{circ}C$ todos os dias", "D) Perda de apetite"],correta:1,justificativas:["Dor à carga é comum em qualquer pseudoartrose (mesmo as não infectadas).", "✔ A fístula (um trajeto que comunica o osso infectado com o meio externo) é o sinal patognomônico de osteomielite crônica ou pseudoartrose infectada.", "Na fase crônica, a febre costuma ser baixa ou ausente; febre alta é típica da fase aguda.", "Sinal sistêmico muito inespecífico."]},
{id:441,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Qual o evento biológico inicial que ocorre imediatamente após a ruptura da integridade óssea e dos vasos sanguíneos periosteais e endosteais em uma fratura?",alternativas:["A) Formação do calo ósseo primário", "B) Reabsorção osteoclástica das bordas da fratura", "C) Formação do hematoma fraturário", "D) Remodelação lamelar cortical"],correta:2,justificativas:["O calo ósseo só se forma após as fases inflamatória e de granulação.", "A reabsorção pelas bordas (osteoclastia) ocorre na fase de limpeza, após a formação do hematoma.", "✔ A formação do hematoma é o primeiro estágio da consolidação. A ruptura de vasos no osso e tecidos moles gera um acúmulo de sangue que serve como matriz para células inflamatórias e fatores de crescimento.", "A remodelação é a última etapa do processo, ocorrendo meses ou anos depois."]},
{id:442,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Qual o evento biológico inicial que ocorre imediatamente após a ruptura da integridade óssea e dos vasos sanguíneos periosteais e endosteais em uma fratura?",alternativas:["A) Formação do calo ósseo primário", "B) Reabsorção osteoclástica das bordas da fratura", "C) Formação do hematoma fraturário", "D) Remodelação lamelar cortical"],correta:2,justificativas:["O calo ósseo só se forma após as fases inflamatória e de granulação.", "A reabsorção pelas bordas (osteoclastia) ocorre na fase de limpeza, após a formação do hematoma.", "✔ A formação do hematoma é o primeiro estágio da consolidação. A ruptura de vasos no osso e tecidos moles gera um acúmulo de sangue que serve como matriz para células inflamatórias e fatores de crescimento.", "A remodelação é a última etapa do processo, ocorrendo meses ou anos depois."]},
{id:443,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Uma fratura que ocorre em um osso previamente fragilizado por uma condição metabólica, tumoral ou infecciosa, mesmo sob trauma de baixa energia, é denominada:",alternativas:["A) Fratura traumática", "B) Fratura patológica", "C) Fratura por estresse", "D) Fratura incompleta"],correta:1,justificativas:["Fraturas traumáticas ocorrem em ossos sadios submetidos a cargas excessivas.", "✔ Definese fratura patológica aquela que ocorre em osso com integridade estrutural prévia comprometida por doenças (como osteoporose grave, tumores ou infecções).", "Fratura por estresse decorre de microtraumas repetitivos, não necessariamente em osso doente.", "Fratura incompleta referese ao traço que não atravessa toda a largura do osso."]},
{id:444,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Uma fratura que ocorre em um osso previamente fragilizado por uma condição metabólica, tumoral ou infecciosa, mesmo sob trauma de baixa energia, é denominada:",alternativas:["A) Fratura traumática", "B) Fratura patológica", "C) Fratura por estresse", "D) Fratura incompleta"],correta:1,justificativas:["Fraturas traumáticas ocorrem em ossos sadios submetidos a cargas excessivas.", "✔ Definese fratura patológica aquela que ocorre em osso com integridade estrutural prévia comprometida por doenças (como osteoporose grave, tumores ou infecções).", "Fratura por estresse decorre de microtraumas repetitivos, não necessariamente em osso doente.", "Fratura incompleta referese ao traço que não atravessa toda a largura do osso."]},
{id:445,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Qual membrana vascularizada recobre a superfície externa do osso e desempenha papel crucial na consolidação de fraturas, especialmente em crianças, por ser mais espessa e ativa?",alternativas:["A) Endósteo", "B) Periósteo", "C) Cartilagem articular", "D) Membrana sinovial"],correta:1,justificativas:["O endósteo reveste a cavidade medular interna.", "✔ O periósteo é a membrana externa rica em células osteoprogenitoras e vasos. Em crianças, ele é mais espesso e resistente, facilitando a rápida consolidação e a remodelação.", "A cartilagem articular recobre as extremidades ósseas nas juntas e não tem função primária na formação do calo diafisário.", "A sinovial reveste a cápsula articular e produz líquido sinovial."]},
{id:446,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Qual membrana vascularizada recobre a superfície externa do osso e desempenha papel crucial na consolidação de fraturas, especialmente em crianças, por ser mais espessa e ativa?",alternativas:["A) Endósteo", "B) Periósteo", "C) Cartilagem articular", "D) Membrana sinovial"],correta:1,justificativas:["O endósteo reveste a cavidade medular interna.", "✔ O periósteo é a membrana externa rica em células osteoprogenitoras e vasos. Em crianças, ele é mais espesso e resistente, facilitando a rápida consolidação e a remodelação.", "A cartilagem articular recobre as extremidades ósseas nas juntas e não tem função primária na formação do calo diafisário.", "A sinovial reveste a cápsula articular e produz líquido sinovial."]},
{id:447,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Termo utilizado para descrever a falha definitiva da consolidação óssea após o período esperado de cicatrização, com a formação de uma \"falsa articulação\" no foco da fratura:",alternativas:["A) Consolidação viciosa", "B) Retardo de consolidação", "C) Pseudoartrose", "D) Osteomielite"],correta:2,justificativas:["Consolidação viciosa ocorre quando o osso \"cola\", mas em posição anatômica incorreta.", "No retardo, o osso ainda está no processo de cura, mas de forma mais lenta que o normal.", "✔ A pseudoartrose é a interrupção definitiva do processo de cura, onde o organismo cria um tecido fibroso/fibrocartilaginoso e mobilidade anormal no local.", "Osteomielite referese à infecção do osso."]},
{id:448,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Termo utilizado para descrever a falha definitiva da consolidação óssea após o período esperado de cicatrização, com a formação de uma \"falsa articulação\" no foco da fratura:",alternativas:["A) Consolidação viciosa", "B) Retardo de consolidação", "C) Pseudoartrose", "D) Osteomielite"],correta:2,justificativas:["Consolidação viciosa ocorre quando o osso \"cola\", mas em posição anatômica incorreta.", "No retardo, o osso ainda está no processo de cura, mas de forma mais lenta que o normal.", "✔ A pseudoartrose é a interrupção definitiva do processo de cura, onde o organismo cria um tecido fibroso/fibrocartilaginoso e mobilidade anormal no local.", "Osteomielite referese à infecção do osso."]},
{id:449,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"O mecanismo de trauma indireto por torção (rotacional) geralmente resulta em qual padrão de traço de fratura?",alternativas:["A) Traço transverso", "B) Traço em cunha", "C) Traço espiral", "D) Traço por compressão axial"],correta:2,justificativas:["Traços transversos costumam resultar de trauma direto de baixa energia.", "Traços em cunha (ou asa de borboleta) resultam de forças de encurvamento (flexão).", "✔ O traço espiral (ou helicoidal) é característico de forças rotacionais aplicadas ao longo do eixo do osso.", "Compressão axial gera fraturas de impacto ou explosão."]},
{id:450,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"O mecanismo de trauma indireto por torção (rotacional) geralmente resulta em qual padrão de traço de fratura?",alternativas:["A) Traço transverso", "B) Traço em cunha", "C) Traço espiral", "D) Traço por compressão axial"],correta:2,justificativas:["Traços transversos costumam resultar de trauma direto de baixa energia.", "Traços em cunha (ou asa de borboleta) resultam de forças de encurvamento (flexão).", "✔ O traço espiral (ou helicoidal) é característico de forças rotacionais aplicadas ao longo do eixo do osso.", "Compressão axial gera fraturas de impacto ou explosão."]},
{id:451,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Na terminologia ortopédica, como se classifica uma fratura onde existe comunicação direta entre o foco da quebra óssea e o meio ambiente através de uma lesão de partes moles?",alternativas:["A) Fratura simples", "B) Fratura fechada", "C) Fratura exposta", "D) Fratura cominutiva"],correta:2,justificativas:["Fratura simples referese ao número de fragmentos (apenas dois).", "Fratura fechada é aquela onde a pele permanece íntegra.", "✔ Por definição, fratura exposta ocorre quando há quebra da continuidade da pele e tecidos moles, expondo o foco da fratura ao meio externo.", "Cominutiva referese à fragmentação múltipla do osso."]},
{id:452,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Na terminologia ortopédica, como se classifica uma fratura onde existe comunicação direta entre o foco da quebra óssea e o meio ambiente através de uma lesão de partes moles?",alternativas:["A) Fratura simples", "B) Fratura fechada", "C) Fratura exposta", "D) Fratura cominutiva"],correta:2,justificativas:["Fratura simples referese ao número de fragmentos (apenas dois).", "Fratura fechada é aquela onde a pele permanece íntegra.", "✔ Por definição, fratura exposta ocorre quando há quebra da continuidade da pele e tecidos moles, expondo o foco da fratura ao meio externo.", "Cominutiva referese à fragmentação múltipla do osso."]},
{id:453,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"No processo de consolidação indireta, o \"calo mole\" é constituído predominantemente por:",alternativas:["A) Osso cortical maduro", "B) Cartilagem e tecido fibroso", "C) Hematoma fresco", "D) Cristais de hidroxiapatita densos"],correta:1,justificativas:["O osso cortical maduro só aparece na fase final de remodelação.", "✔ O calo mole (estágio inicial) é formado por tecido fibroso e fibrocartilagem, que posteriormente será mineralizado para se tornar calo duro.", "O hematoma é a fase que antecede o calo mole.", "A deposição densa de minerais caracteriza o calo duro e o osso maduro."]},
{id:454,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"No processo de consolidação indireta, o \"calo mole\" é constituído predominantemente por:",alternativas:["A) Osso cortical maduro", "B) Cartilagem e tecido fibroso", "C) Hematoma fresco", "D) Cristais de hidroxiapatita densos"],correta:1,justificativas:["O osso cortical maduro só aparece na fase final de remodelação.", "✔ O calo mole (estágio inicial) é formado por tecido fibroso e fibrocartilagem, que posteriormente será mineralizado para se tornar calo duro.", "O hematoma é a fase que antecede o calo mole.", "A deposição densa de minerais caracteriza o calo duro e o osso maduro."]},
{id:455,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Qual região do osso longo é responsável pelo crescimento longitudinal em crianças e é alvo de classificações específicas devido ao risco de sequelas no desenvolvimento?",alternativas:["A) Diáfise", "B) Metáfise", "C) Placa de crescimento (fise)", "D) Epífise"],correta:2,justificativas:["A diáfise é o \"corpo\" ou meio do osso.", "A metáfise é a zona de transição entre o corpo e a extremidade.", "✔ A fise (ou placa epifisária) é o tecido cartilaginoso responsável pelo crescimento em comprimento. Lesões nela podem causar encurtamentos ou deformidades.", "A epífise é a extremidade articular do osso."]},
{id:456,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Qual região do osso longo é responsável pelo crescimento longitudinal em crianças e é alvo de classificações específicas devido ao risco de sequelas no desenvolvimento?",alternativas:["A) Diáfise", "B) Metáfise", "C) Placa de crescimento (fise)", "D) Epífise"],correta:2,justificativas:["A diáfise é o \"corpo\" ou meio do osso.", "A metáfise é a zona de transição entre o corpo e a extremidade.", "✔ A fise (ou placa epifisária) é o tecido cartilaginoso responsável pelo crescimento em comprimento. Lesões nela podem causar encurtamentos ou deformidades.", "A epífise é a extremidade articular do osso."]},
{id:457,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"O sinal clínico precoce mais importante para suspeita de Síndrome Compartimental aguda após uma fratura de perna é:",alternativas:["A) Ausência de pulsos distais", "B) Palidez excessiva do membro", "C) Dor intensa e desproporcional ao trauma", "D) Paralisia completa dos dedos"],correta:2,justificativas:["A ausência de pulso é um sinal muito tardio e raro, pois a pressão compartimental raramente supera a pressão sistólica arterial.", "Palidez é um sinal de isquemia avançada, não sendo o mais precoce.", "✔ A dor desproporcional e a dor ao estiramento passivo da musculatura são os sinais mais precoces e sensíveis da síndrome compartimental.", "Paralisia indica dano nervoso e muscular irreversível (tardio)."]},
{id:458,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"O sinal clínico precoce mais importante para suspeita de Síndrome Compartimental aguda após uma fratura de perna é:",alternativas:["A) Ausência de pulsos distais", "B) Palidez excessiva do membro", "C) Dor intensa e desproporcional ao trauma", "D) Paralisia completa dos dedos"],correta:2,justificativas:["A ausência de pulso é um sinal muito tardio e raro, pois a pressão compartimental raramente supera a pressão sistólica arterial.", "Palidez é um sinal de isquemia avançada, não sendo o mais precoce.", "✔ A dor desproporcional e a dor ao estiramento passivo da musculatura são os sinais mais precoces e sensíveis da síndrome compartimental.", "Paralisia indica dano nervoso e muscular irreversível (tardio)."]},
{id:459,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Qual exame de imagem é considerado o padrão-ouro inicial para a confirmação diagnóstica da maioria das fraturas na prática clínica?",alternativas:["A) Ressonância Magnética (RM)", "B) Tomografia Computadorizada (T", "C) ", "C) Radiografia Simples (RX)"],correta:2,justificativas:["A RM é excelente para partes moles ou fraturas ocultas, mas não é o exame inicial de rotina.", "A TC é usada para detalhes anatômicos em fraturas complexas ou articulares.", "✔ O RX simples em pelo menos duas incidências (frente e perfil) é o exame inicial e principal para diagnóstico de fraturas devido ao baixo custo e disponibilidade.", "A USG tem papel muito limitado na visualização de fraturas ósseas em adultos. ### Fraturas em Crianças"]},
{id:460,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Qual exame de imagem é considerado o padrão-ouro inicial para a confirmação diagnóstica da maioria das fraturas na prática clínica?",alternativas:["A) Ressonância Magnética (RM)", "B) Tomografia Computadorizada (T", "C) ", "C) Radiografia Simples (RX)"],correta:2,justificativas:["A RM é excelente para partes moles ou fraturas ocultas, mas não é o exame inicial de rotina.", "A TC é usada para detalhes anatômicos em fraturas complexas ou articulares.", "✔ O RX simples em pelo menos duas incidências (frente e perfil) é o exame inicial e principal para diagnóstico de fraturas devido ao baixo custo e disponibilidade.", "A USG tem papel muito limitado na visualização de fraturas ósseas em adultos. ### Fraturas em Crianças"]},
{id:461,tema:"Fraturas",subtema:"Fraturas em Crianças",dificuldade:"iniciante",enunciado:"O osso da criança é mais poroso e menos mineralizado que o do adulto, o que permite que ele sofra deformação sem quebrar completamente as duas corticais. Como se chama a fratura incompleta onde ocorre uma falha na cortical do lado convexo, enquanto o lado côncavo permanece íntegro?",alternativas:["A) Fratura em Galho Verde", "B) Fratura em Torus (Encavalgamento)", "C) Fratura Cominutiva", "D) Fratura de Stress"],correta:0,justificativas:["✔ A fratura em \"galho verde\" (greenstick) é típica da infância. Devido à elasticidade do osso, ele quebra de um lado e \"dobra\" do outro, de forma análoga a um galho de árvore jovem e úmido.", "Na fratura em Torus ou \"em bambu\", ocorre um encavalgamento da cortical por compressão, sem ruptura visível do lado convexo.", "Cominutiva é uma fratura com múltiplos fragmentos, comum em traumas de alta energia em adultos.", "Fratura de stress ocorre por microtraumas repetitivos, não sendo definida pela elasticidade óssea."]},
{id:462,tema:"Fraturas",subtema:"Fraturas em Crianças",dificuldade:"intermediário",enunciado:"O osso da criança é mais poroso e menos mineralizado que o do adulto, o que permite que ele sofra deformação sem quebrar completamente as duas corticais. Como se chama a fratura incompleta onde ocorre uma falha na cortical do lado convexo, enquanto o lado côncavo permanece íntegro?",alternativas:["A) Fratura em Galho Verde", "B) Fratura em Torus (Encavalgamento)", "C) Fratura Cominutiva", "D) Fratura de Stress"],correta:0,justificativas:["✔ A fratura em \"galho verde\" (greenstick) é típica da infância. Devido à elasticidade do osso, ele quebra de um lado e \"dobra\" do outro, de forma análoga a um galho de árvore jovem e úmido.", "Na fratura em Torus ou \"em bambu\", ocorre um encavalgamento da cortical por compressão, sem ruptura visível do lado convexo.", "Cominutiva é uma fratura com múltiplos fragmentos, comum em traumas de alta energia em adultos.", "Fratura de stress ocorre por microtraumas repetitivos, não sendo definida pela elasticidade óssea."]},
{id:463,tema:"Fraturas",subtema:"Fraturas em Crianças",dificuldade:"iniciante",enunciado:"Em relação ao periósteo da criança, qual das alternativas abaixo descreve corretamente uma de suas características fundamentais?",alternativas:["A) É mais fino e menos vascularizado que o do adulto", "B) É espesso, resistente e possui alto potencial osteogênico", "C) Não participa do processo de consolidação óssea na infância", "D) É facilmente rompido em qualquer trauma, não ajudando na estabilidade"],correta:1,justificativas:["É exatamente o oposto; o periósteo do adulto é que é mais fino e menos ativo.", "✔ O periósteo infantil é uma membrana robusta e muito ativa. Ele ajuda a limitar o desvio das fraturas e acelera a formação do calo ósseo (osteogênese).", "Ele é o principal protagonista da consolidação rápida nas crianças.", "Por ser resistente, ele frequentemente permanece íntegro de um lado da fratura, auxiliando na redução e estabilidade."]},
{id:464,tema:"Fraturas",subtema:"Fraturas em Crianças",dificuldade:"intermediário",enunciado:"Em relação ao periósteo da criança, qual das alternativas abaixo descreve corretamente uma de suas características fundamentais?",alternativas:["A) É mais fino e menos vascularizado que o do adulto", "B) É espesso, resistente e possui alto potencial osteogênico", "C) Não participa do processo de consolidação óssea na infância", "D) É facilmente rompido em qualquer trauma, não ajudando na estabilidade"],correta:1,justificativas:["É exatamente o oposto; o periósteo do adulto é que é mais fino e menos ativo.", "✔ O periósteo infantil é uma membrana robusta e muito ativa. Ele ajuda a limitar o desvio das fraturas e acelera a formação do calo ósseo (osteogênese).", "Ele é o principal protagonista da consolidação rápida nas crianças.", "Por ser resistente, ele frequentemente permanece íntegro de um lado da fratura, auxiliando na redução e estabilidade."]},
{id:465,tema:"Fraturas",subtema:"Fraturas em Crianças",dificuldade:"iniciante",enunciado:"Como é denominada a região do osso longo situada entre a epífise e a metáfise, composta por cartilagem, responsável pelo crescimento longitudinal do esqueleto pediátrico?",alternativas:["A) Diáfise", "B) Medular", "C) Placa Epifisária (ou Fise)", "D) Pericôndrio"],correta:2,justificativas:["A diáfise é o meio do osso (corpo), longe das zonas de crescimento das extremidades.", "Medular é o canal interno onde fica a medula óssea.", "✔ A fise ou placa de crescimento é a estrutura cartilaginosa onde ocorre a proliferação celular e mineralização que resulta no crescimento em altura da criança.", "Pericôndrio é a membrana que envolve a cartilagem, não a zona de crescimento em si."]},
{id:466,tema:"Fraturas",subtema:"Fraturas em Crianças",dificuldade:"intermediário",enunciado:"Como é denominada a região do osso longo situada entre a epífise e a metáfise, composta por cartilagem, responsável pelo crescimento longitudinal do esqueleto pediátrico?",alternativas:["A) Diáfise", "B) Medular", "C) Placa Epifisária (ou Fise)", "D) Pericôndrio"],correta:2,justificativas:["A diáfise é o meio do osso (corpo), longe das zonas de crescimento das extremidades.", "Medular é o canal interno onde fica a medula óssea.", "✔ A fise ou placa de crescimento é a estrutura cartilaginosa onde ocorre a proliferação celular e mineralização que resulta no crescimento em altura da criança.", "Pericôndrio é a membrana que envolve a cartilagem, não a zona de crescimento em si."]},
{id:467,tema:"Fraturas",subtema:"Fraturas em Crianças",dificuldade:"iniciante",enunciado:"Uma criança sofre uma queda e apresenta uma deformação plástica no antebraço, onde o osso está curvado, mas não se observa um traço de fratura evidente ou ruptura das corticais na radiografia. Este fenômeno é conhecido como:",alternativas:["A) Fratura Transversa", "B) Deformação Plástica Traumática", "C) Pseudoartrose Congênita", "D) Luxação Recidivante"],correta:1,justificativas:["A fratura transversa apresenta um traço nítido perpendicular ao eixo do osso.", "✔ A deformação plástica ocorre quando o osso infantil é submetido a uma força que excede sua capacidade elástica, mas não chega a criar um traço de fratura. O osso fica torto sem \"quebrar\".", "Pseudoartrose congênita é uma doença rara de nascimento, não um evento traumático agudo.", "Luxação referese à perda de contato entre superfícies articulares, não à deformação do osso."]},
{id:468,tema:"Fraturas",subtema:"Fraturas em Crianças",dificuldade:"intermediário",enunciado:"Uma criança sofre uma queda e apresenta uma deformação plástica no antebraço, onde o osso está curvado, mas não se observa um traço de fratura evidente ou ruptura das corticais na radiografia. Este fenômeno é conhecido como:",alternativas:["A) Fratura Transversa", "B) Deformação Plástica Traumática", "C) Pseudoartrose Congênita", "D) Luxação Recidivante"],correta:1,justificativas:["A fratura transversa apresenta um traço nítido perpendicular ao eixo do osso.", "✔ A deformação plástica ocorre quando o osso infantil é submetido a uma força que excede sua capacidade elástica, mas não chega a criar um traço de fratura. O osso fica torto sem \"quebrar\".", "Pseudoartrose congênita é uma doença rara de nascimento, não um evento traumático agudo.", "Luxação referese à perda de contato entre superfícies articulares, não à deformação do osso."]},
{id:469,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Qual a principal vantagem biológica da criança no tratamento de fraturas em comparação ao adulto, permitindo que certos desvios angulares sejam aceitos no tratamento conservador?",alternativas:["A) Maior força muscular", "B) Capacidade de Remodelação Óssea", "C) Ausência de dor", "D) Menor vascularização óssea"],correta:1,justificativas:["A força muscular da criança não influencia na correção da fratura.", "✔ A remodelação óssea na criança é extremamente eficiente. O organismo consegue \"corrigir\" deformidades angulares ao longo do tempo conforme o osso cresce.", "Crianças sentem dor tanto quanto adultos.", "As crianças possuem MAIOR vascularização, o que ajuda na cura."]},
{id:470,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Qual a principal vantagem biológica da criança no tratamento de fraturas em comparação ao adulto, permitindo que certos desvios angulares sejam aceitos no tratamento conservador?",alternativas:["A) Maior força muscular", "B) Capacidade de Remodelação Óssea", "C) Ausência de dor", "D) Menor vascularização óssea"],correta:1,justificativas:["A força muscular da criança não influencia na correção da fratura.", "✔ A remodelação óssea na criança é extremamente eficiente. O organismo consegue \"corrigir\" deformidades angulares ao longo do tempo conforme o osso cresce.", "Crianças sentem dor tanto quanto adultos.", "As crianças possuem MAIOR vascularização, o que ajuda na cura."]},
{id:471,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"A fratura em \"Torus\" ou \"Abaulamento\" é comumente vista no rádio distal de crianças. Qual o mecanismo de trauma mais frequente para essa lesão?",alternativas:["A) Tração vigorosa do braço", "B) Torção (mecanismo rotacional)", "C) Compressão axial (queda sobre a mão espalmada)", "D) Trauma direto com objeto cortante"],correta:2,justificativas:["Tração costuma causar luxações (como o \"pronado doloroso\"), não fraturas por compressão.", "Torção causa fraturas espirais.", "✔ A fratura em Torus ocorre por compressão axial. O osso \"encavala\" na zona de transição entre metáfise e diáfise, criando uma saliência ou abaulamento cortical.", "Objetos cortantes causariam fraturas expostas ou lesões de partes moles."]},
{id:472,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"A fratura em \"Torus\" ou \"Abaulamento\" é comumente vista no rádio distal de crianças. Qual o mecanismo de trauma mais frequente para essa lesão?",alternativas:["A) Tração vigorosa do braço", "B) Torção (mecanismo rotacional)", "C) Compressão axial (queda sobre a mão espalmada)", "D) Trauma direto com objeto cortante"],correta:2,justificativas:["Tração costuma causar luxações (como o \"pronado doloroso\"), não fraturas por compressão.", "Torção causa fraturas espirais.", "✔ A fratura em Torus ocorre por compressão axial. O osso \"encavala\" na zona de transição entre metáfise e diáfise, criando uma saliência ou abaulamento cortical.", "Objetos cortantes causariam fraturas expostas ou lesões de partes moles."]},
{id:473,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Quando uma fratura atinge a placa epifisária (fise), existe um risco potencial de qual complicação a longo prazo?",alternativas:["A) Osteoporose precoce", "B) Parada ou distúrbio do crescimento (Barra Óssea)", "C) Aumento excessivo da densidade óssea", "D) Perda completa da sensibilidade no membro"],correta:1,justificativas:["Osteoporose é uma doença metabólica, não relacionada diretamente a traumas na fise.", "✔ Como a fise é responsável pelo crescimento, uma lesão ou \"ponte óssea\" que se forme nela pode impedir o crescimento do osso ou causar deformidades angulares.", "O trauma não aumenta a densidade óssea sistêmica.", "A sensibilidade depende dos nervos periféricos, não da placa de crescimento."]},
{id:474,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Quando uma fratura atinge a placa epifisária (fise), existe um risco potencial de qual complicação a longo prazo?",alternativas:["A) Osteoporose precoce", "B) Parada ou distúrbio do crescimento (Barra Óssea)", "C) Aumento excessivo da densidade óssea", "D) Perda completa da sensibilidade no membro"],correta:1,justificativas:["Osteoporose é uma doença metabólica, não relacionada diretamente a traumas na fise.", "✔ Como a fise é responsável pelo crescimento, uma lesão ou \"ponte óssea\" que se forme nela pode impedir o crescimento do osso ou causar deformidades angulares.", "O trauma não aumenta a densidade óssea sistêmica.", "A sensibilidade depende dos nervos periféricos, não da placa de crescimento."]},
{id:475,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Por que o tempo de imobilização gessada em crianças é geralmente menor do que em adultos para fraturas semelhantes?",alternativas:["A) Porque o gesso infantil é mais leve", "B) Devido à consolidação mais rápida (maior metabolismo e vascularização)", "C) Porque as crianças colaboram mais com o repouso", "D) Porque os ossos das crianças são mais curtos"],correta:1,justificativas:["O peso do gesso não altera o tempo biológico de cura.", "✔ O metabolismo ósseo e a vascularização (especialmente do periósteo) são muito superiores na infância, gerando calo ósseo em muito menos tempo.", "Geralmente, crianças são mais ativas e \"colaboram\" menos com o repouso absoluto.", "O comprimento do osso não dita a velocidade biológica da consolidação."]},
{id:476,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Por que o tempo de imobilização gessada em crianças é geralmente menor do que em adultos para fraturas semelhantes?",alternativas:["A) Porque o gesso infantil é mais leve", "B) Devido à consolidação mais rápida (maior metabolismo e vascularização)", "C) Porque as crianças colaboram mais com o repouso", "D) Porque os ossos das crianças são mais curtos"],correta:1,justificativas:["O peso do gesso não altera o tempo biológico de cura.", "✔ O metabolismo ósseo e a vascularização (especialmente do periósteo) são muito superiores na infância, gerando calo ósseo em muito menos tempo.", "Geralmente, crianças são mais ativas e \"colaboram\" menos com o repouso absoluto.", "O comprimento do osso não dita a velocidade biológica da consolidação."]},
{id:477,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"O fenômeno de \"Overgrowth\" (sobrecrescimento) é observado em algumas fraturas de ossos longos na infância, como no fêmur. O que isso significa na prática?",alternativas:["A) O osso quebrado para de crescer para sempre", "B) O osso quebrado cresce alguns milímetros a mais do que o lado sadio durante a cicatrização", "C) O osso se torna mais largo, mas não mais comprido", "D) A cartilagem articular se transforma em osso precocemente"],correta:1,justificativas:["Isso seria uma parada de crescimento (fise distal/proximal lesada), não overgrowth.", "✔ Devido ao aumento do fluxo sanguíneo local para a cicatrização da fratura, as placas de crescimento próximas são estimuladas, podendo fazer o osso crescer um pouco mais que o normal.", "O fenômeno é longitudinal (comprimento).", "Isso descreve a maturação epifisária normal ou patológica, não o overgrowth."]},
{id:478,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"O fenômeno de \"Overgrowth\" (sobrecrescimento) é observado em algumas fraturas de ossos longos na infância, como no fêmur. O que isso significa na prática?",alternativas:["A) O osso quebrado para de crescer para sempre", "B) O osso quebrado cresce alguns milímetros a mais do que o lado sadio durante a cicatrização", "C) O osso se torna mais largo, mas não mais comprido", "D) A cartilagem articular se transforma em osso precocemente"],correta:1,justificativas:["Isso seria uma parada de crescimento (fise distal/proximal lesada), não overgrowth.", "✔ Devido ao aumento do fluxo sanguíneo local para a cicatrização da fratura, as placas de crescimento próximas são estimuladas, podendo fazer o osso crescer um pouco mais que o normal.", "O fenômeno é longitudinal (comprimento).", "Isso descreve a maturação epifisária normal ou patológica, não o overgrowth."]},
{id:479,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Qual a terminologia correta para a extremidade arredondada dos ossos longos, que nas crianças é em grande parte cartilaginosa e contém os centros de ossificação secundários?",alternativas:["A) Diáfise", "B) Metáfise", "C) Epífise", "D) Istmo"],correta:2,justificativas:["Diáfise é o meio do osso longo.", "Metáfise é a zona entre a diáfise e a placa de crescimento.", "✔ A epífise é a extremidade do osso. Na criança, ela é essencial para a formação da articulação e contém os núcleos que se transformarão em osso com o tempo.", "Istmo é a parte mais estreita do canal medular na diáfise. ### Fraturas em Idosos"]},
{id:480,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Qual a terminologia correta para a extremidade arredondada dos ossos longos, que nas crianças é em grande parte cartilaginosa e contém os centros de ossificação secundários?",alternativas:["A) Diáfise", "B) Metáfise", "C) Epífise", "D) Istmo"],correta:2,justificativas:["Diáfise é o meio do osso longo.", "Metáfise é a zona entre a diáfise e a placa de crescimento.", "✔ A epífise é a extremidade do osso. Na criança, ela é essencial para a formação da articulação e contém os núcleos que se transformarão em osso com o tempo.", "Istmo é a parte mais estreita do canal medular na diáfise. ### Fraturas em Idosos"]},
{id:481,tema:"Fraturas",subtema:"Fraturas em Idosos",dificuldade:"iniciante",enunciado:"A principal causa metabólica que predispõe o idoso a fraturas por baixo impacto, caracterizada pela redução da densidade mineral óssea e deterioração da microarquitetura do tecido, é denominada:",alternativas:["A) Osteoartrose", "B) Osteoporose", "C) Osteomielite", "D) Sarcopenia"],correta:1,justificativas:["Osteoartrose é o desgaste da cartilagem das articulações, não do tecido ósseo interno.", "✔ A osteoporose é a doença sistêmica que torna os ossos porosos e frágeis, sendo o principal fator de risco para fraturas por fragilidade (quedas da própria altura).", "Osteomielite é uma infecção óssea.", "Sarcopenia referese à perda de massa e força muscular, não óssea."]},
{id:482,tema:"Fraturas",subtema:"Fraturas em Idosos",dificuldade:"intermediário",enunciado:"A principal causa metabólica que predispõe o idoso a fraturas por baixo impacto, caracterizada pela redução da densidade mineral óssea e deterioração da microarquitetura do tecido, é denominada:",alternativas:["A) Osteoartrose", "B) Osteoporose", "C) Osteomielite", "D) Sarcopenia"],correta:1,justificativas:["Osteoartrose é o desgaste da cartilagem das articulações, não do tecido ósseo interno.", "✔ A osteoporose é a doença sistêmica que torna os ossos porosos e frágeis, sendo o principal fator de risco para fraturas por fragilidade (quedas da própria altura).", "Osteomielite é uma infecção óssea.", "Sarcopenia referese à perda de massa e força muscular, não óssea."]},
{id:483,tema:"Fraturas",subtema:"Fraturas em Idosos",dificuldade:"iniciante",enunciado:"O termo \"Fratura por Fragilidade\" é utilizado para descrever lesões que ocorrem após traumas que não seriam suficientes para quebrar um osso jovem e saudável. Qual o mecanismo de trauma mais comum nessas situações?",alternativas:["A) Acidentes automobilísticos de alta velocidade", "B) Queda da própria altura", "C) Traumas esportivos de contato", "D) Esforço repetitivo por corridas longas"],correta:1,justificativas:["Estes são traumas de alta energia, que quebram qualquer osso.", "✔ Fraturas por fragilidade são tipicamente causadas por traumas de baixa energia, sendo a queda da própria altura o exemplo clássico no idoso.", "Idosos raramente sofrem fraturas por esportes de alto impacto comparado a quedas domésticas.", "Isso descreve fraturas por estresse, comuns em atletas, não necessariamente ligadas à fragilidade senil."]},
{id:484,tema:"Fraturas",subtema:"Fraturas em Idosos",dificuldade:"intermediário",enunciado:"O termo \"Fratura por Fragilidade\" é utilizado para descrever lesões que ocorrem após traumas que não seriam suficientes para quebrar um osso jovem e saudável. Qual o mecanismo de trauma mais comum nessas situações?",alternativas:["A) Acidentes automobilísticos de alta velocidade", "B) Queda da própria altura", "C) Traumas esportivos de contato", "D) Esforço repetitivo por corridas longas"],correta:1,justificativas:["Estes são traumas de alta energia, que quebram qualquer osso.", "✔ Fraturas por fragilidade são tipicamente causadas por traumas de baixa energia, sendo a queda da própria altura o exemplo clássico no idoso.", "Idosos raramente sofrem fraturas por esportes de alto impacto comparado a quedas domésticas.", "Isso descreve fraturas por estresse, comuns em atletas, não necessariamente ligadas à fragilidade senil."]},
{id:485,tema:"Fraturas",subtema:"Fraturas em Idosos",dificuldade:"iniciante",enunciado:"Além da perda de massa óssea, o envelhecimento causa a perda progressiva de massa, força e desempenho muscular. Qual o nome deste conceito que contribui diretamente para o aumento do risco de quedas?",alternativas:["A) Osteopenia", "B) Sarcopenia", "C) Condromalácia", "D) Anquilose"],correta:1,justificativas:["Osteopenia é um estágio anterior à osteoporose (perda óssea leve).", "✔ A sarcopenia é o declínio da musculatura esquelética. Músculos fracos diminuem o equilíbrio e a proteção das articulações, facilitando quedas.", "Condromalácia é o amolecimento da cartilagem da patela.", "Anquilose é a rigidez ou fusão de uma articulação."]},
{id:486,tema:"Fraturas",subtema:"Fraturas em Idosos",dificuldade:"intermediário",enunciado:"Além da perda de massa óssea, o envelhecimento causa a perda progressiva de massa, força e desempenho muscular. Qual o nome deste conceito que contribui diretamente para o aumento do risco de quedas?",alternativas:["A) Osteopenia", "B) Sarcopenia", "C) Condromalácia", "D) Anquilose"],correta:1,justificativas:["Osteopenia é um estágio anterior à osteoporose (perda óssea leve).", "✔ A sarcopenia é o declínio da musculatura esquelética. Músculos fracos diminuem o equilíbrio e a proteção das articulações, facilitando quedas.", "Condromalácia é o amolecimento da cartilagem da patela.", "Anquilose é a rigidez ou fusão de uma articulação."]},
{id:487,tema:"Fraturas",subtema:"Fraturas em Idosos",dificuldade:"iniciante",enunciado:"Qual das regiões anatômicas abaixo é considerada um dos principais sítios de fratura por fragilidade no idoso, apresentando alta taxa de morbidade e mortalidade?",alternativas:["A) Diáfise do fêmur", "B) Colo do fêmur (quadril)", "C) Ossos do crânio", "D) Falanges dos dedos do pé"],correta:1,justificativas:["A diáfise (meio do osso) exige traumas maiores para quebrar, mesmo no idoso.", "✔ A fratura do colo do fêmur ou da região trocantérica é o \"evento sentinela\" no idoso, com alto impacto na independência e risco de complicações sistêmicas.", "O crânio não é um sítio típico de fratura por fragilidade osteoporótica.", "Embora ocorram, não possuem a relevância clínica ou o risco de mortalidade do quadril."]},
{id:488,tema:"Fraturas",subtema:"Fraturas em Idosos",dificuldade:"intermediário",enunciado:"Qual das regiões anatômicas abaixo é considerada um dos principais sítios de fratura por fragilidade no idoso, apresentando alta taxa de morbidade e mortalidade?",alternativas:["A) Diáfise do fêmur", "B) Colo do fêmur (quadril)", "C) Ossos do crânio", "D) Falanges dos dedos do pé"],correta:1,justificativas:["A diáfise (meio do osso) exige traumas maiores para quebrar, mesmo no idoso.", "✔ A fratura do colo do fêmur ou da região trocantérica é o \"evento sentinela\" no idoso, com alto impacto na independência e risco de complicações sistêmicas.", "O crânio não é um sítio típico de fratura por fragilidade osteoporótica.", "Embora ocorram, não possuem a relevância clínica ou o risco de mortalidade do quadril."]},
{id:489,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Nas mulheres idosas, a queda brusca de qual hormônio após a menopausa acelera significativamente a reabsorção óssea, aumentando o risco de fraturas?",alternativas:["A) Insulina", "B) Estrogênio", "C) Adrenalina", "D) Somatropina (GH)"],correta:1,justificativas:["A insulina regula a glicose e tem papel menor no metabolismo ósseo direto.", "✔ O estrogênio tem um papel protetor no osso, inibindo a ação dos osteoclastos (células que destroem o osso). Com a menopausa, essa proteção acaba.", "Adrenalina é o hormônio do estresse e não regula a densidade óssea a longo prazo.", "Embora o GH ajude no crescimento, a perda do estrogênio é o fator principal na osteoporose pósmenopausa."]},
{id:490,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Nas mulheres idosas, a queda brusca de qual hormônio após a menopausa acelera significativamente a reabsorção óssea, aumentando o risco de fraturas?",alternativas:["A) Insulina", "B) Estrogênio", "C) Adrenalina", "D) Somatropina (GH)"],correta:1,justificativas:["A insulina regula a glicose e tem papel menor no metabolismo ósseo direto.", "✔ O estrogênio tem um papel protetor no osso, inibindo a ação dos osteoclastos (células que destroem o osso). Com a menopausa, essa proteção acaba.", "Adrenalina é o hormônio do estresse e não regula a densidade óssea a longo prazo.", "Embora o GH ajude no crescimento, a perda do estrogênio é o fator principal na osteoporose pósmenopausa."]},
{id:491,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Como se chama a célula responsável pela reabsorção da matriz óssea (retirada de cálcio do osso), que se torna proporcionalmente mais ativa na osteoporose do idoso?",alternativas:["A) Osteoblasto", "B) Osteócito", "C) Osteoclasto", "D) Condrócito"],correta:2,justificativas:["O osteoblasto é a célula que forma osso novo.", "O osteócito é a célula madura que mantém o tecido, agindo como um \"sensor\".", "✔ O osteoclasto \"come\" o osso. Na osteoporose, há um desequilíbrio onde o osteoclasto retira mais osso do que o corpo consegue repor.", "O condrócito é a célula do tecido cartilaginoso."]},
{id:492,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"Como se chama a célula responsável pela reabsorção da matriz óssea (retirada de cálcio do osso), que se torna proporcionalmente mais ativa na osteoporose do idoso?",alternativas:["A) Osteoblasto", "B) Osteócito", "C) Osteoclasto", "D) Condrócito"],correta:2,justificativas:["O osteoblasto é a célula que forma osso novo.", "O osteócito é a célula madura que mantém o tecido, agindo como um \"sensor\".", "✔ O osteoclasto \"come\" o osso. Na osteoporose, há um desequilíbrio onde o osteoclasto retira mais osso do que o corpo consegue repor.", "O condrócito é a célula do tecido cartilaginoso."]},
{id:493,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"As fraturas de rádio distal (pulso) ao cair com a mão espalmada são muito frequentes em idosos. Qual o nome clássico da deformidade em \"garfo\" que ocorre quando o fragmento ósseo desvia para o dorso da mão?",alternativas:["A) Fratura de Smith", "B) Fratura de Monteggia", "C) Fratura de Colles", "D) Fratura de Galeazzi"],correta:2,justificativas:["A fratura de Smith tem desvio volar (para a palma), sendo menos comum.", "e D: São fraturasluxações complexas que envolvem outros ossos e mecanismos.", "✔ A fratura de Colles é a fratura do rádio distal com desvio dorsal, típica de quedas da própria altura no idoso.", "Alternativa D incorreta."]},
{id:494,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"As fraturas de rádio distal (pulso) ao cair com a mão espalmada são muito frequentes em idosos. Qual o nome clássico da deformidade em \"garfo\" que ocorre quando o fragmento ósseo desvia para o dorso da mão?",alternativas:["A) Fratura de Smith", "B) Fratura de Monteggia", "C) Fratura de Colles", "D) Fratura de Galeazzi"],correta:2,justificativas:["A fratura de Smith tem desvio volar (para a palma), sendo menos comum.", "e D: São fraturasluxações complexas que envolvem outros ossos e mecanismos.", "✔ A fratura de Colles é a fratura do rádio distal com desvio dorsal, típica de quedas da própria altura no idoso.", "Alternativa D incorreta."]},
{id:495,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"No idoso, muitas fraturas vertebrais por compressão ocorrem de forma silenciosa ou com dor crônica. Qual alteração postural clássica é resultante dessas múltiplas microfraturas na coluna torácica?",alternativas:["A) Escoliose em \"S\"", "B) Hiperlordose lombar", "C) Cifose dorsal (corcunda)", "D) Retificação cervical"],correta:2,justificativas:["Escoliose é um desvio lateral.", "Lordose é a curvatura para dentro (comum na lombar); no idoso, ela tende a diminuir.", "✔ O achatamento da parte anterior das vértebras (fraturas em cunha) faz com que a coluna se incline para frente, gerando a cifose aumentada.", "Retificação é a perda da curvatura, não o aumento da \"corcunda\"."]},
{id:496,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"intermediário",enunciado:"No idoso, muitas fraturas vertebrais por compressão ocorrem de forma silenciosa ou com dor crônica. Qual alteração postural clássica é resultante dessas múltiplas microfraturas na coluna torácica?",alternativas:["A) Escoliose em \"S\"", "B) Hiperlordose lombar", "C) Cifose dorsal (corcunda)", "D) Retificação cervical"],correta:2,justificativas:["Escoliose é um desvio lateral.", "Lordose é a curvatura para dentro (comum na lombar); no idoso, ela tende a diminuir.", "✔ O achatamento da parte anterior das vértebras (fraturas em cunha) faz com que a coluna se incline para frente, gerando a cifose aumentada.", "Retificação é a perda da curvatura, não o aumento da \"corcunda\"."]},
{id:497,tema:"Fraturas",subtema:"Conceitos Gerais",dificuldade:"iniciante",enunciado:"Qual nutriente, essencial para a absorção intestinal de cálcio, costuma estar em níveis baixos na população idosa, agravando a fragilidade óssea?",alternativas:["A) Vitamina C", "B) Vitamina K", "C) Vitamina D", "D) Vitamina B12"],correta:2,justificativas:["Vitamina C é importante para o colágeno, mas não controla o cálcio diretamente.", "A Vitamina K ajuda na fixação, mas a D é a \"chave\" da absorção primária.", "✔ A Vitamina D é fundamental para que o cálcio da dieta entre no sangue e chegue ao osso. Sua deficiência é onipresente em idosos com pouca exposição solar.", "A B12 é vital para o sistema nervoso e sangue, não para o metabolismo do cálcio."]},
