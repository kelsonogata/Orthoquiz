// ─── FETCH DIRETO AO SUPABASE ────────────────────────────────────────────────
const REST_HEADERS = {
  apikey: SB_ANON, Authorization: `Bearer ${SB_ANON}`,
  "Content-Type": "application/json",
};

// Todas as operações usam RPC (funções security definer no Supabase)
// Isso contorna completamente o problema de schema orthoquiz não exposto via REST
const rpc = async (fn, params={}) => {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: { ...REST_HEADERS, Prefer: "return=representation" },
      body: JSON.stringify(params),
    });
    const data = await r.json().catch(()=>(r.ok?[]:{error:r.status}));
    if (!r.ok) return { error: data?.message || data?.error || r.status };
    return data;
  } catch(e) { return { error: e.message }; }
};

// ─── AUTH via Supabase Auth API (não usa schema orthoquiz) ──────────────────
const sbAuth = async (email, password) => {
  try {
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: SB_ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    return await r.json();
  } catch(e) { return { error: e.message }; }
};

const sbSignup = async (email, password) => {
  try {
    const resp = await fetch(`${SB_URL}/auth/v1/signup`, {
      method: "POST",
      headers: { apikey: SB_ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await resp.json();
    if (data.error) {
      const msg = typeof data.error === "string" ? data.error
        : data.error.message || data.error.msg || JSON.stringify(data.error);
      return { error: msg };
    }
    if (!resp.ok && data.msg) return { error: data.msg };
    return data;
  } catch(e) { return { error: e.message }; }
};

const sbRecover = async (email) => {
  try {
    const r = await fetch(`${SB_URL}/auth/v1/recover`, {
      method: "POST",
      headers: { apikey: SB_ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    return r.ok ? { ok: true } : { error: "Erro ao enviar email." };
  } catch(e) { return { error: e.message }; }
};

const sbUpdatePwd = async (token, password) => {
  try {
    const r = await fetch(`${SB_URL}/auth/v1/user`, {
      method: "PUT",
      headers: { apikey: SB_ANON, Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    const d = await r.json();
    return d.error ? { error: d.error.message || "Erro." } : { ok: true };
  } catch(e) { return { error: e.message }; }
};

// ─── AUTH HELPERS ─────────────────────────────────────────────────────────────
async function signUp(email, senha, nome, ra) {
  // 1. Criar auth user
  const r = await sbSignup(email, senha);

  if (r.error) {
    const msg = (typeof r.error === "string" ? r.error : r.error?.message || "").toLowerCase();
    if (msg.includes("already registered") || msg.includes("already exists") || msg.includes("duplicate"))
      return { error: "Este email já está cadastrado. Use outro ou faça login." };
    return { error: typeof r.error === "string" ? r.error : (r.error?.message || "Erro no cadastro.") };
  }

  const userId = r.user?.id || r.id;
  if (!userId) return { error: "Não foi possível criar o usuário. Tente novamente." };

  // 2. Auto-confirmar email via Edge Function
  try {
    await fetch(`${SB_URL}/functions/v1/auto-confirm`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SB_ANON },
      body: JSON.stringify({ user_id: userId })
    });
  } catch(e) {}

  // 3. Inserir perfil SEMPRE com aprovado=true (aprovação automática permanente)
  const isAdmin = email === ADMIN_EMAIL;
  await rpc("oq_insert_profile", {
    p_id: userId, p_email: email, p_nome: nome, p_ra: ra,
    p_is_admin: isAdmin, p_aprovado: true
  });

  // 4. Init XP via RPC
  await rpc("oq_insert_user_xp", { p_user_id: userId });

  // 5. Logar automaticamente após cadastro
  await new Promise(res => setTimeout(res, 800));
  const authResp = await sbAuth(email, senha);
  if (authResp.access_token) {
    setUserToken(authResp.access_token);
    // Montar perfil localmente para não depender do banco
    const profile = { id: userId, email, nome, ra, is_admin: isAdmin, aprovado: true };
    return { autoLogin: true, profile };
  }

  return { ok: true };
}

// Perfil admin fixo — evita dependência do proxy para busca
const ADMIN_PROFILE = {
  id: "44d7a03c-0ee6-45c2-a938-b12f7f3010b4",
  email: "kelson.ogata@hotmail.com",
  nome: "Kelson Ogata",
  is_admin: true,
  aprovado: true

async function signIn(email, senha) {
  // Autenticar via proxy
  const authResp = await sbAuth(email, senha);
  if (authResp.error) return { error: typeof authResp.error === "string" ? authResp.error : "Email ou senha incorretos." };
  if (!authResp.access_token) return { error: "Falha na autenticação. Tente novamente." };

  // Admin: retorna perfil fixo sem precisar de query
  if (email === ADMIN_EMAIL) return { token: authResp.access_token, profile: ADMIN_PROFILE };

  // Outros usuários: busca perfil via RPC
  const profiles = await rpc("oq_get_profile_by_email", { p_email: email });
  if (!Array.isArray(profiles) || profiles.length === 0) return { error: "Perfil não encontrado. Entre em contato com o administrador." };
  const profile = profiles[0];
  if (!profile.aprovado) return { error: "Cadastro pendente de aprovação pelo administrador." };

  setUserToken(authResp.access_token);
  return { token: authResp.access_token, profile };
}

async function resetPassword(email) {
  const r = await sbRecover(email);
  if (r.error) return { error: typeof r.error === "string" ? r.error : "Erro ao enviar email." };
  return { ok: true };
}

// ─── USER DATA via SUPABASE ───────────────────────────────────────────────────
async function loadUserData(userId) {
  const [xpRows, progRows, sessRows] = await Promise.all([
    rpc("oq_get_user_xp", { p_user_id: userId }),
    rpc("oq_get_user_progress", { p_user_id: userId }),
    rpc("oq_get_sessions", { p_user_id: userId })
  ]);
  return {
    xp:   Array.isArray(xpRows)  && xpRows.length  ? xpRows[0]  : { xp:0, streak:0, last_date:'' },
    prog: Array.isArray(progRows) ? progRows : [],
    hist: Array.isArray(sessRows) ? sessRows : []
  };
}

async function saveSession(userId, mode, tema, dif, acertos, total, xpGained) {

}

async function saveXP(userId, xp, streak, lastDate) {

async function upsertProgress(userId, tema, dif, status, acertos) {

  const s = document.createElement("script");

  s.onload = () => { _confetti = window.confetti; run(); };
  document.head.appendChild(s);
}

{id:14,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Durante a letra \"C\" (Circulação) do exame primário, o controle de hemorragia pélvica em fraturas instáveis (tipo livro aberto) deve ser feito conceitualmente através de:",alternativas:["A) Redução aberta imediata no centro cirúrgico", "B) Aplicação de gesso pélvico-podálico", "C) Estabilização provisória com cinta pélvica ou lençol ao nível dos trocanteres maiores", "D) Massagem cardíaca externa para manter a pressão"],correta:2,justificativas:["A cirurgia definitiva não é feita na fase de ressuscitação do exame primário.", "Gesso não tem papel no tratamento agudo de instabilidade pélvica.", "✔ A estabilização mecânica da bacia reduz o volume pélvico e promove o tamponamento de sangramentos venosos e ósseos.", "Massagem cardíaca é para parada cardiorrespiratória, não para controle de hemorragia pélvica."]},
{id:15,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"O termo \"AMPLE\" é um mnemônico utilizado no ATLS para facilitar a coleta da história médica simplificada. O que a letra \"L\" representa?",alternativas:["A) Lesões pregressas importantes", "B) Líquidos e alimentos ingeridos recentemente (última refeição)", "C) Localização exata da dor", "D) Liberação de esfíncteres durante o trauma"],correta:1,justificativas:["Isso seria o \"M\" (Histórico médico) ou \"P\" (Passado).", "✔ Saber a hora da última refeição é crucial para prever risco de aspiração caso o paciente precise de anestesia/intubação.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:16,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"O termo \"AMPLE\" é um mnemônico utilizado no ATLS para facilitar a coleta da história médica simplificada. O que a letra \"L\" representa?",alternativas:["A) Lesões pregressas importantes", "B) Líquidos e alimentos ingeridos recentemente (última refeição)", "C) Localização exata da dor", "D) Liberação de esfíncteres durante o trauma"],correta:1,justificativas:["Isso seria o \"M\" (Histórico médico) ou \"P\" (Passado).", "✔ Saber a hora da última refeição é crucial para prever risco de aspiração caso o paciente precise de anestesia/intubação.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:17,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"Qual é o volume inicial de cristaloides (preferencialmente Ringer Lactato) recomendado pelo ATLS 10ª edição para a reanimação inicial de um adulto com suspeita de choque hemorrágico?",alternativas:["A) 5 litros administrados rapidamente", "B) 500 ml apenas para manter a veia aberta", "C) 1 litro de solução isotônica aquecida", "D) 250 ml de soro glicosado"],correta:2,justificativas:["Volume excessivo inicial está associado a piora da coagulopatia (dilucional).", "Volume insuficiente para tratar um choque em evolução.", "✔ O ATLS recomenda um desafio inicial de 1.000 ml (1 litro) de cristaloide isotônico aquecido em adultos.", "Soro glicosado não é expansor volêmico e não deve ser usado na reanimação do trauma."]},
{id:18,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Qual é o volume inicial de cristaloides (preferencialmente Ringer Lactato) recomendado pelo ATLS 10ª edição para a reanimação inicial de um adulto com suspeita de choque hemorrágico?",alternativas:["A) 5 litros administrados rapidamente", "B) 500 ml apenas para manter a veia aberta", "C) 1 litro de solução isotônica aquecida", "D) 250 ml de soro glicosado"],correta:2,justificativas:["Volume excessivo inicial está associado a piora da coagulopatia (dilucional).", "Volume insuficiente para tratar um choque em evolução.", "✔ O ATLS recomenda um desafio inicial de 1.000 ml (1 litro) de cristaloide isotônico aquecido em adultos.", "Soro glicosado não é expansor volêmico e não deve ser usado na reanimação do trauma."]},
{id:19,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"No conceito de \"Exposição e Controle do Ambiente\" (letra E), qual é a preocupação central além de despir o paciente para procurar lesões ocultas?",alternativas:["A) Garantir que o paciente não sinta vergonha da equipe", "B) Prevenir a hipotermia através do uso de mantas térmicas e fluidos aquecidos", "C) Registrar todas as tatuagens do paciente para identificação policial", "D) Coletar amostras de sangue para testes de DNA"],correta:1,justificativas:["A privacidade é importante, mas a vida e a prevenção da hipotermia são as prioridades médicas.", "✔ A hipotermia é parte da tríade letal e deve ser prevenida ativamente assim que o paciente é despido para exame.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:20,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"No conceito de \"Exposição e Controle do Ambiente\" (letra E), qual é a preocupação central além de despir o paciente para procurar lesões ocultas?",alternativas:["A) Garantir que o paciente não sinta vergonha da equipe", "B) Prevenir a hipotermia através do uso de mantas térmicas e fluidos aquecidos", "C) Registrar todas as tatuagens do paciente para identificação policial", "D) Coletar amostras de sangue para testes de DNA"],correta:1,justificativas:["A privacidade é importante, mas a vida e a prevenção da hipotermia são as prioridades médicas.", "✔ A hipotermia é parte da tríade letal e deve ser prevenida ativamente assim que o paciente é despido para exame.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:21,tema:"Urgências",subtema:"Instabilidade Pélvica",dificuldade:"iniciante",enunciado:"No atendimento inicial de um paciente com suspeita de fratura pélvica tipo \"livro aberto\" (APC II), qual o sinal radiográfico que define a ruptura dos ligamentos sacroilíacos anteriores e a consequente instabilidade rotacional?",alternativas:["A) Diástase da sínfise púbica superior a 2,5 cm", "B) Avulsão da espinha ilíaca anterossuperior", "C) Fratura transversa do sacro", "D) Presença de ar no espaço retroperitoneal"],correta:0,justificativas:["✔ Uma diástase de sínfise púbica > 2,5 cm é o critério radiográfico clássico que indica a ruptura dos ligamentos sacroilíacos anteriores e sacroespinais, caracterizando a instabilidade rotacional (Livro Aberto).", "É uma fratura de avulsão muscular, comum em jovens atletas, sem relação direta com instabilidade pélvica grave.", "Sugere um trauma de compressão vertical ou trauma sacral direto, não o mecanismo de livro aberto (Anteroposterior).", "Sugere perfuração de víscera oca ou trauma penetrante, não sendo um sinal ósseo de instabilidade."]},
{id:22,tema:"Urgências",subtema:"Instabilidade Pélvica",dificuldade:"intermediário",enunciado:"No atendimento inicial de um paciente com suspeita de fratura pélvica tipo \"livro aberto\" (APC II), qual o sinal radiográfico que define a ruptura dos ligamentos sacroilíacos anteriores e a consequente instabilidade rotacional?",alternativas:["A) Diástase da sínfise púbica superior a 2,5 cm", "B) Avulsão da espinha ilíaca anterossuperior", "C) Fratura transversa do sacro", "D) Presença de ar no espaço retroperitoneal"],correta:0,justificativas:["✔ Uma diástase de sínfise púbica > 2,5 cm é o critério radiográfico clássico que indica a ruptura dos ligamentos sacroilíacos anteriores e sacroespinais, caracterizando a instabilidade rotacional (Livro Aberto).", "É uma fratura de avulsão muscular, comum em jovens atletas, sem relação direta com instabilidade pélvica grave.", "Sugere um trauma de compressão vertical ou trauma sacral direto, não o mecanismo de livro aberto (Anteroposterior).", "Sugere perfuração de víscera oca ou trauma penetrante, não sendo um sinal ósseo de instabilidade."]},
{id:23,tema:"Urgências",subtema:"Instabilidade Pélvica",dificuldade:"iniciante",enunciado:"Paciente vítima de esmagamento pélvico apresenta-se com instabilidade hemodinâmica e RX mostrando fratura em livro aberto. Qual o local anatômico exato para a aplicação correta da cinta pélvica visando o fechamento do anel e controle do sangramento?",alternativas:["A) Sobre as cristas ilíacas", "B) Ao nível do umbigo", "C) Sobre os trocanteres maiores do fêmur", "D) Abaixo da sínfise púbica, pegando apenas o períneo"],correta:2,justificativas:["A compressão nas cristas ilíacas é ineficaz para estabilizar o anel pélvico profundo.", "Aumenta a pressão intraabdominal sem estabilizar a estrutura óssea da bacia.", "✔ A aplicação da cinta sobre os trocanteres maiores garante o vetor de força ideal para fechar a sínfise púbica e estabilizar a bacia. Aplicar acima (nas cristas) é menos eficaz e pode até abrir mais a fratura dependendo do padrão.", "Não oferece o braço de alavanca necessário para o fechamento dos ossos ilíacos."]},
{id:24,tema:"Urgências",subtema:"Instabilidade Pélvica",dificuldade:"intermediário",enunciado:"Paciente vítima de esmagamento pélvico apresenta-se com instabilidade hemodinâmica e RX mostrando fratura em livro aberto. Qual o local anatômico exato para a aplicação correta da cinta pélvica visando o fechamento do anel e controle do sangramento?",alternativas:["A) Sobre as cristas ilíacas", "B) Ao nível do umbigo", "C) Sobre os trocanteres maiores do fêmur", "D) Abaixo da sínfise púbica, pegando apenas o períneo"],correta:2,justificativas:["A compressão nas cristas ilíacas é ineficaz para estabilizar o anel pélvico profundo.", "Aumenta a pressão intraabdominal sem estabilizar a estrutura óssea da bacia.", "✔ A aplicação da cinta sobre os trocanteres maiores garante o vetor de força ideal para fechar a sínfise púbica e estabilizar a bacia. Aplicar acima (nas cristas) é menos eficaz e pode até abrir mais a fratura dependendo do padrão.", "Não oferece o braço de alavanca necessário para o fechamento dos ossos ilíacos."]},
{id:25,tema:"Urgências",subtema:"Instabilidade Pélvica",dificuldade:"iniciante",enunciado:"Em fraturas de bacia com instabilidade hemodinâmica, qual é a origem mais comum do sangramento retroperitoneal maciço?",alternativas:["A) Artéria Ilíaca Interna", "B) Artéria Epigástrica Inferior", "C) Plexo Venoso Pré-sacral e superfícies ósseas fraturadas", "D) Artéria Femoral Comum"],correta:2,justificativas:["É uma fonte importante de sangramento arterial, mas não é a mais comum estatisticamente.", "Pode sangrar em acessos cirúrgicos, mas não é a fonte primária no trauma fechado.", "✔ Cerca de 8590% dos sangramentos em fraturas de bacia são de origem venosa (plexos) ou das bordas do osso fraturado. Apenas uma minoria é arterial.", "Lesões de femoral ocorrem mais em traumas penetrantes ou luxações de quadril, não sendo o foco principal no sangramento retroperitoneal da bacia."]},
{id:26,tema:"Urgências",subtema:"Instabilidade Pélvica",dificuldade:"intermediário",enunciado:"Em fraturas de bacia com instabilidade hemodinâmica, qual é a origem mais comum do sangramento retroperitoneal maciço?",alternativas:["A) Artéria Ilíaca Interna", "B) Artéria Epigástrica Inferior", "C) Plexo Venoso Pré-sacral e superfícies ósseas fraturadas", "D) Artéria Femoral Comum"],correta:2,justificativas:["É uma fonte importante de sangramento arterial, mas não é a mais comum estatisticamente.", "Pode sangrar em acessos cirúrgicos, mas não é a fonte primária no trauma fechado.", "✔ Cerca de 8590% dos sangramentos em fraturas de bacia são de origem venosa (plexos) ou das bordas do osso fraturado. Apenas uma minoria é arterial.", "Lesões de femoral ocorrem mais em traumas penetrantes ou luxações de quadril, não sendo o foco principal no sangramento retroperitoneal da bacia."]},
{id:27,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"Durante o exame físico de um paciente com fratura de bacia suspeita, observa-se sangue no meato uretral e próstata não palpável (próstata \"subida\"). Qual exame deve ser realizado antes de qualquer tentativa de cateterização vesical?",alternativas:["A) Tomografia de abdome e pelve com contraste oral", "B) Uretrocistografia retrógada", "C) Ultrassonografia transretal", "D) Cistoscopia de urgência"],correta:1,justificativas:["A TC com contraste endovenoso vê a bexiga (fase excretora), mas a uretro retrógada é soberana para a uretra.", "✔ A tríade de sangue no meato, retenção urinária e próstata cefalizada indica lesão de uretra. A uretrocistografia retrógada é o padrão para diagnosticar a lesão antes de passar uma sonda que pode agravar o dano.", "Não tem papel na avaliação de rotina do trauma uretral agudo.", "É um procedimento invasivo desnecessário na fase inicial do diagnóstico."]},
{id:28,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Durante o exame físico de um paciente com fratura de bacia suspeita, observa-se sangue no meato uretral e próstata não palpável (próstata \"subida\"). Qual exame deve ser realizado antes de qualquer tentativa de cateterização vesical?",alternativas:["A) Tomografia de abdome e pelve com contraste oral", "B) Uretrocistografia retrógada", "C) Ultrassonografia transretal", "D) Cistoscopia de urgência"],correta:1,justificativas:["A TC com contraste endovenoso vê a bexiga (fase excretora), mas a uretro retrógada é soberana para a uretra.", "✔ A tríade de sangue no meato, retenção urinária e próstata cefalizada indica lesão de uretra. A uretrocistografia retrógada é o padrão para diagnosticar a lesão antes de passar uma sonda que pode agravar o dano.", "Não tem papel na avaliação de rotina do trauma uretral agudo.", "É um procedimento invasivo desnecessário na fase inicial do diagnóstico."]},
{id:29,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"De acordo com a classificação de Burgess e Young para traumas pélvicos, o mecanismo de Compressão Anteroposterior (APC) tipo III é caracterizado por:",alternativas:["A) Disfunção da sínfise púbica menor que 2,5 cm e ligamentos SI íntegros", "B) Ruptura completa dos ligamentos sacroilíacos (anteriores e posteriores), gerando instabilidade total (vertical e rotacional)", "C) Impactação do sacro por força lateral", "D) Fratura isolada dos ramos pubianos"],correta:1,justificativas:["Essa descrição corresponde à APC I (estável).", "✔ A APC III é o estágio máximo de lesão por compressão AP, onde há ruptura total de todos os ligamentos (SI anterior, posterior, sacroespinal e sacrotuberal), resultando em uma bacia completamente instável.", "Impactação sacral é típica de traumas por Compressão Lateral (LC).", "Fraturas isoladas de ramos podem ocorrer na APC I ou LC I, não definindo a gravidade da APC III."]},
{id:30,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"De acordo com a classificação de Burgess e Young para traumas pélvicos, o mecanismo de Compressão Anteroposterior (APC) tipo III é caracterizado por:",alternativas:["A) Disfunção da sínfise púbica menor que 2,5 cm e ligamentos SI íntegros", "B) Ruptura completa dos ligamentos sacroilíacos (anteriores e posteriores), gerando instabilidade total (vertical e rotacional)", "C) Impactação do sacro por força lateral", "D) Fratura isolada dos ramos pubianos"],correta:1,justificativas:["Essa descrição corresponde à APC I (estável).", "✔ A APC III é o estágio máximo de lesão por compressão AP, onde há ruptura total de todos os ligamentos (SI anterior, posterior, sacroespinal e sacrotuberal), resultando em uma bacia completamente instável.", "Impactação sacral é típica de traumas por Compressão Lateral (LC).", "Fraturas isoladas de ramos podem ocorrer na APC I ou LC I, não definindo a gravidade da APC III."]},
{id:31,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"Paciente com fratura pélvica instável e choque hipovolêmico refratário a cristaloide e hemoderivados. O FAST abdominal é negativo para líquido livre. Qual a conduta mais indicada no protocolo de \"controle de danos\" após a estabilização com cinta?",alternativas:["A) Laparotomia exploradora imediata", "B) Arteriografia com embolização ou Packing Pré-peritoneal", "C) Realização de RM de bacia para detalhar os ligamentos", "D) Colocação de tração esquelética bilateral"],correta:1,justificativas:["A laparotomia em um paciente com sangramento puramente retroperitoneal pode descompressar o hematoma e piorar o choque.", "✔ Se o FAST é negativo, o sangue provavelmente está no retroperitônio (espaço pélvico). O controle é feito com tamponamento (Packing) ou embolização arterial.", "O paciente está instável; exames demorados como RM são contraindicados.", "A tração ajuda na instabilidade vertical (cisalhamento), mas não controla o sangramento agudo de uma APC III."]},
{id:32,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Paciente com fratura pélvica instável e choque hipovolêmico refratário a cristaloide e hemoderivados. O FAST abdominal é negativo para líquido livre. Qual a conduta mais indicada no protocolo de \"controle de danos\" após a estabilização com cinta?",alternativas:["A) Laparotomia exploradora imediata", "B) Arteriografia com embolização ou Packing Pré-peritoneal", "C) Realização de RM de bacia para detalhar os ligamentos", "D) Colocação de tração esquelética bilateral"],correta:1,justificativas:["A laparotomia em um paciente com sangramento puramente retroperitoneal pode descompressar o hematoma e piorar o choque.", "✔ Se o FAST é negativo, o sangue provavelmente está no retroperitônio (espaço pélvico). O controle é feito com tamponamento (Packing) ou embolização arterial.", "O paciente está instável; exames demorados como RM são contraindicados.", "A tração ajuda na instabilidade vertical (cisalhamento), mas não controla o sangramento agudo de uma APC III."]},
{id:33,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"Qual estrutura anatômica vascular, que cruza a parte superior do ramo do pube, deve ser cautelosamente identificada em cirurgias de bacia devido ao risco de hemorragia grave se lesionada?",alternativas:["A) Artéria Glútea Superior", "B) Corona Mortis (anastomose entre vasos ilíacos externos e obturatórios)", "C) Artéria Pudenda Interna", "D) Veia Safena Magna"],correta:1,justificativas:["A glútea superior é comumente lesionada em fraturas que envolvem a incisura isquiática maior, não o ramo do pube.", "✔ A Corona Mortis é uma conexão vascular situada atrás do ramo superior do pube. Sua lesão em fraturas ou acessos cirúrgicos (como o Stoppa) pode causar sangramento de difícil controle.", "É profunda na bacia e menos relacionada a fraturas de ramos pubianos.", "É uma veia superficial do membro inferior, sem relação com a anatomia interna do anel pélvico."]},
{id:34,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Qual estrutura anatômica vascular, que cruza a parte superior do ramo do pube, deve ser cautelosamente identificada em cirurgias de bacia devido ao risco de hemorragia grave se lesionada?",alternativas:["A) Artéria Glútea Superior", "B) Corona Mortis (anastomose entre vasos ilíacos externos e obturatórios)", "C) Artéria Pudenda Interna", "D) Veia Safena Magna"],correta:1,justificativas:["A glútea superior é comumente lesionada em fraturas que envolvem a incisura isquiática maior, não o ramo do pube.", "✔ A Corona Mortis é uma conexão vascular situada atrás do ramo superior do pube. Sua lesão em fraturas ou acessos cirúrgicos (como o Stoppa) pode causar sangramento de difícil controle.", "É profunda na bacia e menos relacionada a fraturas de ramos pubianos.", "É uma veia superficial do membro inferior, sem relação com a anatomia interna do anel pélvico."]},
{id:35,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"Um paciente com fratura de bacia estável (APC I) queixa-se de dor intensa ao tentar deambular. No RX de controle em pé (estresse por carga), a sínfise abre para 3,0 cm. Qual a conduta?",alternativas:["A) Manter tratamento conservador com andador", "B) Indicar estabilização cirúrgica (placa na sínfise)", "C) Aplicar gesso pélvico", "D) Prescrever repouso absoluto no leito por 3 meses"],correta:1,justificativas:["Manter o conservador levaria a dor crônica e falha na consolidação.", "✔ Se a fratura abre sob estresse ou carga acima dos limites de estabilidade (2,5 cm), ela é funcionalmente instável e requer fixação interna para permitir a reabilitação.", "Gessos não estabilizam adequadamente o anel pélvico no adulto.", "O repouso prolongado causa complicações graves (TVP, escaras, pneumonia) e não garante a redução da sínfise."]},
{id:36,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Um paciente com fratura de bacia estável (APC I) queixa-se de dor intensa ao tentar deambular. No RX de controle em pé (estresse por carga), a sínfise abre para 3,0 cm. Qual a conduta?",alternativas:["A) Manter tratamento conservador com andador", "B) Indicar estabilização cirúrgica (placa na sínfise)", "C) Aplicar gesso pélvico", "D) Prescrever repouso absoluto no leito por 3 meses"],correta:1,justificativas:["Manter o conservador levaria a dor crônica e falha na consolidação.", "✔ Se a fratura abre sob estresse ou carga acima dos limites de estabilidade (2,5 cm), ela é funcionalmente instável e requer fixação interna para permitir a reabilitação.", "Gessos não estabilizam adequadamente o anel pélvico no adulto.", "O repouso prolongado causa complicações graves (TVP, escaras, pneumonia) e não garante a redução da sínfise."]},
{id:37,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"Qual complicação urológica tardia é mais frequente em homens sobreviventes de fraturas pélvicas graves com instabilidade rotacional?",alternativas:["A) Incontinência urinária de esforço", "B) Disfunção erétil (impotência)", "C) Câncer de próstata precoce", "D) Cálculos renais de repetição"],correta:1,justificativas:["É menos comum que a impotência em homens; ocorre mais em lesões diretas de esfíncter em mulheres.", "✔ A proximidade do plexo nervoso autônomo e dos vasos pudendos com o anel pélvico torna a disfunção erétil uma sequela comum (até 40% em traumas graves).", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:38,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Qual complicação urológica tardia é mais frequente em homens sobreviventes de fraturas pélvicas graves com instabilidade rotacional?",alternativas:["A) Incontinência urinária de esforço", "B) Disfunção erétil (impotência)", "C) Câncer de próstata precoce", "D) Cálculos renais de repetição"],correta:1,justificativas:["É menos comum que a impotência em homens; ocorre mais em lesões diretas de esfíncter em mulheres.", "✔ A proximidade do plexo nervoso autônomo e dos vasos pudendos com o anel pélvico torna a disfunção erétil uma sequela comum (até 40% em traumas graves).", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:39,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"No trauma por \"cisalhamento vertical\" (Vertical Shear), qual é a principal característica que a diferencia do \"livro aberto\"?",alternativas:["A) A bacia fecha em vez de abrir", "B) Há um deslocamento cefálico (para cima) de uma hemibacia em relação à outra", "C) Ocorre apenas em quedas sentadas", "D) Não há risco de sangramento"],correta:1,justificativas:["Fechamento é típico de Compressão Lateral (LC).", "✔ O Vertical Shear envolve forças verticais (como queda de altura sobre um pé só), rompendo todos os ligamentos e fazendo a hemibacia \"subir\", sendo a lesão pélvica mais instável de todas.", "Pode ocorrer em diversos traumas de alta energia, não apenas sentados.", "É uma das lesões que mais sangra devido à ruptura completa de tecidos moles e vasos. ### Fratura de ossos longos"]},
{id:40,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"No trauma por \"cisalhamento vertical\" (Vertical Shear), qual é a principal característica que a diferencia do \"livro aberto\"?",alternativas:["A) A bacia fecha em vez de abrir", "B) Há um deslocamento cefálico (para cima) de uma hemibacia em relação à outra", "C) Ocorre apenas em quedas sentadas", "D) Não há risco de sangramento"],correta:1,justificativas:["Fechamento é típico de Compressão Lateral (LC).", "✔ O Vertical Shear envolve forças verticais (como queda de altura sobre um pé só), rompendo todos os ligamentos e fazendo a hemibacia \"subir\", sendo a lesão pélvica mais instável de todas.", "Pode ocorrer em diversos traumas de alta energia, não apenas sentados.", "É uma das lesões que mais sangra devido à ruptura completa de tecidos moles e vasos. ### Fratura de ossos longos"]},
{id:41,tema:"Urgências",subtema:"Fratura de Ossos Longos",dificuldade:"iniciante",enunciado:"Durante a avaliação primária (letra C) de um paciente com fratura fechada de diáfise de fêmur isolada, qual a perda volêmica estimada que pode ocorrer no foco da fratura, contribuindo para o estado de choque hipovolêmico?",alternativas:["A) Até 500 ml", "B) Entre 750 ml e 1.500 ml", "C) Exatamente 2.000 ml", "D) Mais de 3.000 ml, obrigatoriamente"],correta:1,justificativas:["500 ml é a perda estimada para fraturas de úmero ou rádio/ulna.", "✔ O ATLS estima que uma fratura de fêmur pode levar à perda de até 1.500 ml de sangue no compartimento da coxa. Em um paciente de 70kg, isso representa até 30% do volume circulante (Choque Classe II ou III).", "Perdas de 2.000 ml ou mais são mais comuns em fraturas instáveis de pelve (livro aberto).", "Uma perda de 3.000 ml isolada por fêmur é improvável sem lesão vascular arterial importante associada."]},
{id:42,tema:"Urgências",subtema:"Fratura de Ossos Longos",dificuldade:"intermediário",enunciado:"Durante a avaliação primária (letra C) de um paciente com fratura fechada de diáfise de fêmur isolada, qual a perda volêmica estimada que pode ocorrer no foco da fratura, contribuindo para o estado de choque hipovolêmico?",alternativas:["A) Até 500 ml", "B) Entre 750 ml e 1.500 ml", "C) Exatamente 2.000 ml", "D) Mais de 3.000 ml, obrigatoriamente"],correta:1,justificativas:["500 ml é a perda estimada para fraturas de úmero ou rádio/ulna.", "✔ O ATLS estima que uma fratura de fêmur pode levar à perda de até 1.500 ml de sangue no compartimento da coxa. Em um paciente de 70kg, isso representa até 30% do volume circulante (Choque Classe II ou III).", "Perdas de 2.000 ml ou mais são mais comuns em fraturas instáveis de pelve (livro aberto).", "Uma perda de 3.000 ml isolada por fêmur é improvável sem lesão vascular arterial importante associada."]},
{id:43,tema:"Urgências",subtema:"Fratura de Ossos Longos",dificuldade:"iniciante",enunciado:"Qual a principal razão recomendada pelo ATLS para a aplicação de tração cutânea ou alinhamento provisório de uma fratura de osso longo ainda na sala de emergência?",alternativas:["A) Garantir a consolidação óssea primária imediata", "B) Substituir a necessidade de cirurgia definitiva", "C) Controlar a hemorragia ao reduzir o volume do compartimento e promover o tamponamento", "D) Evitar que o paciente sinta qualquer dor durante o transporte"],correta:2,justificativas:["A consolidação é um processo biológico que leva semanas; não ocorre na emergência.", "A imobilização inicial é apenas um \"controle de danos\" até o tratamento definitivo (haste ou placa).", "✔ O alinhamento e a imobilização provisória (como o uso de tração de Thomas no fêmur) estabilizam o foco, diminuem o espaço para o hematoma se expandir e reduzem o sangramento ósseo e de partes moles.", "Embora ajude na dor, o objetivo principal no contexto do ATLS (ABCDE) é o controle hemodinâmico e prevenção de lesões adicionais."]},
{id:44,tema:"Urgências",subtema:"Fratura de Ossos Longos",dificuldade:"intermediário",enunciado:"Qual a principal razão recomendada pelo ATLS para a aplicação de tração cutânea ou alinhamento provisório de uma fratura de osso longo ainda na sala de emergência?",alternativas:["A) Garantir a consolidação óssea primária imediata", "B) Substituir a necessidade de cirurgia definitiva", "C) Controlar a hemorragia ao reduzir o volume do compartimento e promover o tamponamento", "D) Evitar que o paciente sinta qualquer dor durante o transporte"],correta:2,justificativas:["A consolidação é um processo biológico que leva semanas; não ocorre na emergência.", "A imobilização inicial é apenas um \"controle de danos\" até o tratamento definitivo (haste ou placa).", "✔ O alinhamento e a imobilização provisória (como o uso de tração de Thomas no fêmur) estabilizam o foco, diminuem o espaço para o hematoma se expandir e reduzem o sangramento ósseo e de partes moles.", "Embora ajude na dor, o objetivo principal no contexto do ATLS (ABCDE) é o controle hemodinâmico e prevenção de lesões adicionais."]},
{id:45,tema:"Urgências",subtema:"Fratura de Ossos Longos",dificuldade:"iniciante",enunciado:"Paciente vítima de queda de altura apresenta fratura exposta de tíbia com grave esmagamento. Após a estabilização do ABCDE, qual o tempo ideal recomendado para o início da antibioticoterapia profilática para reduzir o risco de infecção profunda?",alternativas:["A) Somente após o resultado da cultura da ferida colhida no pronto-socorro", "B) Nas primeiras 3 horas após a lesão (idealmente o mais precocemente possível)", "C) Apenas após a lavagem exaustiva no centro cirúrgico", "D) Após 24 horas de observação para avaliar a viabilidade do membro"],correta:1,justificativas:["Culturas de swab na emergência não são recomendadas, pois identificam contaminantes da pele e não o agente da futura infecção.", "✔ O início precoce da antibioticoterapia (preferencialmente na primeira hora, mas aceitável até a terceira) é o fator isolado mais importante na prevenção de osteomielite em fraturas expostas.", "O antibiótico deve estar circulante antes mesmo do desbridamento cirúrgico.", "O atraso de 24 horas aumenta drasticamente as taxas de infecção e perda do membro."]},
{id:46,tema:"Urgências",subtema:"Fratura de Ossos Longos",dificuldade:"intermediário",enunciado:"Paciente vítima de queda de altura apresenta fratura exposta de tíbia com grave esmagamento. Após a estabilização do ABCDE, qual o tempo ideal recomendado para o início da antibioticoterapia profilática para reduzir o risco de infecção profunda?",alternativas:["A) Somente após o resultado da cultura da ferida colhida no pronto-socorro", "B) Nas primeiras 3 horas após a lesão (idealmente o mais precocemente possível)", "C) Apenas após a lavagem exaustiva no centro cirúrgico", "D) Após 24 horas de observação para avaliar a viabilidade do membro"],correta:1,justificativas:["Culturas de swab na emergência não são recomendadas, pois identificam contaminantes da pele e não o agente da futura infecção.", "✔ O início precoce da antibioticoterapia (preferencialmente na primeira hora, mas aceitável até a terceira) é o fator isolado mais importante na prevenção de osteomielite em fraturas expostas.", "O antibiótico deve estar circulante antes mesmo do desbridamento cirúrgico.", "O atraso de 24 horas aumenta drasticamente as taxas de infecção e perda do membro."]},
{id:47,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"Durante o Exame Secundário, ao avaliar uma fratura de joelho ou fêmur distal, o médico nota ausência de pulsos distais. Após a manobra de realinhamento do membro, os pulsos retornam. Qual a conduta obrigatória segundo o manejo de trauma vascular associado?",alternativas:["A) Alta hospitalar, pois o problema era apenas angulação mecânica", "B) Monitoração rigorosa e cálculo do Índice Tornozelo-Braço (IT", "B) ou angiografia", "C) Gesso imediato para impedir que o pulso suma novamente"],correta:1,justificativas:["Ignorar pode levar à isquemia aguda horas depois.", "✔ O retorno do pulso após manobra não exclui lesão da camada íntima da artéria (dissecção), que pode trombosar tardiamente. A avaliação com ITB ou exames de imagem é mandatória.", "O gesso pode esconder sinais de síndrome compartimental ou alteração de perfusão.", "A observação isolada é insuficiente para diagnosticar lesões arteriais ocultas."]},
{id:48,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Durante o Exame Secundário, ao avaliar uma fratura de joelho ou fêmur distal, o médico nota ausência de pulsos distais. Após a manobra de realinhamento do membro, os pulsos retornam. Qual a conduta obrigatória segundo o manejo de trauma vascular associado?",alternativas:["A) Alta hospitalar, pois o problema era apenas angulação mecânica", "B) Monitoração rigorosa e cálculo do Índice Tornozelo-Braço (IT", "B) ou angiografia", "C) Gesso imediato para impedir que o pulso suma novamente"],correta:1,justificativas:["Ignorar pode levar à isquemia aguda horas depois.", "✔ O retorno do pulso após manobra não exclui lesão da camada íntima da artéria (dissecção), que pode trombosar tardiamente. A avaliação com ITB ou exames de imagem é mandatória.", "O gesso pode esconder sinais de síndrome compartimental ou alteração de perfusão.", "A observação isolada é insuficiente para diagnosticar lesões arteriais ocultas."]},
{id:49,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"Um sinal precoce e fidedigno de Síndrome Compartimental em um paciente consciente com fratura de ossos da perna, que deve ser valorizado no exame físico, é:",alternativas:["A) Ausência de pulso pedioso (Palidez)", "B) Paralisia completa dos dedos do pé", "C) Dor desproporcional à lesão que piora com o alongamento passivo dos músculos", "D) Extremidade fria e cianótica"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ A dor ao alongamento passivo é o sinal clínico mais sensível e precoce. A dor \"desproporcional\" (que não alivia com analgésicos comuns) deve sempre levantar suspeita.", "Alternativa D incorreta."]},
{id:50,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Um sinal precoce e fidedigno de Síndrome Compartimental em um paciente consciente com fratura de ossos da perna, que deve ser valorizado no exame físico, é:",alternativas:["A) Ausência de pulso pedioso (Palidez)", "B) Paralisia completa dos dedos do pé", "C) Dor desproporcional à lesão que piora com o alongamento passivo dos músculos", "D) Extremidade fria e cianótica"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ A dor ao alongamento passivo é o sinal clínico mais sensível e precoce. A dor \"desproporcional\" (que não alivia com analgésicos comuns) deve sempre levantar suspeita.", "Alternativa D incorreta."]},
{id:51,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"Paciente com múltiplas fraturas de ossos longos (fêmur e tíbia) estabilizadas provisoriamente evolui, após 24 horas, com taquicardia, taquipneia, alteração do nível de consciência e petéquias em região de tórax e conjuntiva. Qual a principal suspeita diagnóstica?",alternativas:["A) Embolia Gasosa por acesso venoso central", "B) Síndrome da Embolia Gordurosa", "C) Pneumonia aspirativa", "D) Choque séptico por fratura exposta"],correta:1,justificativas:["A embolia gasosa costuma ter início súbito relacionado à manipulação de cateteres, não 24h após o trauma ósseo.", "✔ A tríade clássica (insuficiência respiratória, alteração neurológica e petéquias) em um contexto de fraturas de ossos longos é patognomônica da Síndrome da Embolia Gordurosa.", "Embora cause hipóxia, não explica as petéquias nem é a associação clássica com fraturas múltiplas.", "O choque séptico em 24h é raro e apresentaria febre alta e instabilidade hemodinâmica severa, sem petéquias típicas."]},
{id:52,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Paciente com múltiplas fraturas de ossos longos (fêmur e tíbia) estabilizadas provisoriamente evolui, após 24 horas, com taquicardia, taquipneia, alteração do nível de consciência e petéquias em região de tórax e conjuntiva. Qual a principal suspeita diagnóstica?",alternativas:["A) Embolia Gasosa por acesso venoso central", "B) Síndrome da Embolia Gordurosa", "C) Pneumonia aspirativa", "D) Choque séptico por fratura exposta"],correta:1,justificativas:["A embolia gasosa costuma ter início súbito relacionado à manipulação de cateteres, não 24h após o trauma ósseo.", "✔ A tríade clássica (insuficiência respiratória, alteração neurológica e petéquias) em um contexto de fraturas de ossos longos é patognomônica da Síndrome da Embolia Gordurosa.", "Embora cause hipóxia, não explica as petéquias nem é a associação clássica com fraturas múltiplas.", "O choque séptico em 24h é raro e apresentaria febre alta e instabilidade hemodinâmica severa, sem petéquias típicas."]},
{id:53,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"No contexto do atendimento ao trauma, qual a conduta imediata para uma fratura exposta com evidente contaminação grosseira (terra e detritos) na sala de emergência?",alternativas:["A) Realizar o fechamento primário da pele para proteger o osso", "B) Remover detritos grosseiros, irrigar com soro fisiológico e cobrir com curativo estéril úmido", "C) Aplicar pomada antibiótica e deixar a ferida aberta ao ar livre", "D) Tentar reduzir o osso para dentro do ferimento antes de lavar"],correta:1,justificativas:["O fechamento de feridas contaminadas é proscrito pelo alto risco de infecção anaeróbica e abscesso.", "✔ A limpeza inicial e a proteção da ferida com curativo estéril reduzem a carga bacteriana e protegem os tecidos até o desbridamento formal no centro cirúrgico.", "Pomadas dificultam a avaliação posterior e não substituem a irrigação e o antibiótico sistêmico.", "Introduzir osso sujo para dentro do compartimento profundo antes de lavar aumenta o risco de contaminação interna profunda."]},
{id:54,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"No contexto do atendimento ao trauma, qual a conduta imediata para uma fratura exposta com evidente contaminação grosseira (terra e detritos) na sala de emergência?",alternativas:["A) Realizar o fechamento primário da pele para proteger o osso", "B) Remover detritos grosseiros, irrigar com soro fisiológico e cobrir com curativo estéril úmido", "C) Aplicar pomada antibiótica e deixar a ferida aberta ao ar livre", "D) Tentar reduzir o osso para dentro do ferimento antes de lavar"],correta:1,justificativas:["O fechamento de feridas contaminadas é proscrito pelo alto risco de infecção anaeróbica e abscesso.", "✔ A limpeza inicial e a proteção da ferida com curativo estéril reduzem a carga bacteriana e protegem os tecidos até o desbridamento formal no centro cirúrgico.", "Pomadas dificultam a avaliação posterior e não substituem a irrigação e o antibiótico sistêmico.", "Introduzir osso sujo para dentro do compartimento profundo antes de lavar aumenta o risco de contaminação interna profunda."]},
{id:55,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"Um paciente idoso com fratura de fêmur proximal apresenta-se estável, mas o ortopedista solicita que se evite o uso excessivo de cristaloides. Qual a complicação comum no idoso traumatizado que justifica essa cautela no \"C\" do ATLS?",alternativas:["A) Insuficiência Renal Aguda", "B) Edema Agudo de Pulmão por sobrecarga volêmica", "C) Hipernatremia por excesso de sal", "D) Desidratação crônica"],correta:1,justificativas:["A falta de soro causaria IRA prérenal; o excesso é menos comum como causa de falha renal aguda no idoso inicial.", "✔ Idosos possuem menor reserva cardiovascular. A reanimação volêmica agressiva (\"soro em abundância\") pode levar rapidamente à falência cardíaca esquerda e edema pulmonar.", "O soro fisiológico é isotônico; a sobrecarga hídrica é um risco maior que a alteração do sódio isoladamente.", "É uma condição prévia, não uma complicação da reanimação exagerada."]},
{id:56,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Um paciente idoso com fratura de fêmur proximal apresenta-se estável, mas o ortopedista solicita que se evite o uso excessivo de cristaloides. Qual a complicação comum no idoso traumatizado que justifica essa cautela no \"C\" do ATLS?",alternativas:["A) Insuficiência Renal Aguda", "B) Edema Agudo de Pulmão por sobrecarga volêmica", "C) Hipernatremia por excesso de sal", "D) Desidratação crônica"],correta:1,justificativas:["A falta de soro causaria IRA prérenal; o excesso é menos comum como causa de falha renal aguda no idoso inicial.", "✔ Idosos possuem menor reserva cardiovascular. A reanimação volêmica agressiva (\"soro em abundância\") pode levar rapidamente à falência cardíaca esquerda e edema pulmonar.", "O soro fisiológico é isotônico; a sobrecarga hídrica é um risco maior que a alteração do sódio isoladamente.", "É uma condição prévia, não uma complicação da reanimação exagerada."]},
{id:57,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"Ao avaliar a perfusão de um membro fraturado, o médico nota que o tempo de enchimento capilar é de 5 segundos. O que este dado sugere no contexto da avaliação circulatória?",alternativas:["A) Perfusão normal do membro", "B) Hiperemia reativa", "C) Má perfusão tecidual, podendo indicar choque sistêmico ou lesão vascular local", "D) Apenas que o ambiente está muito quente"],correta:2,justificativas:["O valor está claramente alterado (o normal é < 2s).", "Na hiperemia, o enchimento seria muito rápido (quase instantâneo).", "✔ O enchimento capilar normal é de até 2 segundos. Um tempo prolongado (5s) é sinal de baixa perfusão, seja por baixo débito cardíaco (choque) ou obstrução arterial local.", "Ambientes frios podem lentificar o enchimento, mas no trauma, devese sempre presumir má perfusão patológica."]},
{id:58,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Ao avaliar a perfusão de um membro fraturado, o médico nota que o tempo de enchimento capilar é de 5 segundos. O que este dado sugere no contexto da avaliação circulatória?",alternativas:["A) Perfusão normal do membro", "B) Hiperemia reativa", "C) Má perfusão tecidual, podendo indicar choque sistêmico ou lesão vascular local", "D) Apenas que o ambiente está muito quente"],correta:2,justificativas:["O valor está claramente alterado (o normal é < 2s).", "Na hiperemia, o enchimento seria muito rápido (quase instantâneo).", "✔ O enchimento capilar normal é de até 2 segundos. Um tempo prolongado (5s) é sinal de baixa perfusão, seja por baixo débito cardíaco (choque) ou obstrução arterial local.", "Ambientes frios podem lentificar o enchimento, mas no trauma, devese sempre presumir má perfusão patológica."]},
{id:59,tema:"Urgências",subtema:"ATLS",dificuldade:"iniciante",enunciado:"Qual nervo é mais frequentemente lesionado em fraturas da diáfise do úmero (terço médio/distal) e qual o sinal clínico resultante?",alternativas:["A) Nervo Ulnar; mão em garra", "B) Nervo Mediano; perda da oponência do polegar", "C) Nervo Radial; \"mão caída\" (incapacidade de extensão do punho e dedos)", "D) Nervo Axilar; perda de abdução do braço"],correta:2,justificativas:["O ulnar é mais lesado em fraturas do cotovelo (epicôndilo medial).", "O mediano é mais comum em luxações de cotovelo ou fraturas de punho.", "✔ O nervo radial corre no sulco do nervo radial, em contato direto com o úmero médio. Fraturas nessa região frequentemente causam neuropraxia, levando à perda da função dos extensores (mão caída).", "O nervo axilar é relacionado a fraturas do colo cirúrgico do úmero ou luxações de ombro. ## Questões Dificeis"]},
{id:60,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Qual nervo é mais frequentemente lesionado em fraturas da diáfise do úmero (terço médio/distal) e qual o sinal clínico resultante?",alternativas:["A) Nervo Ulnar; mão em garra", "B) Nervo Mediano; perda da oponência do polegar", "C) Nervo Radial; \"mão caída\" (incapacidade de extensão do punho e dedos)", "D) Nervo Axilar; perda de abdução do braço"],correta:2,justificativas:["O ulnar é mais lesado em fraturas do cotovelo (epicôndilo medial).", "O mediano é mais comum em luxações de cotovelo ou fraturas de punho.", "✔ O nervo radial corre no sulco do nervo radial, em contato direto com o úmero médio. Fraturas nessa região frequentemente causam neuropraxia, levando à perda da função dos extensores (mão caída).", "O nervo axilar é relacionado a fraturas do colo cirúrgico do úmero ou luxações de ombro. ## Questões Dificeis"]},
{id:61,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Um paciente de 28 anos, vítima de queda de moto, apresenta-se com dor severa em joelho direito e incapacidade de deambular. Ao exame físico, observa-se deformidade grosseira que foi reduzida espontaneamente durante o transporte. O pulso pedioso é palpável, mas o enchimento capilar está lentificado (4 segundos). Qual o diagnóstico de exclusão obrigatório e a conduta diagnóstica prioritária?",alternativas:["A) Luxação de patela; realizar Raio-X em incidência de Merchant", "B) Ruptura do tendão quadricipital; solicitar Ultrassonografia imediata", "C) Luxação de joelho; realizar cálculo do Índice Tornozelo-Braço (IT", "B) e observação vascular seriada"],correta:2,justificativas:["A luxação de patela é dolorosa, mas não costuma cursar com alteração de perfusão distal.", "É uma lesão de partes moles que não justifica a lentificação do enchimento capilar.", "✔ Toda suspeita de luxação de joelho (mesmo as reduzidas espontaneamente) deve ser tratada como uma emergência vascular potencial devido ao risco de lesão da artéria poplítea. O ITB é o primeiro passo na triagem diagnóstica.", "Embora a fratura do platô possa ocorrer, o mecanismo e a alteração vascular direcionam prioritariamente para a exclusão de luxação/lesão arterial."]},
{id:62,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Um paciente de 28 anos, vítima de queda de moto, apresenta-se com dor severa em joelho direito e incapacidade de deambular. Ao exame físico, observa-se deformidade grosseira que foi reduzida espontaneamente durante o transporte. O pulso pedioso é palpável, mas o enchimento capilar está lentificado (4 segundos). Qual o diagnóstico de exclusão obrigatório e a conduta diagnóstica prioritária?",alternativas:["A) Luxação de patela; realizar Raio-X em incidência de Merchant", "B) Ruptura do tendão quadricipital; solicitar Ultrassonografia imediata", "C) Luxação de joelho; realizar cálculo do Índice Tornozelo-Braço (IT", "B) e observação vascular seriada"],correta:2,justificativas:["A luxação de patela é dolorosa, mas não costuma cursar com alteração de perfusão distal.", "É uma lesão de partes moles que não justifica a lentificação do enchimento capilar.", "✔ Toda suspeita de luxação de joelho (mesmo as reduzidas espontaneamente) deve ser tratada como uma emergência vascular potencial devido ao risco de lesão da artéria poplítea. O ITB é o primeiro passo na triagem diagnóstica.", "Embora a fratura do platô possa ocorrer, o mecanismo e a alteração vascular direcionam prioritariamente para a exclusão de luxação/lesão arterial."]},
{id:63,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"No contexto de um trauma torácico, o eFAST (Extended Focal Assessment with Sonography for Trauma) identifica a ausência do sinal de \"deslizamento pleural\" (lung sliding) no 3º espaço intercostal direito de um paciente taquipneico. Qual a interpretação diagnóstica desse achado?",alternativas:["A) Hemotórax volumoso", "B) Contusão pulmonar grave", "C) Pneumotórax", "D) Tamponamento cardíaco"],correta:2,justificativas:["O hemotórax é visualizado como líquido (anecoico) nos recessos pleurais baixos (janelas diafragmáticas), não pela ausência de deslizamento.", "A contusão pulmonar manifestase no ultrassom através de \"linhas B\" (caudas de cometa) ou áreas de consolidação.", "✔ A ausência de deslizamento pleural no ultrassom indica que a pleura visceral e parietal não estão em contato, o que é o sinal patognomônico de pneumotórax no eFAST.", "É avaliado na janela subxifoide através da visualização de líquido no saco pericárdico."]},
{id:64,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"No contexto de um trauma torácico, o eFAST (Extended Focal Assessment with Sonography for Trauma) identifica a ausência do sinal de \"deslizamento pleural\" (lung sliding) no 3º espaço intercostal direito de um paciente taquipneico. Qual a interpretação diagnóstica desse achado?",alternativas:["A) Hemotórax volumoso", "B) Contusão pulmonar grave", "C) Pneumotórax", "D) Tamponamento cardíaco"],correta:2,justificativas:["O hemotórax é visualizado como líquido (anecoico) nos recessos pleurais baixos (janelas diafragmáticas), não pela ausência de deslizamento.", "A contusão pulmonar manifestase no ultrassom através de \"linhas B\" (caudas de cometa) ou áreas de consolidação.", "✔ A ausência de deslizamento pleural no ultrassom indica que a pleura visceral e parietal não estão em contato, o que é o sinal patognomônico de pneumotórax no eFAST.", "É avaliado na janela subxifoide através da visualização de líquido no saco pericárdico."]},
{id:65,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Paciente vítima de atropelamento chega estável, mas com dor pélvica importante. O Raio-X de bacia mostra uma fratura dos quatro ramos pubianos (padrão em borboleta). Qual o mecanismo de trauma provável e o risco associado?",alternativas:["A) Compressão Anteroposterior; alto risco de sangramento retroperitoneal maciço", "B) Compressão Lateral (L", "C) ; risco de lesão de vísceras pélvicas e bexiga", "C) Cisalhamento Vertical; risco de encurtamento do membro"],correta:1,justificativas:["A Compressão AP (Livro Aberto) costuma abrir a sínfise ou causar fraturas verticais dos ramos, não o padrão de quatro ramos por impacto lateral.", "✔ A fratura dos quatro ramos pubianos (estilo \"straddle injury\") é típica de mecanismos de compressão lateral. Embora o anel ósseo pareça instável, o sangramento costuma ser menor que na APC, mas o risco de lesões uretrais e vesicais é alto.", "Exige deslocamento vertical da hemibacia, o que não foi descrito.", "Mecanismo não compatível com o padrão radiográfico de fratura de ramos isolada."]},
{id:66,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Paciente vítima de atropelamento chega estável, mas com dor pélvica importante. O Raio-X de bacia mostra uma fratura dos quatro ramos pubianos (padrão em borboleta). Qual o mecanismo de trauma provável e o risco associado?",alternativas:["A) Compressão Anteroposterior; alto risco de sangramento retroperitoneal maciço", "B) Compressão Lateral (L", "C) ; risco de lesão de vísceras pélvicas e bexiga", "C) Cisalhamento Vertical; risco de encurtamento do membro"],correta:1,justificativas:["A Compressão AP (Livro Aberto) costuma abrir a sínfise ou causar fraturas verticais dos ramos, não o padrão de quatro ramos por impacto lateral.", "✔ A fratura dos quatro ramos pubianos (estilo \"straddle injury\") é típica de mecanismos de compressão lateral. Embora o anel ósseo pareça instável, o sangramento costuma ser menor que na APC, mas o risco de lesões uretrais e vesicais é alto.", "Exige deslocamento vertical da hemibacia, o que não foi descrito.", "Mecanismo não compatível com o padrão radiográfico de fratura de ramos isolada."]},
{id:67,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Durante a avaliação neurológica (letra D) de um politraumatizado, o médico observa que o paciente abre os olhos ao chamado verbal, emite sons incompreensíveis e apresenta retirada inespecífica ao estímulo doloroso. Qual o escore na Escala de Coma de Glasgow atualizada?",alternativas:["A) 8", "B) 9", "C) 10", "D) 11"],correta:1,justificativas:["Alternativa A incorreta.", "✔ Abertura ocular ao som (3) + Resposta verbal com sons incompreensíveis (2) + Resposta motora de retirada/flexão normal (4) = 9.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:68,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Durante a avaliação neurológica (letra D) de um politraumatizado, o médico observa que o paciente abre os olhos ao chamado verbal, emite sons incompreensíveis e apresenta retirada inespecífica ao estímulo doloroso. Qual o escore na Escala de Coma de Glasgow atualizada?",alternativas:["A) 8", "B) 9", "C) 10", "D) 11"],correta:1,justificativas:["Alternativa A incorreta.", "✔ Abertura ocular ao som (3) + Resposta verbal com sons incompreensíveis (2) + Resposta motora de retirada/flexão normal (4) = 9.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:69,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"No diagnóstico diferencial do choque no trauma, qual achado clínico é fundamental para diferenciar o Choque Neurogênico do Choque Hipovolêmico?",alternativas:["A) Nível de consciência preservado", "B) Presença de hipotensão arterial severa", "C) Presença de bradicardia e extremidades quentes", "D) Presença de taquipneia compensatória"],correta:2,justificativas:["Ambos podem cursar com alteração de consciência dependendo da gravidade.", "A hipotensão está presente nos dois tipos de choque.", "✔ O choque neurogênico cursa com perda do tônus simpático (vasodilatação = pele quente) e ausência de taquicardia compensatória (bradicardia), ao contrário do hipovolêmico (taquicardia e vasoconstrição/pele fria).", "A taquipneia pode estar presente em ambos por mecanismos diferentes (acidose vs. lesão medular alta)."]},
{id:70,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"No diagnóstico diferencial do choque no trauma, qual achado clínico é fundamental para diferenciar o Choque Neurogênico do Choque Hipovolêmico?",alternativas:["A) Nível de consciência preservado", "B) Presença de hipotensão arterial severa", "C) Presença de bradicardia e extremidades quentes", "D) Presença de taquipneia compensatória"],correta:2,justificativas:["Ambos podem cursar com alteração de consciência dependendo da gravidade.", "A hipotensão está presente nos dois tipos de choque.", "✔ O choque neurogênico cursa com perda do tônus simpático (vasodilatação = pele quente) e ausência de taquicardia compensatória (bradicardia), ao contrário do hipovolêmico (taquicardia e vasoconstrição/pele fria).", "A taquipneia pode estar presente em ambos por mecanismos diferentes (acidose vs. lesão medular alta)."]},
{id:71,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Paciente de 40 anos com fratura exposta de tíbia Gustilo IIIA após 6 horas do trauma. No exame físico, observa-se creptação gasosa ao redor da ferida e odor fétido. Qual o diagnóstico clínico e o agente etiológico mais temido?",alternativas:["A) Osteomielite estafilocócica", "B) Gangrena gasosa; Clostridium perfringens", "C) Fascite necrosante por Streptococcus pyogenes", "D) Infecção por Pseudomonas aeruginosa"],correta:1,justificativas:["A osteomielite aguda demora dias/semanas para se manifestar e raramente produz gás.", "✔ A crepitação gasosa (presença de gás nos tecidos) e o odor fétido em feridas traumáticas contaminadas sugerem gangrena gasosa por clostrídios anaeróbicos.", "A fascite necrosante pode ter gás (se polimicrobiana), mas a associação com trauma ósseo contaminado e crepitação rápida direciona para mionecrose clostridiana.", "Pseudomonas é comum em infecções hospitalares ou feridas por prego no pé, tipicamente apresentando secreção esverdeada, não gás."]},
{id:72,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Paciente de 40 anos com fratura exposta de tíbia Gustilo IIIA após 6 horas do trauma. No exame físico, observa-se creptação gasosa ao redor da ferida e odor fétido. Qual o diagnóstico clínico e o agente etiológico mais temido?",alternativas:["A) Osteomielite estafilocócica", "B) Gangrena gasosa; Clostridium perfringens", "C) Fascite necrosante por Streptococcus pyogenes", "D) Infecção por Pseudomonas aeruginosa"],correta:1,justificativas:["A osteomielite aguda demora dias/semanas para se manifestar e raramente produz gás.", "✔ A crepitação gasosa (presença de gás nos tecidos) e o odor fétido em feridas traumáticas contaminadas sugerem gangrena gasosa por clostrídios anaeróbicos.", "A fascite necrosante pode ter gás (se polimicrobiana), mas a associação com trauma ósseo contaminado e crepitação rápida direciona para mionecrose clostridiana.", "Pseudomonas é comum em infecções hospitalares ou feridas por prego no pé, tipicamente apresentando secreção esverdeada, não gás."]},
{id:73,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Na suspeita de lesão da uretra membranosa em um paciente com fratura de bacia, qual sinal clínico, além do sangue no meato, é mais indicativo de ruptura uretral no exame retal?",alternativas:["A) Esfíncter anal hipotônico", "B) Presença de fecaloma", "C) Próstata não palpável ou \"cefalizada\"", "D) Hemorroidas externas trombosadas"],correta:2,justificativas:["Sugere lesão neurológica sacral ou choque medular, não especificamente lesão uretral.", "Alternativa B incorreta.", "✔ A ruptura da uretra membranosa permite que a próstata se desloque superiormente devido ao hematoma pélvico, tornandoa difícil de palpar no toque retal.", "Alternativa D incorreta."]},
{id:74,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Na suspeita de lesão da uretra membranosa em um paciente com fratura de bacia, qual sinal clínico, além do sangue no meato, é mais indicativo de ruptura uretral no exame retal?",alternativas:["A) Esfíncter anal hipotônico", "B) Presença de fecaloma", "C) Próstata não palpável ou \"cefalizada\"", "D) Hemorroidas externas trombosadas"],correta:2,justificativas:["Sugere lesão neurológica sacral ou choque medular, não especificamente lesão uretral.", "Alternativa B incorreta.", "✔ A ruptura da uretra membranosa permite que a próstata se desloque superiormente devido ao hematoma pélvico, tornandoa difícil de palpar no toque retal.", "Alternativa D incorreta."]},
{id:75,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Qual o sinal clínico que indica o fim da fase de Choque Medular e o início da fase de lesão medular definitiva em um paciente com trauma raquimedular?",alternativas:["A) Retorno do reflexo bulbocavernoso", "B) Recuperação da força motora nos membros inferiores", "C) Normalização da pressão arterial", "D) Aparecimento de espasticidade muscular imediata"],correta:0,justificativas:["✔ O choque medular é uma arreflexia total. O retorno do reflexo bulbocavernoso (contração do esfíncter anal ao apertar a glande ou clitóris) marca o fim do choque medular. Se a paralisia persistir após isso, a lesão é considerada completa/definitiva.", "A recuperação da força indica que a lesão foi incompleta ou apenas concussão, não define o fim do choque medular.", "A PA se normaliza no choque neurogênico, que é diferente de choque medular (fenômeno elétrico/reflexo).", "A espasticidade é um fenômeno tardio (semanas após o trauma)."]},
{id:76,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Qual o sinal clínico que indica o fim da fase de Choque Medular e o início da fase de lesão medular definitiva em um paciente com trauma raquimedular?",alternativas:["A) Retorno do reflexo bulbocavernoso", "B) Recuperação da força motora nos membros inferiores", "C) Normalização da pressão arterial", "D) Aparecimento de espasticidade muscular imediata"],correta:0,justificativas:["✔ O choque medular é uma arreflexia total. O retorno do reflexo bulbocavernoso (contração do esfíncter anal ao apertar a glande ou clitóris) marca o fim do choque medular. Se a paralisia persistir após isso, a lesão é considerada completa/definitiva.", "A recuperação da força indica que a lesão foi incompleta ou apenas concussão, não define o fim do choque medular.", "A PA se normaliza no choque neurogênico, que é diferente de choque medular (fenômeno elétrico/reflexo).", "A espasticidade é um fenômeno tardio (semanas após o trauma)."]},
{id:77,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Um paciente apresenta dor importante no retropé após queda de escada de 3 metros de altura. O Raio-X confirma fratura de calcâneo. Qual outro segmento esquelético deve ser obrigatoriamente avaliado com exames de imagem devido à associação frequente por mecanismo de carga axial?",alternativas:["A) Punho (Rádio distal)", "B) Coluna Toracolombar (Transição T12-L1)", "C) Crânio", "D) Escápula"],correta:1,justificativas:["Alternativa A incorreta.", "✔ O mecanismo de queda de altura (carga axial) transmite energia dos calcanhares para a coluna. Cerca de 10% dos pacientes com fratura de calcâneo possuem fratura vertebral associada (geralmente por compressão).", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:78,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Um paciente apresenta dor importante no retropé após queda de escada de 3 metros de altura. O Raio-X confirma fratura de calcâneo. Qual outro segmento esquelético deve ser obrigatoriamente avaliado com exames de imagem devido à associação frequente por mecanismo de carga axial?",alternativas:["A) Punho (Rádio distal)", "B) Coluna Toracolombar (Transição T12-L1)", "C) Crânio", "D) Escápula"],correta:1,justificativas:["Alternativa A incorreta.", "✔ O mecanismo de queda de altura (carga axial) transmite energia dos calcanhares para a coluna. Cerca de 10% dos pacientes com fratura de calcâneo possuem fratura vertebral associada (geralmente por compressão).", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:79,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"No manejo de uma fratura exposta de fêmur, o paciente apresenta-se estável após a reanimação inicial. Qual o diagnóstico prioritário a ser descartado antes de encaminhar o paciente para a fixação cirúrgica definitiva?",alternativas:["A) Deficiência de Vitamina D", "B) Lesão vascular oculta ou Síndrome Compartimental incipiente", "C) Tipo de bactéria exata que contaminou a ferida", "D) Presença de osteoporose"],correta:1,justificativas:["Alternativa A incorreta.", "✔ No nível intermediário (avaliação), o médico deve sempre buscar complicações que ameaçam o membro (limbthreatening), como lesões vasculares ou aumento de pressão compartimental, antes do tratamento ósseo definitivo.", "A identificação bacteriana exata leva dias; o tratamento inicial é baseado em antibioticoterapia empírica.", "Alternativa D incorreta."]},
{id:80,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"No manejo de uma fratura exposta de fêmur, o paciente apresenta-se estável após a reanimação inicial. Qual o diagnóstico prioritário a ser descartado antes de encaminhar o paciente para a fixação cirúrgica definitiva?",alternativas:["A) Deficiência de Vitamina D", "B) Lesão vascular oculta ou Síndrome Compartimental incipiente", "C) Tipo de bactéria exata que contaminou a ferida", "D) Presença de osteoporose"],correta:1,justificativas:["Alternativa A incorreta.", "✔ No nível intermediário (avaliação), o médico deve sempre buscar complicações que ameaçam o membro (limbthreatening), como lesões vasculares ou aumento de pressão compartimental, antes do tratamento ósseo definitivo.", "A identificação bacteriana exata leva dias; o tratamento inicial é baseado em antibioticoterapia empírica.", "Alternativa D incorreta."]},
{id:81,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Durante a avaliação do \"B\" (Breathing) de um paciente vítima de colisão frontal, observa-se turgência jugular, hipotensão e murmúrio vesicular universalmente audível, porém com abafamento de bulhas cardíacas. Qual o diagnóstico clínico mais provável?",alternativas:["A) Pneumotórax Hipertensivo", "B) Hemotórax Maciço", "C) Tamponamento Cardíaco", "D) Contusão Pulmonar"],correta:2,justificativas:["No pneumotórax hipertensivo, haveria ausência ou diminuição do murmúrio vesicular no lado afetado e hipertimpanismo à percussão.", "No hemotórax maciço, haveria macicez à percussão e as veias cervicais costumam estar colabadas devido à hipovolemia, não túrgidas.", "✔ A tríade de Beck (hipotensão, turgência jugular e abafamento de bulhas) é o sinal clássico de tamponamento cardíaco. Diferenciase do pneumotórax hipertensivo pela presença de murmúrio vesicular bilateral.", "A contusão pulmonar causa hipóxia e alterações no RX, mas não cursa tipicamente com a tríade de Beck."]},
{id:82,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Durante a avaliação do \"B\" (Breathing) de um paciente vítima de colisão frontal, observa-se turgência jugular, hipotensão e murmúrio vesicular universalmente audível, porém com abafamento de bulhas cardíacas. Qual o diagnóstico clínico mais provável?",alternativas:["A) Pneumotórax Hipertensivo", "B) Hemotórax Maciço", "C) Tamponamento Cardíaco", "D) Contusão Pulmonar"],correta:2,justificativas:["No pneumotórax hipertensivo, haveria ausência ou diminuição do murmúrio vesicular no lado afetado e hipertimpanismo à percussão.", "No hemotórax maciço, haveria macicez à percussão e as veias cervicais costumam estar colabadas devido à hipovolemia, não túrgidas.", "✔ A tríade de Beck (hipotensão, turgência jugular e abafamento de bulhas) é o sinal clássico de tamponamento cardíaco. Diferenciase do pneumotórax hipertensivo pela presença de murmúrio vesicular bilateral.", "A contusão pulmonar causa hipóxia e alterações no RX, mas não cursa tipicamente com a tríade de Beck."]},
{id:83,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"No atendimento pré-hospitalar de um trauma pélvico de alta energia, o médico suspeita de fratura de bacia. Qual é a recomendação do ATLS quanto à manobra de compressão/distração das cristas ilíacas para avaliação de instabilidade?",alternativas:["A) Deve ser realizada repetidamente por cada membro da equipe para confirmar o diagnóstico", "B) Deve ser realizada apenas uma vez por um examinador experiente para evitar o deslocamento de coágulos", "C) É contraindicada em todos os casos de trauma, sendo substituída pelo Raio-X", "D) Deve ser feita com força máxima para testar a resistência mecânica dos ligamentos"],correta:1,justificativas:["A repetição aumenta o risco de choque hemorrágico grave.", "✔ A manipulação repetida da bacia instável pode romper coágulos recémformados e agravar a hemorragia retroperitoneal. Se a instabilidade já for óbvia, não se deve repetir a manobra.", "Não é contraindicada, é uma manobra do exame físico, mas deve ser criteriosa.", "A manobra deve ser gentil, buscando apenas perceber a crepitação ou mobilidade anormal."]},
{id:84,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"No atendimento pré-hospitalar de um trauma pélvico de alta energia, o médico suspeita de fratura de bacia. Qual é a recomendação do ATLS quanto à manobra de compressão/distração das cristas ilíacas para avaliação de instabilidade?",alternativas:["A) Deve ser realizada repetidamente por cada membro da equipe para confirmar o diagnóstico", "B) Deve ser realizada apenas uma vez por um examinador experiente para evitar o deslocamento de coágulos", "C) É contraindicada em todos os casos de trauma, sendo substituída pelo Raio-X", "D) Deve ser feita com força máxima para testar a resistência mecânica dos ligamentos"],correta:1,justificativas:["A repetição aumenta o risco de choque hemorrágico grave.", "✔ A manipulação repetida da bacia instável pode romper coágulos recémformados e agravar a hemorragia retroperitoneal. Se a instabilidade já for óbvia, não se deve repetir a manobra.", "Não é contraindicada, é uma manobra do exame físico, mas deve ser criteriosa.", "A manobra deve ser gentil, buscando apenas perceber a crepitação ou mobilidade anormal."]},
{id:85,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Paciente jovem, vítima de queda de moto, apresenta-se com Frequência Cardíaca (FC) de 125 bpm, Pressão Arterial (PA) de 90/60 mmHg e débito urinário reduzido (cerca de 10 ml/h). De acordo com a classificação de choque do ATLS, em qual classe este paciente se encontra?",alternativas:["A) Classe I", "B) Classe II", "C) Classe III", "D) Classe IV"],correta:2,justificativas:["Classe I apresenta sinais vitais normais ou leve taquicardia.", "Classe II apresenta taquicardia (100120), mas a PA costuma estar preservada devido à vasoconstrição periférica.", "✔ O Choque Classe III é caracterizado por taquicardia acentuada (>120), queda da pressão arterial sistólica e oligúria nítida. É o estágio onde os mecanismos compensatórios falham em manter a PA.", "Classe IV envolve perda >40% do volume, com FC >140 e alteração grave do nível de consciência (letargia)."]},
{id:86,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Paciente jovem, vítima de queda de moto, apresenta-se com Frequência Cardíaca (FC) de 125 bpm, Pressão Arterial (PA) de 90/60 mmHg e débito urinário reduzido (cerca de 10 ml/h). De acordo com a classificação de choque do ATLS, em qual classe este paciente se encontra?",alternativas:["A) Classe I", "B) Classe II", "C) Classe III", "D) Classe IV"],correta:2,justificativas:["Classe I apresenta sinais vitais normais ou leve taquicardia.", "Classe II apresenta taquicardia (100120), mas a PA costuma estar preservada devido à vasoconstrição periférica.", "✔ O Choque Classe III é caracterizado por taquicardia acentuada (>120), queda da pressão arterial sistólica e oligúria nítida. É o estágio onde os mecanismos compensatórios falham em manter a PA.", "Classe IV envolve perda >40% do volume, com FC >140 e alteração grave do nível de consciência (letargia)."]},
{id:87,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Na realização do exame eFAST (Extended Focal Assessment with Sonography for Trauma), qual janela adicional é incorporada em relação ao FAST convencional para avaliar o tórax?",alternativas:["A) Janela pericárdica subxifoide", "B) Espaço de Morrison (hepatorrenal)", "C) Espaço esplenorrenal", "D) Espaços pleurais bilaterais (região anterior do tórax)"],correta:3,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "Alternativa C incorreta.", "✔ O \"e\" do eFAST referese à extensão para o tórax, buscando identificar o \"deslizamento pleural\" (lung sliding). A ausência deste sinal sugere pneumotórax."]},
{id:88,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Na realização do exame eFAST (Extended Focal Assessment with Sonography for Trauma), qual janela adicional é incorporada em relação ao FAST convencional para avaliar o tórax?",alternativas:["A) Janela pericárdica subxifoide", "B) Espaço de Morrison (hepatorrenal)", "C) Espaço esplenorrenal", "D) Espaços pleurais bilaterais (região anterior do tórax)"],correta:3,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "Alternativa C incorreta.", "✔ O \"e\" do eFAST referese à extensão para o tórax, buscando identificar o \"deslizamento pleural\" (lung sliding). A ausência deste sinal sugere pneumotórax."]},
{id:89,tema:"Urgências",subtema:"ATLS",dificuldade:"avançado",enunciado:"Um paciente apresenta-se após queda de altura com hematoma periorbitário bilateral (\"olhos de guaxinim\") e saída de líquido claro pelo nariz (rinorreia). Qual a principal suspeita diagnóstica?",alternativas:["A) Fratura de mandíbula", "B) Fratura de base de crânio", "C) Fratura de coluna cervical alta (C1-C2)", "D) Lesão isolada de septo nasal"],correta:1,justificativas:["Fraturas de mandíbula causam má oclusão dentária e dor local, não hematoma periorbitário bilateral.", "✔ Olhos de guaxinim, sinal de Battle (hematoma retroauricular) e fístula liquórica (rinorreia/otorreia) são sinais clínicos clássicos de fratura da base do crânio.", "Lesões de C1C2 causam dor cervical e déficits neurológicos, mas não fístula liquórica nasal.", "Uma lesão isolada de septo não explicaria o hematoma periorbitário bilateral sistêmico."]},
{id:90,tema:"Urgências",subtema:"ATLS",dificuldade:"intermediário",enunciado:"Um paciente apresenta-se após queda de altura com hematoma periorbitário bilateral (\"olhos de guaxinim\") e saída de líquido claro pelo nariz (rinorreia). Qual a principal suspeita diagnóstica?",alternativas:["A) Fratura de mandíbula", "B) Fratura de base de crânio", "C) Fratura de coluna cervical alta (C1-C2)", "D) Lesão isolada de septo nasal"],correta:1,justificativas:["Fraturas de mandíbula causam má oclusão dentária e dor local, não hematoma periorbitário bilateral.", "✔ Olhos de guaxinim, sinal de Battle (hematoma retroauricular) e fístula liquórica (rinorreia/otorreia) são sinais clínicos clássicos de fratura da base do crânio.", "Lesões de C1C2 causam dor cervical e déficits neurológicos, mas não fístula liquórica nasal.", "Uma lesão isolada de septo não explicaria o hematoma periorbitário bilateral sistêmico."]},
