{id:202,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Paciente vítima de queda de altura apresenta fratura exposta de fêmur. Ao exame, nota-se ferida de 4 cm com moderada contaminação e esmagamento muscular localizado, mas a pele permite cobertura completa do osso sem tensão. Qual a classificação?",alternativas:["A) Grau I", "B) Grau II", "C) Grau IIIA", "D) Grau IIIB"],correta:1,justificativas:["Feridas > 1 cm saem do Grau I.", "✔ O Grau II é definido por feridas entre 1 e 10 cm, com dano de partes moles moderado e, fundamentalmente, onde a cobertura cutânea do osso ainda é possível.", "O Grau III envolve alta energia, cominuição severa ou feridas > 10 cm.", "Exigiria a necessidade de retalho (falha de cobertura cutânea)."]},
{id:203,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"avançado",enunciado:"Um adolescente de 14 anos apresenta dor no joelho após entorse no futebol. O RX mostra um traço de fratura que atravessa a metáfise distal do fêmur e se estende horizontalmente pela placa de crescimento. A epífise está preservada. Classifique a lesão:",alternativas:["A) Salter-Harris I", "B) Salter-Harris II", "C) Salter-Harris III", "D) Salter-Harris IV"],correta:1,justificativas:["Não haveria acometimento ósseo (apenas fise).", "✔ A combinação de traço na fise com um fragmento metafisário (Sinal de ThurstonHolland) define o Tipo II, o mais comum da infância.", "O Tipo III acomete a epífise, não a metáfise.", "Exigiria um traço vertical cruzando metáfise, fise e epífise."]},
{id:204,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"Um adolescente de 14 anos apresenta dor no joelho após entorse no futebol. O RX mostra um traço de fratura que atravessa a metáfise distal do fêmur e se estende horizontalmente pela placa de crescimento. A epífise está preservada. Classifique a lesão:",alternativas:["A) Salter-Harris I", "B) Salter-Harris II", "C) Salter-Harris III", "D) Salter-Harris IV"],correta:1,justificativas:["Não haveria acometimento ósseo (apenas fise).", "✔ A combinação de traço na fise com um fragmento metafisário (Sinal de ThurstonHolland) define o Tipo II, o mais comum da infância.", "O Tipo III acomete a epífise, não a metáfise.", "Exigiria um traço vertical cruzando metáfise, fise e epífise."]},
{id:205,tema:"Classificações",subtema:"ASA",dificuldade:"avançado",enunciado:"Paciente de 40 anos, IMC = 42 $kg/m^2$, sem outras doenças diagnosticadas, será submetido a uma artroscopia de ombro eletiva. Qual o seu estado físico ASA?",alternativas:["A) ASA I", "B) ASA II", "C) ASA III", "D) ASA IV"],correta:2,justificativas:["O paciente tem uma condição patológica (obesidade).", "Obesidade classe I e II (IMC < 40) são ASA II; acima de 40 passa a ser III.", "✔ De acordo com as atualizações da ASA, a Obesidade Mórbida (IMC > 40) é classificada automaticamente como ASA III (doença sistêmica grave).", "Não há menção de risco iminente à vida."]},
{id:206,tema:"Classificações",subtema:"ASA",dificuldade:"intermediário",enunciado:"Paciente de 40 anos, IMC = 42 $kg/m^2$, sem outras doenças diagnosticadas, será submetido a uma artroscopia de ombro eletiva. Qual o seu estado físico ASA?",alternativas:["A) ASA I", "B) ASA II", "C) ASA III", "D) ASA IV"],correta:2,justificativas:["O paciente tem uma condição patológica (obesidade).", "Obesidade classe I e II (IMC < 40) são ASA II; acima de 40 passa a ser III.", "✔ De acordo com as atualizações da ASA, a Obesidade Mórbida (IMC > 40) é classificada automaticamente como ASA III (doença sistêmica grave).", "Não há menção de risco iminente à vida."]},
{id:207,tema:"Classificações",subtema:"Mallampati",dificuldade:"avançado",enunciado:"Durante a avaliação de via aérea, você observa que, ao abrir a boca e colocar a língua para fora, visualiza-se o palato mole e apenas a base da úvula. Os pilares amigdalianos estão cobertos pela língua. Qual a conduta diagnóstica correta?",alternativas:["A) Mallampati II; baixo risco de via aérea difícil", "B) Mallampati III; provável dificuldade na laringoscopia", "C) Mallampati IV; contraindicação para anestesia geral", "D) Mallampati I; visualização total da glote"],correta:1,justificativas:["No Grau II, veríamos a úvula quase toda.", "✔ A visualização apenas do palato mole e da base da úvula caracteriza o Grau III, um sinal clássico de alerta para via aérea difícil.", "Grau IV não veria o palato mole; não contraindica a anestesia, mas exige preparo (ex: videolaringoscópio).", "No Grau I, os pilares e a úvula estariam totalmente visíveis."]},
{id:208,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Durante a avaliação de via aérea, você observa que, ao abrir a boca e colocar a língua para fora, visualiza-se o palato mole e apenas a base da úvula. Os pilares amigdalianos estão cobertos pela língua. Qual a conduta diagnóstica correta?",alternativas:["A) Mallampati II; baixo risco de via aérea difícil", "B) Mallampati III; provável dificuldade na laringoscopia", "C) Mallampati IV; contraindicação para anestesia geral", "D) Mallampati I; visualização total da glote"],correta:1,justificativas:["No Grau II, veríamos a úvula quase toda.", "✔ A visualização apenas do palato mole e da base da úvula caracteriza o Grau III, um sinal clássico de alerta para via aérea difícil.", "Grau IV não veria o palato mole; não contraindica a anestesia, mas exige preparo (ex: videolaringoscópio).", "No Grau I, os pilares e a úvula estariam totalmente visíveis."]},
{id:209,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"avançado",enunciado:"Uma criança sofre esmagamento da extremidade distal do rádio. O RX inicial é inconclusivo, apresentando apenas um leve edema. Seis meses depois, nota-se desvio em varo do punho por parada de crescimento focal. Qual o tipo de lesão provável?",alternativas:["A) Salter-Harris II", "B) Salter-Harris III", "C) Salter-Harris IV", "D) Salter-Harris V"],correta:3,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "Alternativa C incorreta.", "✔ O Tipo V é uma lesão por compressão/esmagamento da fise. É de difícil diagnóstico inicial por não apresentar traço de fratura óbvio, manifestandose tardiamente por distúrbios de crescimento."]},
{id:210,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"Uma criança sofre esmagamento da extremidade distal do rádio. O RX inicial é inconclusivo, apresentando apenas um leve edema. Seis meses depois, nota-se desvio em varo do punho por parada de crescimento focal. Qual o tipo de lesão provável?",alternativas:["A) Salter-Harris II", "B) Salter-Harris III", "C) Salter-Harris IV", "D) Salter-Harris V"],correta:3,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "Alternativa C incorreta.", "✔ O Tipo V é uma lesão por compressão/esmagamento da fise. É de difícil diagnóstico inicial por não apresentar traço de fratura óbvio, manifestandose tardiamente por distúrbios de crescimento."]},
{id:211,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"avançado",enunciado:"Paciente apresenta fratura exposta de tíbia após ferimento por projétil de arma de fogo (baixa velocidade). A ferida de entrada tem 1,5 cm. Como deve ser classificada?",alternativas:["A) Grau I", "B) Grau II", "C) Grau III", "D) Grau IIIC"],correta:2,justificativas:["e B: Não contemplam o mecanismo de alta energia cinética do PAF.", "Alternativa B incorreta.", "✔ Ferimentos por arma de fogo (PAF) são considerados lesões de alta energia devido à cavitação e dissipação de energia, sendo classificados como Grau III independentemente do tamanho da ferida na pele.", "Só seria C se houvesse lesão arterial comprovada."]},
{id:212,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Paciente apresenta fratura exposta de tíbia após ferimento por projétil de arma de fogo (baixa velocidade). A ferida de entrada tem 1,5 cm. Como deve ser classificada?",alternativas:["A) Grau I", "B) Grau II", "C) Grau III", "D) Grau IIIC"],correta:2,justificativas:["e B: Não contemplam o mecanismo de alta energia cinética do PAF.", "Alternativa B incorreta.", "✔ Ferimentos por arma de fogo (PAF) são considerados lesões de alta energia devido à cavitação e dissipação de energia, sendo classificados como Grau III independentemente do tamanho da ferida na pele.", "Só seria C se houvesse lesão arterial comprovada."]},
{id:213,tema:"Classificações",subtema:"ASA",dificuldade:"avançado",enunciado:"Um idoso de 80 anos sofre fratura de colo de fêmur. Tem histórico de insuficiência cardíaca congestiva (ICC) e cansa-se ao tomar banho (pequenos esforços). Será operado em caráter de urgência. Classifique:",alternativas:["A) ASA II-E", "B) ASA III-E", "C) ASA IV", "D) ASA V-E"],correta:1,justificativas:["A limitação funcional exclui o ASA II (doença leve).", "✔ Doença sistêmica grave que limita a atividade funcional (ICC com cansaço aos pequenos esforços) define o ASA III. O sufixo \"E\" é obrigatório por se tratar de uma urgência ortopédica.", "ASA IV indicaria uma ameaça constante à vida (ex: ICC descompensada em repouso).", "O paciente não está moribundo."]},
{id:214,tema:"Classificações",subtema:"ASA",dificuldade:"intermediário",enunciado:"Um idoso de 80 anos sofre fratura de colo de fêmur. Tem histórico de insuficiência cardíaca congestiva (ICC) e cansa-se ao tomar banho (pequenos esforços). Será operado em caráter de urgência. Classifique:",alternativas:["A) ASA II-E", "B) ASA III-E", "C) ASA IV", "D) ASA V-E"],correta:1,justificativas:["A limitação funcional exclui o ASA II (doença leve).", "✔ Doença sistêmica grave que limita a atividade funcional (ICC com cansaço aos pequenos esforços) define o ASA III. O sufixo \"E\" é obrigatório por se tratar de uma urgência ortopédica.", "ASA IV indicaria uma ameaça constante à vida (ex: ICC descompensada em repouso).", "O paciente não está moribundo."]},
{id:215,tema:"Classificações",subtema:"Mallampati",dificuldade:"avançado",enunciado:"Em qual das seguintes situações a classificação de Mallampati pode ser falsamente subestimada (parecer mais fácil do que realmente é)?",alternativas:["A) Se o paciente fonar (\"dizer Ah\") durante o exame", "B) Se o paciente estiver com a boca fechada", "C) Se o paciente estiver em jejum", "D) Se o médico utilizar um abaixador de língua"],correta:0,justificativas:["✔ A fonação eleva o palato mole voluntariamente, o que pode dar uma falsa impressão de que a via aérea é Grau I ou II, quando na verdade é III ou IV.", "Impossibilita o exame.", "O jejum não altera a anatomia da orofaringe.", "O uso de abaixador de língua não faz parte da técnica original de Mallampati (que deve ser feita apenas com protrusão da língua)."]},
{id:216,tema:"Classificações",subtema:"Mallampati",dificuldade:"intermediário",enunciado:"Em qual das seguintes situações a classificação de Mallampati pode ser falsamente subestimada (parecer mais fácil do que realmente é)?",alternativas:["A) Se o paciente fonar (\"dizer Ah\") durante o exame", "B) Se o paciente estiver com a boca fechada", "C) Se o paciente estiver em jejum", "D) Se o médico utilizar um abaixador de língua"],correta:0,justificativas:["✔ A fonação eleva o palato mole voluntariamente, o que pode dar uma falsa impressão de que a via aérea é Grau I ou II, quando na verdade é III ou IV.", "Impossibilita o exame.", "O jejum não altera a anatomia da orofaringe.", "O uso de abaixador de língua não faz parte da técnica original de Mallampati (que deve ser feita apenas com protrusão da língua)."]},
{id:217,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"avançado",enunciado:"Uma fratura que cruza verticalmente a epífise, a fise e a metáfise é classificada como Tipo IV. Qual a principal preocupação biológica desta lesão?",alternativas:["A) Apenas a dor crônica", "B) O risco de formação de uma ponte óssea (fise fechada precocemente) cruzando a placa de crescimento", "C) A cicatrização mais rápida por envolver a metáfise", "D) Não há risco, pois atinge apenas a zona hipertrófica"],correta:1,justificativas:["É uma preocupação, mas o distúrbio de crescimento é o risco principal.", "✔ Por cruzar todas as camadas da fise e alinhar osso metafisário com epifisário, há um alto risco de comunicação óssea, travando o crescimento daquela região.", "Pelo contrário, a complexidade dificulta a redução anatômica.", "Acomete as camadas germinativas, sendo de alto risco."]},
{id:218,tema:"Classificações",subtema:"Salter-Harris",dificuldade:"intermediário",enunciado:"Uma fratura que cruza verticalmente a epífise, a fise e a metáfise é classificada como Tipo IV. Qual a principal preocupação biológica desta lesão?",alternativas:["A) Apenas a dor crônica", "B) O risco de formação de uma ponte óssea (fise fechada precocemente) cruzando a placa de crescimento", "C) A cicatrização mais rápida por envolver a metáfise", "D) Não há risco, pois atinge apenas a zona hipertrófica"],correta:1,justificativas:["É uma preocupação, mas o distúrbio de crescimento é o risco principal.", "✔ Por cruzar todas as camadas da fise e alinhar osso metafisário com epifisário, há um alto risco de comunicação óssea, travando o crescimento daquela região.", "Pelo contrário, a complexidade dificulta a redução anatômica.", "Acomete as camadas germinativas, sendo de alto risco."]},
{id:219,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"avançado",enunciado:"Você atende um paciente com fratura exposta ocorrida em ambiente rural (curral). A ferida é pequena (2 cm), mas está repleta de detritos orgânicos. Qual o Grau de Gustilo?",alternativas:["A) Grau I", "B) Grau II", "C) Grau III", "D) Grau IIIB"],correta:2,justificativas:["e B: O critério de contaminação severa sobrepõese ao tamanho da ferida nestes graus.", "Alternativa B incorreta.", "✔ Contaminação maciça ou exposição em ambientes altamente contaminados (terreno agrícola, esgoto, curral) eleva a fratura automaticamente para o Grau III, independente do tamanho da ferida.", "IIIB exige falta de cobertura cutânea, o que não foi citado."]},
{id:220,tema:"Classificações",subtema:"Gustilo-Anderson",dificuldade:"intermediário",enunciado:"Você atende um paciente com fratura exposta ocorrida em ambiente rural (curral). A ferida é pequena (2 cm), mas está repleta de detritos orgânicos. Qual o Grau de Gustilo?",alternativas:["A) Grau I", "B) Grau II", "C) Grau III", "D) Grau IIIB"],correta:2,justificativas:["e B: O critério de contaminação severa sobrepõese ao tamanho da ferida nestes graus.", "Alternativa B incorreta.", "✔ Contaminação maciça ou exposição em ambientes altamente contaminados (terreno agrícola, esgoto, curral) eleva a fratura automaticamente para o Grau III, independente do tamanho da ferida.", "IIIB exige falta de cobertura cutânea, o que não foi citado."]},
{id:221,tema:"Coluna",subtema:"TRM",dificuldade:"iniciante",enunciado:"O Traumatismo Raquimedular (TRM) é definido tecnicamente como:",alternativas:["A) Qualquer entorse leve da musculatura paravertebral sem sinais de dor", "B) Uma lesão da coluna vertebral associada a comprometimento neurológico potencial ou estabelecido", "C) A presença isolada de uma hérnia de disco degenerativa no idoso", "D) Apenas fraturas ósseas da coluna que não envolvem tecidos moles ou sistema nervoso"],correta:1,justificativas:["Lesões musculares isoladas são classificadas como estiramentos ou entorses simples, não TRM.", "✔ O TRM envolve a agressão à coluna vertebral (seja óssea, ligamentar ou discal) que resulta em dano real ou risco iminente de lesão à medula espinal ou raízes nervosas.", "A hérnia degenerativa é um processo crônico, enquanto o TRM pressupõe um evento traumático agudo.", "Fraturas que não possuem risco ou dano neurológico podem ser apenas fraturas vertebrais; o termo \"raquimedular\" exige a interface com o componente neural."]},
{id:222,tema:"Coluna",subtema:"TRM",dificuldade:"intermediário",enunciado:"O Traumatismo Raquimedular (TRM) é definido tecnicamente como:",alternativas:["A) Qualquer entorse leve da musculatura paravertebral sem sinais de dor", "B) Uma lesão da coluna vertebral associada a comprometimento neurológico potencial ou estabelecido", "C) A presença isolada de uma hérnia de disco degenerativa no idoso", "D) Apenas fraturas ósseas da coluna que não envolvem tecidos moles ou sistema nervoso"],correta:1,justificativas:["Lesões musculares isoladas são classificadas como estiramentos ou entorses simples, não TRM.", "✔ O TRM envolve a agressão à coluna vertebral (seja óssea, ligamentar ou discal) que resulta em dano real ou risco iminente de lesão à medula espinal ou raízes nervosas.", "A hérnia degenerativa é um processo crônico, enquanto o TRM pressupõe um evento traumático agudo.", "Fraturas que não possuem risco ou dano neurológico podem ser apenas fraturas vertebrais; o termo \"raquimedular\" exige a interface com o componente neural."]},
{id:223,tema:"Coluna",subtema:"TRM",dificuldade:"iniciante",enunciado:"O \"Choque Medular\" é um fenômeno clínico caracterizado primordialmente por:",alternativas:["A) Hipertensão arterial severa e taquicardia imediata", "B) Febre alta persistente e tremores generalizados", "C) Perda temporária de todas as funções motoras, sensitivas e reflexas abaixo do nível da lesão", "D) Convulsões tônico-clônicas devido ao trauma craniano associado"],correta:2,justificativas:["O choque neurogênico (frequentemente associado) causa hipotensão e bradicardia, e não hipertensão.", "Febre não é um critério definidor de choque medular.", "✔ O choque medular é um estado de arreflexia e perda funcional total (motora e sensitiva) que ocorre imediatamente após a lesão medular, sendo muitas vezes transitório.", "Convulsões indicam atividade cerebral, não sendo características de uma lesão restrita à medula."]},
{id:224,tema:"Coluna",subtema:"TRM",dificuldade:"intermediário",enunciado:"O \"Choque Medular\" é um fenômeno clínico caracterizado primordialmente por:",alternativas:["A) Hipertensão arterial severa e taquicardia imediata", "B) Febre alta persistente e tremores generalizados", "C) Perda temporária de todas as funções motoras, sensitivas e reflexas abaixo do nível da lesão", "D) Convulsões tônico-clônicas devido ao trauma craniano associado"],correta:2,justificativas:["O choque neurogênico (frequentemente associado) causa hipotensão e bradicardia, e não hipertensão.", "Febre não é um critério definidor de choque medular.", "✔ O choque medular é um estado de arreflexia e perda funcional total (motora e sensitiva) que ocorre imediatamente após a lesão medular, sendo muitas vezes transitório.", "Convulsões indicam atividade cerebral, não sendo características de uma lesão restrita à medula."]},
{id:225,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"Na anatomia funcional da coluna cervical, o nível neurológico responsável pela extensão do punho é:",alternativas:["A) C4", "B) C5", "C) C6", "D) C7"],correta:2,justificativas:["C4 está relacionado à função respiratória (diafragma).", "C5 é responsável pela flexão do cotovelo (bíceps).", "✔ Segundo os padrões diagnósticos (como a escala ASIA), a extensão do punho (músculos extensores radiais) é o marcador motor do nível neurológico C6.", "C7 é responsável pela extensão do cotovelo (tríceps)."]},
{id:226,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"Na anatomia funcional da coluna cervical, o nível neurológico responsável pela extensão do punho é:",alternativas:["A) C4", "B) C5", "C) C6", "D) C7"],correta:2,justificativas:["C4 está relacionado à função respiratória (diafragma).", "C5 é responsável pela flexão do cotovelo (bíceps).", "✔ Segundo os padrões diagnósticos (como a escala ASIA), a extensão do punho (músculos extensores radiais) é o marcador motor do nível neurológico C6.", "C7 é responsável pela extensão do cotovelo (tríceps)."]},
{id:227,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"Qual achado no exame físico clínico indica a fase de choque medular em um paciente com trauma de coluna?",alternativas:["A) Presença de reflexos profundos exaltados (hiperreflexia)", "B) Ausência do reflexo bulbocavernoso", "C) Presença de sensibilidade vibratória preservada", "D) Espasticidade muscular imediata nos membros inferiores"],correta:1,justificativas:["A hiperreflexia ocorre na fase crônica da lesão medular (síndrome do neurônio motor superior), não no choque agudo.", "✔ A ausência do reflexo bulbocavernoso é um marcador clássico da fase de choque medular, indicando arreflexia sacral.", "No choque medular, há perda total da sensibilidade, incluindo a profunda.", "A espasticidade é uma sequela tardia; na fase aguda de choque, a paralisia é flácida."]},
{id:228,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"Qual achado no exame físico clínico indica a fase de choque medular em um paciente com trauma de coluna?",alternativas:["A) Presença de reflexos profundos exaltados (hiperreflexia)", "B) Ausência do reflexo bulbocavernoso", "C) Presença de sensibilidade vibratória preservada", "D) Espasticidade muscular imediata nos membros inferiores"],correta:1,justificativas:["A hiperreflexia ocorre na fase crônica da lesão medular (síndrome do neurônio motor superior), não no choque agudo.", "✔ A ausência do reflexo bulbocavernoso é um marcador clássico da fase de choque medular, indicando arreflexia sacral.", "No choque medular, há perda total da sensibilidade, incluindo a profunda.", "A espasticidade é uma sequela tardia; na fase aguda de choque, a paralisia é flácida."]},
{id:229,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"O termo \"Tetraplegia\" refere-se ao comprometimento funcional decorrente de lesões em qual segmento da coluna vertebral?",alternativas:["A) Segmento lombar", "B) Segmento sacral isolado", "C) Segmento cervical", "D) Segmento torácico baixo (T10-T12)"],correta:2,justificativas:["Lesões lombares causam paraplegia (apenas membros inferiores).", "Lesões sacrais podem causar disfunção esfincteriana ou anestesia em sela, mas não tetraplegia.", "✔ A tetraplegia resulta de danos nos segmentos cervicais da medula espinal, afetando os quatro membros e o tronco.", "Lesões torácicas causam paraplegia."]},
{id:230,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"O termo \"Tetraplegia\" refere-se ao comprometimento funcional decorrente de lesões em qual segmento da coluna vertebral?",alternativas:["A) Segmento lombar", "B) Segmento sacral isolado", "C) Segmento cervical", "D) Segmento torácico baixo (T10-T12)"],correta:2,justificativas:["Lesões lombares causam paraplegia (apenas membros inferiores).", "Lesões sacrais podem causar disfunção esfincteriana ou anestesia em sela, mas não tetraplegia.", "✔ A tetraplegia resulta de danos nos segmentos cervicais da medula espinal, afetando os quatro membros e o tronco.", "Lesões torácicas causam paraplegia."]},
{id:231,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"A Classificação ASIA (American Spinal Injury Association) utiliza a letra \"A\" para definir qual estado neurológico?",alternativas:["A) Lesão Incompleta: Preservação de função motora abaixo do nível", "B) Lesão Completa: Ausência de função motora e sensitiva nos segmentos sacrais (S4-S5)", "C) Lesão Incompleta: Apenas sensibilidade preservada", "D) Função Normal: Sem déficits neurológicos"],correta:1,justificativas:["Esta descrição referese aos graus C ou D.", "✔ Na escala ASIA, o grau A define a lesão completa, onde não há preservação de função sensitiva ou motora nos segmentos sacrais S4S5.", "Esta descrição referese ao grau B.", "O grau E representa a função normal."]},
{id:232,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"A Classificação ASIA (American Spinal Injury Association) utiliza a letra \"A\" para definir qual estado neurológico?",alternativas:["A) Lesão Incompleta: Preservação de função motora abaixo do nível", "B) Lesão Completa: Ausência de função motora e sensitiva nos segmentos sacrais (S4-S5)", "C) Lesão Incompleta: Apenas sensibilidade preservada", "D) Função Normal: Sem déficits neurológicos"],correta:1,justificativas:["Esta descrição referese aos graus C ou D.", "✔ Na escala ASIA, o grau A define a lesão completa, onde não há preservação de função sensitiva ou motora nos segmentos sacrais S4S5.", "Esta descrição referese ao grau B.", "O grau E representa a função normal."]},
{id:233,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"No atendimento inicial (ATLS) de um paciente com suspeita de TRM cervical, qual é a prioridade absoluta após garantir a via aérea?",alternativas:["A) Realizar radiografia simples de tórax", "B) Administração imediata de analgésicos potentes", "C) Restrição do movimento da coluna com colar cervical e prancha rígida", "D) Iniciar fisioterapia motora passiva"],correta:2,justificativas:["Exames de imagem vêm após a estabilização primária.", "Analgesia é importante, mas a imobilização para evitar dano neural catastrófico é prioritária.", "✔ A imobilização e proteção da coluna são fundamentais no passo \"A\" (Vias aéreas com controle da coluna cervical) para evitar o agravamento de uma lesão instável.", "Fisioterapia não tem papel na fase aguda da emergência."]},
{id:234,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"No atendimento inicial (ATLS) de um paciente com suspeita de TRM cervical, qual é a prioridade absoluta após garantir a via aérea?",alternativas:["A) Realizar radiografia simples de tórax", "B) Administração imediata de analgésicos potentes", "C) Restrição do movimento da coluna com colar cervical e prancha rígida", "D) Iniciar fisioterapia motora passiva"],correta:2,justificativas:["Exames de imagem vêm após a estabilização primária.", "Analgesia é importante, mas a imobilização para evitar dano neural catastrófico é prioritária.", "✔ A imobilização e proteção da coluna são fundamentais no passo \"A\" (Vias aéreas com controle da coluna cervical) para evitar o agravamento de uma lesão instável.", "Fisioterapia não tem papel na fase aguda da emergência."]},
{id:235,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"Qual nível medular é responsável pelo controle do músculo diafragma, sendo vital para a respiração independente?",alternativas:["A) T1 a T4", "B) C1 a C2", "C) C3 a C5", "D) C6 a C8"],correta:2,justificativas:["Estes níveis controlam a musculatura intercostal, ajudando na tosse, mas não no diafragma.", "C1 e C2 são níveis cervicais altos que, se lesados, comprometem a inervação que desce para o diafragma.", "✔ O nervo frênico, que inerva o diafragma, originase das raízes de C3, C4 e C5. Lesões acima desse nível causam dependência de ventilador.", "Níveis abaixo de C5 preservam o diafragma, mas afetam os membros superiores."]},
{id:236,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"Qual nível medular é responsável pelo controle do músculo diafragma, sendo vital para a respiração independente?",alternativas:["A) T1 a T4", "B) C1 a C2", "C) C3 a C5", "D) C6 a C8"],correta:2,justificativas:["Estes níveis controlam a musculatura intercostal, ajudando na tosse, mas não no diafragma.", "C1 e C2 são níveis cervicais altos que, se lesados, comprometem a inervação que desce para o diafragma.", "✔ O nervo frênico, que inerva o diafragma, originase das raízes de C3, C4 e C5. Lesões acima desse nível causam dependência de ventilador.", "Níveis abaixo de C5 preservam o diafragma, mas afetam os membros superiores."]},
{id:237,tema:"Coluna",subtema:"TRM",dificuldade:"iniciante",enunciado:"O retorno do reflexo bulbocavernoso após um trauma raquimedular sinaliza tecnicamente o quê?",alternativas:["A) O agravamento irreversível da lesão medular", "B) O término da fase de choque medular", "C) Que o paciente voltará a andar imediatamente", "D) A necessidade de intubação orotraqueal imediata"],correta:1,justificativas:["Pelo contrário, é uma evolução esperada da fisiologia póstrauma.", "✔ O retorno desse reflexo marca o fim do período de choque medular, permitindo que o médico determine se a lesão neurológica restante é completa ou incompleta.", "O retorno do reflexo não garante recuperação motora voluntária, apenas o fim da arreflexia do choque.", "O reflexo bulbocavernoso não tem relação direta com a indicação de ventilação."]},
{id:238,tema:"Coluna",subtema:"TRM",dificuldade:"intermediário",enunciado:"O retorno do reflexo bulbocavernoso após um trauma raquimedular sinaliza tecnicamente o quê?",alternativas:["A) O agravamento irreversível da lesão medular", "B) O término da fase de choque medular", "C) Que o paciente voltará a andar imediatamente", "D) A necessidade de intubação orotraqueal imediata"],correta:1,justificativas:["Pelo contrário, é uma evolução esperada da fisiologia póstrauma.", "✔ O retorno desse reflexo marca o fim do período de choque medular, permitindo que o médico determine se a lesão neurológica restante é completa ou incompleta.", "O retorno do reflexo não garante recuperação motora voluntária, apenas o fim da arreflexia do choque.", "O reflexo bulbocavernoso não tem relação direta com a indicação de ventilação."]},
{id:239,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"Como se denomina a perda de função motora e sensitiva apenas nos membros inferiores decorrente de lesão medular torácica ou lombar?",alternativas:["A) Hemiplegia", "B) Paraplegia", "C) Tetraplegia", "D) Monoplegia"],correta:1,justificativas:["Hemiplegia é a paralisia de um lado do corpo (direito ou esquerdo), comum em AVCs.", "✔ A paraplegia é a terminologia correta para o comprometimento dos membros inferiores (e tronco, dependendo do nível), mantendo a função dos membros superiores preservada.", "Tetraplegia envolve os quatro membros.", "Monoplegia envolve apenas um membro isolado. ## Choque medular Perfeito. Vamos focar exclusivamente no Choque Medular. Lembrese: no nível Fácil, o objetivo é consolidar os conceitos de definição, a diferença para o choque neurogênico e os sinais clínicos imediatos. Aqui está o bloco de 10 questões estruturado para o seu banco de dados: Bloco 02: Coluna Subtema: Choque Medular (Nível Fácil)"]},
{id:240,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"Como se denomina a perda de função motora e sensitiva apenas nos membros inferiores decorrente de lesão medular torácica ou lombar?",alternativas:["A) Hemiplegia", "B) Paraplegia", "C) Tetraplegia", "D) Monoplegia"],correta:1,justificativas:["Hemiplegia é a paralisia de um lado do corpo (direito ou esquerdo), comum em AVCs.", "✔ A paraplegia é a terminologia correta para o comprometimento dos membros inferiores (e tronco, dependendo do nível), mantendo a função dos membros superiores preservada.", "Tetraplegia envolve os quatro membros.", "Monoplegia envolve apenas um membro isolado. ## Choque medular Perfeito. Vamos focar exclusivamente no Choque Medular. Lembrese: no nível Fácil, o objetivo é consolidar os conceitos de definição, a diferença para o choque neurogênico e os sinais clínicos imediatos. Aqui está o bloco de 10 questões estruturado para o seu banco de dados: Bloco 02: Coluna Subtema: Choque Medular (Nível Fácil)"]},
{id:241,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"O choque medular é melhor definido como um estado de:",alternativas:["A) Hipotensão severa causada por perda de sangue (hemorragia)", "B) Depressão temporária de todas as funções neurológicas abaixo do nível da lesão", "C) Aumento súbito da espasticidade e dos reflexos tendinosos", "D) Lesão permanente e irreversível das raízes nervosas da cauda equina"],correta:1,justificativas:["Isso define o choque hipovolêmico, não o medular.", "✔ O choque medular é um estado fisiológico transitório que ocorre imediatamente após o trauma, caracterizado por paralisia flácida, anestesia e arreflexia total abaixo do nível lesado.", "No choque medular os reflexos estão ausentes (arreflexia), não aumentados.", "O choque medular é uma resposta funcional e pode ser temporário, não sendo sinônimo de lesão irreversível por definição."]},
{id:242,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"O choque medular é melhor definido como um estado de:",alternativas:["A) Hipotensão severa causada por perda de sangue (hemorragia)", "B) Depressão temporária de todas as funções neurológicas abaixo do nível da lesão", "C) Aumento súbito da espasticidade e dos reflexos tendinosos", "D) Lesão permanente e irreversível das raízes nervosas da cauda equina"],correta:1,justificativas:["Isso define o choque hipovolêmico, não o medular.", "✔ O choque medular é um estado fisiológico transitório que ocorre imediatamente após o trauma, caracterizado por paralisia flácida, anestesia e arreflexia total abaixo do nível lesado.", "No choque medular os reflexos estão ausentes (arreflexia), não aumentados.", "O choque medular é uma resposta funcional e pode ser temporário, não sendo sinônimo de lesão irreversível por definição."]},
{id:243,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"Qual é o sinal clínico \"marco zero\" que indica a presença de choque medular no exame físico inicial?",alternativas:["A) Taquicardia compensatória", "B) Hiperreflexia profunda", "C) Ausência do reflexo bulbocavernoso", "D) Presença de sinal de Babinski bilateral"],correta:2,justificativas:["O choque medular em si não causa taquicardia; se houver choque neurogênico associado, ocorre bradicardia.", "A hiperreflexia é característica de fases tardias, após a resolução do choque.", "✔ A ausência do reflexo bulbocavernoso (contração do esfíncter anal ao estimular a glande ou clitóris/sonda vesical) é o indicador clássico de que o paciente está em choque medular.", "O sinal de Babinski indica lesão do trato corticoespinhal, mas pode estar ausente durante a fase de arreflexia do choque medular."]},
{id:244,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"Qual é o sinal clínico \"marco zero\" que indica a presença de choque medular no exame físico inicial?",alternativas:["A) Taquicardia compensatória", "B) Hiperreflexia profunda", "C) Ausência do reflexo bulbocavernoso", "D) Presença de sinal de Babinski bilateral"],correta:2,justificativas:["O choque medular em si não causa taquicardia; se houver choque neurogênico associado, ocorre bradicardia.", "A hiperreflexia é característica de fases tardias, após a resolução do choque.", "✔ A ausência do reflexo bulbocavernoso (contração do esfíncter anal ao estimular a glande ou clitóris/sonda vesical) é o indicador clássico de que o paciente está em choque medular.", "O sinal de Babinski indica lesão do trato corticoespinhal, mas pode estar ausente durante a fase de arreflexia do choque medular."]},
{id:245,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"Diferente do choque hipovolêmico, o componente hemodinâmico do Choque Neurogênico (frequentemente associado ao trauma medular alto) apresenta tipicamente:",alternativas:["A) Hipertensão e Taquicardia", "B) Hipotensão e Bradicardia", "C) Hipotensão e Taquicardia", "D) Pressão normal e Sudorese intensa"],correta:1,justificativas:["O perfil é oposto: baixa pressão e batimento lento.", "✔ O choque neurogênico resulta da perda do tônus simpático (vasodilatação) e predomínio parassimpático, levando à tríade de hipotensão, bradicardia e vasodilatação periférica.", "Hipotensão com taquicardia é o padrão do choque hipovolêmico (perda de sangue).", "No choque neurogênico, a pele costuma estar quente e seca devido à perda da inervação simpática das glândulas sudoríparas."]},
{id:246,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"Diferente do choque hipovolêmico, o componente hemodinâmico do Choque Neurogênico (frequentemente associado ao trauma medular alto) apresenta tipicamente:",alternativas:["A) Hipertensão e Taquicardia", "B) Hipotensão e Bradicardia", "C) Hipotensão e Taquicardia", "D) Pressão normal e Sudorese intensa"],correta:1,justificativas:["O perfil é oposto: baixa pressão e batimento lento.", "✔ O choque neurogênico resulta da perda do tônus simpático (vasodilatação) e predomínio parassimpático, levando à tríade de hipotensão, bradicardia e vasodilatação periférica.", "Hipotensão com taquicardia é o padrão do choque hipovolêmico (perda de sangue).", "No choque neurogênico, a pele costuma estar quente e seca devido à perda da inervação simpática das glândulas sudoríparas."]},
{id:247,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"Qual é a duração típica da fase de choque medular na maioria dos pacientes?",alternativas:["A) Exatamente 15 minutos em todos os casos", "B) De 24 a 72 horas, podendo durar dias ou semanas", "C) É um estado permanente que nunca se resolve", "D) Dura apenas enquanto o paciente estiver inconsciente"],correta:1,justificativas:["Não existe um tempo fixo de minutos para esse fenômeno biológico.", "✔ Embora variável, o choque medular geralmente começa a se resolver em 2472 horas, mas pode se estender por períodos maiores dependendo da gravidade.", "O choque medular é, por definição, uma fase transitória de \"atordoamento\" neural.", "O estado de consciência não determina a duração do choque medular, que é um fenômeno da medula espinal."]},
{id:248,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"Qual é a duração típica da fase de choque medular na maioria dos pacientes?",alternativas:["A) Exatamente 15 minutos em todos os casos", "B) De 24 a 72 horas, podendo durar dias ou semanas", "C) É um estado permanente que nunca se resolve", "D) Dura apenas enquanto o paciente estiver inconsciente"],correta:1,justificativas:["Não existe um tempo fixo de minutos para esse fenômeno biológico.", "✔ Embora variável, o choque medular geralmente começa a se resolver em 2472 horas, mas pode se estender por períodos maiores dependendo da gravidade.", "O choque medular é, por definição, uma fase transitória de \"atordoamento\" neural.", "O estado de consciência não determina a duração do choque medular, que é um fenômeno da medula espinal."]},
{id:249,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"Durante a fase de choque medular, o tipo de paralisia observado abaixo do nível da lesão é:",alternativas:["A) Paralisia Espástica (músculos rígidos)", "B) Paralisia Flácida (músculos sem tônus)", "C) Movimentos involuntários do tipo coreia", "D) Paralisia apenas da musculatura lisa intestinal"],correta:1,justificativas:["A espasticidade surge apenas após a resolução do choque, quando os reflexos medulares retornam \"sem controle\" do cérebro.", "✔ No choque medular, há uma interrupção súbita de todos os estímulos nervosos, resultando em perda total do tônus muscular (paralisia flácida).", "Movimentos involuntários não fazem parte do quadro clínico de lesão medular aguda.", "A paralisia atinge tanto a musculatura esquelética quanto a funcionalidade autonômica abaixo da lesão."]},
{id:250,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"Durante a fase de choque medular, o tipo de paralisia observado abaixo do nível da lesão é:",alternativas:["A) Paralisia Espástica (músculos rígidos)", "B) Paralisia Flácida (músculos sem tônus)", "C) Movimentos involuntários do tipo coreia", "D) Paralisia apenas da musculatura lisa intestinal"],correta:1,justificativas:["A espasticidade surge apenas após a resolução do choque, quando os reflexos medulares retornam \"sem controle\" do cérebro.", "✔ No choque medular, há uma interrupção súbita de todos os estímulos nervosos, resultando em perda total do tônus muscular (paralisia flácida).", "Movimentos involuntários não fazem parte do quadro clínico de lesão medular aguda.", "A paralisia atinge tanto a musculatura esquelética quanto a funcionalidade autonômica abaixo da lesão."]},
{id:251,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"Por que é clinicamente impossível determinar o prognóstico neurológico definitivo de um paciente enquanto ele está em choque medular?",alternativas:["A) Porque o paciente está sempre em coma", "B) Porque a arreflexia mascara a função medular real que pode ter sido preservada", "C) Porque o choque medular impede a realização de exames de imagem como a Ressonância", "D) Porque a pressão arterial está muito alta para testar a sensibilidade"],correta:1,justificativas:["O paciente pode estar perfeitamente lúcido e orientado, mas com a medula em choque.", "✔ Como o choque suspende todas as funções (mesmo as que não foram permanentemente lesadas), não se pode diferenciar uma lesão completa de uma incompleta até que o choque passe.", "O choque medular é clínico e não impede fisicamente a entrada no aparelho de exame.", "A pressão arterial no trauma medular tende a ser baixa (se houver choque neurogênico), não alta."]},
{id:252,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"Por que é clinicamente impossível determinar o prognóstico neurológico definitivo de um paciente enquanto ele está em choque medular?",alternativas:["A) Porque o paciente está sempre em coma", "B) Porque a arreflexia mascara a função medular real que pode ter sido preservada", "C) Porque o choque medular impede a realização de exames de imagem como a Ressonância", "D) Porque a pressão arterial está muito alta para testar a sensibilidade"],correta:1,justificativas:["O paciente pode estar perfeitamente lúcido e orientado, mas com a medula em choque.", "✔ Como o choque suspende todas as funções (mesmo as que não foram permanentemente lesadas), não se pode diferenciar uma lesão completa de uma incompleta até que o choque passe.", "O choque medular é clínico e não impede fisicamente a entrada no aparelho de exame.", "A pressão arterial no trauma medular tende a ser baixa (se houver choque neurogênico), não alta."]},
{id:253,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"O fenômeno fisiopatológico que melhor explica o choque medular é:",alternativas:["A) A secção física completa de todos os axônios da medula", "B) Um aumento súbito na liberação de adrenalina pelas glândulas adrenais", "C) A perda súbita da facilitação descendente dos centros cerebrais superiores", "D) A compressão da medula por um hematoma extradural"],correta:2,justificativas:["O choque medular ocorre mesmo em lesões onde os axônios estão íntegros (ex: contusão).", "O choque medular cursa com redução da atividade simpática (adrenérgica).", "✔ A medula depende de impulsos constantes vindos do cérebro para manter seu estado de excitabilidade. Quando o trauma interrompe essa conexão, os neurônios medulares entram em repouso funcional.", "Um hematoma pode causar lesão medular, mas o \"choque medular\" é a resposta fisiológica a essa lesão, não a causa física direta."]},
{id:254,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"O fenômeno fisiopatológico que melhor explica o choque medular é:",alternativas:["A) A secção física completa de todos os axônios da medula", "B) Um aumento súbito na liberação de adrenalina pelas glândulas adrenais", "C) A perda súbita da facilitação descendente dos centros cerebrais superiores", "D) A compressão da medula por um hematoma extradural"],correta:2,justificativas:["O choque medular ocorre mesmo em lesões onde os axônios estão íntegros (ex: contusão).", "O choque medular cursa com redução da atividade simpática (adrenérgica).", "✔ A medula depende de impulsos constantes vindos do cérebro para manter seu estado de excitabilidade. Quando o trauma interrompe essa conexão, os neurônios medulares entram em repouso funcional.", "Um hematoma pode causar lesão medular, mas o \"choque medular\" é a resposta fisiológica a essa lesão, não a causa física direta."]},
{id:255,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"Qual destas funções autonômicas é frequentemente perdida durante o choque medular?",alternativas:["A) Controle voluntário da fala", "B) Controle do esfíncter vesical e anal (retenção urinária/atonia anal)", "C) Capacidade de enxergar cores", "D) Audição de sons agudos"],correta:1,justificativas:["Alternativa A incorreta.", "✔ O choque medular interrompe o arco reflexo sacral, levando à bexiga neurogênica (retenção) e perda do tônus do esfíncter anal.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:256,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"Qual destas funções autonômicas é frequentemente perdida durante o choque medular?",alternativas:["A) Controle voluntário da fala", "B) Controle do esfíncter vesical e anal (retenção urinária/atonia anal)", "C) Capacidade de enxergar cores", "D) Audição de sons agudos"],correta:1,justificativas:["Alternativa A incorreta.", "✔ O choque medular interrompe o arco reflexo sacral, levando à bexiga neurogênica (retenção) e perda do tônus do esfíncter anal.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:257,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"Ao final do choque medular, qual é o primeiro reflexo que costuma retornar, sinalizando o fim desta fase?",alternativas:["A) Reflexo Patelar", "B) Reflexo Aquileu", "C) Reflexo Bulbocavernoso", "D) Reflexo de preensão palmar"],correta:2,justificativas:["e B: Reflexos tendinosos profundos (como patelar) costumam retornar mais tarde na evolução.", "Alternativa B incorreta.", "✔ O reflexo bulbocavernoso é um dos reflexos mais primitivos e é geralmente o primeiro a reaparecer após o choque medular.", "Este é um reflexo primitivo do recémnascido ou sinal de lesão frontal cerebral, não relacionado ao fim do choque medular."]},
{id:258,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"Ao final do choque medular, qual é o primeiro reflexo que costuma retornar, sinalizando o fim desta fase?",alternativas:["A) Reflexo Patelar", "B) Reflexo Aquileu", "C) Reflexo Bulbocavernoso", "D) Reflexo de preensão palmar"],correta:2,justificativas:["e B: Reflexos tendinosos profundos (como patelar) costumam retornar mais tarde na evolução.", "Alternativa B incorreta.", "✔ O reflexo bulbocavernoso é um dos reflexos mais primitivos e é geralmente o primeiro a reaparecer após o choque medular.", "Este é um reflexo primitivo do recémnascido ou sinal de lesão frontal cerebral, não relacionado ao fim do choque medular."]},
{id:259,tema:"Coluna",subtema:"Choque Medular",dificuldade:"iniciante",enunciado:"No contexto do TRM, a diferença fundamental entre Choque Medular e Choque Neurogênico é:",alternativas:["A) Não há diferença; são sinônimos para a mesma condição clínica", "B) O choque medular é um fenômeno elétrico/neurológico; o choque neurogênico é um fenômeno hemodinâmico", "C) O choque medular causa aumento da pressão, o neurogênico causa queda", "D) O choque medular só ocorre na coluna lombar, o neurogênico na cervical"],correta:1,justificativas:["São conceitos distintos que podem coexistir no mesmo paciente.", "✔ O choque medular referese à perda de reflexos e função motora/sensitiva. O choque neurogênico referese à instabilidade circulatória por perda do tônus vasomotor.", "Ambos os termos não estão associados a aumento de pressão arterial.", "O choque medular ocorre em qualquer nível; o neurogênico é mais comum em lesões acima de T6. ## Dor lombar"]},
{id:260,tema:"Coluna",subtema:"Choque Medular",dificuldade:"intermediário",enunciado:"No contexto do TRM, a diferença fundamental entre Choque Medular e Choque Neurogênico é:",alternativas:["A) Não há diferença; são sinônimos para a mesma condição clínica", "B) O choque medular é um fenômeno elétrico/neurológico; o choque neurogênico é um fenômeno hemodinâmico", "C) O choque medular causa aumento da pressão, o neurogênico causa queda", "D) O choque medular só ocorre na coluna lombar, o neurogênico na cervical"],correta:1,justificativas:["São conceitos distintos que podem coexistir no mesmo paciente.", "✔ O choque medular referese à perda de reflexos e função motora/sensitiva. O choque neurogênico referese à instabilidade circulatória por perda do tônus vasomotor.", "Ambos os termos não estão associados a aumento de pressão arterial.", "O choque medular ocorre em qualquer nível; o neurogênico é mais comum em lesões acima de T6. ## Dor lombar"]},
{id:261,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"iniciante",enunciado:"De acordo com a duração dos sintomas, como é classificada uma dor lombar que persiste por um período superior a 12 semanas?",alternativas:["A) Lombalgia Aguda", "B) Lombalgia Subaguda", "C) Lombalgia Crônica", "D) Lombalgia Recidivante"],correta:2,justificativas:["A dor aguda é aquela com duração inferior a 4 semanas.", "A dor subaguda compreende o intervalo entre 4 e 12 semanas.", "✔ Por convenção clínica, a dor lombar é considerada crônica quando ultrapassa o limite de 3 meses (12 semanas) de evolução.", "Recidivante referese a episódios que vão e voltam, independentemente do tempo total."]},
{id:262,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"De acordo com a duração dos sintomas, como é classificada uma dor lombar que persiste por um período superior a 12 semanas?",alternativas:["A) Lombalgia Aguda", "B) Lombalgia Subaguda", "C) Lombalgia Crônica", "D) Lombalgia Recidivante"],correta:2,justificativas:["A dor aguda é aquela com duração inferior a 4 semanas.", "A dor subaguda compreende o intervalo entre 4 e 12 semanas.", "✔ Por convenção clínica, a dor lombar é considerada crônica quando ultrapassa o limite de 3 meses (12 semanas) de evolução.", "Recidivante referese a episódios que vão e voltam, independentemente do tempo total."]},
{id:263,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"iniciante",enunciado:"A dor que se irradia da região lombar para o membro inferior, seguindo o trajeto de uma raiz nervosa, é tecnicamente chamada de:",alternativas:["A) Cervicalgia", "B) Lombociatalgia", "C) Fibromialgia localizada", "D) Dorsalgia mecânica"],correta:1,justificativas:["Cervicalgia referese à dor na região do pescoço.", "✔ A lombociatalgia indica dor lombar associada à compressão ou irritação do nervo ciático (raízes de L4 a S3), estendendose para a perna.", "Fibromialgia é uma síndrome de dor generalizada, não uma irradiação radicular específica.", "Dorsalgia referese à dor na coluna torácica (meio das costas)."]},
{id:264,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"A dor que se irradia da região lombar para o membro inferior, seguindo o trajeto de uma raiz nervosa, é tecnicamente chamada de:",alternativas:["A) Cervicalgia", "B) Lombociatalgia", "C) Fibromialgia localizada", "D) Dorsalgia mecânica"],correta:1,justificativas:["Cervicalgia referese à dor na região do pescoço.", "✔ A lombociatalgia indica dor lombar associada à compressão ou irritação do nervo ciático (raízes de L4 a S3), estendendose para a perna.", "Fibromialgia é uma síndrome de dor generalizada, não uma irradiação radicular específica.", "Dorsalgia referese à dor na coluna torácica (meio das costas)."]},
{id:265,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"iniciante",enunciado:"Na anatomia da coluna lombar, qual estrutura fibrocartilaginosa atua como \"amortecedor\" entre os corpos vertebrais?",alternativas:["A) Medula espinal", "B) Disco intervertebral", "C) Processo espinhoso", "D) Ligamento amarelo"],correta:1,justificativas:["A medula é o tecido nervoso que passa por dentro do canal vertebral.", "✔ O disco intervertebral, composto pelo núcleo pulposo e anel fibroso, tem a função principal de absorver impactos e permitir a mobilidade entre as vértebras.", "O processo espinhoso é a projeção óssea posterior da vértebra (o \"calinho\" que sentimos nas costas).", "O ligamento amarelo une as lâminas das vértebras, não atuando como amortecedor de carga direta."]},
{id:266,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"Na anatomia da coluna lombar, qual estrutura fibrocartilaginosa atua como \"amortecedor\" entre os corpos vertebrais?",alternativas:["A) Medula espinal", "B) Disco intervertebral", "C) Processo espinhoso", "D) Ligamento amarelo"],correta:1,justificativas:["A medula é o tecido nervoso que passa por dentro do canal vertebral.", "✔ O disco intervertebral, composto pelo núcleo pulposo e anel fibroso, tem a função principal de absorver impactos e permitir a mobilidade entre as vértebras.", "O processo espinhoso é a projeção óssea posterior da vértebra (o \"calinho\" que sentimos nas costas).", "O ligamento amarelo une as lâminas das vértebras, não atuando como amortecedor de carga direta."]},
{id:267,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"iniciante",enunciado:"O termo \"Lombalgia Mecânica Comum\" (ou não específica) refere-se a:",alternativas:["A) Dores causadas exclusivamente por tumores ósseos", "B) Dores relacionadas ao uso excessivo ou má postura, sem causa estrutural grave imediata", "C) Infecções bacterianas graves dentro do disco", "D) Fraturas causadas por acidentes de altíssima energia"],correta:1,justificativas:["Alternativa A incorreta.", "✔ Cerca de 90% das lombalgias são mecânicas/inespecíficas, originadas em músculos, ligamentos ou pequenas alterações degenerativas, sem uma doença sistêmica por trás.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:268,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"O termo \"Lombalgia Mecânica Comum\" (ou não específica) refere-se a:",alternativas:["A) Dores causadas exclusivamente por tumores ósseos", "B) Dores relacionadas ao uso excessivo ou má postura, sem causa estrutural grave imediata", "C) Infecções bacterianas graves dentro do disco", "D) Fraturas causadas por acidentes de altíssima energia"],correta:1,justificativas:["Alternativa A incorreta.", "✔ Cerca de 90% das lombalgias são mecânicas/inespecíficas, originadas em músculos, ligamentos ou pequenas alterações degenerativas, sem uma doença sistêmica por trás.", "Alternativa C incorreta.", "Alternativa D incorreta."]},
{id:269,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"iniciante",enunciado:"Qual é a região da coluna vertebral que possui 5 vértebras e suporta a maior parte do peso corporal total?",alternativas:["A) Coluna Cervical", "B) Coluna Torácica", "C) Coluna Lombar", "D) Coluna Sacral"],correta:2,justificativas:["A cervical possui 7 vértebras.", "A torácica possui 12 vértebras.", "✔ A coluna lombar é composta por 5 vértebras (L1 a L5), que são as maiores e mais robustas para suportar a carga do tronco.", "O sacro é composto por 5 vértebras fundidas em um único osso."]},
{id:270,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"Qual é a região da coluna vertebral que possui 5 vértebras e suporta a maior parte do peso corporal total?",alternativas:["A) Coluna Cervical", "B) Coluna Torácica", "C) Coluna Lombar", "D) Coluna Sacral"],correta:2,justificativas:["A cervical possui 7 vértebras.", "A torácica possui 12 vértebras.", "✔ A coluna lombar é composta por 5 vértebras (L1 a L5), que são as maiores e mais robustas para suportar a carga do tronco.", "O sacro é composto por 5 vértebras fundidas em um único osso."]},
{id:271,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"iniciante",enunciado:"No exame físico, o teste de Lasègue é realizado para pesquisar sinais de:",alternativas:["A) Fraqueza muscular no braço", "B) Irritação ou compressão de raízes nervosas lombares", "C) Instabilidade no joelho", "D) Fratura da costela"],correta:1,justificativas:["O Lasègue é um teste de membro inferior.", "✔ O teste de Lasègue (elevação do membro inferior estendido) estira o nervo ciático; se houver dor irradiada entre 30° e 70°, sugere compressão radicular (ex: hérnia de disco).", "Testes de joelho envolvem manobras como Gaveta ou Lachman.", "Não há relação entre o teste de Lasègue e a caixa torácica."]},
{id:272,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"No exame físico, o teste de Lasègue é realizado para pesquisar sinais de:",alternativas:["A) Fraqueza muscular no braço", "B) Irritação ou compressão de raízes nervosas lombares", "C) Instabilidade no joelho", "D) Fratura da costela"],correta:1,justificativas:["O Lasègue é um teste de membro inferior.", "✔ O teste de Lasègue (elevação do membro inferior estendido) estira o nervo ciático; se houver dor irradiada entre 30° e 70°, sugere compressão radicular (ex: hérnia de disco).", "Testes de joelho envolvem manobras como Gaveta ou Lachman.", "Não há relação entre o teste de Lasègue e a caixa torácica."]},
{id:273,tema:"Coluna",subtema:"TRM",dificuldade:"iniciante",enunciado:"O que caracteriza a \"Sinal de Alerta\" (Red Flag) em um paciente com dor lombar?",alternativas:["A) Dor que melhora com o repouso", "B) Dor que começou há apenas 2 dias após carregar peso", "C) Presença de febre, perda de peso inexplicada ou histórico de câncer", "D) Cansaço muscular após um dia de trabalho"],correta:2,justificativas:["Melhora com repouso é típico de dor mecânica simples.", "Início agudo após esforço é o padrão da lombalgia comum.", "✔ Red flags são sinais que sugerem patologias graves (infecção, tumor, fratura) que exigem investigação imediata.", "Sintoma comum de fadiga postural, sem gravidade clínica."]},
{id:274,tema:"Coluna",subtema:"TRM",dificuldade:"intermediário",enunciado:"O que caracteriza a \"Sinal de Alerta\" (Red Flag) em um paciente com dor lombar?",alternativas:["A) Dor que melhora com o repouso", "B) Dor que começou há apenas 2 dias após carregar peso", "C) Presença de febre, perda de peso inexplicada ou histórico de câncer", "D) Cansaço muscular após um dia de trabalho"],correta:2,justificativas:["Melhora com repouso é típico de dor mecânica simples.", "Início agudo após esforço é o padrão da lombalgia comum.", "✔ Red flags são sinais que sugerem patologias graves (infecção, tumor, fratura) que exigem investigação imediata.", "Sintoma comum de fadiga postural, sem gravidade clínica."]},
{id:275,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"iniciante",enunciado:"A \"Síndrome da Cauda Equina\" é uma emergência ortopédica que ocorre devido à compressão de:",alternativas:["A) Nervos cranianos na base do crânio", "B) Múltiplas raízes nervosas abaixo do fim da medula espinal (nível L2)", "C) Apenas do nervo ulnar no cotovelo", "D) Da artéria aorta abdominal"],correta:1,justificativas:["Estes controlam face e funções sensoriais superiores.", "✔ A cauda equina é o feixe de raízes nervosas que ocupa o canal vertebral após o término da medula (L1L2). Sua compressão causa perda de sensibilidade perineal e controle de esfíncteres.", "O nervo ulnar é do membro superior.", "A aorta é um vaso sanguíneo, sua compressão causaria problemas isquêmicos, não a síndrome neurológica clássica da cauda equina."]},
{id:276,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"A \"Síndrome da Cauda Equina\" é uma emergência ortopédica que ocorre devido à compressão de:",alternativas:["A) Nervos cranianos na base do crânio", "B) Múltiplas raízes nervosas abaixo do fim da medula espinal (nível L2)", "C) Apenas do nervo ulnar no cotovelo", "D) Da artéria aorta abdominal"],correta:1,justificativas:["Estes controlam face e funções sensoriais superiores.", "✔ A cauda equina é o feixe de raízes nervosas que ocupa o canal vertebral após o término da medula (L1L2). Sua compressão causa perda de sensibilidade perineal e controle de esfíncteres.", "O nervo ulnar é do membro superior.", "A aorta é um vaso sanguíneo, sua compressão causaria problemas isquêmicos, não a síndrome neurológica clássica da cauda equina."]},
{id:277,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"iniciante",enunciado:"Qual termo é usado para descrever o \"deslizamento\" de uma vértebra sobre a outra?",alternativas:["A) Espondilólise", "B) Espondilolistese", "C) Escoliose", "D) Estenose"],correta:1,justificativas:["Espondilólise é apenas uma falha ou fratura na pars interarticularis, sem necessariamente haver deslizamento.", "✔ Listese significa escorregamento. A espondilolistese é o deslocamento anterior ou posterior de um corpo vertebral em relação ao inferior.", "Escoliose é um desvio lateral (curvatura) da coluna.", "Estenose referese ao estreitamento do canal vertebral."]},
{id:278,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"Qual termo é usado para descrever o \"deslizamento\" de uma vértebra sobre a outra?",alternativas:["A) Espondilólise", "B) Espondilolistese", "C) Escoliose", "D) Estenose"],correta:1,justificativas:["Espondilólise é apenas uma falha ou fratura na pars interarticularis, sem necessariamente haver deslizamento.", "✔ Listese significa escorregamento. A espondilolistese é o deslocamento anterior ou posterior de um corpo vertebral em relação ao inferior.", "Escoliose é um desvio lateral (curvatura) da coluna.", "Estenose referese ao estreitamento do canal vertebral."]},
{id:279,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"iniciante",enunciado:"Anatomia Básica: O \"Núcleo Pulposo\" é o componente central de qual estrutura?",alternativas:["A) Do corpo vertebral ósseo", "B) Do disco intervertebral", "C) Do ligamento longitudinal anterior", "D) Da faceta articular"],correta:1,justificativas:["O corpo vertebral é composto de osso cortical e esponjoso.", "✔ O disco intervertebral é composto por um anel fibroso periférico e um centro gelatinoso chamado núcleo pulposo, que é rico em água e colágeno.", "Ligamentos são estruturas fibrosas de conexão, sem núcleo gelatinoso.", "Facetas são articulações sinoviais entre as vértebras. ## Questões difíceis"]},
{id:280,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"Anatomia Básica: O \"Núcleo Pulposo\" é o componente central de qual estrutura?",alternativas:["A) Do corpo vertebral ósseo", "B) Do disco intervertebral", "C) Do ligamento longitudinal anterior", "D) Da faceta articular"],correta:1,justificativas:["O corpo vertebral é composto de osso cortical e esponjoso.", "✔ O disco intervertebral é composto por um anel fibroso periférico e um centro gelatinoso chamado núcleo pulposo, que é rico em água e colágeno.", "Ligamentos são estruturas fibrosas de conexão, sem núcleo gelatinoso.", "Facetas são articulações sinoviais entre as vértebras. ## Questões difíceis"]},
{id:281,tema:"Coluna",subtema:"TRM",dificuldade:"avançado",enunciado:"Um paciente de 45 anos, motorista de carga, apresenta dor lombar aguda irradiada para a face lateral da perna esquerda e dorso do pé, com fraqueza na dorsiflexão do hálux. Ao exame físico, qual raiz nervosa está provavelmente acometida e qual o teste de irritação radicular positivo esperado?",alternativas:["A) Raiz de L4; Teste de Patrick-Fabere", "B) Raiz de L5; Teste de Lasègue", "C) Raiz de S1; Teste de Elevação da Perna Estendida (Lasègue)", "D) Raiz de L2; Teste de Nachlas (estiramento femoral)"],correta:1,justificativas:["L4 é responsável pela extensão do joelho e reflexo patelar. PatrickFabere avalia a articulação sacroilíaca/quadril.", "✔ A fraqueza da dorsiflexão do hálux (músculo extensor longo do hálux) e a sensibilidade no dorso do pé são territórios clássicos da raiz de L5. O teste de Lasègue positivo corrobora a compressão radicular lombar baixa.", "S1 manifestase com perda do reflexo aquileu e fraqueza na flexão plantar (ficar na ponta dos pés).", "L2 inerva a flexão do quadril; o teste de Nachlas é usado para raízes altas (L2L4)."]},
{id:282,tema:"Coluna",subtema:"TRM",dificuldade:"intermediário",enunciado:"Um paciente de 45 anos, motorista de carga, apresenta dor lombar aguda irradiada para a face lateral da perna esquerda e dorso do pé, com fraqueza na dorsiflexão do hálux. Ao exame físico, qual raiz nervosa está provavelmente acometida e qual o teste de irritação radicular positivo esperado?",alternativas:["A) Raiz de L4; Teste de Patrick-Fabere", "B) Raiz de L5; Teste de Lasègue", "C) Raiz de S1; Teste de Elevação da Perna Estendida (Lasègue)", "D) Raiz de L2; Teste de Nachlas (estiramento femoral)"],correta:1,justificativas:["L4 é responsável pela extensão do joelho e reflexo patelar. PatrickFabere avalia a articulação sacroilíaca/quadril.", "✔ A fraqueza da dorsiflexão do hálux (músculo extensor longo do hálux) e a sensibilidade no dorso do pé são territórios clássicos da raiz de L5. O teste de Lasègue positivo corrobora a compressão radicular lombar baixa.", "S1 manifestase com perda do reflexo aquileu e fraqueza na flexão plantar (ficar na ponta dos pés).", "L2 inerva a flexão do quadril; o teste de Nachlas é usado para raízes altas (L2L4)."]},
{id:283,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"avançado",enunciado:"Paciente vítima de queda de altura apresenta-se com paraplegia flácida e ausência de reflexo bulbocavernoso. Após 48 horas, o reflexo bulbocavernoso retorna, porém o paciente mantém ausência total de sensibilidade e motricidade abaixo do nível da lesão (T10). Qual o diagnóstico neurológico atual segundo a escala ASIA?",alternativas:["A) Choque Neurogênico", "B) Lesão Medular Incompleta ASIA B", "C) Choque Medular persistente", "D) Lesão Medular Completa ASIA A"],correta:3,justificativas:["Choque neurogênico é uma alteração hemodinâmica (PA e FC), não uma classificação de déficit motor.", "ASIA B exigiria preservação da sensibilidade sacral.", "O retorno do reflexo bulbocavernoso indica justamente que o choque medular acabou.", "✔ O retorno do reflexo bulbocavernoso marca o fim do choque medular. Se, após o fim do choque, não há função motora ou sensitiva nos segmentos sacrais (S4S5), a lesão é classificada como completa (ASIA A)."]},
{id:284,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"Paciente vítima de queda de altura apresenta-se com paraplegia flácida e ausência de reflexo bulbocavernoso. Após 48 horas, o reflexo bulbocavernoso retorna, porém o paciente mantém ausência total de sensibilidade e motricidade abaixo do nível da lesão (T10). Qual o diagnóstico neurológico atual segundo a escala ASIA?",alternativas:["A) Choque Neurogênico", "B) Lesão Medular Incompleta ASIA B", "C) Choque Medular persistente", "D) Lesão Medular Completa ASIA A"],correta:3,justificativas:["Choque neurogênico é uma alteração hemodinâmica (PA e FC), não uma classificação de déficit motor.", "ASIA B exigiria preservação da sensibilidade sacral.", "O retorno do reflexo bulbocavernoso indica justamente que o choque medular acabou.", "✔ O retorno do reflexo bulbocavernoso marca o fim do choque medular. Se, após o fim do choque, não há função motora ou sensitiva nos segmentos sacrais (S4S5), a lesão é classificada como completa (ASIA A)."]},
{id:285,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"avançado",enunciado:"Homem de 72 anos queixa-se de dor lombar crônica que piora ao caminhar e melhora significativamente ao sentar ou inclinar o tronco para frente (posição de \"carrinho de supermercado\"). Apresenta pulsos periféricos normais. Qual o diagnóstico mais provável?",alternativas:["A) Insuficiência Vascular Periférica", "B) Hérnia de Disco Extrusa Aguda", "C) Estenose do Canal Lombar", "D) Espondilodiscite Infecciosa"],correta:2,justificativas:["Pulsos normais afastam a claudicação vascular.", "Hérnias agudas geralmente pioram com a flexão do tronco e sentar.", "✔ A claudicação neurogênica (dor que melhora com a flexão da coluna e piora com a extensão/caminhada) é o sintoma patognomônico da estenose de canal em idosos.", "Espondilodiscite causaria dor constante, febre ou aumento de provas inflamatórias (VHS/PCR)."]},
{id:286,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"Homem de 72 anos queixa-se de dor lombar crônica que piora ao caminhar e melhora significativamente ao sentar ou inclinar o tronco para frente (posição de \"carrinho de supermercado\"). Apresenta pulsos periféricos normais. Qual o diagnóstico mais provável?",alternativas:["A) Insuficiência Vascular Periférica", "B) Hérnia de Disco Extrusa Aguda", "C) Estenose do Canal Lombar", "D) Espondilodiscite Infecciosa"],correta:2,justificativas:["Pulsos normais afastam a claudicação vascular.", "Hérnias agudas geralmente pioram com a flexão do tronco e sentar.", "✔ A claudicação neurogênica (dor que melhora com a flexão da coluna e piora com a extensão/caminhada) é o sintoma patognomônico da estenose de canal em idosos.", "Espondilodiscite causaria dor constante, febre ou aumento de provas inflamatórias (VHS/PCR)."]},
{id:287,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"avançado",enunciado:"No contexto do trauma raquimedular, a \"Síndrome Medular Anterior\" caracteriza-se clinicamente por:",alternativas:["A) Perda da função motora e da sensibilidade dolorosa/térmica, com preservação da propriocepção", "B) Perda apenas da propriocepção e vibração", "C) Perda motora ipsilateral e perda térmica contralateral à lesão", "D) Comprometimento predominante dos membros superiores em relação aos inferiores"],correta:0,justificativas:["✔ A síndrome anterior afeta os tratos corticospinais e espinotalâmicos, mas preserva as colunas dorsais (propriocepção e vibração), que ficam na parte posterior da medula.", "Esta seria a síndrome medular posterior (rara).", "Esta descrição referese à Síndrome de BrownSéquard (hemissecção).", "Esta descrição referese à Síndrome Central da Medula."]},
{id:288,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"No contexto do trauma raquimedular, a \"Síndrome Medular Anterior\" caracteriza-se clinicamente por:",alternativas:["A) Perda da função motora e da sensibilidade dolorosa/térmica, com preservação da propriocepção", "B) Perda apenas da propriocepção e vibração", "C) Perda motora ipsilateral e perda térmica contralateral à lesão", "D) Comprometimento predominante dos membros superiores em relação aos inferiores"],correta:0,justificativas:["✔ A síndrome anterior afeta os tratos corticospinais e espinotalâmicos, mas preserva as colunas dorsais (propriocepção e vibração), que ficam na parte posterior da medula.", "Esta seria a síndrome medular posterior (rara).", "Esta descrição referese à Síndrome de BrownSéquard (hemissecção).", "Esta descrição referese à Síndrome Central da Medula."]},
{id:289,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"avançado",enunciado:"Uma gestante no 3º trimestre apresenta dor lombar súbita com \"anestesia em sela\" (perda de sensibilidade na região perineal) e retenção urinária. Qual a conduta diagnóstica imediata e o diagnóstico suspeito?",alternativas:["A) Radiografia de coluna lombar; Espondilolistese", "B) Ressonância Magnética; Síndrome da Cauda Equina", "C) Ultrassonografia de abdome; Parto prematuro", "D) Eletroneuromiografia; Polirradiculopatia"],correta:1,justificativas:["Radiografias não avaliam partes moles/nervos de forma adequada e a radiação deve ser evitada na gestação se houver alternativa.", "✔ A tríade de dor lombar, anestesia perineal e disfunção esfincteriana é uma emergência cirúrgica (Cauda Equina), e a RM é o padrãoouro para confirmar a compressão.", "Os sintomas são claramente neurológicos e não obstétricos.", "A ENMG demora para mostrar alterações e não é exame de urgência para diagnóstico estrutural."]},
{id:290,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"Uma gestante no 3º trimestre apresenta dor lombar súbita com \"anestesia em sela\" (perda de sensibilidade na região perineal) e retenção urinária. Qual a conduta diagnóstica imediata e o diagnóstico suspeito?",alternativas:["A) Radiografia de coluna lombar; Espondilolistese", "B) Ressonância Magnética; Síndrome da Cauda Equina", "C) Ultrassonografia de abdome; Parto prematuro", "D) Eletroneuromiografia; Polirradiculopatia"],correta:1,justificativas:["Radiografias não avaliam partes moles/nervos de forma adequada e a radiação deve ser evitada na gestação se houver alternativa.", "✔ A tríade de dor lombar, anestesia perineal e disfunção esfincteriana é uma emergência cirúrgica (Cauda Equina), e a RM é o padrãoouro para confirmar a compressão.", "Os sintomas são claramente neurológicos e não obstétricos.", "A ENMG demora para mostrar alterações e não é exame de urgência para diagnóstico estrutural."]},
{id:291,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"avançado",enunciado:"Na avaliação de uma cervicalgia traumática, qual critério de imagem, baseado na regra de \"NEXUS\" ou \"Canadian C-Spine Rule\", obriga a realização de exame de imagem (CT/Rx)?",alternativas:["A) Paciente alerta e orientado", "B) Ausência de dor na linha média da coluna", "C) Idade superior a 65 anos ou mecanismo de trauma perigoso", "D) Presença de movimentos normais do pescoço sem dor"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ Segundo os protocolos de triagem cervical, idade > 65 anos ou traumas de alta energia (queda de altura, capotamento) tornam a imagem obrigatória, mesmo se o paciente parecer estável.", "Alternativa D incorreta."]},
{id:292,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"Na avaliação de uma cervicalgia traumática, qual critério de imagem, baseado na regra de \"NEXUS\" ou \"Canadian C-Spine Rule\", obriga a realização de exame de imagem (CT/Rx)?",alternativas:["A) Paciente alerta e orientado", "B) Ausência de dor na linha média da coluna", "C) Idade superior a 65 anos ou mecanismo de trauma perigoso", "D) Presença de movimentos normais do pescoço sem dor"],correta:2,justificativas:["Alternativa A incorreta.", "Alternativa B incorreta.", "✔ Segundo os protocolos de triagem cervical, idade > 65 anos ou traumas de alta energia (queda de altura, capotamento) tornam a imagem obrigatória, mesmo se o paciente parecer estável.", "Alternativa D incorreta."]},
{id:293,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"avançado",enunciado:"Paciente com dor lombar crônica realiza RM que mostra abaulamento discal L4-L5, mas o exame físico revela perda do reflexo aquileu e hipoestesia na face lateral do pé. Onde está a lesão provável?",alternativas:["A) No nível L3-L4", "B) No nível L4-L5, comprimindo a raiz de L4", "C) No nível L5-S1, comprimindo a raiz de S1", "D) No nível T12-L1"],correta:2,justificativas:["L3L4 afetaria o reflexo patelar.", "L4L5 afeta primariamente a raiz de L5 (em hérnias paracentrais).", "✔ O reflexo aquileu é mediado pela raiz de S1. Frequentemente, achados de imagem (L4L5) são incidentais e não explicam a clínica (S1), que depende do nível L5S1.", "Nível de transição toracolombar causaria sintomas de primeiro neurônio motor ou cone medular."]},
{id:294,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"Paciente com dor lombar crônica realiza RM que mostra abaulamento discal L4-L5, mas o exame físico revela perda do reflexo aquileu e hipoestesia na face lateral do pé. Onde está a lesão provável?",alternativas:["A) No nível L3-L4", "B) No nível L4-L5, comprimindo a raiz de L4", "C) No nível L5-S1, comprimindo a raiz de S1", "D) No nível T12-L1"],correta:2,justificativas:["L3L4 afetaria o reflexo patelar.", "L4L5 afeta primariamente a raiz de L5 (em hérnias paracentrais).", "✔ O reflexo aquileu é mediado pela raiz de S1. Frequentemente, achados de imagem (L4L5) são incidentais e não explicam a clínica (S1), que depende do nível L5S1.", "Nível de transição toracolombar causaria sintomas de primeiro neurônio motor ou cone medular."]},
{id:295,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"avançado",enunciado:"Um jovem apresenta dor lombar há 6 meses que piora com o repouso e melhora com a atividade física, associada a rigidez matinal de 2 horas. O exame físico mostra redução da expansibilidade torácica. Qual achado radiológico é esperado?",alternativas:["A) Osteófitos marginais proeminentes (bicos de papagaio)", "B) Sacroileíte bilateral", "C) Fratura por compressão do corpo vertebral", "D) Escoliose idiopática do adolescente"],correta:1,justificativas:["Osteófitos indicam osteoartrose (dor mecânica do idoso).", "✔ O quadro sugere Espondilite Anquilosante (dor inflamatória em jovem). A sacroileíte é o achado radiográfico inicial e fundamental para o diagnóstico.", "Fraturas causam dor aguda mecânica, não inflamatória crônica.", "Escoliose causa deformidade, raramente dor inflamatória com rigidez matinal."]},
{id:296,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"Um jovem apresenta dor lombar há 6 meses que piora com o repouso e melhora com a atividade física, associada a rigidez matinal de 2 horas. O exame físico mostra redução da expansibilidade torácica. Qual achado radiológico é esperado?",alternativas:["A) Osteófitos marginais proeminentes (bicos de papagaio)", "B) Sacroileíte bilateral", "C) Fratura por compressão do corpo vertebral", "D) Escoliose idiopática do adolescente"],correta:1,justificativas:["Osteófitos indicam osteoartrose (dor mecânica do idoso).", "✔ O quadro sugere Espondilite Anquilosante (dor inflamatória em jovem). A sacroileíte é o achado radiográfico inicial e fundamental para o diagnóstico.", "Fraturas causam dor aguda mecânica, não inflamatória crônica.", "Escoliose causa deformidade, raramente dor inflamatória com rigidez matinal."]},
{id:297,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"avançado",enunciado:"Qual das seguintes manobras de exame físico é utilizada especificamente para avaliar a coluna cervical em busca de radiculopatia compressiva (hérnia cervical)?",alternativas:["A) Teste de Adams", "B) Teste de Spurling", "C) Teste de Thomas", "D) Teste de Trendelenburg"],correta:1,justificativas:["Adams avalia a gibosidade na escoliose.", "✔ O teste de Spurling (compressão axial com inclinação lateral da cabeça) reduz o forame neural e reproduz a dor radicular no braço se houver compressão cervical.", "Thomas avalia contratura em flexão do quadril.", "Trendelenburg avalia a força do músculo glúteo médio."]},
{id:298,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"intermediário",enunciado:"Qual das seguintes manobras de exame físico é utilizada especificamente para avaliar a coluna cervical em busca de radiculopatia compressiva (hérnia cervical)?",alternativas:["A) Teste de Adams", "B) Teste de Spurling", "C) Teste de Thomas", "D) Teste de Trendelenburg"],correta:1,justificativas:["Adams avalia a gibosidade na escoliose.", "✔ O teste de Spurling (compressão axial com inclinação lateral da cabeça) reduz o forame neural e reproduz a dor radicular no braço se houver compressão cervical.", "Thomas avalia contratura em flexão do quadril.", "Trendelenburg avalia a força do músculo glúteo médio."]},
{id:299,tema:"Coluna",subtema:"Dor Lombar",dificuldade:"avançado",enunciado:"Paciente vítima de mergulho em águas rasas apresenta tetraplegia imediata. A TC mostra fratura explosão de C5 com retropulsão de fragmento ósseo para o canal. Ele apresenta PA 80/50 mmHg e frequência cardíaca de 50 bpm. Este estado hemodinâmico define:",alternativas:["A) Choque Hipovolêmico", "B) Choque Neurogênico", "C) Choque Medular", "D) Choque Séptico"],correta:1,justificativas:["No choque hipovolêmico, o paciente estaria taquicárdico (>100 bpm).", "✔ A combinação de hipotensão com bradicardia (ou falta de taquicardia compensatória) em um paciente com trauma cervical/torácico alto caracteriza o choque neurogênico pela perda do tônus simpático.", "Choque medular é uma definição neurológica (reflexos), não hemodinâmica (pressão/pulso).", "Não há sinais de infecção descritos no caso agudo."]},
